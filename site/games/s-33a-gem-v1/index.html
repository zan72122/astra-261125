function computePenguinBodyMatrix(p, out) {
  M4.identity(out);
  M4.translate(out, p.x, p.y, p.z);
  M4.rotateY(out, p.yaw);
  // Belly slide or swimming tilts body forward smoothly
  M4.rotateX(out, p.pitch + p.bellySlide * 1.38);
  // Cute waddle side-to-side sway + shake
  const waddleRoll = Math.sin(p.stepPhase) * 0.13 * p.stepAmp;
  const shakeRoll = p.shakeTimer > 0 ? Math.sin(simTime * 42.0) * 0.22 * Math.min(1, p.shakeTimer * 2.5) : 0;
  M4.rotateZ(out, p.roll + waddleRoll + shakeRoll);
  const s = p.scale;
  const sy = s * p.squash;
  const sxz = s / Math.sqrt(Math.max(0.65, p.squash));
  M4.scale(out, sxz, sy, sxz);
  return out;
}

const _tmpMatA = M4.create();
const _tmpMatB = M4.create();

function getPenguinHeadMatrix(p, bodyMat, out) {
  M4.copy(out, bodyMat);
  M4.translate(out, 0, 0.72, 0.015);
  M4.rotateY(out, p.headYaw);
  M4.rotateX(out, p.headPitch - p.bellySlide * 0.75);
  M4.rotateZ(out, p.headTilt);
  return out;
}

function getBeakTipWorldPos(p) {
  computePenguinBodyMatrix(p, _tmpMatA);
  getPenguinHeadMatrix(p, _tmpMatA, _tmpMatB);
  return M4.transformPoint(_tmpMatB, [0, -0.015, 0.285]);
}

function getPenguinCenterWorldPos(p) {
  return [p.x, p.y + (p.inWater ? 0.1 : 0.42 * p.scale), p.z];
}

function penguinChirp(p, mood) {
  if (simTime - p.lastChirpTime < 0.35 && mood !== 'happy' && mood !== 'celebrate') return;
  p.lastChirpTime = simTime;
  Sound.chirp(p.pitchVoice, mood);
}

// Keep land coordinates inside safe sunny walkable spots
function clampLandSpot(x, z) {
  x = clamp(x, -3.1, 3.0);
  z = clamp(z, -1.2, 3.15);
  // Push gently away from bucket pedestal
  const dx = x - BUCKET_POS[0], dz = z - BUCKET_POS[2];
  const d = Math.hypot(dx, dz);
  if (d < 0.66) {
    const nx = d > 0.01 ? dx / d : 1;
    const nz = d > 0.01 ? dz / d : 0;
    x = BUCKET_POS[0] + nx * 0.66;
    z = BUCKET_POS[2] + nz * 0.66;
  }
  return [x, z];
}

function pickRandomLandSpot(p) {
  const spots = [
    [-0.95, 1.95], [-0.25, 2.25], [0.55, 2.15], [1.15, 1.95],
    [2.32, 0.45], [2.25, -0.25], // right diving terrace
    [-2.55, 0.55], [-2.15, 1.45] // left slide hill
  ];
  const s = spots[Math.floor(Math.random() * spots.length)];
  return clampLandSpot(s[0] + (Math.random() - 0.5) * 0.45, s[1] + (Math.random() - 0.5) * 0.35);
}

function pickRandomSwimSpot() {
  const ang = Math.random() * Math.PI * 2;
  const r = 0.25 + Math.random() * 0.65;
  return [0.05 + Math.cos(ang) * 2.0 * r, -0.55 + Math.sin(ang) * 1.35 * r];
}

function triggerPenguinEat(p, fish) {
  fish.state = 'eaten';
  fish.eatenBy = p;
  fish.claimedBy = p;
  p.targetFish = fish;
  p.eatenVariant = fish.variant;
  p.state = 'eating';
  p.stateTimer = 0.72;
  p.fedCount++;
  totalFedCount++;
  Sound.gulp();
  // Look toward the fish as it gulps
  p.beakOpen = 0.52;
  p.happyEyes = 1.0;
  p.squash = 1.14;
  p.spinAccum = 0;

  // Rainbow pearl fish triggers a magical sunlit rainbow & bubble party!
  if (fish.variant === 3 || (totalFedCount > 0 && totalFedCount % 6 === 0)) {
    rainbowTimer = Math.max(rainbowTimer, 11.0);
    bubblePartyTimer = Math.max(bubblePartyTimer, 10.0);
    Sound.rainbowShimmer();
    for (const op of penguins) {
      if (op !== p && (op.state === 'idle_land' || op.state === 'swim_cruise')) {
        op.state = 'happy_dance';
        op.stateTimer = 2.4;
        op.eatenVariant = 3;
        op.spinAccum = 0;
        penguinChirp(op, 'celebrate');
      }
    }
  }
}

function startPenguinDive(p, targetX, targetZ) {
  p.state = 'diving';
  p.jumpT = 0;
  p.jumpStart = [p.x, p.y, p.z];
  p.jumpEnd = [targetX, -0.35, targetZ];
  p.jumpHeight = Math.max(p.y + 0.45, 0.75);
  p.yaw = Math.atan2(targetX - p.x, targetZ - p.z);
  p.diveCooldown = 5.0;
  penguinChirp(p, 'dive');
}

function startPorpoiseJump(p) {
  const dirX = Math.sin(p.yaw), dirZ = Math.cos(p.yaw);
  let ex = p.x + dirX * 1.45;
  let ez = p.z + dirZ * 1.45;
  if (!isPointInWater(ex, ez)) {
    const [sx, sz] = pickRandomSwimSpot();
    ex = sx; ez = sz;
    p.yaw = Math.atan2(ex - p.x, ez - p.z);
  }
  p.state = 'porpoise';
  p.jumpT = 0;
  p.jumpStart = [p.x, -0.22, p.z];
  p.jumpEnd = [ex, -0.32, ez];
  p.jumpHeight = 0.85;
  spawnSplash(p.x, p.z, 0.72);
  Sound.splash(0.55);
  penguinChirp(p, 'happy');
}

function updatePenguins(dt) {
  // Check if there is any free fish in water or land that needs a chaser
  for (const f of activeFish) {
    if ((f.state === 'water' || f.state === 'land') && !f.claimedBy) {
      let best = null, bestScore = 1e9;
      for (const p of penguins) {
        if (p.state === 'eating' || p.state === 'diving' || p.state === 'porpoise' || p.state === 'toboggan' || p.state === 'fetch_gift') continue;
        const d = Math.hypot(p.x - f.x, p.z - f.z);
        const modePenalty = (f.state === 'water' && !p.inWater) ? 1.4 : ((f.state === 'land' && p.inWater) ? 2.2 : 0);
        if (d + modePenalty < bestScore) {
          bestScore = d + modePenalty;
          best = p;
        }
      }
      if (best) {
        f.claimedBy = best;
        best.targetFish = f;
        best.state = 'chase_fish';
        best.stateTimer = 8.0;
        penguinChirp(best, 'eager');
      }
    }
  }

  for (const p of penguins) {
    p.diveCooldown = Math.max(0, p.diveCooldown - dt);
    p.squash = damp(p.squash, 1.0, 7.5, dt);

    // Wetness dries gradually on sunny rocks, instant 1.0 in water
    if (p.inWater) {
      p.wetness = damp(p.wetness, 1.0, 6.0, dt);
    } else {
      p.wetness = Math.max(0, p.wetness - dt * 0.065);
    }

    // Natural eye blinking
    p.blinkTimer -= dt;
    if (p.blinkTimer <= 0) {
      p.blinkTimer = 2.2 + Math.random() * 3.4;
      p.blink = 1.0;
    } else {
      p.blink = Math.max(0, p.blink - dt * 7.5);
    }

    // Shake dry timer
    if (p.shakeTimer > 0) {
      p.shakeTimer -= dt;
      if (Math.random() < dt * 28 && p.wetness > 0.15) {
        const a = Math.random() * 6.28;
        spawnParticle('drop', p.x + Math.cos(a)*0.2, p.y + 0.35 + Math.random()*0.25, p.z + Math.sin(a)*0.2,
          Math.cos(a)*1.4, 0.8 + Math.random()*0.8, Math.sin(a)*1.4, 0.42, 0.45, [0.88, 0.97, 1.0]);
      }
    }

    // Target gaze defaults (look warmly toward camera or held fish)
    let lookTarget = [camPos[0] * 0.45, camPos[1] * 0.35, camPos[2] * 0.65];
    let wantBeakOpen = 0;
    let wantHappyEyes = 0;
    let wantFlipperFlap = 0;
    let wantTailWag = 0;
    let wantBellySlide = 0;
    let wantHeadTilt = 0;

    // --- If player is holding a fish, all free penguins become super curious & beg! ---
    if (heldFish && (p.state === 'idle_land' || p.state === 'swim_cruise' || p.state === 'begging')) {
      p.state = 'begging';
      lookTarget = [heldFish.x, heldFish.y, heldFish.z];
    }

    // --- State Machine ---
    if (p.state === 'eating') {
      p.stateTimer -= dt;
      const t = 1 - clamp(p.stateTimer / 0.72, 0, 1);
      wantHappyEyes = 1.0;
      wantTailWag = 1.0;
      wantFlipperFlap = 0.75;
      p.stepAmp = damp(p.stepAmp, 0, 8, dt);

      // Keep swallowed fish locked to beak while tilting skyward to gulp!
      if (p.targetFish && p.targetFish.eatenBy === p) {
        const tip = getBeakTipWorldPos(p);
        const swallowProg = smoothstep(0.18, 0.68, t);
        p.targetFish.x = lerp(tip[0], p.x, swallowProg * 0.55);
        p.targetFish.y = lerp(tip[1], p.y + 0.65 * p.scale, swallowProg * 0.45);
        p.targetFish.z = lerp(tip[2], p.z, swallowProg * 0.55);
        p.targetFish.yaw = p.yaw + Math.PI;
        p.targetFish.pitch = -0.6 - swallowProg * 0.8;
        p.targetFish.scale = (p.eatenVariant === 2 ? 1.26 : 1.0) * (1 - smoothstep(0.45, 0.78, t));
      }

      if (t < 0.25) {
        wantBeakOpen = 0.52;
        p.headPitch = damp(p.headPitch, -0.25, 14, dt);
      } else if (t < 0.72) {
        // Tilt beak skyward & gulp!
        wantBeakOpen = lerp(0.35, 0.0, (t - 0.25) / 0.47);
        const doubleGulp = p.eatenVariant === 2 ? Math.sin(t * 28.0) * 0.14 : 0;
        p.headPitch = damp(p.headPitch, -0.78 + doubleGulp, 12, dt);
      } else {
        wantBeakOpen = 0;
        p.headPitch = damp(p.headPitch, 0.0, 10, dt);
      }

      if (p.stateTimer <= 0) {
        // Remove eaten fish
        if (p.targetFish) {
          const idx = activeFish.indexOf(p.targetFish);
          if (idx >= 0) activeFish.splice(idx, 1);
          p.targetFish = null;
        }
        p.state = 'happy_dance';
        p.stateTimer = p.eatenVariant === 1 ? 2.1 : 1.75;
        p.spinAccum = 0;
        penguinChirp(p, p.eatenVariant === 3 ? 'celebrate' : 'happy');
        spawnHappySparkles(p.x, p.y + 0.55 * p.scale, p.z, p.eatenVariant === 1 ? 16 : 11, p.eatenVariant === 1);
      }
    }

    else if (p.state === 'happy_dance') {
      p.stateTimer -= dt;
      wantHappyEyes = 1.0;
      wantTailWag = 1.3;
      wantFlipperFlap = 1.35;
      wantBeakOpen = 0.12 + Math.sin(simTime * 16) * 0.08;
      if (p.inWater) {
        // Joyful water spin or porpoise leap!
        if (p.stateTimer < 1.25 && Math.random() < 0.06) {
          startPorpoiseJump(p);
        } else {
          p.yaw += dt * 4.2;
          p.y = damp(p.y, -0.18 + Math.sin(simTime * 11) * 0.08, 10, dt);
          if (Math.random() < dt * 8) addRipple(p.x, p.z, 0.45);
        }
      } else {
        // Adorable bouncy waddle dance!
        p.stepPhase += dt * 15.0;
        p.stepAmp = 1.1;
        const hop = Math.abs(Math.sin(simTime * 9.5)) * 0.14;
        p.y = getTerrainHeight(p.x, p.z) + hop;
        // Sakura fish makes penguin do a joyous 360 twirl!
        if (p.eatenVariant === 1 && p.spinAccum < Math.PI * 2) {
          const dSpin = dt * 6.5;
          p.yaw += dSpin;
          p.spinAccum += dSpin;
        } else if (p.eatenVariant === 2) {
          // Proud mackerel chest puff + bow!
          p.pitch = damp(p.pitch, Math.sin(simTime * 6.0) * 0.22, 10, dt);
        } else {
          wantHeadTilt = Math.sin(simTime * 9.5) * 0.26;
        }
      }

      if (p.stateTimer <= 0) {
        p.pitch = 0;
        // Every ~3rd fish eaten -> dive to fetch a shiny seashell gift for the child!
        if (placedGifts.length < GIFT_SLOTS.length && totalFedCount >= 2 && (totalFedCount % 3 === 0 || p.fedCount === 2) && !penguins.some(o => o.carryingGift !== null)) {
          p.carryingGift = placedGifts.length;
          p.state = 'fetch_gift';
          p.stateTimer = 0; // phase 0: go dive into pool -> phase 1: surface with shell -> phase 2: place on right shelf
          const [sx, sz] = [0.4 + (Math.random()-0.5)*0.8, -0.65 + (Math.random()-0.5)*0.6];
          p.targetX = sx; p.targetZ = sz;
          if (!p.inWater) startPenguinDive(p, sx, sz);
        } else if (!p.inWater && p.name === 'Hina' && Math.random() < 0.42) {
          // Hina loves climbing to the left rock to belly-slide after eating!
          p.state = 'toboggan_walk';
          p.targetX = -2.75; p.targetZ = 0.25;
          p.stateTimer = 6.0;
        } else {
          p.state = p.inWater ? 'swim_cruise' : 'idle_land';
          p.stateTimer = 2.0 + Math.random() * 2.5;
        }
      }
    }

    else if (p.state === 'petted') {
      p.petTimer -= dt;
      wantHappyEyes = 1.0;
      wantTailWag = 1.1;
      wantFlipperFlap = 0.55;
      wantHeadTilt = Math.sin(simTime * 5.2) * 0.24;
      p.stepAmp = damp(p.stepAmp, 0.25, 8, dt);
      if (!p.inWater) {
        const ty = getTerrainHeight(p.x, p.z);
        p.y = damp(p.y, ty, 12, dt);
        p.yaw = dampAngle(p.yaw, Math.atan2(camPos[0]*0.3 - p.x, camPos[2]*0.7 - p.z), 5, dt);
      }
      if (p.petTimer <= 0) {
        p.state = p.inWater ? 'swim_cruise' : 'idle_land';
        p.stateTimer = 2.2;
      }
    }

    else if (p.state === 'begging') {
      if (!heldFish) {
        p.state = p.inWater ? 'swim_cruise' : 'idle_land';
        p.stateTimer = 1.5;
      } else {
        lookTarget = [heldFish.x, heldFish.y, heldFish.z];
        const tip = getBeakTipWorldPos(p);
        const distFish = V3.dist(tip, [heldFish.x, heldFish.y, heldFish.z]);
        const horizDist = Math.hypot(heldFish.x - p.x, heldFish.z - p.z);

        // Hand-feed catch! Super smooth & forgiving for 5-year-old fingers
        if (distFish < 0.42) {
          const f = heldFish;
          heldFish = null;
          triggerPenguinEat(p, f);
          continue;
        }

        const wantYaw = Math.atan2(heldFish.x - p.x, heldFish.z - p.z);
        p.yaw = dampAngle(p.yaw, wantYaw, 6.5, dt);

        if (p.inWater) {
          // Swim eagerly toward the area under the held fish
          const tx = clamp(heldFish.x, -2.0, 2.0);
          const tz = clamp(heldFish.z, -1.7, 1.15);
          const dx = tx - p.x, dz = tz - p.z;
          const d = Math.hypot(dx, dz);
          if (d > 0.32) {
            p.x += (dx / d) * 1.45 * dt;
            p.z += (dz / d) * 1.45 * dt;
            if (Math.random() < dt * 5) addRipple(p.x, p.z, 0.35);
          }
          // Pop head happily above water surface to look up at the fish!
          p.y = damp(p.y, -0.26, 6, dt);
          p.pitch = damp(p.pitch, -0.15, 6, dt);
          wantFlipperFlap = horizDist < 1.8 ? 0.65 : 0.25;
        } else {
          // Waddle eagerly closer on the rock ledge (without falling in accidentally)
          if (horizDist > 0.72) {
            const stepX = p.x + Math.sin(p.yaw) * 0.95 * dt;
            const stepZ = p.z + Math.cos(p.yaw) * 0.95 * dt;
            const [cx, cz] = clampLandSpot(stepX, stepZ);
            if (!isPointInWater(cx, cz)) {
              p.x = cx; p.z = cz;
              p.stepPhase += dt * 11.5;
              p.stepAmp = damp(p.stepAmp, 1.0, 8, dt);
            } else {
              p.stepAmp = damp(p.stepAmp, 0.2, 8, dt);
            }
          } else {
            p.stepAmp = damp(p.stepAmp, 0.0, 8, dt);
          }
          const hop = horizDist < 1.35 ? Math.abs(Math.sin(simTime * 8.5 + p.seed)) * 0.065 : 0;
          p.y = damp(p.y, getTerrainHeight(p.x, p.z) + hop, 14, dt);
          wantFlipperFlap = horizDist < 1.55 ? 0.95 : 0.35;
          wantTailWag = horizDist < 1.4 ? 0.75 : 0.2;
        }

        // Open beak wide ("あーん!") when the fish is close!
        wantBeakOpen = smoothstep(1.65, 0.55, distFish) * 0.52;
        if (distFish < 1.1 && Math.random() < dt * 0.9) penguinChirp(p, 'eager');
      }
    }

    else if (p.state === 'chase_fish') {
      const f = p.targetFish;
      if (!f || (f.state !== 'water' && f.state !== 'land')) {
        p.targetFish = null;
        p.state = p.inWater ? 'swim_cruise' : 'idle_land';
        p.stateTimer = 1.5;
      } else {
        lookTarget = [f.x, f.y, f.z];
        const dx = f.x - p.x, dz = f.z - p.z;
        const hd = Math.hypot(dx, dz);
        p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 8.0, dt);
        wantBeakOpen = smoothstep(1.1, 0.35, hd) * 0.48;

        if (f.state === 'water' && !p.inWater) {
          // Waddle briskly to the water edge and dive in!
          const nx = dx / (hd || 1), nz = dz / (hd || 1);
          const nextX = p.x + nx * 1.25 * dt;
          const nextZ = p.z + nz * 1.25 * dt;
          if (isPointInWater(nextX, nextZ) || hd < 1.35) {
            startPenguinDive(p, lerp(p.x, f.x, 0.55), lerp(p.z, f.z, 0.55));
          } else {
            p.x = nextX; p.z = nextZ;
            p.y = getTerrainHeight(p.x, p.z);
            p.stepPhase += dt * 13;
            p.stepAmp = 1.1;
            wantFlipperFlap = 0.6;
          }
        } else if (f.state === 'water' && p.inWater) {
          // Torpedo-swim gracefully underwater right to the fish!
          const dy = (f.y - 0.1) - p.y;
          const d3 = Math.hypot(dx, dy, dz) || 1;
          const spd = 2.35;
          p.x += (dx / d3) * spd * dt;
          p.y = clamp(p.y + (dy / d3) * spd * dt, getTerrainHeight(p.x, p.z) + 0.18, -0.15);
          p.z += (dz / d3) * spd * dt;
          p.pitch = damp(p.pitch, 1.35 - (dy / d3) * 0.65, 7, dt);
          wantFlipperFlap = 1.1;
          if (Math.random() < dt * 12) {
            spawnParticle('bubble', p.x, p.y + 0.1, p.z, (Math.random()-0.5)*0.2, 0.45, (Math.random()-0.5)*0.2, 0.4, 0.9, [0.88, 0.98, 1.0]);
          }
          if (d3 < 0.48) {
            triggerPenguinEat(p, f);
          }
        } else if (f.state === 'land' && !p.inWater) {
          // Waddle briskly on land to scoop up the fish!
          if (hd > 0.38) {
            p.x += (dx / hd) * 1.35 * dt;
            p.z += (dz / hd) * 1.35 * dt;
            p.y = getTerrainHeight(p.x, p.z);
            p.stepPhase += dt * 13.5;
            p.stepAmp = 1.1;
            wantFlipperFlap = 0.7;
          } else {
            triggerPenguinEat(p, f);
          }
        } else {
          // Fish on land while penguin in water -> release claim so a land penguin or swim-exit takes it
          f.claimedBy = null;
          p.targetFish = null;
          p.state = 'swim_cruise';
        }
      }
    }

    else if (p.state === 'diving' || p.state === 'porpoise') {
      const dur = p.state === 'porpoise' ? 0.78 : 0.72;
      p.jumpT += dt / dur;
      const t = clamp(p.jumpT, 0, 1);
      p.x = lerp(p.jumpStart[0], p.jumpEnd[0], t);
      p.z = lerp(p.jumpStart[2], p.jumpEnd[2], t);
      const baseY = lerp(p.jumpStart[1], p.jumpEnd[1], t);
      const arc = 4 * t * (1 - t) * (p.jumpHeight - Math.max(p.jumpStart[1], p.jumpEnd[1]) * 0.5);
      p.y = baseY + Math.max(0.25, arc);
      // Graceful arched dive pitch!
      p.pitch = lerp(0.55, 2.15, t);
      p.stepAmp = 0;
      wantFlipperFlap = 0.2;
      if (t >= 1) {
        p.inWater = true;
        p.wetness = 1.0;
        spawnSplash(p.x, p.z, 0.95);
        Sound.splash(0.85);
        if (p.carryingGift !== null) {
          p.state = 'fetch_gift';
          p.stateTimer = 1.0; // diving underwater to pick shell
        } else if (p.targetFish) {
          p.state = 'chase_fish';
        } else {
          p.state = 'swim_cruise';
          p.stateTimer = 3.5 + Math.random() * 3.5;
          const [sx, sz] = pickRandomSwimSpot();
          p.targetX = sx; p.targetZ = sz; p.targetY = -0.45;
        }
      }
    }

    else if (p.state === 'toboggan_walk') {
      // Walk up the left smooth rock hill to slide down on belly!
      const dx = p.targetX - p.x, dz = p.targetZ - p.z;
      const d = Math.hypot(dx, dz);
      p.stateTimer -= dt;
      if (d > 0.25 && p.stateTimer > 0) {
        p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 6, dt);
        p.x += (dx / d) * 1.05 * dt;
        p.z += (dz / d) * 1.05 * dt;
        p.y = getTerrainHeight(p.x, p.z);
        p.stepPhase += dt * 11;
        p.stepAmp = 1.0;
      } else {
        p.state = 'toboggan';
        p.stateTimer = 1.5;
        p.yaw = Math.atan2(-1.1 - p.x, 0.05 - p.z);
        penguinChirp(p, 'dive');
      }
    }

    else if (p.state === 'toboggan') {
      // Adorable belly-slide down the wet left rock into the turquoise pool!
      wantBellySlide = 1.0;
      wantHappyEyes = 1.0;
      wantFlipperFlap = 0.35;
      p.stepAmp = 0;
      const dx = -0.95 - p.x, dz = -0.05 - p.z;
      const d = Math.hypot(dx, dz) || 1;
      p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 6, dt);
      p.x += (dx / d) * 2.25 * dt;
      p.z += (dz / d) * 2.25 * dt;
      const ty = getTerrainHeight(p.x, p.z);
      p.y = ty + 0.14;
      if (Math.random() < dt * 16) {
        spawnParticle('drop', p.x, p.y, p.z, (Math.random()-0.5)*0.6, 0.5, (Math.random()-0.5)*0.6, 0.38, 0.35, [0.9, 0.98, 1.0]);
      }
      if (ty < -0.18 || p.stateTimer <= 0) {
        p.inWater = true;
        p.wetness = 1.0;
        p.bellySlide = 0;
        spawnSplash(p.x, p.z, 1.15);
        Sound.splash(1.0);
        p.state = 'swim_cruise';
        p.stateTimer = 4.0;
        const [sx, sz] = pickRandomSwimSpot();
        p.targetX = sx; p.targetZ = sz; p.targetY = -0.45;
      }
      p.stateTimer -= dt;
    }

    else if (p.state === 'fetch_gift') {
      // Phase 0..1: dive underwater -> Phase 1..2: swim to front exit holding shell -> Phase 2..3: waddle to right shelf & place it!
      const slot = GIFT_SLOTS[p.carryingGift];
      if (!slot) { p.carryingGift = null; p.state = 'idle_land'; continue; }
      if (p.inWater) {
        // Swim smoothly toward front entry cove (0.15, 1.25)
        const ex = 0.25, ez = 1.28;
        const dx = ex - p.x, dz = ez - p.z;
        const d = Math.hypot(dx, dz);
        p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 6, dt);
        if (d > 0.35) {
          p.x += (dx / d) * 1.55 * dt;
          p.z += (dz / d) * 1.55 * dt;
          p.y = damp(p.y, -0.25, 5, dt);
          p.pitch = damp(p.pitch, 1.05, 5, dt);
          wantFlipperFlap = 0.9;
        } else {
          // Hop out onto the sunny front ledge!
          p.inWater = false;
          p.pitch = 0;
          p.y = getTerrainHeight(p.x, p.z);
          spawnSplash(p.x, p.z, 0.5);
          Sound.splash(0.42);
        }
      } else {
        // Waddle to the right sunny gift shelf!
        const gx = slot[0] - 0.22, gz = slot[1] - 0.16;
        const dx = gx - p.x, dz = gz - p.z;
        const d = Math.hypot(dx, dz);
        p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 6.5, dt);
        if (d > 0.22) {
          p.x += (dx / d) * 1.05 * dt;
          p.z += (dz / d) * 1.05 * dt;
          p.y = getTerrainHeight(p.x, p.z);
          p.stepPhase += dt * 11.5;
          p.stepAmp = 1.0;
        } else {
          // Place the shiny shell gift down proudly!
          const gy = getTerrainHeight(slot[0], slot[1]) + 0.015;
          placedGifts.push({
            slotIdx: p.carryingGift,
            x: slot[0], y: gy, z: slot[1],
            kind: slot[2], col: slot[3],
            yaw: Math.random() * 6.28,
            pop: 0.01, shimmer: 1.0
          });
          Sound.shellChime(placedGifts.length - 1);
          spawnHappySparkles(slot[0], gy + 0.12, slot[1], 14, true);
          p.carryingGift = null;
          p.state = 'happy_dance';
          p.stateTimer = 1.65;
          p.eatenVariant = 0;
          p.yaw = Math.atan2(camPos[0]*0.3 - p.x, camPos[2]*0.7 - p.z);
          penguinChirp(p, 'happy');
        }
      }
    }

    else if (p.state === 'swim_cruise') {
      p.stateTimer -= dt;
      const dx = p.targetX - p.x, dz = p.targetZ - p.z;
      const d = Math.hypot(dx, dz);

      // Occasionally boop the floating beach ball if nearby!
      const bd = Math.hypot(beachBall.x - p.x, beachBall.z - p.z);
      if (bd < 0.55 && beachBall.boopCooldown <= 0) {
        const bnx = (beachBall.x - p.x) / (bd || 1);
        const bnz = (beachBall.z - p.z) / (bd || 1);
        beachBall.vx += bnx * 2.2;
        beachBall.vz += bnz * 2.2;
        beachBall.vy = 1.25;
        beachBall.boopCooldown = 1.4;
        spawnSplash(beachBall.x, beachBall.z, 0.55);
        Sound.ballBoop();
        penguinChirp(p, 'happy');
      }

      if (d > 0.35) {
        p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 4.5, dt);
        const spd = bubblePartyTimer > 0 ? 1.85 : 1.15;
        const nx = p.x + Math.sin(p.yaw) * spd * dt;
        const nz = p.z + Math.cos(p.yaw) * spd * dt;
        if (isPointInWater(nx, nz)) {
          p.x = nx; p.z = nz;
        } else {
          const [sx, sz] = pickRandomSwimSpot();
          p.targetX = sx; p.targetZ = sz;
        }
        const desiredY = bubblePartyTimer > 0 ? -0.32 : p.targetY;
        const floorY = getTerrainHeight(p.x, p.z) + 0.22;
        p.y = damp(p.y, Math.max(floorY, desiredY + Math.sin(simTime * 2.6 + p.seed) * 0.08), 4.5, dt);
        // Sleek horizontal swim pitch underwater vs upright floating near surface
        const submergeAmt = smoothstep(-0.18, -0.45, p.y);
        p.pitch = damp(p.pitch, lerp(0.18, 1.32, submergeAmt), 5, dt);
        wantFlipperFlap = lerp(0.35, 0.95, submergeAmt);
        if (p.y > -0.35 && Math.random() < dt * 4.5) addRipple(p.x, p.z, 0.26);
        if (p.y < -0.32 && Math.random() < dt * 6) {
          spawnParticle('bubble', p.x, p.y + 0.12, p.z, 0, 0.42, 0, 0.36, 0.9, [0.88, 0.98, 1.0]);
        }
      } else {
        // Reached swim waypoint -> pick next action!
        const landCount = penguins.filter(o => !o.inWater).length;
        if (bubblePartyTimer > 0 && Math.random() < 0.48) {
          startPorpoiseJump(p);
        } else if (Math.random() < 0.24) {
          // Swim to play with the beach ball!
          p.targetX = beachBall.x;
          p.targetZ = beachBall.z;
          p.targetY = -0.22;
        } else if (p.stateTimer <= 0 && landCount < 2 && Math.random() < 0.45) {
          // Exit water at the front cove!
          p.state = 'exit_water';
          p.targetX = 0.05 + (Math.random() - 0.5) * 0.7;
          p.targetZ = 1.65;
        } else {
          const [sx, sz] = pickRandomSwimSpot();
          p.targetX = sx; p.targetZ = sz;
          p.targetY = Math.random() < 0.55 ? -0.24 : -0.62;
          p.stateTimer = 2.5 + Math.random() * 3.0;
        }
      }
    }

    else if (p.state === 'exit_water') {
      const dx = p.targetX - p.x, dz = p.targetZ - p.z;
      const d = Math.hypot(dx, dz);
      p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 5.5, dt);
      if (d > 0.25) {
        p.x += (dx / d) * 1.15 * dt;
        p.z += (dz / d) * 1.15 * dt;
        const ty = getTerrainHeight(p.x, p.z);
        if (ty >= -0.08) {
          p.inWater = false;
          p.y = ty;
          p.pitch = damp(p.pitch, 0, 8, dt);
          p.stepPhase += dt * 10;
          p.stepAmp = 0.9;
        } else {
          p.y = damp(p.y, -0.22, 6, dt);
          p.pitch = damp(p.pitch, 0.55, 6, dt);
        }
      } else {
        p.inWater = false;
        p.pitch = 0;
        p.y = getTerrainHeight(p.x, p.z);
        p.shakeTimer = 0.95; // Adorable dry-off shake right after leaving the pool!
        p.state = 'idle_land';
        p.stateTimer = 2.6 + Math.random() * 2.5;
        penguinChirp(p, 'curious');
      }
    }

    else {
      // --- idle_land (waddling, curious head tilts, preening, occasional diving/sliding!) ---
      p.stateTimer -= dt;
      p.pitch = damp(p.pitch, 0, 7, dt);
      const dx = p.targetX - p.x, dz = p.targetZ - p.z;
      const d = Math.hypot(dx, dz);

      if (d > 0.16) {
        p.yaw = dampAngle(p.yaw, Math.atan2(dx, dz), 5.5, dt);
        const nx = p.x + (dx / d) * 0.78 * dt;
        const nz = p.z + (dz / d) * 0.78 * dt;
        if (!isPointInWater(nx, nz)) {
          p.x = nx; p.z = nz;
          p.y = damp(p.y, getTerrainHeight(p.x, p.z), 14, dt);
          p.stepPhase += dt * 9.8;
          p.stepAmp = damp(p.stepAmp, 1.0, 8, dt);
        } else {
          p.targetX = p.x; p.targetZ = p.z;
        }
      } else {
        p.stepAmp = damp(p.stepAmp, 0, 8, dt);
        p.y = damp(p.y, getTerrainHeight(p.x, p.z), 14, dt);
        // Warmly look slightly toward viewer or a friend, tilting head adorably
        const camYaw = Math.atan2(camPos[0]*0.3 - p.x, camPos[2]*0.7 - p.z);
        p.yaw = dampAngle(p.yaw, camYaw, 1.8, dt);
        wantHeadTilt = Math.sin(simTime * 1.15 + p.seed * 2.1) * 0.16;

        // Occasional cute preening (tuck beak gently toward shoulder)
        if (p.preenTimer > 0) {
          p.preenTimer -= dt;
          p.headYaw = damp(p.headYaw, 0.78, 7, dt);
          p.headPitch = damp(p.headPitch, 0.42, 7, dt);
          wantTailWag = 0.35;
        }
      }

      // Notice nearby sliding ice cube!
      if (slidingIces.length > 0 && d <= 0.25) {
        const ic = slidingIces[0];
        const id = Math.hypot(ic.x - p.x, ic.z - p.z);
        if (id < 1.8) {
          lookTarget = [ic.x, ic.y, ic.z];
          if (id < 0.45 && !ic.inWater) {
            ic.vx += Math.sin(p.yaw) * 1.6;
            ic.vz += Math.cos(p.yaw) * 1.6;
            Sound.iceClink();
            penguinChirp(p, 'curious');
          }
        }
      }

      if (p.stateTimer <= 0) {
        const waterCount = penguins.filter(o => o.inWater).length;
        const r = Math.random();
        if ((bubblePartyTimer > 0 || (waterCount < 2 && r < 0.22)) && p.diveCooldown <= 0) {
          // Dive into the sparkling pool!
          const [sx, sz] = pickRandomSwimSpot();
          startPenguinDive(p, sx, sz);
        } else if (r < 0.34 && p.name === 'Hina' && p.diveCooldown <= 0) {
          p.state = 'toboggan_walk';
          p.targetX = -2.72; p.targetZ = 0.22;
          p.stateTimer = 6.0;
        } else if (r < 0.52) {
          p.preenTimer = 1.4;
          p.stateTimer = 2.6 + Math.random() * 2.0;
        } else if (r < 0.65 && p.wetness > 0.25) {
          p.shakeTimer = 0.85;
          p.stateTimer = 2.2;
        } else {
          const [lx, lz] = pickRandomLandSpot(p);
          p.targetX = lx; p.targetZ = lz;
          p.stateTimer = 3.2 + Math.random() * 3.5;
        }
      }
    }

    // --- Soft Penguin-Penguin Separation (no overlapping!) ---
    for (const o of penguins) {
      if (o === p) continue;
      if (p.inWater !== o.inWater) continue;
      if (p.state === 'diving' || p.state === 'porpoise' || p.state === 'toboggan') continue;
      const dx = p.x - o.x, dz = p.z - o.z;
      const d = Math.hypot(dx, dz);
      const minD = 0.56;
      if (d > 0.001 && d < minD) {
        const push = (minD - d) * 2.4 * dt;
        const nx = p.x + (dx / d) * push;
        const nz = p.z + (dz / d) * push;
        if (p.inWater ? isPointInWater(nx, nz) : !isPointInWater(nx, nz)) {
          p.x = nx; p.z = nz;
        }
      }
    }

    // --- Smooth Head Tracking & Expressive Secondary Motion ---
    if (p.state !== 'eating' && p.preenTimer <= 0) {
      const toLookYaw = Math.atan2(lookTarget[0] - p.x, lookTarget[2] - p.z);
      const relYaw = clamp(angleDiff(p.yaw, toLookYaw), -0.95, 0.95);
      const horizL = Math.hypot(lookTarget[0] - p.x, lookTarget[2] - p.z) + 0.001;
      const relPitch = clamp(-Math.atan2(lookTarget[1] - (p.y + 0.68 * p.scale), horizL), -0.68, 0.45);
      p.headYaw = damp(p.headYaw, relYaw, 7.5, dt);
      p.headPitch = damp(p.headPitch, relPitch, 7.5, dt);
    }
    p.headTilt = damp(p.headTilt, wantHeadTilt, 6.0, dt);
    p.beakOpen = damp(p.beakOpen, wantBeakOpen, 14.0, dt);
    p.happyEyes = damp(p.happyEyes, wantHappyEyes, 10.0, dt);
    p.tailWag = damp(p.tailWag, wantTailWag, 8.0, dt);
    p.bellySlide = damp(p.bellySlide, wantBellySlide, 7.0, dt);

    // Flipper articulation (flap, swim stroke, or cute relaxed balance)
    if (p.inWater) {
      const stroke = Math.sin(simTime * (5.5 + wantFlipperFlap * 5.0) + p.seed);
      p.flipperL = damp(p.flipperL, stroke * 0.72, 10, dt);
      p.flipperR = damp(p.flipperR, stroke * 0.72, 10, dt);
      p.flipperSpread = damp(p.flipperSpread, 0.68 + Math.cos(simTime * 6 + p.seed) * 0.25, 8, dt);
    } else {
      const flap = Math.sin(simTime * (12.0 + wantFlipperFlap * 11.0) + p.seed) * wantFlipperFlap;
      const idleSway = Math.sin(p.stepPhase) * 0.14 * p.stepAmp;
      p.flipperL = damp(p.flipperL, flap * 0.45 + idleSway, 12, dt);
      p.flipperR = damp(p.flipperR, flap * 0.45 - idleSway, 12, dt);
      p.flipperSpread = damp(p.flipperSpread, 0.14 + wantFlipperFlap * 0.62 + p.stepAmp * 0.18 + Math.abs(flap) * 0.28, 10, dt);
    }
  }
}

// ============================================================================
// 10. WORLD OBJECTS SIMULATION (FISH, BALL, ICE, WATERFALL, PARTICLES)
// ============================================================================
function updateWorld(dt) {
  // Bucket rattle decay & automatic fish refill
  bucketShake = Math.max(0, bucketShake - dt * 3.8);
  bucketJiggleTime += dt;
  for (const bf of bucketFish) {
    if (!bf.present) {
      bf.refillTimer -= dt;
      if (bf.refillTimer <= 0) {
        bf.present = true;
        bf.variant = pickNextFishVariant();
        bf.popAnim = 0.01;
      }
    } else if (bf.popAnim < 1) {
      bf.popAnim = Math.min(1, bf.popAnim + dt * 3.2);
    }
  }

  // Waterfall mist & sunlit rainbow arc
  if (rainbowTimer > 0) rainbowTimer = Math.max(0, rainbowTimer - dt);
  if (bubblePartyTimer > 0) bubblePartyTimer = Math.max(0, bubblePartyTimer - dt);
  const wfBoost = clamp(rainbowTimer * 0.22, 0, 1);
  Sound.setWaterfallBoost(wfBoost);

  // Waterfall continuous base foam + mist droplets
  if (Math.random() < dt * (14 + wfBoost * 24)) {
    const wx = -1.35 + (Math.random() - 0.5) * 0.72;
    const wz = -2.42 + (Math.random() - 0.5) * 0.28;
    spawnParticle('drop', wx, WATER_Y + 0.06, wz,
      (Math.random() - 0.5) * (0.6 + wfBoost * 0.9),
      0.7 + Math.random() * (0.9 + wfBoost * 1.1),
      0.4 + Math.random() * 0.7,
      0.38 + Math.random() * 0.4, 0.55 + Math.random() * 0.35, [0.92, 0.99, 1.0]);
    if (Math.random() < 0.25) addRipple(wx, wz, 0.24 + wfBoost * 0.22);
  }

  // Floor bubble-jet party vents!
  if (bubblePartyTimer > 0 && Math.random() < dt * 26) {
    const bx = (Math.random() - 0.5) * 3.6;
    const bz = -0.55 + (Math.random() - 0.5) * 2.2;
    const by = getTerrainHeight(bx, bz);
    if (by < -0.3) {
      spawnParticle('bubble', bx, by + 0.08, bz,
        (Math.random() - 0.5) * 0.25, 0.85 + Math.random() * 0.65, (Math.random() - 0.5) * 0.25,
        0.55 + Math.random() * 0.95, 2.2 + Math.random() * 1.4, [0.92, 0.99, 1.0]);
      if (Math.random() < 0.14) Sound.bubble();
    }
  }

  // Active fish physics (airborne throws, sinking/gliding in water, wiggling on rocks)
  for (let i = activeFish.length - 1; i >= 0; i--) {
    const f = activeFish[i];
    f.age += dt;
    if (f.state === 'held' || f.state === 'eaten') continue;

    if (f.state === 'air') {
      f.vy -= 8.8 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.z += f.vz * dt;
      const spdH = Math.hypot(f.vx, f.vz);
      if (spdH > 0.08) f.yaw = Math.atan2(f.vx, f.vz);
      f.pitch = clamp(-Math.atan2(f.vy, Math.max(0.2, spdH)), -1.1, 1.1);
      f.wiggle = 1.15;

      // Mid-air catch by a nearby eager penguin!
      let caught = false;
      for (const p of penguins) {
        if (p.state === 'eating' || p.state === 'diving' || p.state === 'fetch_gift') continue;
        const tip = getBeakTipWorldPos(p);
        if (V3.dist(tip, [f.x, f.y, f.z]) < 0.55) {
          triggerPenguinEat(p, f);
          caught = true;
          break;
        }
      }
      if (caught) continue;

      // Hit water or rock terrain
      const ty = getTerrainHeight(f.x, f.z);
      if (f.y <= WATER_Y && ty < WATER_Y - 0.08) {
        f.state = 'water';
        f.y = WATER_Y - 0.05;
        f.vx *= 0.35; f.vy = -0.55; f.vz *= 0.35;
        spawnSplash(f.x, f.z, 0.52);
        Sound.splash(0.45);
      } else if (f.y <= ty + 0.055) {
        f.y = ty + 0.055;
        if (ty < WATER_Y - 0.05) {
          f.state = 'water';
        } else {
          f.state = 'land';
          f.vx *= 0.2; f.vy = 0; f.vz *= 0.2;
          f.roll = Math.PI * 0.5;
          f.pitch = 0;
        }
      }
      // Safety bounds
      if (f.y < -4 || Math.abs(f.x) > 8 || Math.abs(f.z) > 8) {
        activeFish.splice(i, 1);
      }
    } else if (f.state === 'water') {
      // Gently glide and glint underwater while penguins dive & chase it!
      const ty = getTerrainHeight(f.x, f.z);
      f.vx *= Math.exp(-2.2 * dt);
      f.vz *= Math.exp(-2.2 * dt);
      f.yaw += Math.sin(simTime * 2.5 + i) * 0.4 * dt;
      f.x += (f.vx + Math.sin(f.yaw) * 0.16) * dt;
      f.z += (f.vz + Math.cos(f.yaw) * 0.16) * dt;
      // Keep gently inside pool
      if (!isPointInWater(f.x, f.z)) {
        f.yaw += Math.PI * 0.7;
        f.x = lerp(f.x, 0.05, 0.08);
        f.z = lerp(f.z, -0.5, 0.08);
      }
      const targetY = clamp(ty + 0.32, -0.85, -0.22);
      f.y = damp(f.y, targetY + Math.sin(simTime * 3.1 + i) * 0.04, 2.5, dt);
      f.pitch = damp(f.pitch, 0, 5, dt);
      f.roll = damp(f.roll, 0, 5, dt);
      f.wiggle = 0.85;
    } else if (f.state === 'land') {
      f.vx *= Math.exp(-6 * dt);
      f.vz *= Math.exp(-6 * dt);
      f.x += f.vx * dt;
      f.z += f.vz * dt;
      f.y = getTerrainHeight(f.x, f.z) + 0.05;
      f.wiggle = 0.35 + Math.max(0, Math.sin(simTime * 6 + i * 2)) * 0.4;
    }
  }

  // Floating Pastel Beach Ball Physics
  beachBall.boopCooldown = Math.max(0, beachBall.boopCooldown - dt);
  beachBall.vy -= 7.8 * dt;
  beachBall.x += beachBall.vx * dt;
  beachBall.y += beachBall.vy * dt;
  beachBall.z += beachBall.vz * dt;
  const ballFloor = getTerrainHeight(beachBall.x, beachBall.z);
  const inBallWater = ballFloor < WATER_Y - 0.12;
  if (inBallWater && beachBall.y < WATER_Y + 0.14) {
    // Buoyant float & splash!
    if (beachBall.vy < -0.9) {
      spawnSplash(beachBall.x, beachBall.z, clamp(-beachBall.vy * 0.22, 0.25, 0.75));
      Sound.splash(0.32);
    }
    const sub = (WATER_Y + 0.14) - beachBall.y;
    beachBall.vy += sub * 24.0 * dt;
    beachBall.vy *= Math.exp(-3.8 * dt);
    beachBall.vx *= Math.exp(-1.2 * dt);
    beachBall.vz *= Math.exp(-1.2 * dt);
    // Gentle sunlit pool drift
    beachBall.vx += Math.sin(simTime * 0.7) * 0.08 * dt;
    beachBall.vz += Math.cos(simTime * 0.6) * 0.08 * dt;
  } else if (beachBall.y < ballFloor + beachBall.radius) {
    beachBall.y = ballFloor + beachBall.radius;
    if (beachBall.vy < -0.5) {
      beachBall.vy = -beachBall.vy * 0.45;
      Sound.ballBoop();
    } else {
      beachBall.vy = 0;
    }
    // Gently roll back toward pool if pushed onto steep shore
    const n = getTerrainNormal(beachBall.x, beachBall.z);
    beachBall.vx += n[0] * 3.5 * dt;
    beachBall.vz += n[2] * 3.5 * dt;
    beachBall.vx *= Math.exp(-2.5 * dt);
    beachBall.vz *= Math.exp(-2.5 * dt);
  }
  // Keep beach ball comfortably in view
  const bdx = beachBall.x - 0.1, bdz = beachBall.z + 0.55;
  const bdist = Math.hypot(bdx / 2.6, bdz / 1.9);
  if (bdist > 1.0) {
    beachBall.vx -= bdx * 1.2 * dt;
    beachBall.vz -= bdz * 1.2 * dt;
  }
  beachBall.rotX += beachBall.vz * 2.4 * dt;
  beachBall.rotZ -= beachBall.vx * 2.4 * dt;

  // Sliding Ice Cubes
  for (let i = slidingIces.length - 1; i >= 0; i--) {
    const ic = slidingIces[i];
    ic.life -= dt;
    ic.vy -= 8.5 * dt;
    ic.x += ic.vx * dt;
    ic.y += ic.vy * dt;
    ic.z += ic.vz * dt;
    ic.yaw += ic.spin * dt;
    const ty = getTerrainHeight(ic.x, ic.z);
    if (ty < WATER_Y - 0.08 && ic.y <= WATER_Y + 0.02) {
      if (!ic.inWater) {
        ic.inWater = true;
        spawnSplash(ic.x, ic.z, 0.32);
        Sound.splash(0.25);
      }
      ic.y = damp(ic.y, WATER_Y + 0.015 + Math.sin(simTime * 4 + i) * 0.012, 8, dt);
      ic.vy = 0;
      ic.vx *= Math.exp(-1.8 * dt);
      ic.vz *= Math.exp(-1.8 * dt);
      ic.spin *= Math.exp(-1.5 * dt);
    } else if (ic.y < ty + 0.05) {
      ic.y = ty + 0.05;
      ic.vy = Math.abs(ic.vy) > 0.6 ? -ic.vy * 0.3 : 0;
      // Low slippery ice friction!
      const n = getTerrainNormal(ic.x, ic.z);
      ic.vx += n[0] * 1.8 * dt;
      ic.vz += n[2] * 1.8 * dt;
      ic.vx *= Math.exp(-0.9 * dt);
      ic.vz *= Math.exp(-0.9 * dt);
      ic.spin *= Math.exp(-1.2 * dt);
    }
    if (ic.life <= 0) slidingIces.splice(i, 1);
  }

  // Placed Gift Shells pop-in & shimmer decay
  for (const g of placedGifts) {
    g.pop = Math.min(1, g.pop + dt * 3.5);
    g.shimmer = Math.max(0, g.shimmer - dt * 1.8);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    if (pt.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    if (pt.type === 'drop') {
      pt.vy -= 6.8 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.z += pt.vz * dt;
      if (pt.y < WATER_Y && pt.vy < 0 && isPointInWater(pt.x, pt.z)) {
        pt.life = 0;
      }
    } else if (pt.type === 'bubble') {
      pt.x += (pt.vx + Math.sin(simTime * 5 + i) * 0.14) * dt;
      pt.y += pt.vy * dt;
      pt.z += (pt.vz + Math.cos(simTime * 4.5 + i) * 0.14) * dt;
      if (pt.y > WATER_Y + 0.02 && pt.y < WATER_Y + 0.12 && pt.vy > 0) {
        // Gentle shimmer float slightly into sunny air!
        pt.vy *= 0.96;
      }
    } else {
      // Golden sunlit sparkle mote
      pt.x += (pt.vx + Math.sin(simTime * 3.8 + i) * 0.16) * dt;
      pt.y += pt.vy * dt;
      pt.z += pt.vz * dt;
      pt.vx *= Math.exp(-1.5 * dt);
      pt.vz *= Math.exp(-1.5 * dt);
    }
  }
}

// ============================================================================
// 11. CAMERA, RAYCASTING & CHILD-FRIENDLY TAP/DRAG INTERACTION
// ============================================================================
const projMat = M4.create();
const viewMat = M4.create();
const viewProjMat = M4.create();
const invViewProjMat = M4.create();
const lightViewProjMat = M4.create();

const SUN_DIR = V3.norm([0.46, 0.82, 0.34]);
let camPos = [0.0, 3.72, 7.65];
let camTarget = [0.0, 0.38, 0.12];
let camLookShiftX = 0;
let camLookShiftY = 0;

function updateLightMatrix() {
  const lv = M4.create(), lp = M4.create();
  const eye = V3.scale(SUN_DIR, 14.0);
  M4.lookAt(lv, eye, [0, 0.2, -0.3], [0, 1, 0]);
  M4.ortho(lp, -6.2, 6.2, -5.2, 5.2, 1.0, 28.0);
  M4.multiply(lightViewProjMat, lp, lv);
}
updateLightMatrix();

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function updateCamera(dt) {
  const aspect = canvas.width / Math.max(1, canvas.height);
  // Gracefully widen FOV and pull back slightly on portrait phones/tablets so the bucket & full pool stay reachable!
  const portraitBoost = aspect < 1.15 ? clamp((1.15 - aspect) * 0.95, 0, 0.58) : 0;
  const fovy = (38 + portraitBoost * 20) * Math.PI / 180;

  // Very gentle, calm breathing camera + subtle follow when holding a fish
  const wantShiftX = heldFish ? clamp(heldFish.x * 0.08, -0.25, 0.25) : Math.sin(simTime * 0.22) * 0.12;
  const wantShiftY = Math.cos(simTime * 0.19) * 0.04;
  camLookShiftX = damp(camLookShiftX, wantShiftX, 2.5, dt);
  camLookShiftY = damp(camLookShiftY, wantShiftY, 2.5, dt);

  camPos = [
    camLookShiftX * 0.9,
    3.68 + portraitBoost * 1.15 + camLookShiftY,
    7.45 + portraitBoost * 1.55
  ];
  camTarget = [camLookShiftX * 0.35, 0.36, 0.15];

  M4.perspective(projMat, fovy, aspect, 0.15, 65.0);
  M4.lookAt(viewMat, camPos, camTarget, [0, 1, 0]);
  M4.multiply(viewProjMat, projMat, viewMat);
  M4.invert(invViewProjMat, viewProjMat);
}

function getRayFromClient(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
  const pNear = M4.transformPoint(invViewProjMat, [nx, ny, -1]);
  const pFar  = M4.transformPoint(invViewProjMat, [nx, ny,  1]);
  return { origin: pNear, dir: V3.norm(V3.sub(pFar, pNear)) };
}

function raySphereDist(ray, center, rad) {
  const oc = V3.sub(ray.origin, center);
  const b = V3.dot(oc, ray.dir);
  const c = V3.dot(oc, oc) - rad * rad;
  const disc = b * b - c;
  if (disc < 0) return -1;
  const t = -b - Math.sqrt(disc);
  return t > 0 ? t : -1;
}

function rayIntersectWater(ray) {
  if (Math.abs(ray.dir[1]) < 1e-4) return null;
  const t = (WATER_Y - ray.origin[1]) / ray.dir[1];
  if (t <= 0 || t > 25) return null;
  return V3.add(ray.origin, V3.scale(ray.dir, t));
}

function rayIntersectTerrain(ray) {
  // Fast sphere-march / binary refine against terrain heightfield
  let t = 0.5;
  for (let i = 0; i < 40; i++) {
    const p = V3.add(ray.origin, V3.scale(ray.dir, t));
    const h = getTerrainHeight(p[0], p[2]);
    if (p[1] <= h) {
      let lo = Math.max(0.1, t - 0.35), hi = t;
      for (let k = 0; k < 6; k++) {
        const mid = (lo + hi) * 0.5;
        const mp = V3.add(ray.origin, V3.scale(ray.dir, mid));
        if (mp[1] <= getTerrainHeight(mp[0], mp[2])) hi = mid; else lo = mid;
      }
      return V3.add(ray.origin, V3.scale(ray.dir, (lo + hi) * 0.5));
    }
    t += 0.32;
    if (t > 16) break;
  }
  return null;
}

// Compute comfortable 3D drag point for a held fish above rocks & pool
function getFishDragTarget(ray) {
  let pt = rayIntersectTerrain(ray);
  const wp = rayIntersectWater(ray);
  if (wp && (!pt || wp[2] < pt[2])) {
    if (isPointInWater(wp[0], wp[2])) pt = wp;
  }
  if (!pt) pt = V3.add(ray.origin, V3.scale(ray.dir, 6.2));
  const x = clamp(pt[0], -3.4, 3.4);
  const z = clamp(pt[2], -2.6, 3.25);
  const ground = Math.max(WATER_Y, getTerrainHeight(x, z));
  let y = ground + 0.72;

  // Soft magnetic assist toward a nearby penguin's eager open beak!
  let bestP = null, bestD = 0.95;
  for (const p of penguins) {
    if (p.state === 'eating' || p.state === 'diving') continue;
    const tip = getBeakTipWorldPos(p);
    const d = Math.hypot(x - tip[0], z - tip[2]);
    if (d < bestD) { bestD = d; bestP = p; }
  }
  if (bestP) {
    const tip = getBeakTipWorldPos(bestP);
    const pull = smoothstep(0.95, 0.25, bestD) * 0.65;
    return [lerp(x, tip[0], pull), lerp(y, tip[1] + 0.08, pull), lerp(z, tip[2], pull)];
  }
  return [x, y, z];
}

// Pointer Interaction State
let activePointerId = null;
let dragMode = null; // 'fish' | 'pet' | 'water' | 'ball'
let dragStartTime = 0;
let dragStartXY = [0, 0];
let dragMovedDist = 0;
let dragVel3 = [0, 0, 0];
let lastFishPos = [0, 0, 0];
let pettedPenguin = null;
let lastWaterRippleTime = 0;
let lastPetSparkleTime = 0;

function pickFishFromBucket(ray) {
  // Find a present bucket fish (prefer closest or special variant)
  let slot = bucketFish.find(bf => bf.present && bf.variant === 3)
          || bucketFish.find(bf => bf.present);
  let variant = slot ? slot.variant : pickNextFishVariant();
  if (slot) {
    slot.present = false;
    slot.refillTimer = 2.6;
  }
  bucketShake = 1.0;
  Sound.bucketClink();
  Sound.iceClink();
  spawnHappySparkles(BUCKET_POS[0], BUCKET_POS[1] + 0.56, BUCKET_POS[2], 6, false);

  const startPos = getFishDragTarget(ray);
  const f = createWorldFish(
    lerp(BUCKET_POS[0], startPos[0], 0.45),
    BUCKET_POS[1] + 0.72,
    lerp(BUCKET_POS[2], startPos[2], 0.45),
    variant
  );
  heldFish = f;
  lastFishPos = [f.x, f.y, f.z];
  dragVel3 = [0, 0, 0];

  // Wake up penguins' curiosity immediately!
  for (const p of penguins) {
    if (p.state === 'idle_land' || p.state === 'swim_cruise') {
      penguinChirp(p, 'curious');
    }
  }
}

function petPenguin(p) {
  if (p.state === 'eating' || p.state === 'diving' || p.state === 'porpoise' || p.state === 'toboggan') return;
  const wasPetted = p.state === 'petted';
  p.state = 'petted';
  p.petTimer = 1.45;
  p.squash = 0.90;
  if (!wasPetted) {
    penguinChirp(p, 'coo');
    spawnHappySparkles(p.x, p.y + 0.62 * p.scale, p.z, 8, true);
    if (p.wetness > 0.3) p.shakeTimer = 0.5;
  }
}

canvas.addEventListener('pointerdown', (e) => {
  Sound.unlock();
  if (activePointerId !== null) return;
  activePointerId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  dragStartTime = performance.now();
  dragStartXY = [e.clientX, e.clientY];
  dragMovedDist = 0;

  const ray = getRayFromClient(e.clientX, e.clientY);

  // 1. Check Fish Bucket (very generous touch target for 5-year-old hands!)
  const bucketCenter = [BUCKET_POS[0], BUCKET_POS[1] + 0.34, BUCKET_POS[2]];
  if (raySphereDist(ray, bucketCenter, 0.76) > 0) {
    dragMode = 'fish';
    pickFishFromBucket(ray);
    return;
  }

  // 2. Check Penguins (petting / tickling!)
  let hitP = null, bestPT = 1e9;
  for (const p of penguins) {
    const c = getPenguinCenterWorldPos(p);
    const t = raySphereDist(ray, c, 0.52 * p.scale);
    if (t > 0 && t < bestPT) { bestPT = t; hitP = p; }
  }
  if (hitP) {
    dragMode = 'pet';
    pettedPenguin = hitP;
    petPenguin(hitP);
    return;
  }

  // 3. Check Floating Beach Ball!
  if (raySphereDist(ray, [beachBall.x, beachBall.y, beachBall.z], 0.52) > 0) {
    dragMode = 'ball';
    beachBall.vy = 1.65;
    beachBall.vx += (Math.random() - 0.5) * 1.4;
    beachBall.vz -= 0.8 + Math.random() * 0.8;
    spawnSplash(beachBall.x, beachBall.z, 0.65);
    Sound.ballBoop();
    return;
  }

  // 4. Check Back Waterfall Rock (boosts sparkling mist & sunlit rainbow!)
  if (raySphereDist(ray, [WATERFALL_POS[0], 0.95, WATERFALL_POS[2] + 0.35], 1.15) > 0) {
    rainbowTimer = Math.max(rainbowTimer, 9.5);
    bubblePartyTimer = Math.max(bubblePartyTimer, 6.5);
    Sound.rainbowShimmer();
    Sound.splash(0.85);
    spawnSplash(-1.35, -2.25, 1.05);
    for (const p of penguins) {
      if (p.inWater) {
        p.targetX = -1.15 + (Math.random() - 0.5) * 0.8;
        p.targetZ = -1.65 + (Math.random() - 0.5) * 0.5;
        penguinChirp(p, 'happy');
      }
    }
    return;
  }

  // 5. Check Gifted Seashells / Sea-glass on right foreground ledge!
  for (let i = 0; i < placedGifts.length; i++) {
    const g = placedGifts[i];
    if (raySphereDist(ray, [g.x, g.y + 0.05, g.z], 0.32) > 0) {
      g.shimmer = 1.0;
      Sound.shellChime(i);
      spawnHappySparkles(g.x, g.y + 0.14, g.z, 10, true);
      return;
    }
  }

  // 6. Check Sliding Ice Cubes!
  for (const ic of slidingIces) {
    if (raySphereDist(ray, [ic.x, ic.y, ic.z], 0.34) > 0) {
      ic.vx += (Math.random() - 0.5) * 2.4;
      ic.vz -= 1.4 + Math.random() * 1.0;
      ic.vy = 1.1;
      Sound.iceClink();
      return;
    }
  }

  // 7. Check Crystal Pool Water Surface!
  const wp = rayIntersectWater(ray);
  if (wp && isPointInWater(wp[0], wp[2])) {
    dragMode = 'water';
    spawnSplash(wp[0], wp[2], 0.62);
    Sound.splash(0.45);
    lastWaterRippleTime = simTime;
    // Swimming penguins playfully turn toward the child's water ripples!
    for (const p of penguins) {
      if (p.inWater && p.state === 'swim_cruise') {
        p.targetX = clamp(wp[0], -2.1, 2.1);
        p.targetZ = clamp(wp[2], -1.8, 1.0);
        p.targetY = -0.24;
      }
    }
    return;
  }

  // 8. Tap on sunny rock -> curious nearby penguin waddles over to check it out!
  const tp = rayIntersectTerrain(ray);
  if (tp && !isPointInWater(tp[0], tp[2])) {
    const [lx, lz] = clampLandSpot(tp[0], tp[2]);
    let nearest = null, bestD = 3.5;
    for (const p of penguins) {
      if (!p.inWater && p.state === 'idle_land') {
        const d = Math.hypot(p.x - lx, p.z - lz);
        if (d < bestD) { bestD = d; nearest = p; }
      }
    }
    if (nearest) {
      nearest.targetX = lx;
      nearest.targetZ = lz;
      nearest.stateTimer = 4.0;
      penguinChirp(nearest, 'curious');
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePointerId) return;
  dragMovedDist += Math.hypot(e.clientX - dragStartXY[0], e.clientY - dragStartXY[1]);
  dragStartXY = [e.clientX, e.clientY];
  const ray = getRayFromClient(e.clientX, e.clientY);

  if (dragMode === 'fish' && heldFish) {
    const target = getFishDragTarget(ray);
    const oldX = heldFish.x, oldY = heldFish.y, oldZ = heldFish.z;
    heldFish.x = lerp(heldFish.x, target[0], 0.55);
    heldFish.y = lerp(heldFish.y, target[1], 0.55);
    heldFish.z = lerp(heldFish.z, target[2], 0.55);
    const dx = heldFish.x - oldX, dy = heldFish.y - oldY, dz = heldFish.z - oldZ;
    dragVel3 = [
      lerp(dragVel3[0], dx * 38, 0.35),
      lerp(dragVel3[1], dy * 38, 0.35),
      lerp(dragVel3[2], dz * 38, 0.35)
    ];
    // Natural dangling fish orientation following drag movement
    if (Math.hypot(dx, dz) > 0.004) {
      heldFish.yaw = dampAngle(heldFish.yaw, Math.atan2(dx, dz), 12, 0.03);
    }
    heldFish.pitch = clamp(-0.35 + dy * 2.5, -0.9, 0.6);
    heldFish.roll = clamp(-dx * 4.5, -0.6, 0.6);
    heldFish.wiggle = 1.35;
  } else if (dragMode === 'pet' && pettedPenguin) {
    petPenguin(pettedPenguin);
    if (simTime - lastPetSparkleTime > 0.22) {
      lastPetSparkleTime = simTime;
      spawnHappySparkles(pettedPenguin.x, pettedPenguin.y + 0.58 * pettedPenguin.scale, pettedPenguin.z, 3, true);
    }
  } else if (dragMode === 'water') {
    const wp = rayIntersectWater(ray);
    if (wp && isPointInWater(wp[0], wp[2]) && simTime - lastWaterRippleTime > 0.07) {
      lastWaterRippleTime = simTime;
      addRipple(wp[0], wp[2], 0.52);
      spawnParticle('drop', wp[0], WATER_Y + 0.05, wp[2],
        (Math.random()-0.5)*0.9, 0.9 + Math.random()*0.7, (Math.random()-0.5)*0.9, 0.4, 0.42, [0.88, 0.98, 1.0]);
      if (Math.random() < 0.35) Sound.bubble();
      for (const p of penguins) {
        if (p.inWater && p.state === 'swim_cruise') {
          p.targetX = clamp(wp[0], -2.1, 2.1);
          p.targetZ = clamp(wp[2], -1.8, 1.0);
        }
      }
    }
  } else if (dragMode === 'ball') {
    const wp = rayIntersectWater(ray);
    if (wp) {
      const dx = wp[0] - beachBall.x, dz = wp[2] - beachBall.z;
      beachBall.vx = clamp(dx * 4.5, -4.0, 4.0);
      beachBall.vz = clamp(dz * 4.5, -4.0, 4.0);
      if (simTime - lastWaterRippleTime > 0.12) {
        lastWaterRippleTime = simTime;
        addRipple(beachBall.x, beachBall.z, 0.38);
      }
    }
  }
});

function releasePointer(e) {
  if (e.pointerId !== activePointerId) return;
  activePointerId = null;

  if (dragMode === 'fish' && heldFish) {
    const f = heldFish;
    heldFish = null;
    const heldMs = performance.now() - dragStartTime;

    // Case 1: Quick tap on the bucket -> toss a shiny fish cheerfully toward an eager penguin or into the pool!
    if (heldMs < 260 && dragMovedDist < 22) {
      let tx, tz;
      if (totalFedCount % 2 === 0) {
        // Aim gently near an eager land or water penguin
        const p = penguins[totalFedCount % penguins.length];
        tx = p.x + (Math.random() - 0.5) * 0.35;
        tz = p.z + (Math.random() - 0.5) * 0.35;
      } else {
        // Toss into the sparkling pool so penguins dive & chase it!
        [tx, tz] = pickRandomSwimSpot();
      }
      const flightT = 0.68;
      f.state = 'air';
      f.vx = (tx - f.x) / flightT;
      f.vz = (tz - f.z) / flightT;
      f.vy = (0.35 - f.y + 0.5 * 8.8 * flightT * flightT) / flightT;
      // Occasionally pop a playful skating ice cube too!
      if (Math.random() < 0.32) spawnSlidingIce();
    } else {
      // Case 2: Released near any penguin -> smooth friendly catch!
      let closestP = null, bestD = 0.92;
      for (const p of penguins) {
        if (p.state === 'eating' || p.state === 'diving') continue;
        const tip = getBeakTipWorldPos(p);
        const d = V3.dist(tip, [f.x, f.y, f.z]);
        if (d < bestD) { bestD = d; closestP = p; }
      }
      if (closestP) {
        triggerPenguinEat(closestP, f);
      } else {
        // Case 3: Natural parabolic toss using finger flick velocity!
        f.state = 'air';
        f.vx = clamp(dragVel3[0] * 0.42, -4.5, 4.5);
        f.vz = clamp(dragVel3[2] * 0.42, -5.2, 3.2);
        f.vy = clamp(1.35 + dragVel3[1] * 0.25 + Math.hypot(f.vx, f.vz) * 0.32, 0.8, 4.6);
      }
    }
  }

  dragMode = null;
  pettedPenguin = null;
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

// ============================================================================
// 12. RENDER PIPELINE (SHADOW PASS + SKY + PBR + PENGUINS + CRYSTAL WATER + FX)
// ============================================================================
const modelMat = M4.create();
const normalMat = new Float32Array(9);
const pBodyMat = M4.create();
const pHeadMat = M4.create();
const pPartMat = M4.create();
const emptyVAO = gl.createVertexArray();

function drawShadowMesh(mesh, mat, wiggle = 0) {
  gl.uniformMatrix4fv(shadowU.uModel, false, mat);
  gl.uniform1f(shadowU.uFishWiggle, wiggle);
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.indexType, 0);
}

function drawPBRMesh(mesh, mat, matType, baseCol, rough, metal, wet = 0, variant = 0, seed = 0, wiggle = 0) {
  M4.normalMat3(normalMat, mat);
  gl.uniformMatrix4fv(pbrU.uModel, false, mat);
  gl.uniformMatrix3fv(pbrU.uNormalMat, false, normalMat);
  gl.uniform1i(pbrU.uMatType, matType);
  gl.uniform3f(pbrU.uBaseColor, baseCol[0], baseCol[1], baseCol[2]);
  gl.uniform1f(pbrU.uRoughness, rough);
  gl.uniform1f(pbrU.uMetalness, metal);
  gl.uniform1f(pbrU.uWetness, wet);
  gl.uniform1f(pbrU.uVariant, variant);
  gl.uniform1f(pbrU.uPenguinSeed, seed);
  gl.uniform1f(pbrU.uFishWiggle, wiggle);
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.indexType, 0);
}

function drawFXMesh(mesh, mat, mode, col4) {
  M4.normalMat3(normalMat, mat);
  gl.uniformMatrix4fv(fxU.uModel, false, mat);
  gl.uniformMatrix3fv(fxU.uNormalMat, false, normalMat);
  gl.uniform1i(fxU.uFxMode, mode);
  gl.uniform4f(fxU.uColor, col4[0], col4[1], col4[2], col4[3]);
  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.indexType, 0);
}

function drawPenguin(p, isShadow) {
  computePenguinBodyMatrix(p, pBodyMat);
  getPenguinHeadMatrix(p, pBodyMat, pHeadMat);

  if (isShadow) {
    drawShadowMesh(MESH.pBody, pBodyMat);
    drawShadowMesh(MESH.pHead, pHeadMat);
    // Flippers in shadow
    for (const side of [1, -1]) {
      M4.copy(pPartMat, pBodyMat);
      M4.translate(pPartMat, side * 0.205, 0.50, 0.01);
      M4.rotateZ(pPartMat, side * p.flipperSpread);
      M4.rotateX(pPartMat, side > 0 ? p.flipperL : p.flipperR);
      drawShadowMesh(side > 0 ? MESH.pFlipL : MESH.pFlipR, pPartMat);
    }
    return;
  }

  // Body (Cape Penguin tuxedo + horseshoe chest stripe + belly speckles!)
  drawPBRMesh(MESH.pBody, pBodyMat, 2, [1,1,1], 0.68, 0.0, p.wetness, 0, p.seed);

  // Cute stubby wagging tail
  M4.copy(pPartMat, pBodyMat);
  M4.translate(pPartMat, 0, 0.14, -0.175);
  M4.rotateY(pPartMat, Math.sin(simTime * 22.0 + p.seed) * 0.34 * (0.15 + p.tailWag));
  drawPBRMesh(MESH.pTail, pPartMat, 0, [1,1,1], lerp(0.66, 0.22, p.wetness), 0.0);

  // Articulated Flippers (Left & Right)
  for (const side of [1, -1]) {
    M4.copy(pPartMat, pBodyMat);
    M4.translate(pPartMat, side * 0.202, 0.51, 0.012);
    M4.rotateZ(pPartMat, side * p.flipperSpread);
    M4.rotateX(pPartMat, side > 0 ? p.flipperL : p.flipperR);
    drawPBRMesh(side > 0 ? MESH.pFlipL : MESH.pFlipR, pPartMat, 0, [1,1,1], lerp(0.62, 0.20, p.wetness), 0.0);
  }

  // Articulated Webbed Feet (animated waddle!)
  for (const side of [1, -1]) {
    const phase = p.stepPhase + (side > 0 ? 0 : Math.PI);
    const lift = p.inWater ? 0 : Math.max(0, Math.sin(phase)) * 0.048 * p.stepAmp;
    const stride = p.inWater ? -0.05 : Math.cos(phase) * 0.055 * p.stepAmp;
    M4.copy(pPartMat, pBodyMat);
    M4.translate(pPartMat, side * 0.095, 0.006 + lift, 0.02 + stride);
    M4.rotateY(pPartMat, side * 0.18);
    M4.rotateX(pPartMat, p.inWater ? 1.1 : -lift * 4.5);
    drawPBRMesh(MESH.pFoot, pPartMat, 0, [1,1,1], lerp(0.55, 0.22, p.wetness), 0.0);
  }

  // Head (Cape Penguin white C-stripe + rosy pink eye patch!)
  drawPBRMesh(MESH.pHead, pHeadMat, 3, [1,1,1], 0.66, 0.0, p.wetness, 0, p.seed);

  // Articulated Upper & Lower Beak (opens wide for fish!)
  M4.copy(pPartMat, pHeadMat);
  M4.translate(pPartMat, 0, -0.012, 0.135);
  M4.rotateX(pPartMat, -p.beakOpen * 0.35);
  drawPBRMesh(MESH.pBeakU, pPartMat, 4, [1,1,1], 0.28, 0.02);

  M4.copy(pPartMat, pHeadMat);
  M4.translate(pPartMat, 0, -0.018, 0.132);
  M4.rotateX(pPartMat, p.beakOpen * 0.72);
  drawPBRMesh(MESH.pBeakL, pPartMat, 4, [1,1,1], 0.28, 0.02);

  // Glossy Sparkling Eyes + Blinking & Happy-Smiling Crescent Eyelids!
  for (const side of [1, -1]) {
    M4.copy(pPartMat, pHeadMat);
    M4.translate(pPartMat, side * 0.118, 0.022, 0.092);
    M4.rotateY(pPartMat, side * 0.42);
    drawPBRMesh(MESH.pEye, pPartMat, 5, [1,1,1], 0.04, 0.05);

    // Upper eyelid (blinks down naturally)
    if (p.blink > 0.02) {
      M4.copy(pPartMat, pHeadMat);
      M4.translate(pPartMat, side * 0.118, 0.022, 0.092);
      M4.rotateY(pPartMat, side * 0.42);
      M4.rotateX(pPartMat, lerp(-1.15, 0.05, p.blink));
      drawPBRMesh(MESH.pLidU, pPartMat, 0, [1,1,1], 0.62, 0.0);
    }
    // Lower eyelid rises into adorable smiling crescent (^ ^) when happy or petted!
    if (p.happyEyes > 0.02 || p.blink > 0.02) {
      const smileAmt = Math.max(p.happyEyes * 0.92, p.blink * 0.65);
      M4.copy(pPartMat, pHeadMat);
      M4.translate(pPartMat, side * 0.118, 0.022, 0.092);
      M4.rotateY(pPartMat, side * 0.42);
      M4.rotateX(pPartMat, lerp(1.05, -0.18, smileAmt));
      drawPBRMesh(MESH.pLidL, pPartMat, 0, [1,1,1], 0.62, 0.0);
    }
  }

  // Carried seashell gift in beak when returning from a dive!
  if (p.carryingGift !== null && !p.inWater) {
    const slot = GIFT_SLOTS[p.carryingGift];
    if (slot) {
      M4.copy(pPartMat, pHeadMat);
      M4.translate(pPartMat, 0, -0.022, 0.255);
      M4.rotateX(pPartMat, 0.35);
      drawPBRMesh(slot[2] === 'shell' ? MESH.shell : MESH.pebble, pPartMat, 9, slot[3], 0.16, 0.18, 0, p.carryingGift);
    }
  }
}

function drawWorldFish(f, isShadow) {
  if (f.scale <= 0.02) return;
  M4.identity(modelMat);
  M4.translate(modelMat, f.x, f.y, f.z);
  M4.rotateY(modelMat, f.yaw);
  M4.rotateX(modelMat, f.pitch);
  M4.rotateZ(modelMat, f.roll);
  M4.scale(modelMat, f.scale, f.scale, f.scale);
  if (isShadow) {
    drawShadowMesh(MESH.fish, modelMat, f.wiggle);
  } else {
    drawPBRMesh(MESH.fish, modelMat, 6, [1,1,1], 0.14, 0.72, 0, f.variant, 0, f.wiggle);
  }
}

function drawBucketAndFish(isShadow) {
  const jiggleZ = Math.sin(bucketJiggleTime * 34) * 0.075 * bucketShake;
  const jiggleX = Math.cos(bucketJiggleTime * 29) * 0.055 * bucketShake;
  M4.identity(modelMat);
  M4.translate(modelMat, BUCKET_POS[0], BUCKET_POS[1], BUCKET_POS[2]);
  M4.rotateY(modelMat, 0.42);
  // Subtle tilt toward viewer so the shiny fish inside are super inviting!
  M4.rotateX(modelMat, 0.06 + jiggleX);
  M4.rotateZ(modelMat, jiggleZ);

  if (isShadow) {
    drawShadowMesh(MESH.bucket, modelMat);
  } else {
    drawPBRMesh(MESH.bucket, modelMat, 7, [1,1,1], 0.30, 0.78);
  }

  // Visible shimmering fish peeking out of the bucket!
  for (const bf of bucketFish) {
    if (!bf.present) continue;
    const pop = smoothstep(0, 1, bf.popAnim);
    M4.copy(pPartMat, modelMat);
    M4.translate(pPartMat, bf.ox, lerp(0.28, 0.43, pop) + Math.sin(simTime * 3 + bf.slot) * 0.005, bf.oz);
    M4.rotateY(pPartMat, bf.yaw);
    M4.rotateX(pPartMat, bf.pitch);
    const sc = (bf.variant === 2 ? 1.12 : 0.96) * pop;
    M4.scale(pPartMat, sc, sc, sc);
    if (isShadow) {
      drawShadowMesh(MESH.fish, pPartMat, 0.25);
    } else {
      drawPBRMesh(MESH.fish, pPartMat, 6, [1,1,1], 0.14, 0.72, 0, bf.variant, 0, 0.25);
    }
  }
}

function renderScene() {
  // === PASS 1: 2048x2048 Sun Shadow Map ===
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT); // Front-face culling prevents self-shadow acne!
  gl.useProgram(shadowProg);
  gl.uniformMatrix4fv(shadowU.uLightViewProj, false, lightViewProjMat);
  gl.uniform1f(shadowU.uTime, simTime);

  M4.identity(modelMat);
  drawShadowMesh(MESH.terrain, modelMat);
  for (const b of BOULDERS) {
    M4.identity(modelMat);
    M4.translate(modelMat, b.pos[0], b.pos[1], b.pos[2]);
    M4.rotateY(modelMat, b.yaw);
    M4.scale(modelMat, b.scale[0], b.scale[1], b.scale[2]);
    drawShadowMesh(b.mesh, modelMat);
  }
  drawBucketAndFish(true);
  for (const p of penguins) drawPenguin(p, true);
  for (const f of activeFish) drawWorldFish(f, true);
  M4.identity(modelMat);
  M4.translate(modelMat, beachBall.x, beachBall.y, beachBall.z);
  drawShadowMesh(MESH.ball, modelMat);

  gl.cullFace(gl.BACK);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // === PASS 2: Main Viewport — Sunny Sky Dome ===
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(skyU.uInvViewProj, false, invViewProjMat);
  gl.uniform3f(skyU.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(skyU.uSunDir, SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]);
  gl.uniform1f(skyU.uTime, simTime);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // === PASS 3: Opaque PBR World & Characters ===
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.useProgram(pbrProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(pbrU.uShadowMap, 0);
  gl.uniformMatrix4fv(pbrU.uViewProj, false, viewProjMat);
  gl.uniformMatrix4fv(pbrU.uLightViewProj, false, lightViewProjMat);
  gl.uniform3f(pbrU.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(pbrU.uSunDir, SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]);
  gl.uniform1f(pbrU.uTime, simTime);

  // Terrain (rocks + submerged sunlit turquoise pool basin!)
  M4.identity(modelMat);
  drawPBRMesh(MESH.terrain, modelMat, 1, [1,1,1], 0.82, 0.0);

  // Sculpted Accent Boulders
  for (const b of BOULDERS) {
    M4.identity(modelMat);
    M4.translate(modelMat, b.pos[0], b.pos[1], b.pos[2]);
    M4.rotateY(modelMat, b.yaw);
    M4.scale(modelMat, b.scale[0], b.scale[1], b.scale[2]);
    drawPBRMesh(b.mesh, modelMat, 1, [1,1,1], 0.80, 0.0);
  }

  // Sunlit Coastal Grass Tufts
  for (const g of GRASS_SPOTS) {
    const gy = getTerrainHeight(g[0], g[1]) - 0.04;
    M4.identity(modelMat);
    M4.translate(modelMat, g[0], gy, g[1]);
    M4.rotateY(modelMat, g[3]);
    M4.scale(modelMat, g[2], g[2], g[2]);
    drawPBRMesh(MESH.grass, modelMat, 10, [1,1,1], 0.55, 0.0);
  }

  // Aquarium Back Terrace Steel Posts
  for (const r of GLASS_RAILS) {
    for (const s of [-1.14, 1.14]) {
      M4.identity(modelMat);
      M4.translate(modelMat, r.pos[0] + Math.cos(r.yaw)*s, r.pos[1], r.pos[2] - Math.sin(r.yaw)*s);
      M4.rotateY(modelMat, r.yaw);
      drawPBRMesh(MESH.steelPost, modelMat, 0, [0.85, 0.88, 0.90], 0.22, 0.88);
    }
  }

  // Fish Bucket & Visible Fish inside
  drawBucketAndFish(false);

  // 3 Expressive Cape Penguins!
  for (const p of penguins) drawPenguin(p, false);

  // Active World Fish (held, flying, swimming, or on rocks)
  for (const f of activeFish) drawWorldFish(f, false);

  // Sunny Pastel Beach Ball
  M4.identity(modelMat);
  M4.translate(modelMat, beachBall.x, beachBall.y, beachBall.z);
  M4.rotateX(modelMat, beachBall.rotX);
  M4.rotateZ(modelMat, beachBall.rotZ);
  drawPBRMesh(MESH.ball, modelMat, 8, [1,1,1], 0.14, 0.02);

  // Pearlescent Gifted Seashells & Sea-Glass on right sunny rock shelf!
  for (const g of placedGifts) {
    const sc = (0.9 + g.shimmer * 0.25) * smoothstep(0, 1, g.pop);
    M4.identity(modelMat);
    M4.translate(modelMat, g.x, g.y + g.shimmer * 0.05, g.z);
    M4.rotateY(modelMat, g.yaw + g.shimmer * 0.4);
    M4.scale(modelMat, sc, sc, sc);
    drawPBRMesh(g.kind === 'shell' ? MESH.shell : MESH.pebble, modelMat, 9, g.col, 0.14, 0.20, 0, g.slotIdx);
  }

  // === PASS 4: Crystal-Clear Interactive Turquoise Water Surface ===
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(waterProg);
  gl.uniformMatrix4fv(waterU.uViewProj, false, viewProjMat);
  gl.uniform3f(waterU.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(waterU.uSunDir, SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]);
  gl.uniform1f(waterU.uTime, simTime);
  gl.uniform4fv(waterU.uRipples, rippleData);
  gl.bindVertexArray(MESH.water.vao);
  gl.drawElements(gl.TRIANGLES, MESH.water.count, MESH.water.indexType, 0);

  // === PASS 5: Translucent FX (Waterfall, Rainbow, Ice Cubes, Glass Rails, Droplets, Bubbles, Motes) ===
  gl.useProgram(fxProg);
  gl.uniformMatrix4fv(fxU.uViewProj, false, viewProjMat);
  gl.uniform3f(fxU.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(fxU.uSunDir, SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]);
  gl.uniform1f(fxU.uTime, simTime);

  // Tempered Aquarium Glass Railing Panels
  for (const r of GLASS_RAILS) {
    M4.identity(modelMat);
    M4.translate(modelMat, r.pos[0], r.pos[1], r.pos[2]);
    M4.rotateY(modelMat, r.yaw);
    drawFXMesh(MESH.glassPanel, modelMat, 4, [0.85, 0.96, 1.0, 0.42]);
  }

  // Cascading Sunlit Waterfall Ribbon
  M4.identity(modelMat);
  drawFXMesh(MESH.waterfall, modelMat, 2, [0.9, 0.98, 1.0, 0.82 + clamp(rainbowTimer * 0.05, 0, 0.18)]);

  // Optical Sunlit Rainbow Arc in the Waterfall Mist!
  const rbAlpha = clamp(rainbowTimer * 0.25, 0, 1) * smoothstep(0, 1.2, rainbowTimer);
  if (rbAlpha > 0.01) {
    M4.identity(modelMat);
    M4.translate(modelMat, -0.95, 0.15, -2.05);
    M4.rotateY(modelMat, 0.32);
    M4.scale(modelMat, 1.15, 1.05, 1.0);
    drawFXMesh(MESH.rainbow, modelMat, 3, [1, 1, 1, rbAlpha]);
  }

  // Translucent Ice Cubes inside the Fish Bucket
  const jiggleZ = Math.sin(bucketJiggleTime * 34) * 0.075 * bucketShake;
  const jiggleX = Math.cos(bucketJiggleTime * 29) * 0.055 * bucketShake;
  for (const o of bucketIceOffsets) {
    M4.identity(modelMat);
    M4.translate(modelMat, BUCKET_POS[0], BUCKET_POS[1], BUCKET_POS[2]);
    M4.rotateY(modelMat, 0.42);
    M4.rotateX(modelMat, 0.06 + jiggleX);
    M4.rotateZ(modelMat, jiggleZ);
    M4.translate(modelMat, o[0], o[1], o[2]);
    M4.rotateY(modelMat, o[3]);
    M4.rotateX(modelMat, 0.25);
    drawFXMesh(MESH.ice, modelMat, 0, [0.72, 0.92, 1.0, 0.72]);
  }

  // Interactive Sliding Ice Cubes on Rock / Pool
  for (const ic of slidingIces) {
    const melt = clamp(ic.life / 3.0, 0, 1);
    M4.identity(modelMat);
    M4.translate(modelMat, ic.x, ic.y, ic.z);
    M4.rotateY(modelMat, ic.yaw);
    M4.scale(modelMat, melt, melt, melt);
    drawFXMesh(MESH.ice, modelMat, 0, [0.74, 0.94, 1.0, 0.76 * melt]);
  }

  // 3D Droplets, Iridescent Bubbles & Warm Golden Sun-Motes
  for (const pt of particles) {
    const fade = clamp(pt.life / pt.maxLife, 0, 1);
    const sc = pt.size * (pt.type === 'bubble' ? (0.65 + (1 - fade) * 0.45) : (0.4 + fade * 0.65));
    M4.identity(modelMat);
    M4.translate(modelMat, pt.x, pt.y, pt.z);
    M4.scale(modelMat, sc, sc, sc);
    if (pt.type === 'drop') {
      drawFXMesh(MESH.droplet, modelMat, 0, [pt.col[0], pt.col[1], pt.col[2], 0.85 * fade]);
    } else if (pt.type === 'bubble') {
      drawFXMesh(MESH.bubble, modelMat, 1, [pt.col[0], pt.col[1], pt.col[2], 0.88 * Math.min(1, fade * 2.2)]);
    } else {
      drawFXMesh(MESH.droplet, modelMat, 5, [pt.col[0], pt.col[1], pt.col[2], 0.85 * Math.sin(fade * Math.PI)]);
    }
  }

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

// ============================================================================
// 13. MAIN LOOP
// ============================================================================
let simTime = 0;
let lastTS = performance.now();

// Seed a gentle opening water ripple so the pool shimmers immediately
addRipple(0.72, -0.25, 0.55);
addRipple(-1.35, -2.35, 0.45);

function frame(ts) {
  const dt = clamp((ts - lastTS) * 0.001, 0.001, 0.05);
  lastTS = ts;
  simTime += dt;

  updateCamera(dt);
  updateWorld(dt);
  updatePenguins(dt);
  renderScene();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
