<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {
  antialias: true,
  alpha: false,
  depth: true,
  powerPreference: 'high-performance'
});
if (!gl) return;

// ============================================================================
// 1. MATH & NOISE UTILITIES
// ============================================================================
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const angleDiff = (a, b) => {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
};
const dampAngle = (a, b, lambda, dt) => a + angleDiff(a, b) * (1 - Math.exp(-lambda * dt));

const V3 = {
  add: (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]],
  sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  scale: (a, s) => [a[0]*s, a[1]*s, a[2]*s],
  dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  cross: (a, b) => [
    a[1]*b[2] - a[2]*b[1],
    a[2]*b[0] - a[0]*b[2],
    a[0]*b[1] - a[1]*b[0]
  ],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  dist: (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]),
  norm: (a) => {
    const l = Math.hypot(a[0], a[1], a[2]);
    return l > 1e-6 ? [a[0]/l, a[1]/l, a[2]/l] : [0, 1, 0];
  }
};

const M4 = {
  create: () => {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  identity: (m) => {
    m.fill(0);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  copy: (out, a) => { out.set(a); return out; },
  multiply: (out, a, b) => {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],
          a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11],
          a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0=b[0],b1=b[1],b2=b[2],b3=b[3];
    out[0]=b0*a00+b1*a10+b2*a20+b3*a30;
    out[1]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[2]=b0*a02+b1*a12+b2*a22+b3*a32;
    out[3]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[4];b1=b[5];b2=b[6];b3=b[7];
    out[4]=b0*a00+b1*a10+b2*a20+b3*a30;
    out[5]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[6]=b0*a02+b1*a12+b2*a22+b3*a32;
    out[7]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[8];b1=b[9];b2=b[10];b3=b[11];
    out[8]=b0*a00+b1*a10+b2*a20+b3*a30;
    out[9]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[10]=b0*a02+b1*a12+b2*a22+b3*a32;
    out[11]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[12];b1=b[13];b2=b[14];b3=b[15];
    out[12]=b0*a00+b1*a10+b2*a20+b3*a30;
    out[13]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[14]=b0*a02+b1*a12+b2*a22+b3*a32;
    out[15]=b0*a03+b1*a13+b2*a23+b3*a33;
    return out;
  },
  translate: (m, x, y, z) => {
    m[12] = m[0]*x + m[4]*y + m[8]*z + m[12];
    m[13] = m[1]*x + m[5]*y + m[9]*z + m[13];
    m[14] = m[2]*x + m[6]*y + m[10]*z + m[14];
    m[15] = m[3]*x + m[7]*y + m[11]*z + m[15];
    return m;
  },
  scale: (m, x, y, z) => {
    m[0]*=x; m[1]*=x; m[2]*=x; m[3]*=x;
    m[4]*=y; m[5]*=y; m[6]*=y; m[7]*=y;
    m[8]*=z; m[9]*=z; m[10]*=z; m[11]*=z;
    return m;
  },
  rotateX: (m, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a10=m[4],a11=m[5],a12=m[6],a13=m[7],
          a20=m[8],a21=m[9],a22=m[10],a23=m[11];
    m[4]=a10*c+a20*s; m[5]=a11*c+a21*s; m[6]=a12*c+a22*s; m[7]=a13*c+a23*s;
    m[8]=a20*c-a10*s; m[9]=a21*c-a11*s; m[10]=a22*c-a12*s; m[11]=a23*c-a13*s;
    return m;
  },
  rotateY: (m, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],
          a20=m[8],a21=m[9],a22=m[10],a23=m[11];
    m[0]=a00*c-a20*s; m[1]=a01*c-a21*s; m[2]=a02*c-a22*s; m[3]=a03*c-a23*s;
    m[8]=a00*s+a20*c; m[9]=a01*s+a21*c; m[10]=a02*s+a22*c; m[11]=a03*s+a23*c;
    return m;
  },
  rotateZ: (m, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],
          a10=m[4],a11=m[5],a12=m[6],a13=m[7];
    m[0]=a00*c+a10*s; m[1]=a01*c+a11*s; m[2]=a02*c+a12*s; m[3]=a03*c+a13*s;
    m[4]=a10*c-a00*s; m[5]=a11*c-a01*s; m[6]=a12*c-a02*s; m[7]=a13*c-a03*s;
    return m;
  },
  perspective: (out, fovy, aspect, near, far) => {
    const f = 1.0 / Math.tan(fovy * 0.5);
    const nf = 1 / (near - far);
    out.fill(0);
    out[0] = f / aspect;
    out[5] = f;
    out[10] = (far + near) * nf;
    out[11] = -1;
    out[14] = (2 * far * near) * nf;
    return out;
  },
  ortho: (out, l, r, b, t, n, f) => {
    const lr = 1 / (l - r), bt = 1 / (b - t), nf = 1 / (n - f);
    out.fill(0);
    out[0] = -2 * lr;
    out[5] = -2 * bt;
    out[10] = 2 * nf;
    out[12] = (l + r) * lr;
    out[13] = (t + b) * bt;
    out[14] = (f + n) * nf;
    out[15] = 1;
    return out;
  },
  lookAt: (out, eye, center, up) => {
    const zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
    let len = Math.hypot(zx, zy, zz) || 1;
    const z0 = zx/len, z1 = zy/len, z2 = zz/len;
    let xx = up[1]*z2 - up[2]*z1, xy = up[2]*z0 - up[0]*z2, xz = up[0]*z1 - up[1]*z0;
    len = Math.hypot(xx, xy, xz) || 1;
    const x0 = xx/len, x1 = xy/len, x2 = xz/len;
    const y0 = z1*x2 - z2*x1, y1 = z2*x0 - z0*x2, y2 = z0*x1 - z1*x0;
    out[0]=x0; out[1]=y0; out[2]=z0; out[3]=0;
    out[4]=x1; out[5]=y1; out[6]=z1; out[7]=0;
    out[8]=x2; out[9]=y2; out[10]=z2; out[11]=0;
    out[12]=-(x0*eye[0]+x1*eye[1]+x2*eye[2]);
    out[13]=-(y0*eye[0]+y1*eye[1]+y2*eye[2]);
    out[14]=-(z0*eye[0]+z1*eye[1]+z2*eye[2]);
    out[15]=1;
    return out;
  },
  invert: (out, a) => {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],
          a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11],
          a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
          b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
          b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if (!det) return null;
    det = 1.0 / det;
    out[0]=(a11*b11-a12*b10+a13*b09)*det;
    out[1]=(a02*b10-a01*b11-a03*b09)*det;
    out[2]=(a31*b05-a32*b04+a33*b03)*det;
    out[3]=(a22*b04-a21*b05-a23*b03)*det;
    out[4]=(a12*b08-a10*b11-a13*b07)*det;
    out[5]=(a00*b11-a02*b08+a03*b07)*det;
    out[6]=(a32*b02-a30*b05-a33*b01)*det;
    out[7]=(a20*b05-a22*b02+a23*b01)*det;
    out[8]=(a10*b10-a11*b08+a13*b06)*det;
    out[9]=(a01*b08-a00*b10-a03*b06)*det;
    out[10]=(a30*b04-a31*b02+a33*b00)*det;
    out[11]=(a21*b02-a20*b04-a23*b00)*det;
    out[12]=(a11*b07-a10*b09-a12*b06)*det;
    out[13]=(a00*b09-a01*b07+a02*b06)*det;
    out[14]=(a31*b01-a30*b03-a32*b00)*det;
    out[15]=(a20*b03-a21*b01+a22*b00)*det;
    return out;
  },
  normalMat3: (out, m) => {
    const a00=m[0],a01=m[1],a02=m[2],
          a10=m[4],a11=m[5],a12=m[6],
          a20=m[8],a21=m[9],a22=m[10];
    const b01 = a22*a11 - a12*a21;
    const b11 = -a22*a10 + a12*a20;
    const b21 = a21*a10 - a11*a20;
    let det = a00*b01 + a01*b11 + a02*b21;
    if (Math.abs(det) < 1e-8) {
      out[0]=1;out[1]=0;out[2]=0;out[3]=0;out[4]=1;out[5]=0;out[6]=0;out[7]=0;out[8]=1;
      return out;
    }
    det = 1.0 / det;
    out[0] = b01 * det;
    out[1] = b11 * det;
    out[2] = b21 * det;
    out[3] = (-a22*a01 + a02*a21) * det;
    out[4] = (a22*a00 - a02*a20) * det;
    out[5] = (-a21*a00 + a01*a20) * det;
    out[6] = (a12*a01 - a02*a11) * det;
    out[7] = (-a12*a00 + a02*a10) * det;
    out[8] = (a11*a00 - a01*a10) * det;
    return out;
  },
  transformPoint: (m, p) => {
    const x=p[0], y=p[1], z=p[2];
    const w = m[3]*x + m[7]*y + m[11]*z + m[15] || 1;
    return [
      (m[0]*x + m[4]*y + m[8]*z + m[12]) / w,
      (m[1]*x + m[5]*y + m[9]*z + m[13]) / w,
      (m[2]*x + m[6]*y + m[10]*z + m[14]) / w
    ];
  }
};

function hash2(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function noise2(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix+1, iz);
  const c = hash2(ix, iz+1), d = hash2(ix+1, iz+1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uz);
}
function fbm2(x, z) {
  return noise2(x, z) * 0.55 + noise2(x*2.03 + 17.1, z*2.07 + 9.2) * 0.30 + noise2(x*4.11 - 5.3, z*4.05 + 31.4) * 0.15;
}

// ============================================================================
// 2. SHARED AQUARIUM TERRAIN HEIGHTFIELD
// ============================================================================
const WATER_Y = 0.0;
const BUCKET_POS = [-1.85, 0.45, 2.45];
const WATERFALL_POS = [-1.35, 1.55, -2.95];

function getTerrainHeight(x, z) {
  // Base organic pool basin centered around (0.05, -0.55)
  const px = (x - 0.05) / 2.65;
  const pz = (z + 0.52) / 1.92;
  const warp = (fbm2(x * 0.42 + 2.1, z * 0.42 - 1.3) - 0.5) * 0.32;
  const poolDist = Math.hypot(px, pz) + warp;

  // Deep turquoise pool inside, coastal terrace outside
  let h = lerp(-1.48, 0.42, smoothstep(0.55, 1.18, poolDist));

  // Smooth front sunny ledge plateau (wide & walkable for penguins & bucket)
  const frontFlat = smoothstep(1.25, 2.05, z) * (1 - smoothstep(2.9, 4.4, Math.abs(x)));
  h = lerp(h, 0.44, frontFlat * 0.88);

  // Gentle front entry cove so penguins can waddle straight into & out of water
  const cove = Math.exp(-((x - 0.05)*(x - 0.05) / 0.85 + (z - 1.38)*(z - 1.38) / 0.36));
  h -= cove * 0.34;

  // Left smooth toboggan slide rock (rises on left, slopes cleanly into water)
  const leftHill = smoothstep(-1.45, -3.25, x) * Math.exp(-((z - 0.18)*(z - 0.18)) / 2.8);
  h += leftHill * 0.68;

  // Right diving rock terrace (flat-topped elevated boulder ledge)
  const rightRock = smoothstep(1.65, 2.55, x) * Math.exp(-((z + 0.25)*(z + 0.25)) / 2.6);
  const rightTop = smoothstep(1.85, 2.6, x) * (1 - smoothstep(1.0, 2.1, Math.abs(z + 0.25)));
  h += rightRock * 0.38;
  h = lerp(h, 0.76, rightTop * 0.65);

  // Back scenic cliff amphitheater behind the pool
  const backCliff = smoothstep(-2.15, -3.95, z);
  const cliffNoise = (fbm2(x * 0.55 + 5.0, z * 0.55) - 0.35) * 0.9;
  h += backCliff * (1.85 + cliffNoise);

  // Sculpted waterfall notch on the back-left cliff
  const wfNotch = Math.exp(-((x + 1.35)*(x + 1.35) / 0.42 + (z + 3.05)*(z + 3.05) / 0.85));
  h -= wfNotch * 0.65;

  // Outer perimeter rock rim
  const sideRim = smoothstep(3.6, 6.2, Math.abs(x));
  h += sideRim * 0.85;

  // Natural limestone micro-relief (smoother on the front shelf & pool floor)
  const microAmp = lerp(0.03, 0.11, smoothstep(0.1, 1.2, h)) * (1 - frontFlat * 0.65);
  h += (fbm2(x * 1.65, z * 1.65) - 0.5) * microAmp;

  // Keep bucket pad super flat
  const bDist = Math.hypot(x - BUCKET_POS[0], z - BUCKET_POS[2]);
  h = lerp(h, 0.45, 1 - smoothstep(0.35, 0.82, bDist));

  // Keep right shell gift shelf gently flat
  const gDist = Math.hypot((x - 1.95)/0.95, (z - 2.35)/0.55);
  h = lerp(h, 0.44, (1 - smoothstep(0.6, 1.2, gDist)) * 0.7);

  return h;
}

function getTerrainNormal(x, z) {
  const e = 0.08;
  const hL = getTerrainHeight(x - e, z);
  const hR = getTerrainHeight(x + e, z);
  const hD = getTerrainHeight(x, z - e);
  const hU = getTerrainHeight(x, z + e);
  return V3.norm([hL - hR, 2 * e, hD - hU]);
}

function isPointInWater(x, z) {
  return getTerrainHeight(x, z) < WATER_Y - 0.06;
}

// ============================================================================
// 3. PROCEDURAL WEB AUDIO ENGINE (SUNNY AQUARIUM + CUTE PENGUIN VOICES)
// ============================================================================
const Sound = (() => {
  let ctx = null;
  let master = null;
  let noiseBuf = null;
  let unlocked = false;
  let waterfallGain = null;

  function unlock() {
    if (unlocked) {
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.42;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    master.connect(comp);
    comp.connect(ctx.destination);

    // Pre-generate soft pink-ish noise buffer (2 seconds)
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    let b0=0, b1=0, b2=0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.997*b0 + w*0.029;
      b1 = 0.985*b1 + w*0.032;
      b2 = 0.950*b2 + w*0.048;
      d[i] = (b0 + b1 + b2 + w * 0.18) * 0.4;
    }

    // Gentle sunny aquarium waterfall & water murmur bed
    const amb = ctx.createBufferSource();
    amb.buffer = noiseBuf;
    amb.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'bandpass';
    lp.frequency.value = 680;
    lp.Q.value = 0.7;
    waterfallGain = ctx.createGain();
    waterfallGain.gain.value = 0.055;
    amb.connect(lp);
    lp.connect(waterfallGain);
    waterfallGain.connect(master);
    amb.start();

    unlocked = true;
  }

  function setWaterfallBoost(boost) {
    if (!ctx || !waterfallGain) return;
    waterfallGain.gain.setTargetAtTime(0.055 + boost * 0.14, ctx.currentTime, 0.18);
  }

  function chirp(pitchMult = 1.0, mood = 'curious') {
    if (!ctx) return;
    const now = ctx.currentTime;
    const playNote = (delay, f0, f1, dur, vol, wave = 'triangle') => {
      const osc = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const filt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      osc.type = wave;
      osc2.type = 'sine';
      osc.frequency.setValueAtTime(f0 * pitchMult, now + delay);
      osc.frequency.exponentialRampToValueAtTime(f1 * pitchMult, now + delay + dur);
      osc2.frequency.setValueAtTime(f0 * pitchMult * 2.01, now + delay);
      osc2.frequency.exponentialRampToValueAtTime(f1 * pitchMult * 2.01, now + delay + dur);
      filt.type = 'bandpass';
      filt.frequency.value = 1450 * pitchMult;
      filt.Q.value = 1.8;
      g.gain.setValueAtTime(0.0001, now + delay);
      g.gain.linearRampToValueAtTime(vol, now + delay + dur * 0.18);
      g.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
      const g2 = ctx.createGain();
      g2.gain.value = 0.25;
      osc.connect(filt);
      osc2.connect(g2);
      g2.connect(filt);
      filt.connect(g);
      g.connect(master);
      osc.start(now + delay);
      osc2.start(now + delay);
      osc.stop(now + delay + dur + 0.02);
      osc2.stop(now + delay + dur + 0.02);
    };

    if (mood === 'curious') {
      playNote(0, 560, 840, 0.13, 0.22);
    } else if (mood === 'eager') {
      playNote(0, 660, 960, 0.09, 0.20);
      playNote(0.10, 740, 1080, 0.10, 0.22);
    } else if (mood === 'happy') {
      playNote(0, 620, 940, 0.10, 0.22);
      playNote(0.09, 780, 1180, 0.11, 0.24);
      playNote(0.19, 920, 1340, 0.15, 0.20);
    } else if (mood === 'coo') {
      playNote(0, 480, 590, 0.18, 0.18, 'sine');
      playNote(0.14, 590, 510, 0.16, 0.14, 'sine');

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
function createProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
  }
  return p;
}
function getUniforms(prog, names) {
  const out = {};
  for (const n of names) out[n] = gl.getUniformLocation(prog, n);
  return out;
}

  p += dot(p, p + 45.32);

}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);

    mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),

    // arcs over the pink brow patch, behind the black cheek, and wraps forward into the white throat!
    vec2 cheekC = vec2(0.065, 0.008); // (z, y) center of black cheek patch
    vec2 dzy = vec2(lp.z - cheekC.x, lp.y - cheekC.y);
    float rad = length(dzy);
    float ring = 1.0 - smoothstep(0.020, 0.036, abs(rad - 0.088));
    // Cut open the front of the C-ring around eye/beak so the face mask stays crisp black
    float openFront = 1.0 - smoothstep(0.095, 0.125, lp.z) * (1.0 - smoothstep(0.055, 0.085, lp.y));
    float sideMask = smoothstep(0.052, 0.095, ax);
    // Keep very top crown crisp black
    float crownKeep = 1.0 - smoothstep(0.105, 0.128, lp.y);
    // Extend white band smoothly down the lower throat & neck sides
    float throatWhite = smoothstep(-0.045, -0.095, lp.y) * smoothstep(-0.03, 0.06, lp.z) * (1.0 - smoothstep(0.04, 0.08, -lp.z));
    float whiteAmt = clamp(max(ring * openFront * sideMask * crownKeep, throatWhite * 0.96), 0.0, 1.0);
    // Keep chin directly beneath beak crisp black
    float chinMask = smoothstep(0.075, 0.125, lp.z) * smoothstep(0.02, -0.055, lp.y) * (1.0 - smoothstep(0.055, 0.088, ax));
    whiteAmt *= (1.0 - chinMask);

    // Authentic rosy-pink supraorbital gland patch nestled right above each eye!
    float pinkDist = length(vec3((ax - 0.108) * 1.15, (lp.y - 0.054) * 1.9, (lp.z - 0.094) * 1.3));
    float pinkAmt = 1.0 - smoothstep(0.026, 0.043, pinkDist);

    albedo = mix(darkHead, whiteBand, whiteAmt);
    albedo = mix(albedo, pinkPatch, pinkAmt);
    rough = mix(0.66, 0.24, uWetness);
    rough = mix(rough, 0.48, pinkAmt);
    velvet = mix(0.42, 0.10, uWetness) * (1.0 - pinkAmt);
  }

  // --- Material 4: Cape Penguin Beak (Slate + Pale Silver Tip Band) ---
  else if (uMatType == 4) {
    float band = 1.0 - smoothstep(0.014, 0.028, abs(vLocalPos.z - 0.085));
    vec3 darkBeak = vec3(0.055, 0.060, 0.072);
    vec3 paleBand = vec3(0.48, 0.49, 0.51);
    albedo = mix(darkBeak, paleBand, band * 0.85);
    // Rosy inside of mouth when open
    if (vColor.r > 0.85 && vColor.g < 0.6) {
      albedo = vec3(0.82, 0.38, 0.44);
      rough = 0.35;
    } else {
      rough = 0.28;
    }
  }

  // --- Material 5: Glossy Sparkle Eye ---
  else if (uMatType == 5) {
    albedo = vec3(0.015, 0.012, 0.018);
    rough = 0.04;
    metal = 0.05;
    // Crisp sky/sun catchlight dot so penguins always have sparkling soulful eyes
    vec3 H = normalize(L + V);
    float catchlight = pow(max(dot(N, H), 0.0), 180.0);
    vec3 H2 = normalize(normalize(vec3(-0.4, 0.8, 0.6)) + V);
    float catchlight2 = pow(max(dot(N, H2), 0.0), 90.0);
    emissiveBoost = catchlight * 1.6 + catchlight2 * 0.55;
  }

  // --- Material 6: Shimmering Iridescent Fish Scales ---
  else if (uMatType == 6) {
    float scalePat = sin(vLocalPos.z * 210.0) * sin(vLocalPos.y * 230.0 + vLocalPos.z * 105.0);
    float scaleSparkle = smoothstep(0.15, 0.95, scalePat);
    float dorsal = smoothstep(-0.01, 0.048, vLocalPos.y);
    float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);

    vec3 bellyCol, backCol, iridCol;
    if (uVariant < 0.5) {
      // Classic silver-blue sardine
      bellyCol = vec3(0.84, 0.89, 0.93);
      backCol  = vec3(0.10, 0.25, 0.44);
      iridCol  = vec3(0.45, 0.88, 1.0);
    } else if (uVariant < 1.5) {
      // Sakura rose-gold baby sea bream
      bellyCol = vec3(0.98, 0.86, 0.88);
      backCol  = vec3(0.92, 0.42, 0.56);
      iridCol  = vec3(1.0, 0.82, 0.55);
    } else if (uVariant < 2.5) {
      // Plump emerald-silver mackerel with wavy back stripes
      float stripe = smoothstep(0.2, 0.8, sin(vLocalPos.z * 115.0 + sin(vLocalPos.y * 80.0) * 1.4));
      bellyCol = vec3(0.86, 0.92, 0.90);
      backCol  = mix(vec3(0.07, 0.30, 0.34), vec3(0.16, 0.46, 0.44), stripe);
      iridCol  = vec3(0.55, 0.98, 0.82);
    } else {
      // Rainbow mother-of-pearl smelt!
      float ph = vLocalPos.z * 20.0 + uTime * 2.5 + fres * 4.5;
      bellyCol = vec3(0.95, 0.94, 0.98);
      backCol  = 0.55 + 0.42 * cos(ph + vec3(0.0, 2.1, 4.2));
      iridCol  = 0.65 + 0.35 * cos(ph * 1.3 + vec3(1.0, 3.1, 5.2));
    }
    albedo = mix(bellyCol, backCol, dorsal);
    albedo = mix(albedo, iridCol, fres * 0.55 + scaleSparkle * 0.16);
    // Tiny dark shiny eye on fish head (+z)
    float eyeD = length(vec2((vLocalPos.z - 0.115), (vLocalPos.y - 0.012)));
    float eyeM = 1.0 - smoothstep(0.011, 0.017, eyeD);
    albedo = mix(albedo, vec3(0.02, 0.02, 0.03), eyeM);
    rough = mix(0.16, 0.07, scaleSparkle);
    metal = 0.72 * (1.0 - eyeM);
  }

  // --- Material 7: Galvanized Metal Fish Bucket ---
  else if (uMatType == 7) {
    float grain = noise3(vec3(vLocalPos.x * 16.0, vLocalPos.y * 42.0, vLocalPos.z * 16.0));
    float spangle = noise3(floor(vLocalPos * 18.0));
    albedo = mix(vec3(0.58, 0.63, 0.68), vec3(0.76, 0.80, 0.84), grain * 0.5 + spangle * 0.5);
    // Soft blue-white enamel stripe near top
    float rimStripe = 1.0 - smoothstep(0.01, 0.02, abs(vLocalPos.y - 0.40));
    albedo = mix(albedo, vec3(0.18, 0.48, 0.76), rimStripe * 0.85);
    rough = mix(0.28, 0.38, spangle);
    metal = mix(0.78, 0.25, rimStripe);
  }

  // --- Material 8: Sunny Pastel Beach Ball ---
  else if (uMatType == 8) {
    float a = atan(vLocalPos.z, vLocalPos.x) + PI;
    int seg = int(floor(a / (PI / 3.0))) % 6;
    vec3 c = vec3(0.96, 0.96, 0.95);
    if (seg == 0) c = vec3(0.97, 0.46, 0.56);      // coral-pink
    else if (seg == 2) c = vec3(0.32, 0.78, 0.94); // sky-aqua
    else if (seg == 4) c = vec3(0.99, 0.82, 0.34); // sunny buttercup
    // Polar caps
    if (abs(vLocalPos.y) > 0.225) c = vec3(0.98, 0.97, 0.95);
    albedo = c;
    rough = 0.14;
    metal = 0.02;
  }

  // --- Material 9: Pearlescent Seashell / Coral / Sea-glass Gifts ---
  else if (uMatType == 9) {
    float fres = pow(1.0 - max(dot(N, V), 0.0), 2.4);
    vec3 pearl = 0.65 + 0.35 * cos(fres * 5.0 + uTime * 1.4 + uVariant * 2.1 + vec3(0.0, 2.0, 4.0));
    albedo = mix(albedo, pearl, fres * 0.55);
    rough = 0.16;
    metal = 0.18;
  }

  // --- Material 10: Sunlit Coastal Grass ---
  else if (uMatType == 10) {
    albedo = mix(vec3(0.14, 0.34, 0.15), vec3(0.34, 0.56, 0.20), clamp(vLocalPos.y * 1.7, 0.0, 1.0));
    rough = 0.55;
  }

  // --- Cook-Torrance GGX PBR Lighting ---
  vec3 F0 = mix(vec3(0.04), albedo, metal);
  vec3 H = normalize(L + V);
  float NdotL = max(dot(N, L), 0.0);
  float NdotV = max(dot(N, V), 0.001);
  float NdotH = max(dot(N, H), 0.0);
  float HdotV = max(dot(H, V), 0.0);

  float alpha = max(rough * rough, 0.002);
  float a2 = alpha * alpha;
  float denom = NdotH * NdotH * (a2 - 1.0) + 1.0;
  float D = a2 / (PI * denom * denom);
  float k = (rough + 1.0);
  k = (k * k) / 8.0;
  float G = (NdotV / (NdotV * (1.0 - k) + k)) * (NdotL / (NdotL * (1.0 - k) + k));
  vec3 F = F0 + (1.0 - F0) * pow(1.0 - HdotV, 5.0);
  vec3 spec = (D * G * F) / max(4.0 * NdotV * NdotL, 0.001);
  vec3 kD = (1.0 - F) * (1.0 - metal);

  float shadow = calcShadow(vLightPos);
  vec3 sunColor = vec3(2.85, 2.72, 2.46);
  vec3 direct = (kD * albedo / PI + spec) * sunColor * NdotL * shadow;

  // Hemisphere sky / aqua-bounce ambient + soft rim
  float skyFactor = N.y * 0.5 + 0.5;
  vec3 skyAmb = vec3(0.54, 0.78, 1.05);
  vec3 bounceAmb = vec3(0.34, 0.52, 0.56); // turquoise water + warm limestone bounce
  vec3 ambient = albedo * mix(bounceAmb, skyAmb, skyFactor) * 0.52;

  // Specular sky reflection for glossy/metallic/wet materials
  vec3 R = reflect(-V, N);
  vec3 envSky = mix(vec3(0.45, 0.74, 0.88), vec3(0.28, 0.60, 0.96), clamp(R.y * 0.8 + 0.2, 0.0, 1.0));
  vec3 envF = F0 + (max(vec3(1.0 - rough), F0) - F0) * pow(1.0 - NdotV, 5.0);
  ambient += envSky * envF * (1.0 - rough * 0.72) * 0.52;

  // Soft sunlit velvet rim on penguin feathers
  if (velvet > 0.01) {
    float rim = pow(1.0 - NdotV, 3.2) * (0.45 + 0.55 * max(dot(N, L), 0.0));
    ambient += vec3(0.72, 0.86, 1.0) * rim * velvet * 0.26;
  }

  vec3 color = direct + ambient + vec3(emissiveBoost);

  // --- Underwater Caustics & Turquoise Water Absorption ---
  if (vWorldPos.y < 0.02) {
    float depth = max(0.0, -vWorldPos.y);
    float c1 = causticPattern(vWorldPos.xz + vWorldPos.y * L.xz * 0.35, uTime);
    float causticFade = exp(-depth * 0.45) * smoothstep(0.02, -0.08, vWorldPos.y);
    color += vec3(0.55, 0.96, 1.0) * c1 * causticFade * (0.35 + 0.65 * shadow) * 0.85;
    // Beer-Lambert clear turquoise aquarium water absorption
    vec3 absorb = exp(-depth * vec3(0.42, 0.14, 0.08));
    vec3 waterScatter = vec3(0.08, 0.48, 0.60);
    color = color * absorb + waterScatter * (1.0 - absorb) * 0.62;
  }

  // Gentle sunny atmospheric depth haze for distant back rocks
  float camDist = length(uCamPos - vWorldPos);
  float haze = smoothstep(10.0, 26.0, camDist) * 0.35;
  color = mix(color, vec3(0.72, 0.88, 0.98), haze);

  color = pow(aces(color), vec3(1.0 / 2.2));
  fragColor = vec4(color, 1.0);
}`
);

// --- 4D. Crystal-Clear Interactive Turquoise Water Shader ---
const waterProg = createProgram(
`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec2 aUV;
layout(location=3) in vec3 aColor; // aColor.r stores terrain depth below water

uniform mat4 uViewProj;
uniform float uTime;
uniform vec4 uRipples[16];

out vec3 vWorldPos;
out float vDepth;
out float vRippleSum;

void main() {
  vec3 pos = aPos;
  float depth = aColor.r;
  float edgeDamp = smoothstep(-0.08, 0.35, depth);

  // Gentle sunlit pool swells
  float w = sin(pos.x * 1.9 + uTime * 1.9) * 0.011
          + cos(pos.z * 2.3 - uTime * 1.65) * 0.009
          + sin((pos.x + pos.z) * 3.2 + uTime * 2.6) * 0.006;

  // Interactive expanding circular ripples
  float rSum = 0.0;
  for (int i = 0; i < 16; i++) {
    vec4 r = uRipples[i];
    float age = uTime - r.z;
    if (r.w > 0.001 && age >= 0.0 && age < 2.6) {
      float d = length(pos.xz - r.xy);
      float radius = age * 2.15;
      float ring = exp(-pow((d - radius) * 2.8, 2.0));
      float fade = exp(-age * 1.15) * r.w;
      float wave = sin((d - radius) * 14.0) * ring * fade;
      w += wave * 0.045;
      rSum += abs(wave) * 1.8;
    }
  }

  pos.y += w * edgeDamp;
  vWorldPos = pos;
  vDepth = depth;
  vRippleSum = rSum;
  gl_Position = uViewProj * vec4(pos, 1.0);
}`,
`#version 300 es
precision highp float;
in vec3 vWorldPos;
in float vDepth;
in float vRippleSum;

uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform float uTime;
uniform vec4 uRipples[16];

out vec4 fragColor;

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

float waveHeight(vec2 p, float t) {
  float h = 0.0;
  h += sin(p.x * 2.6 + p.y * 1.2 + t * 2.2) * 0.014;
  h += cos(p.x * 1.8 - p.y * 3.1 + t * 1.9) * 0.012;
  h += sin(p.x * 5.2 + p.y * 4.4 - t * 3.4) * 0.0055;
  h += cos(p.x * 7.8 - p.y * 6.3 + t * 4.2) * 0.0032;
  for (int i = 0; i < 16; i++) {
    vec4 r = uRipples[i];
    float age = t - r.z;
    if (r.w > 0.001 && age >= 0.0 && age < 2.6) {
      float d = length(p - r.xy);
      float rad = age * 2.15;
      float ring = exp(-pow((d - rad) * 2.8, 2.0));
      float fade = exp(-age * 1.15) * r.w;
      h += sin((d - rad) * 14.0) * ring * fade * 0.042;
    }
  }
  return h;
}

void main() {
  if (vDepth < -0.05) discard;
  vec2 p = vWorldPos.xz;
  float e = 0.035;
  float hC = waveHeight(p, uTime);
  float hX = waveHeight(p + vec2(e, 0.0), uTime);
  float hZ = waveHeight(p + vec2(0.0, e), uTime);
  vec3 N = normalize(vec3(hC - hX, e, hC - hZ));

  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 L = normalize(uSunDir);
  vec3 H = normalize(L + V);

  float NdotV = max(dot(N, V), 0.001);
  float fresnel = 0.03 + 0.97 * pow(1.0 - NdotV, 4.2);

  // Sky reflection
  vec3 R = reflect(-V, N);
  vec3 skyRefl = mix(vec3(0.68, 0.89, 0.99), vec3(0.18, 0.56, 0.92), clamp(R.y * 1.1, 0.0, 1.0));
  // Sparkling sun glints on water wavelets
  float sunGlint = pow(max(dot(N, H), 0.0), 260.0) * 4.2 + pow(max(dot(N, H), 0.0), 36.0) * 0.42;

  // Crystal turquoise tint
  vec3 shallowCol = vec3(0.24, 0.84, 0.88);
  vec3 deepCol    = vec3(0.04, 0.42, 0.62);
  vec3 waterTint  = mix(shallowCol, deepCol, smoothstep(0.05, 1.25, vDepth));

  // Delicate white foam hugging rock shoreline & lively ripples
  float shoreFoam = smoothstep(0.16, 0.0, vDepth + sin(p.x * 5.0 + uTime * 2.5) * 0.025);
  float rippleFoam = smoothstep(0.32, 0.95, vRippleSum) * 0.45;
  float foam = clamp(shoreFoam * 0.68 + rippleFoam, 0.0, 0.85);

  vec3 col = mix(waterTint, skyRefl, fresnel * 0.82);
  col += vec3(1.0, 0.96, 0.86) * sunGlint;
  col = mix(col, vec3(0.95, 0.98, 1.0), foam);

  float alpha = mix(0.24, 0.66, smoothstep(0.0, 1.0, vDepth)) + fresnel * 0.28 + foam * 0.35 + min(sunGlint * 0.25, 0.3);
  alpha *= smoothstep(-0.04, 0.04, vDepth);
  alpha = clamp(alpha, 0.0, 0.92);

  col = pow(aces(col), vec3(1.0 / 2.2));
  fragColor = vec4(col, alpha);
}`

const fxProg = createProgram(
`#version 300 es
precision highp float;

uniform mat4 uModel;

`#version 300 es
precision highp float;
in vec3 vWorldPos;
in vec3 vNormal;
in vec2 vUV;

uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform float uTime;
uniform int uFxMode;
uniform vec4 uColor; // rgb + opacity

out vec4 fragColor;

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 L = normalize(uSunDir);
  vec3 H = normalize(L + V);
  float NdotV = abs(dot(N, V));
  float fres = pow(1.0 - clamp(NdotV, 0.0, 1.0), 3.0);
  float spec = pow(max(dot(N, H), 0.0), 96.0);

  vec3 col = uColor.rgb;
  float alpha = uColor.a;

  if (uFxMode == 0) {
    // Water droplet or glossy ice cube
    col = mix(uColor.rgb, vec3(0.95, 0.99, 1.0), fres * 0.72) + vec3(1.5, 1.48, 1.42) * spec;
    alpha = clamp(uColor.a * (0.45 + fres * 0.55 + spec * 0.4), 0.0, 0.96);
  } else if (uFxMode == 1) {
    // Iridescent soap / air bubble!
    vec3 irid = 0.62 + 0.38 * cos(fres * 6.5 + uTime * 2.2 + vWorldPos.y * 2.0 + vec3(0.0, 2.1, 4.2));
    col = mix(vec3(0.75, 0.95, 1.0), irid, 0.75) + vec3(1.8) * pow(max(dot(N, H), 0.0), 140.0);
    alpha = clamp(uColor.a * (0.14 + fres * 0.82 + spec * 0.8), 0.0, 0.92);
  } else if (uFxMode == 2) {
    // Cascading sunlit waterfall ribbon
    float flow1 = sin(vUV.y * 24.0 - uTime * 11.0 + sin(vUV.x * 9.0) * 1.2) * 0.5 + 0.5;
    float flow2 = sin(vUV.y * 42.0 - uTime * 16.5 - vUV.x * 14.0) * 0.5 + 0.5;
    float edge = smoothstep(0.0, 0.22, vUV.x) * smoothstep(1.0, 0.78, vUV.x);
    float foam = smoothstep(0.35, 0.88, flow1 * 0.6 + flow2 * 0.4) + smoothstep(0.72, 1.0, vUV.y) * 0.5;
    col = mix(vec3(0.42, 0.86, 0.96), vec3(0.98, 0.99, 1.0), clamp(foam, 0.0, 1.0));
    col += vec3(0.9, 0.95, 1.0) * spec * 0.5;
    alpha = edge * (0.42 + foam * 0.48) * uColor.a;
  } else if (uFxMode == 3) {
    // Soft optical sunlit rainbow arc in waterfall mist!
    float t = vUV.y; // radial across rainbow band (0..1)
    float along = smoothstep(0.0, 0.22, vUV.x) * smoothstep(1.0, 0.78, vUV.x);
    float bandFade = smoothstep(0.0, 0.2, t) * smoothstep(1.0, 0.8, t);
    // Spectral palette (violet -> blue -> cyan -> green -> yellow -> orange -> rose)
    vec3 rCol = 0.55 + 0.45 * cos(6.28318 * (vec3(0.78, 0.50, 0.24) - t * 0.82));
    col = rCol * 1.15;
    alpha = along * bandFade * uColor.a * 0.58;
  } else if (uFxMode == 4) {
    // Aquarium tempered glass railing
    col = mix(vec3(0.66, 0.88, 0.96), vec3(0.96, 0.99, 1.0), fres * 0.85) + vec3(1.2) * spec * 0.6;
    float border = smoothstep(0.03, 0.0, vUV.y) + smoothstep(0.97, 1.0, vUV.y);
    alpha = clamp(0.14 + fres * 0.38 + border * 0.32, 0.0, 0.65);
  } else {
    // Warm sunlit sparkle mote
    col = uColor.rgb * 1.45;
    alpha = uColor.a;
  }

  col = pow(aces(col), vec3(1.0 / 2.2));
  fragColor = vec4(col, alpha);
}`

function createMesh(positions, normals, uvs, colors, indices) {

    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  };
  bindBuf(0, positions, 3);
  bindBuf(1, normals, 3);
  bindBuf(2, uvs, 2);
  bindBuf(3, colors, 3);

  const ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  const use32 = positions.length / 3 > 65530;
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, use32 ? new Uint32Array(indices) : new Uint16Array(indices), gl.STATIC_DRAW);
  gl.bindVertexArray(null);

  return { vao, count: indices.length, indexType: use32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
}

function computeSmoothNormals(pos, idx) {
  const nrm = new Float32Array(pos.length);
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i]*3, b = idx[i+1]*3, c = idx[i+2]*3;
    const ux = pos[b]-pos[a], uy = pos[b+1]-pos[a+1], uz = pos[b+2]-pos[a+2];
    const vx = pos[c]-pos[a], vy = pos[c+1]-pos[a+1], vz = pos[c+2]-pos[a+2];
    const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    nrm[a]+=nx; nrm[a+1]+=ny; nrm[a+2]+=nz;
    nrm[b]+=nx; nrm[b+1]+=ny; nrm[b+2]+=nz;
    nrm[c]+=nx; nrm[c+1]+=ny; nrm[c+2]+=nz;
  }
  for (let i = 0; i < nrm.length; i += 3) {
    const l = Math.hypot(nrm[i], nrm[i+1], nrm[i+2]) || 1;
    nrm[i]/=l; nrm[i+1]/=l; nrm[i+2]/=l;
  }
  return nrm;
}

function buildSphere(rad = 1, rings = 16, segs = 24, sx = 1, sy = 1, sz = 1, col = [1,1,1]) {
  const pos = [], nrm = [], uv = [], color = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const v = r / rings;
    const phi = v * Math.PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const th = u * Math.PI * 2;
      const x = Math.cos(th) * sp, y = cp, z = Math.sin(th) * sp;
      pos.push(x * rad * sx, y * rad * sy, z * rad * sz);
      const nn = V3.norm([x / sx, y / sy, z / sz]);
      nrm.push(nn[0], nn[1], nn[2]);
      uv.push(u, v);
      color.push(col[0], col[1], col[2]);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s;
      const i1 = i0 + segs + 1;
      idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
    }
  }
  return createMesh(pos, nrm, uv, color, idx);
}

// Sculpted Cape Penguin Body (plump adorable teardrop with smooth organic posture)
function buildPenguinBody() {
  const rings = 26, segs = 32;
  const pos = [], uv = [], col = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const t = r / rings; // 0 = bottom, 1 = neck top
    const y = t * 0.72;
    // Plump penguin silhouette profile
    let rx, rz, zOff;
    if (t < 0.05) {
      const k = Math.sin((t / 0.05) * Math.PI * 0.5);
      rx = 0.14 * k; rz = 0.14 * k; zOff = 0.0;
    } else if (t < 0.95) {
      const s = (t - 0.05) / 0.90;
      const belly = Math.sin(Math.pow(s, 0.72) * Math.PI);
      rx = 0.095 + belly * 0.155;
      rz = 0.095 + belly * 0.172;
      zOff = Math.sin(s * Math.PI) * 0.028 - s * 0.015;
    } else {
      const k = Math.cos(((t - 0.95) / 0.05) * Math.PI * 0.5);
      rx = 0.115 * k; rz = 0.115 * k; zOff = -0.01;
    }
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const a = u * Math.PI * 2;
      const x = Math.sin(a) * rx;
      const z = Math.cos(a) * rz + zOff;
      pos.push(x, y, z);
      uv.push(u, t);
      col.push(1, 1, 1);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Articulated Upper / Lower Beak Mandible
function buildBeakHalf(isUpper) {
  const segs = 14, rings = 8;
  const pos = [], uv = [], col = [], idx = [];
  const sign = isUpper ? 1 : -1;
  const len = isUpper ? 0.155 : 0.138;
  for (let r = 0; r <= rings; r++) {
    const t = r / rings; // 0 = base, 1 = tip
    const z = t * len;
    const w = (1 - Math.pow(t, 1.35)) * (isUpper ? 0.044 : 0.037);
    const h = (1 - Math.pow(t, 1.25)) * (isUpper ? 0.036 : 0.025);
    // Gentle downward curve on upper beak tip
    const yCurve = isUpper ? -Math.pow(t, 2.4) * 0.022 : -Math.pow(t, 2.0) * 0.008;
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      let x, y, inner = false;
      if (s <= segs * 0.65) {
        const k = s / (segs * 0.65);
        const ang = k * Math.PI;
        x = Math.cos(ang) * w;
        y = Math.sin(ang) * h * sign + yCurve;
      } else {
        const k = (s - segs * 0.65) / (segs * 0.35);
        x = lerp(-w, w, k);
        y = yCurve;
        inner = true;
      }
      pos.push(x, y, z);
      uv.push(u, t);
      if (inner && t < 0.82) col.push(0.95, 0.45, 0.50);
      else col.push(1, 1, 1);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      if (isUpper) idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
      else idx.push(i0, i1, i0 + 1, i0 + 1, i1, i1 + 1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Sculpted Hydrodynamic Penguin Flipper (black outside, crisp white inner edge!)
function buildPenguinFlipper(side) {
  const rings = 12, segs = 14;
  const pos = [], uv = [], col = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const t = r / rings; // 0 = shoulder, 1 = flipper tip
    const y = -t * 0.34;
    const chord = (0.042 + Math.sin(Math.pow(t, 0.72) * Math.PI) * 0.056) * (1 - t * 0.25);
    const thick = (0.019 * (1 - t * 0.65)) + 0.004;
    const zCurve = -Math.sin(t * Math.PI) * 0.038 - t * 0.025;
    const xCurve = side * (0.012 + Math.sin(t * Math.PI * 0.85) * 0.028);
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const a = u * Math.PI * 2;
      const lx = Math.cos(a) * thick;
      const lz = Math.sin(a) * chord;
      pos.push(lx + xCurve, y, lz + zCurve);
      uv.push(u, t);
      // Inner side and trailing edge are crisp white-cream!
      const isInner = (lx * side < -0.002) || (lz < -chord * 0.62);
      if (isInner) col.push(0.90, 0.90, 0.88);
      else col.push(0.045, 0.05, 0.065);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Sculpted 3-Toed Webbed Penguin Foot
function buildPenguinFoot() {
  const pos = [], uv = [], col = [], idx = [];
  const segs = 16;
  // Flat webbed fan with subtle toe ridges
  const topY = 0.024, botY = 0.0;
  // Center ankle top & bottom
  pos.push(0, topY + 0.012, -0.02); uv.push(0.5, 0); col.push(0.11, 0.11, 0.13);
  pos.push(0, botY, -0.02);         uv.push(0.5, 0); col.push(0.08, 0.08, 0.10);
  for (let s = 0; s <= segs; s++) {
    const u = s / segs;
    const ang = lerp(-0.68, 0.68, u);
    const toeWave = Math.pow(Math.abs(Math.cos(u * Math.PI * 2.0)), 0.7) * 0.022;
    const len = 0.135 + toeWave;
    const x = Math.sin(ang) * len;
    const z = Math.cos(ang) * len;
    const ridge = Math.pow(Math.abs(Math.cos(u * Math.PI * 2.0)), 1.5) * 0.009;
    pos.push(x, topY * 0.55 + ridge, z); uv.push(u, 1); col.push(0.13, 0.12, 0.14);
    pos.push(x, botY, z);                uv.push(u, 1); col.push(0.08, 0.08, 0.10);
  }
  for (let s = 0; s < segs; s++) {
    const t0 = 2 + s * 2, b0 = t0 + 1, t1 = t0 + 2, b1 = t0 + 3;
    idx.push(0, t0, t1);
    idx.push(1, b1, b0);
    idx.push(t0, b0, t1, t1, b0, b1);
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Realistic 3D Fish Mesh (streamlined body + forked tail + dorsal & side fins!)
function buildFishMesh() {
  const pos = [], uv = [], col = [], idx = [];
  const rings = 16, segs = 14;
  // Fusiform body from nose (+0.16) to tail base (-0.12)
  for (let r = 0; r <= rings; r++) {
    const t = r / rings; // 0 = nose, 1 = tail base
    const z = lerp(0.165, -0.125, t);
    const prof = Math.sin(Math.pow(t, 0.65) * Math.PI);
    const rx = 0.004 + prof * 0.031;
    const ry = 0.005 + prof * 0.052;
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const a = u * Math.PI * 2;
      pos.push(Math.cos(a) * rx, Math.sin(a) * ry, z);
      uv.push(u, t);
      col.push(1, 1, 1);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      idx.push(i0, i1, i0 + 1, i0 + 1, i1, i1 + 1);
    }
  }
  // Helper to add thin 2-sided fin triangles
  const addFin = (pts, c = [0.85, 0.92, 0.98]) => {
    const base = pos.length / 3;
    for (const p of pts) {
      pos.push(p[0], p[1], p[2]);
      uv.push(0.5, 0.5);
      col.push(c[0], c[1], c[2]);
    }
    for (let i = 1; i < pts.length - 1; i++) {
      idx.push(base, base + i, base + i + 1);
      idx.push(base, base + i + 1, base + i);
    }
  };
  // Forked Caudal Tail Fin (upper & lower lobes)
  addFin([[0, 0.008, -0.11], [0, 0.068, -0.215], [0, 0.002, -0.165]]);
  addFin([[0, -0.008, -0.11], [0, 0.002, -0.165], [0, -0.064, -0.21]]);
  // Dorsal fin
  addFin([[0, 0.044, 0.04], [0, 0.088, -0.02], [0, 0.036, -0.065]]);
  // Pectoral side fins
  addFin([[0.025, -0.012, 0.06], [0.065, -0.028, 0.005], [0.022, -0.024, 0.005]]);
  addFin([[-0.025, -0.012, 0.06], [-0.022, -0.024, 0.005], [-0.065, -0.028, 0.005]]);

  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Galvanized Metal Fish Bucket (hollow interior + rolled lip + handle)
function buildBucketMesh() {
  const pos = [], uv = [], col = [], idx = [];
  const segs = 32;
  // Profile points [radius, y, brightness]
  const prof = [
    [0.0,   0.00, 0.7],
    [0.24,  0.00, 0.8],
    [0.25,  0.02, 0.9],
    [0.32,  0.46, 1.0],
    [0.342, 0.48, 1.05],
    [0.338, 0.495, 1.0],
    [0.315, 0.485, 0.85],
    [0.295, 0.34, 0.55],
    [0.245, 0.32, 0.78], // ice bed shelf inside
    [0.0,   0.33, 0.88]
  ];
  for (let r = 0; r < prof.length; r++) {
    const [rad, y, br] = prof[r];
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const a = u * Math.PI * 2;
      // Add subtle embossed ring ribs on outer wall
      const rib = (r === 2 || r === 3) ? 0 : 0;
      pos.push(Math.cos(a) * (rad + rib), y, Math.sin(a) * (rad + rib));
      uv.push(u, r / (prof.length - 1));
      const isIceBed = r >= 8;
      if (isIceBed) col.push(0.76, 0.91, 0.98);
      else col.push(br, br, br);
    }
  }
  for (let r = 0; r < prof.length - 1; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      idx.push(i0, i1, i0 + 1, i0 + 1, i1, i1 + 1);
    }
  }
  // Curved wire handle resting playfully over the front-left rim
  const hSegs = 20, tubeSegs = 8;
  const hBase = pos.length / 3;
  for (let i = 0; i <= hSegs; i++) {
    const t = i / hSegs;
    const ang = lerp(-Math.PI * 0.5, Math.PI * 0.5, t);
    const cx = Math.sin(ang) * 0.34;
    const cz = Math.cos(ang) * 0.25;
    const cy = 0.43 - Math.cos(ang) * 0.16;
    const tx = Math.cos(ang) * 0.34, tz = -Math.sin(ang) * 0.25, ty = Math.sin(ang) * 0.16;
    const tang = V3.norm([tx, ty, tz]);
    const up = V3.norm(V3.cross(tang, [0, 1, 0]));
    const bin = V3.cross(tang, up);
    for (let j = 0; j <= tubeSegs; j++) {
      const b = (j / tubeSegs) * Math.PI * 2;
      const rr = 0.0085;
      pos.push(
        cx + (up[0]*Math.cos(b) + bin[0]*Math.sin(b)) * rr,
        cy + (up[1]*Math.cos(b) + bin[1]*Math.sin(b)) * rr,
        cz + (up[2]*Math.cos(b) + bin[2]*Math.sin(b)) * rr
      );
      uv.push(t, j / tubeSegs);
      col.push(0.85, 0.88, 0.92);
    }
  }
  for (let i = 0; i < hSegs; i++) {
    for (let j = 0; j < tubeSegs; j++) {
      const i0 = hBase + i * (tubeSegs + 1) + j, i1 = i0 + tubeSegs + 1;
      idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Rounded Ice Cube
function buildIceCube() {
  const rings = 8, segs = 12;
  const pos = [], uv = [], col = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const phi = (r / rings) * Math.PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * Math.PI * 2;
      const dx = Math.cos(a) * sp, dy = cp, dz = Math.sin(a) * sp;
      // Superellipsoid (rounded cube!)
      const sx = Math.sign(dx) * Math.pow(Math.abs(dx), 0.45);
      const sy = Math.sign(dy) * Math.pow(Math.abs(dy), 0.45);
      const sz = Math.sign(dz) * Math.pow(Math.abs(dz), 0.45);
      pos.push(sx * 0.068, sy * 0.056, sz * 0.068);
      uv.push(s / segs, r / rings);
      col.push(0.84, 0.96, 1.0);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Coastal Aquarium Terrain Mesh

  return createMesh(pos, nrm, uv, col, idx);
}

// Crystal Water Surface Mesh
function buildWaterMesh() {
  const nx = 96, nz = 76;
  const minX = -4.8, maxX = 4.8, minZ = -3.6, maxZ = 2.6;
  const pos = [], nrm = [], uv = [], col = [], idx = [];
  for (let j = 0; j <= nz; j++) {
    const vz = j / nz;
    const z = lerp(minZ, maxZ, vz);
    for (let i = 0; i <= nx; i++) {
      const vx = i / nx;
      const x = lerp(minX, maxX, vx);
      const depth = WATER_Y - getTerrainHeight(x, z);
      pos.push(x, WATER_Y, z);
      nrm.push(0, 1, 0);
      uv.push(vx, vz);
      col.push(depth, 0, 0);
    }
  }
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      const i0 = j * (nx + 1) + i, i1 = i0 + nx + 1;
      idx.push(i0, i1, i0 + 1, i0 + 1, i1, i1 + 1);
    }
  }
  return createMesh(pos, nrm, uv, col, idx);
}

// Sculpted Organic Accent Boulder
function buildBoulder(seed = 1) {
  const rings = 12, segs = 16;
  const pos = [], uv = [], col = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const phi = (r / rings) * Math.PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * Math.PI * 2;
      let dx = Math.cos(a) * sp, dy = cp * 0.72, dz = Math.sin(a) * sp;
      const n = fbm2(dx * 2.1 + seed * 7.3, dz * 2.1 + dy * 1.9 + seed * 3.1);
      const rad = 0.78 + n * 0.36;
      // Flatten top slightly like natural coastal limestone slabs
      if (dy > 0.35) dy = 0.35 + (dy - 0.35) * 0.45;
      pos.push(dx * rad, dy * rad, dz * rad);
      uv.push(s / segs, r / rings);
      col.push(1, 1, 1);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segs; s++) {
      const i0 = r * (segs + 1) + s, i1 = i0 + segs + 1;
      idx.push(i0, i0 + 1, i1, i0 + 1, i1 + 1, i1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Cascading Waterfall Ribbon Mesh
function buildWaterfallMesh() {
  const nx = 14, ny = 22;
  const pos = [], uv = [], col = [], idx = [];
  for (let j = 0; j <= ny; j++) {
    const v = j / ny; // 0 = top lip, 1 = pool splash
    const y = lerp(1.62, -0.05, v * v * 0.75 + v * 0.25);
    const z = lerp(-3.18, -2.42, Math.pow(v, 0.75));
    const halfW = lerp(0.28, 0.44, v);
    for (let i = 0; i <= nx; i++) {
      const u = i / nx;
      const x = -1.35 + lerp(-halfW, halfW, u);
      const curveZ = Math.sin(u * Math.PI) * 0.08;
      pos.push(x, y, z + curveZ);
      uv.push(u, v);
      col.push(1, 1, 1);
    }
  }
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const i0 = j * (nx + 1) + i, i1 = i0 + nx + 1;
      idx.push(i0, i1, i0 + 1, i0 + 1, i1, i1 + 1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Optical Sunlit Rainbow Arc Mesh (hovers gently in waterfall mist)
function buildRainbowArcMesh() {
  const segs = 28;
  const pos = [], nrm = [], uv = [], col = [], idx = [];
  const rInner = 0.78, rOuter = 1.24;
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const ang = lerp(Math.PI * 0.12, Math.PI * 0.88, u);
    const c = Math.cos(ang), s = Math.sin(ang);
    pos.push(c * rInner, s * rInner, 0); nrm.push(0, 0, 1); uv.push(u, 0); col.push(1,1,1);
    pos.push(c * rOuter, s * rOuter, 0); nrm.push(0, 0, 1); uv.push(u, 1); col.push(1,1,1);
  }
  for (let i = 0; i < segs; i++) {
    const k = i * 2;
    idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
  }
  return createMesh(pos, nrm, uv, col, idx);
}

// Coastal Grass Clump
function buildGrassClump() {
  const pos = [], uv = [], col = [], idx = [];
  const blades = 9;
  for (let b = 0; b < blades; b++) {
    const base = pos.length / 3;
    const ang = (b / blades) * Math.PI * 2 + hash2(b, 3.1) * 0.6;
    const h = 0.34 + hash2(b, 7.2) * 0.28;
    const lean = 0.12 + hash2(b, 9.4) * 0.18;
    const dx = Math.cos(ang), dz = Math.sin(ang);
    const px = -dz, pz = dx;
    const segs = 4;
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      const w = (1 - t * 0.85) * 0.036;
      const cx = dx * lean * t * t;
      const cz = dz * lean * t * t;
      const cy = h * t;
      pos.push(cx - px * w, cy, cz - pz * w); uv.push(0, t); col.push(1,1,1);
      pos.push(cx + px * w, cy, cz + pz * w); uv.push(1, t); col.push(1,1,1);
    }
    for (let s = 0; s < segs; s++) {
      const k = base + s * 2;
      idx.push(k, k+1, k+2, k+1, k+3, k+2);
      idx.push(k, k+2, k+1, k+1, k+2, k+3);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, col, idx);
}

// Box / Glass Panel Helper
function buildBox(w, h, d, col = [1, 1, 1]) {
  const hw = w/2, hh = h/2, hd = d/2;
  const faces = [
    [[ -hw,-hh, hd],[ hw,-hh, hd],[ hw, hh, hd],[-hw, hh, hd],[0,0,1]],
    [[  hw,-hh,-hd],[-hw,-hh,-hd],[-hw, hh,-hd],[ hw, hh,-hd],[0,0,-1]],
    [[ -hw, hh, hd],[ hw, hh, hd],[ hw, hh,-hd],[-hw, hh,-hd],[0,1,0]],
    [[ -hw,-hh,-hd],[ hw,-hh,-hd],[ hw,-hh, hd],[-hw,-hh, hd],[0,-1,0]],
    [[  hw,-hh, hd],[ hw,-hh,-hd],[ hw, hh,-hd],[ hw, hh, hd],[1,0,0]],
    [[ -hw,-hh,-hd],[-hw,-hh, hd],[-hw, hh, hd],[-hw, hh,-hd],[-1,0,0]],
  ];
  const pos=[], nrm=[], uv=[], color=[], idx=[];
  let v = 0;
  for (const f of faces) {
    for (let i = 0; i < 4; i++) {
      pos.push(f[i][0], f[i][1], f[i][2]);
      nrm.push(f[4][0], f[4][1], f[4][2]);
      uv.push(i === 1 || i === 2 ? 1 : 0, i >= 2 ? 1 : 0);
      color.push(col[0], col[1], col[2]);
    }
    idx.push(v, v+1, v+2, v, v+2, v+3);
    v += 4;
  }
  return createMesh(pos, nrm, uv, color, idx);
}
