<script>
(() => {
'use strict';

// ============================================================================
// 1. MATH UTILITIES
// ============================================================================
const V3 = {
  create: (x = 0, y = 0, z = 0) => new Float32Array([x, y, z]),
  set: (o, x, y, z) => { o[0] = x; o[1] = y; o[2] = z; return o; },
  copy: (o, a) => { o[0] = a[0]; o[1] = a[1]; o[2] = a[2]; return o; },
  add: (o, a, b) => { o[0] = a[0] + b[0]; o[1] = a[1] + b[1]; o[2] = a[2] + b[2]; return o; },
  sub: (o, a, b) => { o[0] = a[0] - b[0]; o[1] = a[1] - b[1]; o[2] = a[2] - b[2]; return o; },
  scale: (o, a, s) => { o[0] = a[0] * s; o[1] = a[1] * s; o[2] = a[2] * s; return o; },
  lerp: (o, a, b, t) => {
    o[0] = a[0] + (b[0] - a[0]) * t;
    o[1] = a[1] + (b[1] - a[1]) * t;
    o[2] = a[2] + (b[2] - a[2]) * t;
    return o;
  },
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (o, a, b) => {
    const ax = a[0], ay = a[1], az = a[2], bx = b[0], by = b[1], bz = b[2];
    o[0] = ay * bz - az * by;
    o[1] = az * bx - ax * bz;
    o[2] = ax * by - ay * bx;
    return o;
  },
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  norm: (o, a) => {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    o[0] = a[0] / l; o[1] = a[1] / l; o[2] = a[2] / l;
    return o;
  },
  transformMat4: (o, a, m) => {
    const x = a[0], y = a[1], z = a[2];
    const w = m[3] * x + m[7] * y + m[11] * z + m[15] || 1;
    o[0] = (m[0] * x + m[4] * y + m[8] * z + m[12]) / w;
    o[1] = (m[1] * x + m[5] * y + m[9] * z + m[13]) / w;
    o[2] = (m[2] * x + m[6] * y + m[10] * z + m[14]) / w;
    return o;
  }
};

const M4 = {
  create: () => {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  ident: (m) => {
    m.fill(0);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  copy: (o, a) => { o.set(a); return o; },
  mul: (o, a, b) => {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3],
          a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
          a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11],
          a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    let b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
    o[0] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
    o[1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
    o[2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
    o[3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
    o[4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
    o[5] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
    o[6] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
    o[7] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
    o[8] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
    o[9] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
    o[10] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
    o[11] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
    o[12] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
    o[13] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
    o[14] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
    o[15] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    return o;
  },
  translate: (o, a, x, y, z) => {
    if (o !== a) o.set(a);
    o[12] = a[0] * x + a[4] * y + a[8] * z + a[12];
    o[13] = a[1] * x + a[5] * y + a[9] * z + a[13];
    o[14] = a[2] * x + a[6] * y + a[10] * z + a[14];
    o[15] = a[3] * x + a[7] * y + a[11] * z + a[15];
    return o;
  },
  scale: (o, a, x, y, z) => {
    o[0] = a[0] * x; o[1] = a[1] * x; o[2] = a[2] * x; o[3] = a[3] * x;
    o[4] = a[4] * y; o[5] = a[5] * y; o[6] = a[6] * y; o[7] = a[7] * y;
    o[8] = a[8] * z; o[9] = a[9] * z; o[10] = a[10] * z; o[11] = a[11] * z;
    if (o !== a) { o[12] = a[12]; o[13] = a[13]; o[14] = a[14]; o[15] = a[15]; }
    return o;
  },
  rotateX: (o, a, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
          a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
    if (o !== a) {
      o[0] = a[0]; o[1] = a[1]; o[2] = a[2]; o[3] = a[3];
      o[12] = a[12]; o[13] = a[13]; o[14] = a[14]; o[15] = a[15];
    }
    o[4] = a10 * c + a20 * s; o[5] = a11 * c + a21 * s; o[6] = a12 * c + a22 * s; o[7] = a13 * c + a23 * s;
    o[8] = a20 * c - a10 * s; o[9] = a21 * c - a11 * s; o[10] = a22 * c - a12 * s; o[11] = a23 * c - a13 * s;
    return o;
  },
  rotateY: (o, a, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3],
          a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
    if (o !== a) {
      o[4] = a[4]; o[5] = a[5]; o[6] = a[6]; o[7] = a[7];
      o[12] = a[12]; o[13] = a[13]; o[14] = a[14]; o[15] = a[15];
    }
    o[0] = a00 * c - a20 * s; o[1] = a01 * c - a21 * s; o[2] = a02 * c - a22 * s; o[3] = a03 * c - a23 * s;
    o[8] = a00 * s + a20 * c; o[9] = a01 * s + a21 * c; o[10] = a02 * s + a22 * c; o[11] = a03 * s + a23 * c;
    return o;
  },
  rotateZ: (o, a, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3],
          a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
    if (o !== a) {
      o[8] = a[8]; o[9] = a[9]; o[10] = a[10]; o[11] = a[11];
      o[12] = a[12]; o[13] = a[13]; o[14] = a[14]; o[15] = a[15];
    }
    o[0] = a00 * c + a10 * s; o[1] = a01 * c + a11 * s; o[2] = a02 * c + a12 * s; o[3] = a03 * c + a13 * s;
    o[4] = a10 * c - a00 * s; o[5] = a11 * c - a01 * s; o[6] = a12 * c - a02 * s; o[7] = a13 * c - a03 * s;
    return o;
  },
  perspective: (o, fovy, aspect, near, far) => {
    const f = 1.0 / Math.tan(fovy * 0.5);
    const nf = 1 / (near - far);
    o.fill(0);
    o[0] = f / aspect;
    o[5] = f;
    o[10] = (far + near) * nf;
    o[11] = -1;
    o[14] = 2 * far * near * nf;
    return o;
  },
  ortho: (o, l, r, b, t, n, f) => {
    const lr = 1 / (l - r), bt = 1 / (b - t), nf = 1 / (n - f);
    o.fill(0);
    o[0] = -2 * lr; o[5] = -2 * bt; o[10] = 2 * nf;
    o[12] = (l + r) * lr; o[13] = (t + b) * bt; o[14] = (f + n) * nf;
    o[15] = 1;
    return o;
  },
  lookAt: (o, eye, center, up) => {
    let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    let zl = Math.hypot(zx, zy, zz) || 1;
    zx /= zl; zy /= zl; zz /= zl;
    let xx = up[1] * zz - up[2] * zy;
    let xy = up[2] * zx - up[0] * zz;
    let xz = up[0] * zy - up[1] * zx;
    let xl = Math.hypot(xx, xy, xz) || 1;
    xx /= xl; xy /= xl; xz /= xl;
    const yx = zy * xz - zz * xy;
    const yy = zz * xx - zx * xz;
    const yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
    o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
    o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    o[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    o[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    o[15] = 1;
    return o;
  },
  invert: (o, a) => {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3],
          a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
          a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11],
          a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10,
          b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11,
          b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12,
          b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30,
          b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31,
          b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
    if (!det) return null;
    det = 1.0 / det;
    o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
    o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
    o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
    o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
    o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
    o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
    o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
    o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
    o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
    o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return o;
  }
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const angleDiff = (a, b) => {
  let d = (b - a + Math.PI) % (Math.PI * 2) - Math.PI;
  return d < -Math.PI ? d + Math.PI * 2 : d;
};

// ============================================================================
// 2. PROCEDURAL WEB AUDIO ENGINE (Gentle, Warm, Lifelike)
// ============================================================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.noiseBuf = null;
    this.ready = false;
    this.ambientTimer = 0;
  }

  unlock() {
    if (this.ready) {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.65;
      this.master.connect(this.ctx.destination);

      // Create reusable soft pink-ish noise buffer
      const sr = this.ctx.sampleRate;
      const len = sr * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, sr);
      const data = this.noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.032;
        b2 = 0.950 * b2 + w * 0.048;
        data[i] = (b0 + b1 + b2 + w * 0.12) * 1.4;
      }
      this.ready = true;
    } catch (_) {}
  }

  now() { return this.ctx ? this.ctx.currentTime : 0; }

  // Soft wet puppy lick ("pero-pero")
  playLick(intensity = 1.0) {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;

    // Wet noise flick
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    const baseF = 1100 + Math.random() * 450;
    bp.frequency.setValueAtTime(baseF * 0.65, t);
    bp.frequency.exponentialRampToValueAtTime(baseF * 1.45, t + 0.055);
    bp.frequency.exponentialRampToValueAtTime(baseF * 0.8, t + 0.11);
    bp.Q.value = 3.2;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.16 * intensity, t + 0.022);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.115);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.2, 0.13);

    // Subtle liquid smack pop
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const f0 = 320 + Math.random() * 90;
    osc.frequency.setValueAtTime(f0, t + 0.015);
    osc.frequency.exponentialRampToValueAtTime(f0 * 2.1, t + 0.065);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.001, t + 0.015);
    og.gain.linearRampToValueAtTime(0.065 * intensity, t + 0.032);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.075);
    osc.connect(og); og.connect(this.master);
    osc.start(t + 0.015);
    osc.stop(t + 0.085);
  }

  // Water lapping with liquid droplets
  playWaterLap() {
    if (!this.ready) return;
    this.playLick(0.7);
    const t = this.now() + 0.03;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const f = 680 + Math.random() * 340;
    osc.frequency.setValueAtTime(f * 0.72, t);
    osc.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.065);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.08, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.085);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.09);
  }

  // Water dish tap ripple plink
  playWaterPlink() {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const f = 540 + Math.random() * 260;
    osc.frequency.setValueAtTime(f, t);
    osc.frequency.exponentialRampToValueAtTime(f * 1.75, t + 0.09);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.15);
  }

  // Cute puppy sniff-sniff
  playSniff() {
    if (!this.ready) return;
    const ctx = this.ctx;
    for (let i = 0; i < 2; i++) {
      const t = this.now() + i * 0.11;
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'bandpass';
      hp.frequency.value = 1750 + Math.random() * 300;
      hp.Q.value = 2.0;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.08, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      src.connect(hp); hp.connect(g); g.connect(this.master);
      src.start(t, Math.random(), 0.08);
    }
  }

  // Sweet tiny puppy happy yip ("wan!")
  playYip() {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    const base = 520 + Math.random() * 70;
    osc.frequency.setValueAtTime(base * 0.85, t);
    osc.frequency.exponentialRampToValueAtTime(base * 1.48, t + 0.045);
    osc.frequency.exponentialRampToValueAtTime(base * 0.72, t + 0.13);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1600, t);
    lp.frequency.exponentialRampToValueAtTime(750, t + 0.13);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.145);

    osc.connect(lp); lp.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.16);
  }

  // Blissful soft puppy sigh / warm hum
  playSigh() {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280 + Math.random() * 30, t);
    osc.frequency.exponentialRampToValueAtTime(185, t + 0.34);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.38);

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 1.5;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.001, t);
    ng.gain.linearRampToValueAtTime(0.035, t + 0.1);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    src.connect(bp); bp.connect(ng); ng.connect(this.master);
    src.start(t, Math.random(), 0.36);
  }

  // Pouch peel / pop open
  playPouchOpen() {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    // Soft crinkle
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'bandpass'; hp.frequency.value = 2800; hp.Q.value = 1.6;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.001, t);
    ng.gain.linearRampToValueAtTime(0.11, t + 0.03);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.connect(hp); hp.connect(ng); ng.connect(this.master);
    src.start(t, Math.random(), 0.16);

    // Friendly pop
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, t + 0.05);
    osc.frequency.exponentialRampToValueAtTime(620, t + 0.12);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.001, t + 0.05);
    og.gain.linearRampToValueAtTime(0.13, t + 0.068);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(og); og.connect(this.master);
    osc.start(t + 0.05); osc.stop(t + 0.16);
  }

  // Creamy paste squeeze
  playSqueeze() {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const f = 190 + Math.random() * 65;
    osc.frequency.setValueAtTime(f, t);
    osc.frequency.exponentialRampToValueAtTime(f * 1.45, t + 0.07);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.075, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.1);
  }

  // Ceramic spoon clink (gentle pentatonic)
  playCeramicClink() {
    if (!this.ready) return;
    const notes = [523.25, 587.33, 659.25, 783.99, 880.0];
    const f = notes[Math.floor(Math.random() * notes.length)] * 1.5;
    const t = this.now();
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.085, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.24);
  }

  // Soft cloth wipe swish
  playWipe() {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1050; bp.Q.value = 1.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.065, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random(), 0.18);
  }

  // Plush ball soft bounce / squeak
  playBallBounce(squeak = false) {
    if (!this.ready) return;
    const t = this.now();
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    if (squeak) {
      osc.frequency.setValueAtTime(840, t);
      osc.frequency.exponentialRampToValueAtTime(1260, t + 0.05);
      osc.frequency.exponentialRampToValueAtTime(760, t + 0.12);
    } else {
      osc.frequency.setValueAtTime(175, t);
      osc.frequency.exponentialRampToValueAtTime(85, t + 0.09);
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(squeak ? 0.08 : 0.11, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + (squeak ? 0.13 : 0.1));
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.15);
  }

  // Sunbeam / rainbow / celebration kalimba chime
  playChime(chordIndex = 0) {
    if (!this.ready) return;
    const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    const ctx = this.ctx;
    const count = chordIndex >= 0 ? 3 : 1;
    for (let i = 0; i < count; i++) {
      const idx = chordIndex >= 0 ? (chordIndex + i * 2) % scale.length : Math.floor(Math.random() * scale.length);
      const t = this.now() + i * 0.09;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(scale[idx], t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.065, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.72);
      osc.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + 0.75);
    }
  }

  // Distant gentle post-rain songbird or raindrop drip
  updateAmbient(dt) {
    if (!this.ready) return;
    this.ambientTimer -= dt;
    if (this.ambientTimer > 0) return;
    this.ambientTimer = 3.2 + Math.random() * 5.0;
    const ctx = this.ctx;
    const t = this.now();
    if (Math.random() < 0.45) {
      // Soft outdoor raindrop drip
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const f = 920 + Math.random() * 480;
      osc.frequency.setValueAtTime(f * 0.75, t);
      osc.frequency.exponentialRampToValueAtTime(f * 1.45, t + 0.055);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.028, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.075);
      osc.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + 0.08);
    } else {
      // Soft distant post-rain songbird double chirp
      for (let i = 0; i < 2; i++) {
        const st = t + i * 0.16;
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        const f = 2200 + Math.random() * 550;
        osc.frequency.setValueAtTime(f, st);
        osc.frequency.exponentialRampToValueAtTime(f * (i === 0 ? 1.24 : 0.88), st + 0.11);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.001, st);
        g.gain.linearRampToValueAtTime(0.022, st + 0.025);
        g.gain.exponentialRampToValueAtTime(0.001, st + 0.12);
        osc.connect(g); g.connect(this.master);
        osc.start(st); osc.stop(st + 0.13);
      }
    }
  }
}

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: false
});

if (!gl) {
  document.body.style.background = '#e8d9c5';
  throw new Error('WebGL2 not supported');
}

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src);
    throw new Error('Shader compile failed');
  }
  return s;
}

function createProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    throw new Error('Program link failed');
  }
  const u = {};
  const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u };
}

// --- Shadow Map Shader ---
const SHADOW_VS = `#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uLightVP;
uniform mat4 uModel;
void main() {
  gl_Position = uLightVP * uModel * vec4(aPos, 1.0);
}`;

const SHADOW_FS = `#version 300 es
precision highp float;

// --- Main Photorealistic PBR Shader ---
const MAIN_VS = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
layout(location=2) in vec2 aUV;
layout(location=3) in vec4 aColor;

uniform mat4 uVP;
uniform mat4 uModel;
uniform mat4 uLightVP;
uniform float uTime;
uniform float uWaveAmp;

out vec3 vWorldPos;
out vec3 vWorldNorm;
out vec3 vLocalPos;
out vec2 vUV;
out vec4 vColor;
out vec4 vLightSpacePos;

void main() {
  vec3 pos = aPos;
  if (uWaveAmp > 0.0001) {
    float sway = sin(uTime * 1.45 + pos.y * 2.6 + pos.x * 3.1) * uWaveAmp * smoothstep(0.95, -0.5, pos.y);
    pos.z += sway;
    pos.x += sway * 0.32;
  }
  vec4 wp = uModel * vec4(pos, 1.0);
  vWorldPos = wp.xyz;
  mat3 nMat = mat3(uModel);
  vWorldNorm = normalize(nMat * aNorm);
  vLocalPos = aPos;
  vUV = aUV;
  vColor = aColor;
  vLightSpacePos = uLightVP * wp;
  gl_Position = uVP * wp;
}`;

const MAIN_FS = `#version 300 es
precision highp float;
precision highp sampler2D;

in vec3 vWorldPos;
in vec3 vWorldNorm;
in vec3 vLocalPos;
in vec2 vUV;
in vec4 vColor;
in vec4 vLightSpacePos;

uniform sampler2D uTex;
uniform sampler2D uShadowMap;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uSkyColor;
uniform vec3 uBounceColor;
uniform vec4 uBaseColor;
uniform vec4 uPBR;       // x: roughness, y: metallic, z: sheen, w: uvScale
uniform int uMatMode;    // 0:std PBR, 1:dog fur, 2:dog eye, 3:wet gloss/paste, 4:water, 5:window glass, 6:floor w/ sunbeam+rainbow
uniform int uFurPart;    // 1:head, 2:torso, 3:ear, 4:tail, 5:leg/paw, 6:white fluff
uniform float uTime;
uniform float uRainbowStrength;
uniform float uRainSlide;
uniform vec4 uRipples[4]; // xyz: local x,z,startTime, w: strength
uniform vec4 uHighlight;  // xyz: glow tint, w: amount

out vec4 fragColor;

const float PI = 3.14159265;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise2(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) {
    v += a * noise2(p);
    p *= 2.07;
    a *= 0.5;
  }
  return v;
}

float calcShadow(vec4 lsPos, vec3 N, vec3 L) {
  vec3 proj = lsPos.xyz / lsPos.w;
  proj = proj * 0.5 + 0.5;
  if (proj.z > 0.999 || proj.x < 0.01 || proj.x > 0.99 || proj.y < 0.01 || proj.y > 0.99) return 1.0;
  float ndotl = max(dot(N, L), 0.0);
  float bias = max(0.0022 * (1.0 - ndotl), 0.0008);
  vec2 texel = vec2(1.0 / 2048.0);
  float sum = 0.0;
  const vec2 offs[9] = vec2[9](
    vec2(-1.0, -1.0), vec2(0.0, -1.0), vec2(1.0, -1.0),
    vec2(-1.0,  0.0), vec2(0.0,  0.0), vec2(1.0,  0.0),
    vec2(-1.0,  1.0), vec2(0.0,  1.0), vec2(1.0,  1.0)
  );
  for (int i = 0; i < 9; i++) {
    float d = texture(uShadowMap, proj.xy + offs[i] * texel * 1.65).r;
    sum += (proj.z - bias > d) ? 0.0 : 1.0;
  }
  return sum / 9.0;
}

// Blenheim Cavalier King Charles Spaniel procedural fur coloration
vec3 blenheimFurColor(vec3 lp, vec2 uv, int part, out float furRough) {
  vec3 pearlWhite = vec3(0.95, 0.92, 0.87);
  vec3 warmCream  = vec3(0.90, 0.84, 0.75);
  vec3 chestnut   = vec3(0.56, 0.24, 0.095);
  vec3 richAmber  = vec3(0.68, 0.33, 0.14);
  vec3 deepMahog  = vec3(0.38, 0.15, 0.06);

  float strands = fbm(uv * vec2(34.0, 14.0) + lp.xy * 12.0);
  float fineNoise = noise2(uv * 85.0 + lp.zx * 24.0);
  float edgeJitter = (strands - 0.5) * 0.032;
  furRough = mix(0.62, 0.80, strands);

  if (part == 1) {
    // Head: local space ~ radius 0.11, +Z is forward muzzle, +Y is crown
    float ax = abs(lp.x);
    // White central blaze between eyes & over muzzle
    float blazeWidth = mix(0.022, 0.056, smoothstep(0.035, 0.105, lp.z));
    blazeWidth = mix(blazeWidth, 0.044, smoothstep(0.03, 0.10, lp.y));
    float isPatch = smoothstep(blazeWidth - 0.008, blazeWidth + 0.014, ax + edgeJitter);
    // Keep lower muzzle & chin softly white
    float muzzleWhite = smoothstep(0.068, 0.112, lp.z) * smoothstep(0.03, -0.02, lp.y);
    isPatch *= (1.0 - muzzleWhite * 0.92);
    // Keep underside of jaw white
    isPatch *= smoothstep(-0.072, -0.025, lp.y + edgeJitter * 0.6);

    // Signature Blenheim lozenge ("kissing spot") on top of crown
    vec2 crownD = (lp.xz - vec2(0.0, -0.005)) / vec2(0.022, 0.028);
    float spot = 1.0 - smoothstep(0.72, 1.05, length(crownD) + (strands - 0.5) * 0.35);
    spot *= smoothstep(0.065, 0.095, lp.y);

    float cMix = clamp(max(isPatch, spot), 0.0, 1.0);
    vec3 brown = mix(deepMahog, richAmber, 0.45 + 0.45 * strands + 0.15 * smoothstep(-0.05, 0.09, lp.y));
    vec3 white = mix(warmCream, pearlWhite, 0.55 + 0.4 * fineNoise);
    vec3 col = mix(white, brown, cMix);

    // Soft rose-warm lip & cheek depth
    float mouthCrease = smoothstep(0.085, 0.125, lp.z) * smoothstep(0.01, -0.045, lp.y);
    col = mix(col, col * vec3(0.86, 0.78, 0.74), mouthCrease * 0.35);
    return col;
  } else if (part == 2) {
    // Torso: local +Z is chest/front, +Y is back
    float saddle = smoothstep(-0.02, 0.065, lp.y + edgeJitter * 1.4);
    float chestWhite = smoothstep(0.06, 0.16, lp.z + edgeJitter);
    float backPatch = saddle * (1.0 - chestWhite * 0.95);
    // Natural organic waist break
    float wave = sin(lp.z * 16.0) * 0.025 + (strands - 0.5) * 0.05;
    float sidePatch = smoothstep(0.01, 0.07, lp.y + wave) * smoothstep(-0.19, -0.05, lp.z);
    float cMix = clamp(max(backPatch * 0.95, sidePatch), 0.0, 1.0);
    vec3 brown = mix(chestnut, richAmber, 0.35 + 0.5 * strands);
    vec3 white = mix(warmCream, pearlWhite, 0.5 + 0.45 * fineNoise);
    return mix(white, brown, cMix);
  } else if (part == 3) {
    // Long silky wavy chestnut ears with subtle golden highlights & feathering
    float waveSheen = 0.5 + 0.5 * sin(uv.y * 22.0 + strands * 4.0);
    vec3 col = mix(deepMahog, richAmber, 0.35 + 0.45 * waveSheen + 0.2 * strands);
    float tipFeather = smoothstep(0.84, 1.0, uv.y) * smoothstep(0.35, 0.75, strands);
    col = mix(col, warmCream, tipFeather * 0.22);
    furRough = mix(0.46, 0.66, strands);
    return col;
  } else if (part == 4) {
    // Plumed tail: chestnut near root, snow-white fluffy plume along length
    float plume = smoothstep(0.18, 0.58, uv.y + (strands - 0.5) * 0.18);
    vec3 brown = mix(chestnut, richAmber, strands);
    vec3 white = mix(warmCream, pearlWhite, 0.6 + 0.4 * fineNoise);
    return mix(brown, white, plume);
  } else if (part == 5) {
    // Legs & paws: silky pearl-white with subtle warm freckle/spot on upper leg
    float freckle = smoothstep(0.68, 0.85, strands) * smoothstep(0.35, 0.75, uv.y) * 0.32;
    vec3 white = mix(warmCream, pearlWhite, 0.55 + 0.4 * fineNoise);
    return mix(white, richAmber, freckle);
  }
  // Pure fluffy cream-white (ruff, belly fluff)
  return mix(warmCream, pearlWhite, 0.6 + 0.4 * fineNoise);
}

// Procedural Rainy Post-Rain Window Glass + Outdoor Garden Bokeh + Rainbow
vec3 renderWindowGlass(vec2 uv, vec3 V) {
  // Outdoor sky gradient (fresh post-rain luminous blue-gold)
  vec3 skyTop = vec3(0.42, 0.68, 0.94);
  vec3 skyMid = vec3(0.78, 0.89, 0.97);
  vec3 skyHor = vec3(1.00, 0.93, 0.80);
  vec3 bg = mix(skyHor, skyMid, smoothstep(0.15, 0.55, uv.y));
  bg = mix(bg, skyTop, smoothstep(0.55, 1.0, uv.y));

  // Soft sunlit sun-glow in upper-left sky
  float sunD = length((uv - vec2(0.22, 0.82)) * vec2(1.2, 1.0));
  bg += vec3(1.0, 0.92, 0.72) * exp(-sunD * 3.2) * 0.85;

  // Faint post-rain rainbow arc in the sky (grows gently with happiness)
  vec2 rbC = vec2(0.72, 0.12);
  float rbR = length((uv - rbC) * vec2(1.0, 1.15));
  float rbBand = smoothstep(0.46, 0.52, rbR) * (1.0 - smoothstep(0.58, 0.64, rbR));
  float rbT = clamp((rbR - 0.48) / 0.12, 0.0, 1.0);
  vec3 rbCol = 0.5 + 0.5 * cos(6.28318 * (rbT * 0.82 + vec3(0.0, 0.33, 0.67)));
  bg += rbCol * rbBand * smoothstep(0.28, 0.52, uv.y) * (0.14 + uRainbowStrength * 0.32);

  // Soft defocused wet garden foliage at lower portion
  float treeH1 = 0.36 + 0.08 * sin(uv.x * 7.0 + uTime * 0.35) + 0.05 * cos(uv.x * 15.0);
  float treeH2 = 0.25 + 0.06 * sin(uv.x * 11.0 + 1.4 - uTime * 0.45);
  float foliage1 = 1.0 - smoothstep(treeH1 - 0.08, treeH1 + 0.06, uv.y);
  float foliage2 = 1.0 - smoothstep(treeH2 - 0.05, treeH2 + 0.05, uv.y);
  vec3 leafFar = vec3(0.28, 0.49, 0.33);
  vec3 leafNear = vec3(0.20, 0.42, 0.24);
  vec3 leafSun = vec3(0.58, 0.72, 0.34);
  float leafNoise = fbm(uv * vec2(14.0, 12.0) + vec2(uTime * 0.04, 0.0));
  bg = mix(bg, mix(leafFar, leafSun, leafNoise * 0.65), foliage1 * 0.75);
  bg = mix(bg, mix(leafNear, leafSun, leafNoise * 0.55), foliage2 * 0.88);

  // Sunlit bokeh sparkles on wet garden leaves
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    vec2 bp = vec2(fract(fi * 0.37 + 0.12), 0.10 + fract(fi * 0.61) * 0.24);
    float bd = length((uv - bp) * vec2(1.2, 1.0));
    float bGlow = smoothstep(0.055, 0.015, bd) * (0.4 + 0.3 * sin(uTime * 1.2 + fi * 2.1));
    bg += vec3(1.0, 0.96, 0.78) * bGlow * 0.35;
  }

  // Animated glistening raindrops on the window glass!
  vec2 dropUV = uv * vec2(11.0, 7.0);
  vec2 cell = floor(dropUV);
  vec2 f = fract(dropUV) - 0.5;
  float h = hash21(cell);
  float slideSpeed = 0.08 + h * 0.11 + uRainSlide * 0.38;
  float yCycle = fract(uTime * slideSpeed + h * 17.0);
  float dropY = 0.38 - yCycle * 0.78;
  float wobbleX = sin(yCycle * 10.0 + h * 30.0) * 0.07;
  vec2 dp = f - vec2((h - 0.5) * 0.45 + wobbleX, dropY);
  dp.y *= 0.72; // teardrop stretch
  float r = length(dp);
  float dropMask = smoothstep(0.145, 0.09, r);
  // Specular sunlit glint inside each drop
  float dropSpec = smoothstep(0.065, 0.015, length(dp - vec2(-0.032, 0.038)));
  float dropRim = smoothstep(0.13, 0.08, r) * smoothstep(0.04, 0.12, r);
  // Faint wet trail above moving drop
  float trailX = abs(dp.x);
  float trail = smoothstep(0.04, 0.005, trailX) * smoothstep(-0.02, 0.08, dp.y) * smoothstep(0.45, 0.05, dp.y);

  bg = mix(bg, bg * 0.92 + vec3(0.08, 0.11, 0.13), dropMask * 0.45 + trail * 0.12);
  bg += vec3(1.0, 0.97, 0.90) * (dropSpec * 0.95 + dropRim * 0.25);

  // Static tiny dew beads
  vec2 microUV = uv * vec2(34.0, 26.0);
  vec2 mc = floor(microUV);
  vec2 mf = fract(microUV) - 0.5;
  float mh = hash21(mc + 41.7);
  if (mh > 0.62) {
    vec2 mp = mf - (vec2(hash21(mc + 3.1), hash21(mc + 9.2)) - 0.5) * 0.45;
    float mr = length(mp);
    float mm = smoothstep(0.16, 0.09, mr);
    float ms = smoothstep(0.07, 0.01, length(mp - vec2(-0.035, 0.035)));
    bg = mix(bg, bg * 0.94 + vec3(0.05), mm * 0.35);
    bg += vec3(1.0, 0.98, 0.92) * ms * 0.65;
  }

  return bg;
}

void main() {
  vec3 N = normalize(vWorldNorm);
  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 L = normalize(uSunDir);

  // Window Glass special shader
  if (uMatMode == 5) {
    vec3 winCol = renderWindowGlass(vUV, V);
    // Subtle warm indoor glass Fresnel reflection
    float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
    winCol = mix(winCol, vec3(0.95, 0.89, 0.80), fres * 0.14);
    fragColor = vec4(winCol * 1.18, 1.0);
    return;
  }

  // Base albedo & PBR properties
  vec2 tuv = vUV * uPBR.w;
  vec3 texCol = texture(uTex, tuv).rgb;
  vec3 albedo = uBaseColor.rgb * vColor.rgb * texCol;
  float rough = clamp(uPBR.x, 0.04, 0.98);
  float metal = uPBR.y;
  float sheen = uPBR.z;
  float alpha = uBaseColor.a * vColor.a;

  // Mode 1: Silky Cavalier Fur
  if (uMatMode == 1) {
    float furR;
    vec3 furCol = blenheimFurColor(vLocalPos, vUV, uFurPart, furR);
    albedo = furCol * uBaseColor.rgb * mix(vec3(1.0), texCol, 0.28);
    rough = furR;
    // Subtle anisotropic fur strand normal perturbation
    float f1 = fbm(vUV * vec2(42.0, 18.0) + vLocalPos.xy * 18.0);
    float f2 = fbm(vUV * vec2(42.0, 18.0) + vLocalPos.xy * 18.0 + vec2(0.15, 0.0));
    N = normalize(N + vec3((f1 - 0.5) * 0.14, (f2 - 0.5) * 0.12, 0.0));
  }
  // Mode 2: Liquid Realistic Dog Eye
  else if (uMatMode == 2) {
    // Local +Z is forward gaze of eyeball
    vec3 lp = normalize(vLocalPos);
    float rIris = length(lp.xy);
    float frontMask = smoothstep(-0.05, 0.15, lp.z);
    vec3 sclera = vec3(0.76, 0.72, 0.67);
    vec3 limbal = vec3(0.06, 0.03, 0.02);
    vec3 irisOuter = vec3(0.18, 0.085, 0.035);
    vec3 irisInner = vec3(0.34, 0.17, 0.065);
    vec3 pupil = vec3(0.015, 0.01, 0.01);

    float inIris = (1.0 - smoothstep(0.62, 0.69, rIris)) * frontMask;
    float inPupil = (1.0 - smoothstep(0.30, 0.36, rIris)) * frontMask;
    float irisRing = smoothstep(0.52, 0.66, rIris);
    float radial = 0.5 + 0.5 * sin(atan(lp.y, lp.x) * 26.0 + rIris * 12.0);

    vec3 irisCol = mix(irisInner, irisOuter, smoothstep(0.32, 0.60, rIris));
    irisCol += vec3(0.11, 0.06, 0.022) * radial * smoothstep(0.62, 0.36, rIris);
    irisCol = mix(irisCol, limbal, irisRing * 0.7);
    // Warm sunlit crescent at bottom of iris (corneal caustics!)
    float caustic = smoothstep(0.1, -0.55, lp.y) * inIris * (1.0 - inPupil);
    irisCol += vec3(0.30, 0.16, 0.05) * caustic * 0.72;

    albedo = mix(sclera, irisCol, inIris);
    albedo = mix(albedo, pupil, inPupil);
    rough = 0.04;
  }
  // Mode 3: Wet Gloss (Paste, Wet Nose, Pink Tongue)
  else if (uMatMode == 3) {
    // Savory micro-flecks for paste or tiny pebble texture for nose
    float micro = fbm(vLocalPos.xz * 48.0 + vLocalPos.xy * 36.0);
    if (uFurPart == 10) {
      // Wet food paste: creamy subsurface + tiny savory herbs/flecks
      float fleck = smoothstep(0.72, 0.85, noise2(vLocalPos.xz * 72.0 + vLocalPos.y * 55.0));
      albedo = mix(albedo, albedo * vec3(0.78, 0.68, 0.58), fleck * 0.35);
      N = normalize(N + vec3((micro - 0.5) * 0.16, 0.0, (micro - 0.5) * 0.16));
      rough = 0.13;
    } else if (uFurPart == 11) {
      // Dog wet nose leather
      N = normalize(N + vec3((micro - 0.5) * 0.25, (micro - 0.5) * 0.25, 0.0));
      rough = 0.14;
    } else {
      // Wet pink tongue
      rough = 0.15;
    }
  }
  // Mode 4: Animated Rippling Water Dish
  else if (uMatMode == 4) {
    vec2 p = vLocalPos.xz;
    vec2 grad = vec2(0.0);
    float hSum = 0.0;
    for (int i = 0; i < 4; i++) {
      vec4 rp = uRipples[i];
      if (rp.w > 0.001) {
        float age = uTime - rp.z;
        if (age > 0.0 && age < 2.2) {
          vec2 d = p - rp.xy;
          float dist = length(d) + 0.0001;
          float wavePos = age * 0.28;
          float env = exp(-abs(dist - wavePos) * 26.0) * exp(-age * 1.6) * rp.w;
          float ph = (dist - wavePos) * 75.0;
          hSum += sin(ph) * env;
          grad += (d / dist) * cos(ph) * env * 1.8;
        }
      }
    }
    // Gentle ambient micro-shimmer
    grad.x += sin(p.x * 40.0 + uTime * 2.1) * 0.025;
    grad.y += cos(p.y * 40.0 - uTime * 1.8) * 0.025;
    N = normalize(vec3(-grad.x, 1.0, -grad.y));
    float fres = pow(1.0 - max(dot(N, V), 0.0), 3.2);
    vec3 waterDeep = vec3(0.76, 0.88, 0.90);
    vec3 reflCol = mix(uSkyColor * 1.25, vec3(1.0, 0.96, 0.88), 0.45);
    albedo = mix(waterDeep, reflCol, clamp(0.28 + fres * 0.65, 0.0, 0.95));
    rough = 0.05;
    alpha = 0.82;
  }

  // Soft shadow from sunlit window
  float shadow = calcShadow(vLightSpacePos, N, L);

  // Cook-Torrance GGX Lighting
  vec3 H = normalize(L + V);
  float NdotL = max(dot(N, L), 0.0);
  float NdotV = max(dot(N, V), 0.001);
  float NdotH = max(dot(N, H), 0.0);
  float VdotH = max(dot(V, H), 0.0);

  vec3 F0 = mix(vec3(0.04), albedo, metal);
  vec3 F = F0 + (1.0 - F0) * pow(1.0 - VdotH, 5.0);

  float a = rough * rough;
  float a2 = a * a;
  float denom = (NdotH * NdotH * (a2 - 1.0) + 1.0);
  float D = a2 / max(PI * denom * denom, 0.0001);

  float k = (rough + 1.0) * (rough + 1.0) / 8.0;
  float G = (NdotV / (NdotV * (1.0 - k) + k)) * (NdotL / (NdotL * (1.0 - k) + k));
  vec3 spec = (D * G * F) / max(4.0 * NdotV * NdotL, 0.001);

  // Soft wrap diffuse for fur & wet paste (creates warm organic softness!)
  float wrap = (uMatMode == 1) ? 0.36 : ((uMatMode == 3 && uFurPart == 10) ? 0.25 : 0.0);
  float diffTerm = max((dot(N, L) + wrap) / (1.0 + wrap), 0.0);
  vec3 kD = (1.0 - F) * (1.0 - metal);
  vec3 direct = (kD * albedo / PI * diffTerm + spec * NdotL) * uSunColor * mix(0.22, 1.0, shadow);

  // Warm front-right fill light (bounced afternoon room glow, keeps puppy face luminous!)
  vec3 L2 = normalize(vec3(0.55, 0.62, 0.78));
  vec3 H2 = normalize(L2 + V);
  float diff2 = max((dot(N, L2) + wrap) / (1.0 + wrap), 0.0);
  float spec2 = pow(max(dot(N, H2), 0.0), mix(180.0, 12.0, rough)) * mix(0.32, 0.03, rough);
  vec3 fillLight = (albedo * diff2 * 0.42 + vec3(spec2) * 0.35) * vec3(1.0, 0.94, 0.87);

  // Back-left golden post-rain window rim light!
  vec3 L3 = normalize(vec3(-0.68, 0.58, -0.62));
  float rimNdotL = max(dot(N, L3), 0.0);
  float rimFres = pow(1.0 - NdotV, 3.0);
  vec3 rimLight = uSunColor * rimFres * (0.18 + 0.55 * rimNdotL) * (0.28 + sheen * 1.15);

  // Hemisphere ambient (post-rain sky above + warm honey wood bounce below)
  float hemi = N.y * 0.5 + 0.5;
  vec3 ambient = mix(uBounceColor, uSkyColor, hemi) * albedo * 0.48;

  // Velvet/Fur sheen grazing glow
  if (sheen > 0.01) {
    ambient += albedo * rimFres * sheen * 0.30 * uSunColor;
  }

  vec3 color = ambient + direct + fillLight + rimLight;

  // Crisp realistic sunlit window catchlights on Dog Eyes!
  if (uMatMode == 2) {
    vec3 R = reflect(-V, N);
    // Primary sunlit window pane catchlight (upper-left)
    vec3 wDir1 = normalize(vec3(-0.42, 0.56, 0.72));
    vec3 wDir2 = normalize(vec3(-0.22, 0.56, 0.80));
    float c1 = smoothstep(0.985, 0.996, dot(R, wDir1));
    float c2 = smoothstep(0.990, 0.997, dot(R, wDir2));
    // Secondary tiny warm room catchlight (lower-right)
    vec3 wDir3 = normalize(vec3(0.42, -0.18, 0.88));
    float c3 = smoothstep(0.992, 0.998, dot(R, wDir3));
    color += vec3(1.0, 0.98, 0.92) * (c1 * 1.35 + c2 * 0.85 + c3 * 0.35);
  }

  // Wet gloss clearcoat glint (paste, wet nose, wet tongue, water)
  if (uMatMode == 3 || uMatMode == 4) {
    vec3 Hc = normalize(normalize(vec3(-0.35, 0.85, 0.45)) + V);
    float coat = pow(max(dot(N, Hc), 0.0), 96.0);
    color += vec3(1.0, 0.97, 0.90) * coat * (uMatMode == 4 ? 0.95 : 0.65);
  }

  // Floor sunlit window-mullion pattern + delicate post-rain rainbow prism caustic!
  if (uMatMode == 6) {
    // Diagonal sunlit patch on floorboards/rug from back-left window
    vec2 sp = vWorldPos.xz - vec2(0.05, 0.12);
    float beamBox = smoothstep(0.95, 0.55, abs(sp.x - sp.y * 0.32)) * smoothstep(0.88, 0.45, abs(sp.y));
    // Subtle soft window muntin shadow bars
    float barX = smoothstep(0.025, 0.06, abs(sp.x - sp.y * 0.32 - 0.05));
    float barY = smoothstep(0.025, 0.06, abs(sp.y + 0.08));
    float sunPatch = beamBox * mix(0.72, 1.0, barX * barY) * shadow;
    color += vec3(0.24, 0.19, 0.11) * sunPatch * (0.75 + uRainbowStrength * 0.35);

    // Delicate rainbow prism shimmer on sunlit floor
    vec2 rp = (vWorldPos.xz - vec2(0.32, 0.10)) * vec2(2.6, 1.8);
    float rDist = length(rp);
    float rMask = exp(-rDist * rDist * 3.2) * (0.18 + uRainbowStrength * 0.82);
    float rPhase = rp.x * 1.15 + rp.y * 0.65;
    vec3 prism = 0.5 + 0.5 * cos(6.28318 * (rPhase * 0.55 + vec3(0.0, 0.33, 0.67)));
    color += prism * rMask * 0.22;
  }

  // Gentle tactile hover/interactive warm glow (subtle & diegetic)
  if (uHighlight.w > 0.001) {
    color += uHighlight.rgb * (0.08 + rimFres * 0.22) * uHighlight.w;
  }

  // Subtle cozy atmospheric depth mist near back wall
  float camDist = length(uCamPos - vWorldPos);
  float fog = smoothstep(2.2, 5.2, camDist) * 0.22;
  color = mix(color, vec3(0.95, 0.90, 0.82), fog);

  fragColor = vec4(color, alpha);
}`;

// --- Volumetric Sunbeam / Sparkle Particle Shader ---
const FX_VS = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
layout(location=2) in vec2 aUV;
uniform mat4 uVP;
uniform mat4 uModel;
out vec2 vUV;
out vec3 vWorldPos;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vUV = aUV;
  gl_Position = uVP * wp;
}`;

const FX_FS = `#version 300 es
precision highp float;
in vec2 vUV;
in vec3 vWorldPos;
uniform vec4 uColor;
uniform float uTime;
uniform int uFxMode; // 0: sunbeam shaft, 1: glowing sparkle mote
out vec4 fragColor;
void main() {
  if (uFxMode == 0) {
    float edgeX = sin(vUV.x * 3.14159);
    float fadeY = smoothstep(0.0, 0.25, vUV.y) * smoothstep(1.0, 0.15, vUV.y);
    float shimmer = 0.86 + 0.14 * sin(vUV.x * 9.0 + uTime * 0.45);
    float a = edgeX * edgeX * fadeY * shimmer * uColor.a;
    fragColor = vec4(uColor.rgb * a, a);
  } else {
    vec2 p = vUV * 2.0 - 1.0;
    float d = length(p);
    float core = exp(-d * d * 5.5);
    float star = exp(-abs(p.x) * 9.0) * exp(-abs(p.y) * 2.2) + exp(-abs(p.y) * 9.0) * exp(-abs(p.x) * 2.2);
    float g = (core + star * 0.45) * smoothstep(1.0, 0.2, d) * uColor.a;
    fragColor = vec4(uColor.rgb * g, g);
  }
}`;

// --- ACES Filmic Tone Mapping + Warm Bloom Post-Process Shader ---
const POST_VS = `#version 300 es
out vec2 vUV;
void main() {
  vec2 pos = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUV = pos;
  gl_Position = vec4(pos * 2.0 - 1.0, 0.0, 1.0);
}`;

const POST_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform vec2 uTexelSize;
out vec4 fragColor;

vec3 aces(vec3 x) {
  const float a = 2.51;
  const float b = 0.03;
  const float c = 2.43;
  const float d = 0.59;
  const float e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

void main() {
  vec3 col = texture(uScene, vUV).rgb;

  // Lightweight warm sunlit bloom (12-tap cross/ring)
  vec3 bloom = vec3(0.0);
  const vec2 offs[8] = vec2[8](
    vec2(-2.0, 0.0), vec2(2.0, 0.0), vec2(0.0, -2.0), vec2(0.0, 2.0),
    vec2(-4.0, -4.0), vec2(4.0, -4.0), vec2(-4.0, 4.0), vec2(4.0, 4.0)
  );
  for (int i = 0; i < 8; i++) {
    vec3 s = texture(uScene, vUV + offs[i] * uTexelSize * 2.4).rgb;
    float lum = dot(s, vec3(0.299, 0.587, 0.114));
    bloom += s * smoothstep(0.85, 1.55, lum);
  }
  col += (bloom / 8.0) * 0.24 * vec3(1.04, 0.99, 0.90);

  // ACES filmic tone map & gentle sunlit warmth
  col *= 1.06;
  col = aces(col);

  // Subtle photographic vignette
  vec2 d = vUV - 0.5;
  float vig = 1.0 - dot(d, d) * 0.26;
  col *= vig;

  // Gamma to sRGB
  col = pow(max(col, vec3(0.0)), vec3(1.0 / 2.2));
  fragColor = vec4(col, 1.0);
}`;

// 4. PROCEDURAL HIGH-RES TEXTURES (Canvas2D -> WebGL2)
// ============================================================================
function makeCanvasTex(size, drawFn, repeat = true) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  drawFn(ctx, size);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  return tex;
}

// Warm Honey-Oak Wood Floorboards
TEX.wood = makeCanvasTex(512, (ctx, s) => {
  ctx.fillStyle = '#c49868';
  ctx.fillRect(0, 0, s, s);
  const planks = 6;
  const pw = s / planks;
  for (let p = 0; p < planks; p++) {
    const shade = 0.92 + (p * 37 % 17) * 0.01;
    ctx.fillStyle = `rgb(${Math.round(196 * shade)},${Math.round(148 * shade)},${Math.round(101 * shade)})`;
    ctx.fillRect(p * pw, 0, pw, s);
    // Fine grain lines
    for (let i = 0; i < 70; i++) {
      const gx = p * pw + Math.random() * pw;
      ctx.strokeStyle = Math.random() > 0.45 ? 'rgba(110,66,30,0.12)' : 'rgba(235,198,150,0.11)';
      ctx.lineWidth = 0.8 + Math.random() * 1.8;
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      for (let y = 0; y <= s; y += 32) {
        ctx.lineTo(gx + Math.sin(y * 0.02 + p * 2.1 + i) * 3.5, y);
      }
      ctx.stroke();
    }
    // Plank vertical seam
    ctx.fillStyle = 'rgba(72,42,20,0.34)';
    ctx.fillRect(p * pw, 0, 2, s);
    // Staggered horizontal seam
    const hy = ((p * 173) % s);
    ctx.fillRect(p * pw, hy, pw, 2);
  }
});

  for (let r = 8; r < s * 0.52; r += 5) {
    const band = Math.floor(r / 34) % 4;
    const cols = ['#efe6da', '#e8d7c6', '#f2dfd3', '#e5dcd0'];
    ctx.strokeStyle = cols[band];
    ctx.lineWidth = 4.4;

    ctx.arc(cx, cy, r, 0, Math.PI * 2);

    const steps = Math.max(12, Math.floor(r * 0.9));
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2 + (r % 2) * 0.1;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      ctx.fillStyle = i % 2 === 0 ? 'rgba(150,126,104,0.16)' : 'rgba(255,252,246,0.22)';
      ctx.fillRect(x - 1, y - 1, 2.2, 2.2);

// 5. PROCEDURAL 3D MESH BUILDER

function createMesh(positions, normals, uvs, indices, colors = null) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const vboP = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboP);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

  const vboN = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboN);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

  const vboU = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboU);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uvs), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

  const vertCount = positions.length / 3;
  const colArr = colors ? new Float32Array(colors) : new Float32Array(vertCount * 4).fill(1);
  const vboC = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboC);
  gl.bufferData(gl.ARRAY_BUFFER, colArr, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(3);
  gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 0, 0);

  const ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  const idxArr = new Uint16Array(indices);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxArr, gl.STATIC_DRAW);

  gl.bindVertexArray(null);
  return { vao, count: idxArr.length };
}

function computeSmoothNormals(pos, idx) {
  const n = new Float32Array(pos.length);
  for (let i = 0; i < idx.length; i += 3) {
    const i0 = idx[i] * 3, i1 = idx[i + 1] * 3, i2 = idx[i + 2] * 3;
    const ax = pos[i1] - pos[i0], ay = pos[i1 + 1] - pos[i0 + 1], az = pos[i1 + 2] - pos[i0 + 2];
    const bx = pos[i2] - pos[i0], by = pos[i2 + 1] - pos[i0 + 1], bz = pos[i2 + 2] - pos[i0 + 2];
    const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    n[i0] += nx; n[i0 + 1] += ny; n[i0 + 2] += nz;
    n[i1] += nx; n[i1 + 1] += ny; n[i1 + 2] += nz;
    n[i2] += nx; n[i2 + 1] += ny; n[i2 + 2] += nz;
  }
  for (let i = 0; i < n.length; i += 3) {
    const l = Math.hypot(n[i], n[i + 1], n[i + 2]) || 1;
    n[i] /= l; n[i + 1] /= l; n[i + 2] /= l;
  }
  return n;
}

// High-craft UV Sphere / Deformed Organic Sculpt
function buildSphere(rx, ry, rz, segU = 24, segV = 18, deformFn = null) {
  const pos = [], uv = [], idx = [];
  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV;
    const phi = v * Math.PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let iu = 0; iu <= segU; iu++) {
      const u = iu / segU;
      const th = u * Math.PI * 2;
      let x = rx * sp * Math.cos(th);
      let y = ry * cp;
      let z = rz * sp * Math.sin(th);
      if (deformFn) {
        const d = deformFn(x, y, z, u, v);
        x = d[0]; y = d[1]; z = d[2];
      }
      pos.push(x, y, z);
      uv.push(u, v);
    }
  }
  const stride = segU + 1;
  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * stride + iu;
      const b = a + stride;
      idx.push(a, a + 1, b);
      idx.push(b, a + 1, b + 1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, idx);
}

// Sculpted Capsule / Tapered Limb along Y (from y=0 down to y=-len, or centered)
function buildLimb(rTop, rBot, len, segU = 16, segV = 12, yOffset = 0) {
  const pos = [], uv = [], idx = [];
  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV;
    let y, r;
    if (v < 0.2) {
      const a = (v / 0.2) * (Math.PI * 0.5);
      y = rTop * Math.cos(a);
      r = rTop * Math.sin(a);
    } else if (v > 0.8) {
      const a = ((v - 0.8) / 0.2) * (Math.PI * 0.5);
      y = -len - rBot * Math.sin(a);
      r = rBot * Math.cos(a);
    } else {
      const t = (v - 0.2) / 0.6;
      y = -len * t;
      r = lerp(rTop, rBot, t);
    }
    for (let iu = 0; iu <= segU; iu++) {
      const u = iu / segU;
      const th = u * Math.PI * 2;
      pos.push(r * Math.cos(th), y + yOffset, r * Math.sin(th));
      uv.push(u, v);
    }
  }
  const stride = segU + 1;
  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * stride + iu, b = a + stride;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, idx);
}

// Lathe Mesh (for ceramic bowls, water dish, flower pot, spoon handle, etc.)
function buildLathe(pts, segs = 32) {
  const pos = [], uv = [], idx = [];
  for (let iv = 0; iv < pts.length; iv++) {
    const [r, y] = pts[iv];
    const v = iv / (pts.length - 1);
    for (let iu = 0; iu <= segs; iu++) {
      const u = iu / segs;
      const th = u * Math.PI * 2;
      pos.push(r * Math.cos(th), y, r * Math.sin(th));
      uv.push(u, v);
    }
  }
  const stride = segs + 1;
  for (let iv = 0; iv < pts.length - 1; iv++) {
    for (let iu = 0; iu < segs; iu++) {
      const a = iv * stride + iu, b = a + stride;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, idx);
}

// Box with clean normals and UVs
function buildBox(w, h, d, segX = 1, segY = 1) {
  const hw = w / 2, hh = h / 2, hd = d / 2;
  const pos = [], norm = [], uv = [], idx = [];
  const faces = [
    [[0, 0, 1], [1, 0, 0], [0, 1, 0], [0, 0, hd], hw, hh],
    [[0, 0, -1], [-1, 0, 0], [0, 1, 0], [0, 0, -hd], hw, hh],
    [[1, 0, 0], [0, 0, -1], [0, 1, 0], [hw, 0, 0], hd, hh],
    [[-1, 0, 0], [0, 0, 1], [0, 1, 0], [-hw, 0, 0], hd, hh],
    [[0, 1, 0], [1, 0, 0], [0, 0, -1], [0, hh, 0], hw, hd],
    [[0, -1, 0], [1, 0, 0], [0, 0, 1], [0, -hh, 0], hw, hd]
  ];
  let base = 0;
  for (const [n, rx, ry, c, sx, sy] of faces) {
    for (let iy = 0; iy <= segY; iy++) {
      const v = iy / segY;
      const py = (v * 2 - 1) * sy;
      for (let ix = 0; ix <= segX; ix++) {
        const u = ix / segX;
        const px = (u * 2 - 1) * sx;
        pos.push(c[0] + rx[0] * px + ry[0] * py, c[1] + rx[1] * px + ry[1] * py, c[2] + rx[2] * px + ry[2] * py);
        norm.push(n[0], n[1], n[2]);
        uv.push(u, v);
      }
    }
    const st = segX + 1;
    for (let iy = 0; iy < segY; iy++) {
      for (let ix = 0; ix < segX; ix++) {
        const a = base + iy * st + ix, b = a + st;
        idx.push(a, a + 1, b, b, a + 1, b + 1);
      }
    }
    base += (segX + 1) * (segY + 1);
  }
  return createMesh(pos, norm, uv, idx);
}

// Flat Quad (facing +Z or +Y)
function buildQuad(w, h, segX = 1, segY = 1, faceUp = false) {
  const pos = [], norm = [], uv = [], idx = [];
  for (let iy = 0; iy <= segY; iy++) {
    const v = iy / segY;
    for (let ix = 0; ix <= segX; ix++) {
      const u = ix / segX;
      const px = (u - 0.5) * w, py = (v - 0.5) * h;
      if (faceUp) {
        pos.push(px, 0, -py);
        norm.push(0, 1, 0);
      } else {
        pos.push(px, py, 0);
        norm.push(0, 0, 1);
      }
      uv.push(u, v);
    }
  }
  const st = segX + 1;
  for (let iy = 0; iy < segY; iy++) {
    for (let ix = 0; ix < segX; ix++) {
      const a = iy * st + ix, b = a + st;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  }
  return createMesh(pos, norm, uv, idx);
}

// Disc (for circular rug, water surface)
function buildDisc(radius, segR = 14, segT = 40, thickness = 0) {
  const pos = [], norm = [], uv = [], idx = [];
  pos.push(0, thickness, 0);
  norm.push(0, 1, 0);
  uv.push(0.5, 0.5);
  for (let ir = 1; ir <= segR; ir++) {
    const fr = ir / segR;
    const r = radius * fr;
    const y = thickness * (1 - Math.pow(fr, 8) * 0.65);
    for (let it = 0; it <= segT; it++) {
      const th = (it / segT) * Math.PI * 2;
      const x = r * Math.cos(th), z = r * Math.sin(th);
      pos.push(x, y, z);
      norm.push(0, 1, 0);
      uv.push(0.5 + 0.5 * fr * Math.cos(th), 0.5 + 0.5 * fr * Math.sin(th));
    }
  }
  const st = segT + 1;
  for (let it = 0; it < segT; it++) {
    idx.push(0, 1 + it + 1, 1 + it);
  }
  for (let ir = 1; ir < segR; ir++) {
    const rowA = 1 + (ir - 1) * st;
    const rowB = 1 + ir * st;
    for (let it = 0; it < segT; it++) {
      idx.push(rowA + it, rowA + it + 1, rowB + it);
      idx.push(rowB + it, rowA + it + 1, rowB + it + 1);
    }
  }
  return createMesh(pos, computeSmoothNormals(pos, idx), uv, idx);
}

MESH.dogHead = buildSphere(0.105, 0.098, 0.106, 34, 26, (x, y, z) => {
  let ox = x, oy = y, oz = z;
  // Soft rounded cranium dome
  if (y > 0.02 && z < 0.04) {
    oy *= 1.08;
    ox *= 1.03;
  }
  // Sweet Cavalier muzzle protrusion: centered in X and lower in Y so eyes sit cleanly in orbits!
  if (z > 0.025) {
    const zT = smoothstep(0.025, 0.105, z);
    const centerX = Math.exp(-Math.pow(x / 0.046, 2));
    const lowerY = smoothstep(0.032, -0.025, y);
    const snoutMask = zT * centerX * lowerY;
    oz += snoutMask * 0.052;
    // Soft rounded upper-lip cheeks (flews)
    const cheek = Math.exp(-Math.pow((Math.abs(x) - 0.026) / 0.024, 2)) *
                  Math.exp(-Math.pow((y + 0.026) / 0.022, 2)) * zT;
    ox += Math.sign(x) * cheek * 0.014;
    oy -= cheek * 0.010;
    oz += cheek * 0.012;
  }
  // Gentle orbital cushion sockets for the big dark Cavalier eyes
  const eyeD = Math.hypot(Math.abs(x) - 0.046, y - 0.016, z - 0.092);
  if (eyeD < 0.030) {
    const indent = Math.pow(1 - eyeD / 0.030, 1.5) * 0.010;
    oz -= indent;
  }
  return [ox, oy, oz];
});

gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
gl.drawBuffers([gl.NONE]);

// Scene Post-Processing FBO
const hasHalfFloat = !!gl.getExtension('EXT_color_buffer_float');
let sceneFBO = null, sceneColTex = null, sceneDepthRB = null;
let fboW = 1, fboH = 1, usePostFBO = true;

function resizeRenderTargets() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width === w && canvas.height === h && sceneFBO) return;
  canvas.width = w;
  canvas.height = h;
  fboW = w; fboH = h;

  if (sceneFBO) gl.deleteFramebuffer(sceneFBO);
  if (sceneColTex) gl.deleteTexture(sceneColTex);
  if (sceneDepthRB) gl.deleteRenderbuffer(sceneDepthRB);

  sceneFBO = gl.createFramebuffer();
  sceneColTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, sceneColTex);
  if (hasHalfFloat) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  } else {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  sceneDepthRB = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepthRB);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneColTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepthRB);
  usePostFBO = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
window.addEventListener('resize', resizeRenderTargets);
resizeRenderTargets();
