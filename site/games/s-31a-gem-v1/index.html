// 9. CAVALIER KING CHARLES SPANIEL (Rig, AI, Secondary Physics & Animation)
// ============================================================================
class CavalierDog {
  constructor() {
    this.pos = [CUSHION_POS[0] + 0.02, 0.055, CUSHION_POS[2] + 0.04];
    this.yaw = 0.42;
    this.targetPos = [...this.pos];
    this.targetYaw = this.yaw;

    // Behavioral state machine
    this.state = 'SLEEPING'; // SLEEPING, WAKING, SITTING, WALKING, EATING_BOWL, DRINKING, PLAYING_BALL, HAPPY_SPIN, BELLY_BLISS
    this.stateTimer = 0;
    this.wakeDelay = 2.4;

    // Posture parameters (smoothly damped)
    this.sitAmount = 0.0;      // 0: standing, 1: sitting
    this.lieAmount = 1.0;      // 0: upright, 1: curled lying down
    this.bellyRoll = 0.0;      // 0: normal, 1: rolled blissfully showing fluffy belly
    this.stretchBow = 0.0;     // 0..1 play-bow stretch
    this.standTall = 0.0;      // 0..1 standing on hind paws reaching for high paste!
    this.bodyPitch = 0.0;
    this.bodyY = 0.0;
    this.walkPhase = 0.0;

    // Head & facial animation
    this.lookTarget = [0.0, 0.45, 0.9];
    this.headYaw = 0;
    this.headPitch = 0;
    this.headTilt = 0;
    this.headTiltTarget = 0;
    this.jawOpen = 0;
    this.tongueOut = 0;
    this.tongueCurl = 0;
    this.lickPhase = 0;
    this.isLicking = false;
    this.lickIntensity = 0;
    this.blink = 0;
    this.blinkTimer = 2.2;
    this.happySquint = 0;      // 0..1 blissful happy eyes
    this.sniffPulse = 0;
    this.petGlow = 0;
    this.bellyKick = 0;

    // Secondary spring-damper physics for floppy ears & tail
    this.earL = { angleZ: 0.18, velZ: 0, angleX: 0, velX: 0 };
    this.earR = { angleZ: -0.18, velZ: 0, angleX: 0, velX: 0 };
    this.prevHeadYaw = 0;
    this.prevHeadPitch = 0;
    this.earShake = 0;

    this.tailPhase = 0;
    this.tailSpeed = 3.2;
    this.tailAmp = 0.22;

    // Cute paste smears on nose & cheeks! { local: [x,y,z], col: [r,g,b], size }
    this.smears = [];

    // Cached world positions for exact interaction (mouth, head, body, belly)
    this.mouthWorld = V3.create(0, 0.35, 0);
    this.headWorld = V3.create(0, 0.40, 0);
    this.bodyWorld = V3.create(0, 0.25, 0);
    this.noseWorld = V3.create(0, 0.37, 0);
  }

  addSmear(col) {
    if (this.smears.length >= 3) return;
    const spots = [
      [0.006, 0.008, 0.166],   // right on tip of nose!
      [-0.032, -0.018, 0.132], // left plush cheek
      [0.032, -0.018, 0.132]   // right plush cheek
    ];
    const spot = spots[this.smears.length];
    this.smears.push({
      local: [...spot],
      col: [...col],
      size: 0.0125 + Math.random() * 0.004
    });
  }

  wipeSmears(amount = 0.05) {
    if (this.smears.length === 0) return false;
    const last = this.smears[this.smears.length - 1];
    last.size -= amount;
    if (last.size <= 0.002) {
      this.smears.pop();
      spawnSparkle(this.noseWorld[0], this.noseWorld[1] + 0.02, this.noseWorld[2], [1.0, 0.96, 0.84], 8, 0.10);
      audio.playChime(-1);
      world.happiness = clamp(world.happiness + 0.06, 0, 1);
      return true;
    }
    return false;
  }

  wakeUpNow() {
    if (this.state === 'SLEEPING' || this.state === 'BELLY_BLISS') {
      this.state = 'WAKING';
      this.stateTimer = 0;
      audio.playSigh();
    }
  }

  triggerHappySpin() {
    this.state = 'HAPPY_SPIN';
    this.stateTimer = 0;
    audio.playYip();
    audio.playChime(0);
    spawnSparkle(this.headWorld[0], this.headWorld[1] + 0.1, this.headWorld[2], [1.0, 0.92, 0.65], 12, 0.25);
  }

  registerLick(flavorIdx, pasteCol) {
    audio.playLick(0.95);
    world.happiness = clamp(world.happiness + 0.028, 0, 1);
    world.fullness = clamp(world.fullness + 0.035, 0, 1);
    world.licksSinceSmear++;
    world.licksSinceDrink++;
    this.happySquint = Math.max(this.happySquint, 0.65);

    // Flavor-specific cute reactions
    if (flavorIdx === 0) {
      // Salmon pink: joyful fast helicopter tail!
      this.tailSpeed = Math.max(this.tailSpeed, 14.0);
    } else if (flavorIdx === 1) {
      // Pumpkin gold: blissful cozy squint & gentle head tilt
      this.happySquint = Math.max(this.happySquint, 0.95);
      this.headTiltTarget = 0.22;
    } else {
      // Creamy chicken: excited double tail wag & bright eyes
      this.tailSpeed = Math.max(this.tailSpeed, 12.5);
      this.headTiltTarget = -0.18;
    }

    // Occasional cute paste dab on nose/cheek
    if (world.licksSinceSmear >= 5 && this.smears.length < 3) {
      world.licksSinceSmear = 0;
      this.addSmear(pasteCol);
    }

    // Subtle sunlit sparkle of delight
    if (Math.random() < 0.35) {
      spawnSparkle(this.mouthWorld[0], this.mouthWorld[1] + 0.05, this.mouthWorld[2], [1.0, 0.95, 0.78], 2, 0.08);
    }

    // Milestone 1: Joyful spin!
    if (!world.celebrated1 && world.fullness >= 0.36) {
      world.celebrated1 = true;
      setTimeout(() => {
        if (!dragState.active && this.state === 'SITTING') this.triggerHappySpin();
      }, 600);
    }
    // Milestone 2: Extra rainbow bloom + playful bounce!
    if (!world.celebrated2 && world.fullness >= 0.72) {
      world.celebrated2 = true;
      audio.playChime(2);
      spawnSparkle(0, 0.45, 0, [1.0, 0.90, 0.75], 14, 0.55);
    }
  }

  update(dt, drag) {
    this.stateTimer += dt;
    this.isLicking = false;

    // Natural blinking
    this.blinkTimer -= dt;
    if (this.blinkTimer <= 0) {
      this.blinkTimer = 2.4 + Math.random() * 3.4;
    }
    const blinkWave = this.blinkTimer < 0.14 ? Math.sin((this.blinkTimer / 0.14) * Math.PI) : 0;
    this.blink = Math.max(blinkWave, this.state === 'SLEEPING' ? 0.92 : 0);

    // Decay transient expressions
    this.happySquint = damp(this.happySquint, 0, 2.8, dt);
    this.sniffPulse = damp(this.sniffPulse, 0, 6.0, dt);
    this.petGlow = damp(this.petGlow, 0, 3.0, dt);
    this.bellyKick = damp(this.bellyKick, 0, 3.2, dt);
    this.earShake = damp(this.earShake, 0, 4.5, dt);

    // Check if user is holding yummy food (open pouch or loaded spoon)
    const holdingFood = drag.active && (
      (drag.type === 'pouch' && drag.item.open && drag.item.fill > 0.02) ||
      (drag.type === 'spoon' && drag.item.pasteAmt > 0.05)
    );
    const holdingCloth = drag.active && drag.type === 'cloth';

    // Default posture goals
    let goalSit = 1.0, goalLie = 0.0, goalBelly = 0.0, goalBow = 0.0, goalTall = 0.0;
    let goalPitch = 0.0, goalTailSpd = 4.5 + world.happiness * 6.0, goalTailAmp = 0.28 + world.happiness * 0.25;
    let lookGoal = [0.0, 0.52, 1.15];

    // --- STATE MACHINE ---
    if (this.state === 'SLEEPING') {
      goalSit = 0; goalLie = 1.0;
      goalTailSpd = 1.8; goalTailAmp = 0.10;
      lookGoal = [0.0, 0.20, 0.50];
      if (this.stateTimer > this.wakeDelay || drag.active) {
        this.state = 'WAKING';
        this.stateTimer = 0;
      }
    } else if (this.state === 'WAKING') {
      goalSit = 0; goalLie = 0;
      if (this.stateTimer < 0.85) {
        // Adorable play-bow stretch!
        goalBow = Math.sin(clamp(this.stateTimer / 0.85, 0, 1) * Math.PI);
        this.jawOpen = damp(this.jawOpen, goalBow * 0.55, 8, dt);
        goalTailSpd = 6.5;
      } else if (this.stateTimer < 1.35) {
        // Cute ear-flap head shake!
        this.earShake = 1.0;
        goalTailSpd = 9.0;
      } else {
        this.state = 'WALKING';
        this.stateTimer = 0;
        this.targetPos = [0.02, 0.02, -0.02];
        this.targetYaw = 0.0;
        audio.playYip();
      }
    } else if (this.state === 'WALKING') {
      goalSit = 0; goalLie = 0;
      const dx = this.targetPos[0] - this.pos[0];
      const dz = this.targetPos[2] - this.pos[2];
      const dist = Math.hypot(dx, dz);
      if (dist > 0.03) {
        const speed = 0.52;
        this.pos[0] += (dx / dist) * Math.min(dist, speed * dt);
        this.pos[2] += (dz / dist) * Math.min(dist, speed * dt);
        this.pos[1] = damp(this.pos[1], 0.02, 8, dt);
        const moveYaw = Math.atan2(dx, dz);
        this.yaw += angleDiff(this.yaw, moveYaw) * Math.min(1, dt * 8);
        this.walkPhase += dt * 11.5;
        goalTailSpd = 10.5;
        lookGoal = [this.targetPos[0], 0.25, this.targetPos[2] + 0.3];
      } else {
        this.yaw += angleDiff(this.yaw, this.targetYaw) * Math.min(1, dt * 8);
        if (Math.abs(angleDiff(this.yaw, this.targetYaw)) < 0.14) {
          if (this.nextStateAfterWalk) {
            this.state = this.nextStateAfterWalk;
            this.nextStateAfterWalk = null;
          } else {
            this.state = 'SITTING';
          }
          this.stateTimer = 0;
        }
      }
    } else if (this.state === 'SITTING') {
      goalSit = 1.0;
      this.pos[1] = damp(this.pos[1], 0.02, 8, dt);
      // Turn gently toward held item or camera
      let aimX = 0.0, aimZ = 0.7;
      if (drag.active && drag.item && drag.item.pos) {
        aimX = drag.item.pos[0];
        aimZ = drag.item.pos[2];
        lookGoal = [drag.item.pos[0], drag.item.pos[1], drag.item.pos[2]];
      } else if (world.idleTimer > 3.5) {
        // Gentle wordless cue: look curiously at a closed pouch or bowl, then back at user!
        const cuePhase = Math.sin(world.time * 0.9);
        if (cuePhase > 0.25) {
          const p = pouches[0];
          lookGoal = [p.pos[0], p.pos[1] + 0.04, p.pos[2]];
          this.headTiltTarget = 0.24;
        } else {
          lookGoal = [0.0, 0.56, 1.25];
          this.headTiltTarget = -0.14;
        }
      } else {
        // Subtle natural gaze
        lookGoal = [Math.sin(world.time * 0.5) * 0.18, 0.48 + Math.cos(world.time * 0.7) * 0.06, 1.1];
      }

      const wantYaw = clamp(Math.atan2(aimX - this.pos[0], Math.max(0.25, aimZ - this.pos[2])), -0.75, 0.75);
      this.yaw += angleDiff(this.yaw, wantYaw) * Math.min(1, dt * 5.0);

      // Stand tall eagerly if yummy food is held high above her head!
      if (holdingFood) {
        const foodPos = drag.type === 'pouch' ? [drag.item.pos[0], drag.item.pos[1] + 0.07, drag.item.pos[2]] : drag.item.pos;
        const dFood = V3.dist(this.mouthWorld, foodPos);
        goalTailSpd = 12.5;
        goalTailAmp = 0.48;
        if (dFood < 0.36 && foodPos[1] > 0.45) {
          goalTall = smoothstep(0.45, 0.58, foodPos[1]);
          goalSit = 1.0 - goalTall * 0.85;
        }
        if (dFood < 0.38 && Math.random() < dt * 1.4 && !this.isLicking) {
          this.sniffPulse = 1.0;
          audio.playSniff();
        }
        // Check if food is right at her mouth -> LICK!
        if (dFood < 0.20) {
          this.isLicking = true;
          this.lickIntensity = 1.0;
          goalPitch = clamp((foodPos[1] - 0.36) * 1.5, -0.35, 0.45);
        }
      } else if (holdingCloth) {
        const dCloth = V3.dist(this.noseWorld, cloth.pos);
        if (dCloth < 0.22) {
          this.happySquint = Math.max(this.happySquint, 0.85);
          this.headTiltTarget = 0.18;
          goalTailSpd = 9.5;
        }
      }

      // Autonomous cute decisions when not dragging food!
      if (!drag.active && this.stateTimer > 0.7) {
        // 1. If there's yummy paste in the ceramic bowl, trot over and eat from bowl!
        if (bowlBlobs.length > 0) {
          this.targetPos = [FOOD_BOWL_POS[0] + 0.02, 0.02, FOOD_BOWL_POS[2] - 0.25];
          this.targetYaw = 0.0;
          this.nextStateAfterWalk = 'EATING_BOWL';
          this.state = 'WALKING';
          this.stateTimer = 0;
        }
        // 2. If thirsty after lots of licks, walk over for a refreshing drink!
        else if (world.licksSinceDrink >= 14) {
          world.licksSinceDrink = 0;
          this.targetPos = [WATER_BOWL_POS[0] + 0.04, 0.02, WATER_BOWL_POS[2] - 0.24];
          this.targetYaw = -0.15;
          this.nextStateAfterWalk = 'DRINKING';
          this.state = 'WALKING';
          this.stateTimer = 0;
        }
        // 3. When happily full, roll onto her fluffy back for belly rubs!
        else if (world.fullness >= 0.96 && !world.bellyBlissTriggered && this.stateTimer > 1.6) {
          world.bellyBlissTriggered = true;
          this.state = 'BELLY_BLISS';
          this.stateTimer = 0;
          audio.playSigh();
          audio.playChime(1);
          spawnSparkle(this.pos[0], 0.35, this.pos[2], [1.0, 0.92, 0.72], 14, 0.35);
        }
      }
    } else if (this.state === 'EATING_BOWL') {
      goalSit = 0.25;
      goalPitch = -0.68;
      goalTailSpd = 13.0;
      goalTailAmp = 0.50;
      lookGoal = [FOOD_BOWL_POS[0], FOOD_BOWL_POS[1] + 0.04, FOOD_BOWL_POS[2]];
      this.isLicking = true;
      this.lickIntensity = 0.95;

      // Interrupt smoothly if child picks up a pouch or bounces the ball
      if (holdingFood) {
        this.state = 'SITTING';
        this.stateTimer = 0;
      } else if (bowlBlobs.length === 0) {
        // Finished bowl! Step back nicely and sit happily
        this.targetPos = [0.02, 0.02, -0.02];
        this.targetYaw = 0.0;
        this.nextStateAfterWalk = 'SITTING';
        this.state = 'WALKING';
        this.stateTimer = 0;
        audio.playYip();
      }
    } else if (this.state === 'DRINKING') {
      goalSit = 0.2;
      goalPitch = -0.66;
      goalTailSpd = 7.5;
      lookGoal = [WATER_BOWL_POS[0], WATER_BOWL_POS[1] + 0.04, WATER_BOWL_POS[2]];
      this.isLicking = true;
      this.lickIntensity = 0.85;
      if (this.stateTimer > 3.2 || holdingFood) {
        this.earShake = 0.9;
        this.targetPos = [0.02, 0.02, -0.02];
        this.targetYaw = 0.0;
        this.nextStateAfterWalk = 'SITTING';
        this.state = 'WALKING';
        this.stateTimer = 0;
      }
    } else if (this.state === 'PLAYING_BALL') {
      goalSit = 0; goalLie = 0;
      const dx = ball.pos[0] - this.pos[0];
      const dz = ball.pos[2] - this.pos[2];
      const dist = Math.hypot(dx, dz);
      lookGoal = [ball.pos[0], ball.pos[1], ball.pos[2]];
      goalTailSpd = 15.0;
      goalTailAmp = 0.55;
      if (dist > 0.22 && this.stateTimer < 4.5 && !holdingFood) {
        const spd = 0.85;
        this.pos[0] += (dx / dist) * Math.min(dist, spd * dt);
        this.pos[2] += (dz / dist) * Math.min(dist, spd * dt);
        this.yaw += angleDiff(this.yaw, Math.atan2(dx, dz)) * Math.min(1, dt * 11);
        this.walkPhase += dt * 16.0;
        // Cute playful bounce
        this.pos[1] = 0.02 + Math.abs(Math.sin(this.walkPhase * 0.5)) * 0.045;
      } else {
        // Boop the ball happily back toward the center!
        if (dist <= 0.25) {
          const bx = -0.15 - ball.pos[0];
          const bz = 0.10 - ball.pos[2];
          const bl = Math.hypot(bx, bz) || 1;
          ball.vel[0] = (bx / bl) * 0.85 + (Math.random() - 0.5) * 0.3;
          ball.vel[1] = 0.72;
          ball.vel[2] = (bz / bl) * 0.85;
          audio.playBallBounce(true);
          audio.playYip();
          world.happiness = clamp(world.happiness + 0.08, 0, 1);
          spawnSparkle(ball.pos[0], ball.pos[1] + 0.06, ball.pos[2], [1.0, 0.90, 0.82], 7, 0.14);
        }
        this.targetPos = [0.02, 0.02, -0.02];
        this.targetYaw = 0.0;
        this.nextStateAfterWalk = 'SITTING';
        this.state = 'WALKING';
        this.stateTimer = 0;
      }
    } else if (this.state === 'HAPPY_SPIN') {
      goalSit = 0; goalLie = 0;
      this.yaw += dt * 7.8;
      this.walkPhase += dt * 18.0;
      this.pos[1] = 0.02 + Math.abs(Math.sin(this.stateTimer * 9.5)) * 0.06;
      goalTailSpd = 16.0;
      goalTailAmp = 0.6;
      this.happySquint = 0.85;
      if (this.stateTimer > 0.92) {
        this.pos[1] = 0.02;
        this.state = 'SITTING';
        this.stateTimer = 0;
      }
    } else if (this.state === 'BELLY_BLISS') {
      goalSit = 0; goalLie = 0.85; goalBelly = 1.0;
      this.happySquint = Math.max(this.happySquint, 0.78);
      goalTailSpd = 5.5 + this.bellyKick * 8.0;
      goalTailAmp = 0.35;
      lookGoal = [0.0, 0.65, 1.1];
      // Wake up gently if child holds food or taps ball, or after cozy cuddle time
      if (holdingFood || this.stateTimer > 14.0) {
        world.fullness = 0.25;
        world.bellyBlissTriggered = false;
        this.state = 'WAKING';
        this.stateTimer = 0;
      }
    }

    // Smoothly damp all posture values
    this.sitAmount = damp(this.sitAmount, goalSit, 6.5, dt);
    this.lieAmount = damp(this.lieAmount, goalLie, 5.5, dt);
    this.bellyRoll = damp(this.bellyRoll, goalBelly, 4.5, dt);
    this.stretchBow = damp(this.stretchBow, goalBow, 7.0, dt);
    this.standTall = damp(this.standTall, goalTall, 6.5, dt);
    this.bodyPitch = damp(this.bodyPitch, goalPitch, 7.5, dt);

    // Tail wave speed & amplitude
    this.tailSpeed = damp(this.tailSpeed, goalTailSpd, 5.0, dt);
    this.tailAmp = damp(this.tailAmp, goalTailAmp, 5.0, dt);
    this.tailPhase += dt * this.tailSpeed;

    // Rhythmic Realistic Licking Kinematics!
    if (this.isLicking) {
      const prevCycle = Math.floor(this.lickPhase / (Math.PI * 2));
      this.lickPhase += dt * 16.5;
      const curCycle = Math.floor(this.lickPhase / (Math.PI * 2));
      const s = Math.sin(this.lickPhase);
      const extend = Math.max(0, s);
      this.tongueOut = damp(this.tongueOut, extend * this.lickIntensity, 28, dt);
      this.tongueCurl = Math.max(0, Math.sin(this.lickPhase - 0.55));
      this.jawOpen = damp(this.jawOpen, 0.16 + extend * 0.28, 22, dt);

      // Fire lick event at the peak of each tongue flick!
      if (curCycle > prevCycle) {
        if (this.state === 'DRINKING') {
          audio.playWaterLap();
          spawnWaterRipple((Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03, 0.9);
          spawnSparkle(WATER_BOWL_POS[0], WATER_BOWL_POS[1] + 0.06, WATER_BOWL_POS[2], [0.85, 0.96, 1.0], 2, 0.05);
        } else if (this.state === 'EATING_BOWL') {
          if (bowlBlobs.length > 0) {
            const top = bowlBlobs[bowlBlobs.length - 1];
            top.scale -= 0.42;
            this.registerLick(top.flavorIdx, top.color);
            if (top.scale <= 0.15) bowlBlobs.pop();
          }
        } else if (drag.active && drag.type === 'pouch' && drag.item.open && drag.item.fill > 0.01) {
          drag.item.fill = Math.max(0, drag.item.fill - 0.055);
          drag.item.squeezePulse = 1.0;
          this.registerLick(drag.item.id, drag.item.flavor.pasteCol);
        } else if (drag.active && drag.type === 'spoon' && drag.item.pasteAmt > 0.02) {
          drag.item.pasteAmt = Math.max(0, drag.item.pasteAmt - 0.28);
          this.registerLick(0, spoon.pasteCol);
        }
      }
    } else {
      this.tongueOut = damp(this.tongueOut, 0, 12, dt);
      this.tongueCurl = damp(this.tongueCurl, 0, 10, dt);
      if (this.state !== 'WAKING') {
        // Tiny happy pant when super joyful
        const happyPant = (world.happiness > 0.65 && this.state === 'SITTING') ? 0.06 + Math.sin(world.time * 7.0) * 0.02 : 0.0;
        this.jawOpen = damp(this.jawOpen, happyPant, 8, dt);
      }
    }

    // Head look-at calculation in dog-local coordinates
    V3.lerp(this.lookTarget, this.lookTarget, lookGoal, 1 - Math.exp(-8 * dt));
    const dx = this.lookTarget[0] - this.headWorld[0];
    const dy = this.lookTarget[1] - this.headWorld[1];
    const dz = this.lookTarget[2] - this.headWorld[2];
    const targetWorldYaw = Math.atan2(dx, dz);
    const localYaw = clamp(angleDiff(this.yaw, targetWorldYaw), -0.82, 0.82);
    const horizD = Math.hypot(dx, dz) || 0.01;
    const localPitch = clamp(-Math.atan2(dy, horizD), -0.58, 0.62);

    this.headYaw = damp(this.headYaw, localYaw, 9.0, dt);
    const lickBob = this.isLicking ? Math.sin(this.lickPhase) * 0.08 : 0;
    this.headPitch = damp(this.headPitch, localPitch + lickBob, 10.0, dt);
    this.headTilt = damp(this.headTilt, this.headTiltTarget, 4.5, dt);
    this.headTiltTarget = damp(this.headTiltTarget, 0, 0.9, dt);

    // Secondary Spring-Damper Physics for Floppy Cavalier Ears!
    const dHeadYaw = (this.headYaw - this.prevHeadYaw) / Math.max(dt, 0.005);
    const dHeadPitch = (this.headPitch - this.prevHeadPitch) / Math.max(dt, 0.005);
    this.prevHeadYaw = this.headYaw;
    this.prevHeadPitch = this.headPitch;

    const shakeForce = this.earShake * Math.sin(world.time * 34.0) * 18.0;
    const earBreeze = Math.sin(world.time * 2.2) * 0.025;
    // Left ear
    const restZL = 0.16 + this.headTilt * 0.65 + (this.state === 'EATING_BOWL' ? 0.12 : 0) + this.bellyRoll * 0.65;
    const forceZL = (restZL - this.earL.angleZ) * 42.0 - this.earL.velZ * 6.5 - dHeadYaw * 0.45 + shakeForce;
    this.earL.velZ += forceZL * dt;
    this.earL.angleZ = clamp(this.earL.angleZ + this.earL.velZ * dt, -0.35, 1.05);
    const restXL = -this.headPitch * 0.72 + earBreeze;
    this.earL.velX += ((restXL - this.earL.angleX) * 38.0 - this.earL.velX * 6.2 - dHeadPitch * 0.4) * dt;
    this.earL.angleX = clamp(this.earL.angleX + this.earL.velX * dt, -0.75, 0.75);

    // Right ear
    const restZR = -0.16 + this.headTilt * 0.65 - (this.state === 'EATING_BOWL' ? 0.12 : 0) - this.bellyRoll * 0.65;
    const forceZR = (restZR - this.earR.angleZ) * 42.0 - this.earR.velZ * 6.5 - dHeadYaw * 0.45 - shakeForce;
    this.earR.velZ += forceZR * dt;
    this.earR.angleZ = clamp(this.earR.angleZ + this.earR.velZ * dt, -1.05, 0.35);
    const restXR = -this.headPitch * 0.72 - earBreeze;
    this.earR.velX += ((restXR - this.earR.angleX) * 38.0 - this.earR.velX * 6.2 - dHeadPitch * 0.4) * dt;
    this.earR.angleX = clamp(this.earR.angleX + this.earR.velX * dt, -0.75, 0.75);
  }

  // Emit all articulated draw calls for the Cavalier (used in both shadow & main pass!)
  submitDrawCalls(pushDraw) {
    const breath = Math.sin(world.time * 2.6) * 0.006;
    const walkSin = Math.sin(this.walkPhase);
    const walkCos = Math.cos(this.walkPhase);
    const isMoving = this.state === 'WALKING' || this.state === 'PLAYING_BALL' || this.state === 'HAPPY_SPIN';
    const stride = isMoving ? 0.42 : 0.0;

    // Compute root transform
    const mRoot = M4.create();
    const baseHeight = lerp(0.24, 0.185, this.sitAmount);
    const lieHeight = lerp(baseHeight, 0.095, this.lieAmount);
    const tallBoost = this.standTall * 0.11;
    M4.translate(mRoot, mRoot, this.pos[0], this.pos[1] + lieHeight + tallBoost, this.pos[2]);
    M4.rotateY(mRoot, mRoot, this.yaw);

    // Roll onto back/side for Belly Bliss!
    if (this.bellyRoll > 0.001) {
      M4.rotateZ(mRoot, mRoot, this.bellyRoll * 2.55);
      M4.translate(mRoot, mRoot, 0, -this.bellyRoll * 0.03, 0);
    }

    // Torso pitch (sitting angles spine up, eating bows down, standing tall angles steep!)
    const spinePitch = -this.sitAmount * 0.48 - this.standTall * 0.92 + this.stretchBow * 0.36 - this.bodyPitch * 0.42;
    const mTorso = M4.create();
    M4.copy(mTorso, mRoot);
    M4.rotateX(mTorso, mTorso, spinePitch);

    // Cache body center
    V3.transformMat4(this.bodyWorld, [0, 0, 0], mTorso);

    // 1. Torso
    const mTorsoDraw = M4.create();
    M4.scale(mTorsoDraw, mTorso, 1.0 + breath * 1.6, 1.0 + breath * 1.4, 1.0);
    pushDraw(MESH.dogTorso, mTorsoDraw, TEX.fur, [1, 1, 1, 1], [0.72, 0, 0.52, 1.0], 1, 2);

    // 2. Fluffy White Chest Ruff
    const mRuff = M4.create();
    M4.translate(mRuff, mTorso, 0, 0.005, 0.148);
    M4.scale(mRuff, mRuff, 1.0 + breath * 2.0, 1.05, 0.95);
    pushDraw(MESH.dogRuff, mRuff, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.62, 1.0], 1, 6);

    // 3. Neck + Cute Blush Ribbon Collar & Golden Bell -> Head
    const mNeck = M4.create();
    M4.translate(mNeck, mTorso, 0, 0.062, 0.145);
    M4.rotateX(mNeck, mNeck, -spinePitch * 0.55 - 0.18 + this.bodyPitch * 0.52);
    pushDraw(MESH.dogNeck, mNeck, TEX.fur, [1, 1, 1, 1], [0.72, 0, 0.52, 1.0], 1, 6);

    const mCollar = M4.create();
    M4.translate(mCollar, mNeck, 0, 0.005, 0.004);
    M4.rotateX(mCollar, mCollar, 0.25);
    pushDraw(MESH.collar, mCollar, TEX.fabric, [0.92, 0.54, 0.58, 1], [0.62, 0, 0.3, 2.0], 0, 0);

    const mBell = M4.create();
    const bellSwing = Math.sin(world.time * 12.0) * (this.earShake * 0.35 + (isMoving ? 0.2 : 0.03));
    M4.translate(mBell, mCollar, Math.sin(bellSwing) * 0.012, -0.016, 0.088);
    pushDraw(MESH.bell, mBell, TEX.white, [0.96, 0.80, 0.40, 1], [0.16, 0.88, 0, 1], 0, 0);

    const mHead = M4.create();
    M4.translate(mHead, mNeck, 0, 0.072, 0.045);
    M4.rotateY(mHead, mHead, this.headYaw);
    M4.rotateX(mHead, mHead, this.headPitch - spinePitch * 0.35 - this.bodyPitch * 0.25);
    M4.rotateZ(mHead, mHead, this.headTilt);

    // Cache world positions for mouth, head, nose
    V3.transformMat4(this.headWorld, [0, 0.01, 0.02], mHead);
    V3.transformMat4(this.noseWorld, [0, -0.004, 0.162], mHead);
    V3.transformMat4(this.mouthWorld, [0, -0.036, 0.156], mHead);

    // Head main skull + snout
    const sniffScale = 1.0 + Math.sin(world.time * 28.0) * this.sniffPulse * 0.02;
    const mHeadDraw = M4.create();
    M4.scale(mHeadDraw, mHead, 1, 1, sniffScale);
    pushDraw(MESH.dogHead, mHeadDraw, TEX.fur, [1, 1, 1, 1], [0.68, 0, 0.55, 1.0], 1, 1);

    // Glossy Dark Wet Nose
    const mNose = M4.create();
    M4.translate(mNose, mHead, 0, -0.004, 0.156 + this.sniffPulse * 0.003);
    M4.rotateX(mNose, mNose, 0.10 + Math.sin(world.time * 26.0) * this.sniffPulse * 0.08);
    pushDraw(MESH.dogNose, mNose, TEX.white, [0.09, 0.06, 0.05, 1], [0.14, 0.02, 0.0, 1], 3, 11);

    // Lower Jaw
    const mJaw = M4.create();
    M4.translate(mJaw, mHead, 0, -0.036, 0.072);
    M4.rotateX(mJaw, mJaw, 0.06 + this.jawOpen * 0.72);
    M4.translate(mJaw, mJaw, 0, -0.008, 0.034);
    pushDraw(MESH.dogJaw, mJaw, TEX.fur, [0.96, 0.92, 0.87, 1], [0.74, 0, 0.45, 1], 1, 6);

    // Articulated Wet Pink Tongue (4 curved segments!)
    if (this.tongueOut > 0.01 || this.jawOpen > 0.10) {
      const tLen = 0.018 + this.tongueOut * 0.062;
      const mT = M4.create();
      M4.translate(mT, mHead, 0, -0.038, 0.104);
      M4.rotateX(mT, mT, 0.25 + this.jawOpen * 0.25 - this.tongueOut * 0.35);
      for (let seg = 0; seg < 4; seg++) {
        const frac = seg / 3;
        M4.translate(mT, mT, 0, 0, tLen * 0.28);
        // Upward curl at the tip while licking!
        M4.rotateX(mT, mT, -0.18 - this.tongueCurl * 0.34 * frac);
        const mSeg = M4.create();
        const w = lerp(1.0, 0.76, frac);
        M4.scale(mSeg, mT, w, 1.0, 1.0 + this.tongueOut * 0.35);
        pushDraw(MESH.dogTongueSeg, mSeg, TEX.white, [0.94, 0.46, 0.50, 1], [0.14, 0, 0.1, 1], 3, 12);
      }
    }

    // Liquid Realistic Eyes + Expressive Eyelids (Blink + Happy ^_^ Squint)
    for (const side of [-1, 1]) {
      const mEyeSocket = M4.create();
      M4.translate(mEyeSocket, mHead, side * 0.046, 0.017, 0.089);
      M4.rotateY(mEyeSocket, mEyeSocket, side * 0.18);

      const mEye = M4.create();
      M4.copy(mEye, mEyeSocket);
      // Subtle extra eyeball tracking for soulful aliveness!
      M4.rotateY(mEye, mEye, clamp(this.headYaw * 0.18, -0.14, 0.14));
      M4.rotateX(mEye, mEye, clamp(this.headPitch * 0.16, -0.12, 0.12));
      pushDraw(MESH.dogEye, mEye, TEX.white, [1, 1, 1, 1], [0.04, 0, 0, 1], 2, 0);

      // Upper eyelid: negative rotateX opens wide back (-Z), positive sweeps smoothly down over front (+Z)!
      const closeAmt = clamp(this.blink * 0.95 + this.happySquint * 0.42, 0, 1);
      const mLidTop = M4.create();
      M4.copy(mLidTop, mEyeSocket);
      M4.rotateX(mLidTop, mLidTop, lerp(-0.92, 0.36, closeAmt));
      pushDraw(MESH.eyelid, mLidTop, TEX.fur, [0.52, 0.22, 0.09, 1], [0.68, 0, 0.35, 1], 0, 0);

      // Lower smiling cheek-lid: rises up from bottom (+Z) when happy-squinting!
      if (this.happySquint > 0.04) {
        const mLidBot = M4.create();
        M4.copy(mLidBot, mEyeSocket);
        M4.rotateX(mLidBot, mLidBot, Math.PI + lerp(0.88, -0.22, this.happySquint));
        pushDraw(MESH.eyelid, mLidBot, TEX.fur, [0.56, 0.25, 0.11, 1], [0.68, 0, 0.35, 1], 0, 0);
      }
    }

    // Long Wavy Feathered Blenheim Ears (Secondary Spring Physics!)
    for (const side of [-1, 1]) {
      const ear = side < 0 ? this.earL : this.earR;
      const mEar = M4.create();
      M4.translate(mEar, mHead, side * 0.092, 0.042, -0.008);
      M4.rotateY(mEar, mEar, side * 0.14);
      M4.rotateZ(mEar, mEar, ear.angleZ);
      M4.rotateX(mEar, mEar, ear.angleX);
      pushDraw(MESH.dogEar, mEar, TEX.fur, [1, 1, 1, 1], [0.56, 0, 0.65, 1.0], 1, 3);
    }

    // Cute Glossy Paste Smears on Nose / Cheeks!
    for (const sm of this.smears) {
      const mSm = M4.create();
      M4.translate(mSm, mHead, sm.local[0], sm.local[1], sm.local[2]);
      const sc = sm.size / 0.020;
      M4.scale(mSm, mSm, sc, sc * 0.72, sc * 0.85);
      pushDraw(MESH.pasteBlob, mSm, TEX.white, [sm.col[0], sm.col[1], sm.col[2], 1], [0.12, 0, 0, 1], 3, 10);
    }

    // 4. Articulated Front Legs & Plush Paws (remember: negative rotateX swings leg FORWARD +Z!)
    for (const side of [-1, 1]) {
      const phase = side < 0 ? walkSin : -walkSin;
      const mSh = M4.create();
      M4.translate(mSh, mTorso, side * 0.072, -0.032, 0.118);
      let upperAng = -spinePitch * 0.85 + phase * stride;
      let lowerAng = Math.max(0, phase * stride * 0.55);
      if (this.standTall > 0.05) {
        // Cute bent begging front paws lifted in front of chest!
        upperAng = lerp(upperAng, -0.68 + Math.sin(world.time * 9.0 + side) * 0.12, this.standTall);
        lowerAng = lerp(lowerAng, 1.25, this.standTall);
      }
      if (this.lieAmount > 0.05) {
        // Stretched cozy forward when curled, or relaxed up during belly bliss!
        upperAng = lerp(upperAng, -1.18 + this.bellyRoll * 0.55, this.lieAmount);
        lowerAng = lerp(lowerAng, 0.28 + this.bellyRoll * 0.85, this.lieAmount);
      }
      if (this.stretchBow > 0.05) {
        // Adorable play-bow front paws stretched forward!
        upperAng = lerp(upperAng, -1.02, this.stretchBow);
        lowerAng = lerp(lowerAng, 0.18, this.stretchBow);
      }
      M4.rotateX(mSh, mSh, upperAng);
      pushDraw(MESH.dogLegUpper, mSh, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.48, 1], 1, 5);

      const mLo = M4.create();
      M4.translate(mLo, mSh, 0, -0.105, 0);
      M4.rotateX(mLo, mLo, lowerAng);
      pushDraw(MESH.dogLegLower, mLo, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.48, 1], 1, 5);

      const mPaw = M4.create();
      M4.translate(mPaw, mLo, 0, -0.095, 0.014);
      M4.rotateX(mPaw, mPaw, -(upperAng + lowerAng + spinePitch) * (1 - this.standTall) * (1 - this.bellyRoll));
      pushDraw(MESH.dogPaw, mPaw, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.45, 1], 1, 6);
    }

    // 5. Articulated Hind Legs & Plush Paws (with adorable belly-rub kick!)
    for (const side of [-1, 1]) {
      const phase = side < 0 ? -walkSin : walkSin;
      const mHip = M4.create();
      M4.translate(mHip, mTorso, side * 0.075, -0.025, -0.128);
      const kick = (side > 0 && this.bellyKick > 0.01) ? Math.sin(world.time * 22.0) * 0.42 * this.bellyKick : 0;
      let upperAng = -spinePitch * 0.75 + 0.12 + phase * stride;
      let lowerAng = -0.22 - Math.max(0, -phase * stride * 0.45);
      if (this.sitAmount > 0.02) {
        // Seated tucked thighs forward (-X) and shins tucked neatly!
        upperAng = lerp(upperAng, -1.16, this.sitAmount);
        lowerAng = lerp(lowerAng, 0.78, this.sitAmount);
      }
      if (this.lieAmount > 0.02) {
        upperAng = lerp(upperAng, -1.05 + this.bellyRoll * 0.62 + kick, this.lieAmount);
        lowerAng = lerp(lowerAng, 0.85 - kick * 0.65, this.lieAmount);
      }
      M4.rotateX(mHip, mHip, upperAng);
      M4.rotateZ(mHip, mHip, side * (this.sitAmount * 0.18 + this.bellyRoll * 0.34));
      pushDraw(MESH.dogLegUpper, mHip, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.48, 1], 1, 5);

      const mLo = M4.create();
      M4.translate(mLo, mHip, 0, -0.105, 0);
      M4.rotateX(mLo, mLo, lowerAng);
      pushDraw(MESH.dogLegLower, mLo, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.48, 1], 1, 5);

      const mPaw = M4.create();
      M4.translate(mPaw, mLo, 0, -0.095, 0.014);
      M4.rotateX(mPaw, mPaw, -(upperAng + lowerAng + spinePitch) * (1 - this.bellyRoll));
      pushDraw(MESH.dogPaw, mPaw, TEX.fur, [1, 1, 1, 1], [0.74, 0, 0.45, 1], 1, 6);
    }

    // 6. Articulated Plumed Tail (4 Wave-Propagating Segments!)
    const mTail = M4.create();
    M4.translate(mTail, mTorso, 0, 0.045, -0.185);
    M4.rotateX(mTail, mTail, -0.55 + this.sitAmount * 0.35);
    for (let s = 0; s < 4; s++) {
      const wag = Math.sin(this.tailPhase - s * 0.52) * this.tailAmp * (0.65 + s * 0.32);
      M4.rotateZ(mTail, mTail, wag * 0.55);
      M4.rotateX(mTail, mTail, 0.18);
      const mTSeg = M4.create();
      const plumeScale = 1.0 + Math.sin((s / 3) * Math.PI * 0.85) * 0.45;
      M4.scale(mTSeg, mTail, plumeScale * 0.88, 1.0, plumeScale);
      pushDraw(MESH.dogTailSeg, mTSeg, TEX.fur, [1, 1, 1, 1], [0.70, 0, 0.65, 1], 1, 4);
      M4.translate(mTail, mTail, 0, 0.062, 0);
    }
  }
}

const dog = new CavalierDog();

// ============================================================================
// 10. CAMERA, RAYCASTING & TACTILE POINTER INTERACTION (Tap & Drag Only!)
// ============================================================================
const cam = {
  pos: V3.create(0.0, 0.72, 1.38),
  target: V3.create(0.0, 0.24, -0.05),
  fov: 38 * Math.PI / 180,
  proj: M4.create(),
  view: M4.create(),
  vp: M4.create(),
  invVP: M4.create()
};

function updateCamera(dt) {
  const aspect = canvas.width / Math.max(1, canvas.height);
  // Gracefully widen distance on portrait phones/tablets so the entire tray + dog + window fit cleanly!
  const portraitPad = aspect < 1.05 ? (1.05 - aspect) * 0.95 : 0;
  const baseZ = 1.38 + portraitPad * 0.95;
  const baseY = 0.72 + portraitPad * 0.34;
  cam.fov = (aspect < 0.85 ? 43 : 38) * Math.PI / 180;

  world.camOffset[0] = damp(world.camOffset[0], world.camOffsetTarget[0], 4.5, dt);
  world.camOffset[1] = damp(world.camOffset[1], world.camOffsetTarget[1], 4.5, dt);
  // Gentle automatic return to ideal warm framing
  if (!dragState.active || dragState.type !== 'bg') {
    world.camOffsetTarget[0] = damp(world.camOffsetTarget[0], 0, 1.2, dt);
    world.camOffsetTarget[1] = damp(world.camOffsetTarget[1], 0, 1.2, dt);
  }

  // Subtle living breath sway
  const bx = Math.sin(world.time * 0.35) * 0.012;
  const by = Math.cos(world.time * 0.45) * 0.008;

  V3.set(cam.pos, world.camOffset[0] + bx, baseY + world.camOffset[1] + by, baseZ);
  V3.set(cam.target, 0.0, 0.24 - portraitPad * 0.04, -0.02);

  M4.perspective(cam.proj, cam.fov, aspect, 0.08, 14.0);
  M4.lookAt(cam.view, cam.pos, cam.target, [0, 1, 0]);
  M4.mul(cam.vp, cam.proj, cam.view);
  M4.invert(cam.invVP, cam.vp);
}

function screenToRay(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
  const near = V3.transformMat4(V3.create(), [nx, ny, -1], cam.invVP);
  const far = V3.transformMat4(V3.create(), [nx, ny, 1], cam.invVP);
  const dir = V3.norm(V3.create(), V3.sub(V3.create(), far, near));
  return { orig: near, dir };
}

function raySphereHit(ray, center, radius) {
  const oc = V3.sub(V3.create(), ray.orig, center);
  const b = V3.dot(oc, ray.dir);
  const c = V3.dot(oc, oc) - radius * radius;
  const disc = b * b - c;
  if (disc < 0) return -1;
  const t = -b - Math.sqrt(disc);
  return t > 0 ? t : -1;
}

function rayPlaneZ(ray, planeZ) {
  if (Math.abs(ray.dir[2]) < 0.0001) return null;
  const t = (planeZ - ray.orig[2]) / ray.dir[2];
  if (t <= 0) return null;
  return [ray.orig[0] + ray.dir[0] * t, ray.orig[1] + ray.dir[1] * t, planeZ];
}

function rayPlaneY(ray, planeY) {
  if (Math.abs(ray.dir[1]) < 0.0001) return null;
  const t = (planeY - ray.orig[1]) / ray.dir[1];
  if (t <= 0) return null;
  return [ray.orig[0] + ray.dir[0] * t, planeY, ray.orig[2] + ray.dir[2] * t];
}

function refillPouches() {
  let didAny = false;
  for (const p of pouches) {
    if (p.fill < 0.92 || p.open) {
      p.fill = 1.0;
      p.open = false;
      p.openAnim = 0;
      p.popBounce = 1.0;
      didAny = true;
    }
  }
  if (!didAny) {
    pouches.forEach(p => { p.popBounce = 0.6; });
  }
  audio.playPouchOpen();
  audio.playChime(-1);
  spawnSparkle(0.35, 0.18, 0.40, [1.0, 0.95, 0.78], 10, 0.25);
}

const dragState = {
  active: false,
  pointerId: null,
  type: null,      // 'pouch', 'spoon', 'cloth', 'ball', 'dog', 'bg'
  item: null,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  movedDist: 0,
  squeezeAccum: 0,
  petAccum: 0,
  wipeAccum: 0
};

function pickTarget(ray) {
  const hits = [];
  const test = (type, item, center, r, priority = 0) => {
    const t = raySphereHit(ray, center, r);
    if (t > 0) hits.push({ type, item, t: t - priority * 0.12 });
  };

  // Generous hit volumes for 5-year-old fingers!
  for (const p of pouches) test('pouch', p, p.pos, 0.085, 2.0);
  test('spoon', spoon, spoon.pos, 0.085, 2.0);
  test('cloth', cloth, cloth.pos, 0.095, 1.8);
  test('ball', ball, ball.pos, 0.095, 1.8);
  test('basket', null, [BASKET_POS[0], BASKET_POS[1] + 0.08, BASKET_POS[2]], 0.16, 1.2);
  test('foodBowl', null, [FOOD_BOWL_POS[0], FOOD_BOWL_POS[1] + 0.04, FOOD_BOWL_POS[2]], 0.13, 1.0);
  test('waterBowl', null, [WATER_BOWL_POS[0], WATER_BOWL_POS[1] + 0.04, WATER_BOWL_POS[2]], 0.12, 1.0);

  // Dog head & body
  test('dog', 'head', dog.headWorld, 0.165, 1.5);
  test('dog', 'body', dog.bodyWorld, 0.21, 1.2);

  // Potted Sunlit Houseplant & Flower Prism Vase on Windowsill
  test('plant', null, [0.46, 0.62, -1.46], 0.20, 0.5);
  test('vase', null, [-0.88, 0.52, -1.48], 0.16, 0.5);

  // Curtains left & right of window
  test('curtain', -1, [-1.18, 0.95, -1.48], 0.34, 0.3);
  test('curtain', 1, [0.64, 0.95, -1.48], 0.34, 0.3);

  // Sunlit Post-Rain Window
  const wp = rayPlaneZ(ray, -1.58);
  if (wp && wp[0] > -1.05 && wp[0] < 0.55 && wp[1] > 0.35 && wp[1] < 1.65) {
    hits.push({ type: 'window', item: wp, t: 3.5 });
  }

  hits.sort((a, b) => a.t - b.t);
  return hits[0] || null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audio.unlock();
  world.idleTimer = 0;

  const ray = screenToRay(e.clientX, e.clientY);
  const hit = pickTarget(ray);

  dragState.active = true;
  dragState.pointerId = e.pointerId;
  dragState.startX = dragState.lastX = e.clientX;
  dragState.startY = dragState.lastY = e.clientY;
  dragState.movedDist = 0;
  dragState.squeezeAccum = 0;
  dragState.petAccum = 0;
  dragState.wipeAccum = 0;
  canvas.setPointerCapture(e.pointerId);

  if (!hit) {
    dragState.type = 'bg';
    dragState.item = null;
    return;
  }

  if (hit.type === 'pouch') {
    const p = hit.item;
    if (p.fill <= 0.02) {
      refillPouches();
      dragState.type = 'bg';
      return;
    }
    if (!p.open) {
      p.open = true;
      p.popBounce = 0.85;
      audio.playPouchOpen();
      spawnSparkle(p.pos[0], p.pos[1] + 0.08, p.pos[2], p.flavor.accent, 6, 0.07);
    }
    dog.wakeUpNow();
    dragState.type = 'pouch';
    dragState.item = p;
    canvas.classList.add('grabbing');
  } else if (hit.type === 'spoon') {
    dog.wakeUpNow();
    dragState.type = 'spoon';
    dragState.item = spoon;
    audio.playCeramicClink();
    canvas.classList.add('grabbing');
  } else if (hit.type === 'cloth') {
    dragState.type = 'cloth';
    dragState.item = cloth;
    audio.playWipe();
    canvas.classList.add('grabbing');
  } else if (hit.type === 'ball') {
    dog.wakeUpNow();
    dragState.type = 'ball';
    dragState.item = ball;
    audio.playBallBounce(true);
    canvas.classList.add('grabbing');
  } else if (hit.type === 'dog') {
    dragState.type = 'dog';
    dragState.item = hit.item;
    if (dog.state === 'SLEEPING') {
      dog.wakeUpNow();
      audio.playYip();
    } else if (dog.state === 'BELLY_BLISS') {
      dog.bellyKick = 1.0;
      dog.happySquint = 1.0;
      audio.playSigh();
      spawnSparkle(dog.bodyWorld[0], dog.bodyWorld[1] + 0.08, dog.bodyWorld[2], [1.0, 0.94, 0.72], 5, 0.16);
    } else {
      dog.happySquint = 0.95;
      dog.petGlow = 1.0;
      dog.headTiltTarget = (Math.random() > 0.5 ? 1 : -1) * 0.24;
      dog.tailSpeed = 13.5;
      audio.playSigh();
      spawnSparkle(dog.headWorld[0], dog.headWorld[1] + 0.08, dog.headWorld[2], [1.0, 0.94, 0.74], 5, 0.12);
    }
  } else if (hit.type === 'basket') {
    refillPouches();
    dragState.type = null;
  } else if (hit.type === 'waterBowl') {
    spawnWaterRipple((Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.04, 1.15);
    audio.playWaterPlink();
    spawnSparkle(WATER_BOWL_POS[0], WATER_BOWL_POS[1] + 0.06, WATER_BOWL_POS[2], [0.82, 0.95, 1.0], 5, 0.08);
    dragState.type = null;
  } else if (hit.type === 'foodBowl') {
    audio.playCeramicClink();
    if (bowlBlobs.length > 0 && dog.state !== 'EATING_BOWL') {
      dog.wakeUpNow();
    }
    dragState.type = null;
  } else if (hit.type === 'window') {
    world.rainSlideBoost = 1.0;
    world.rainbowStrength = Math.min(1.0, world.rainbowStrength + 0.18);
    audio.playWaterPlink();
    audio.playChime(-1);
    const wp = hit.item;
    spawnSparkle(wp[0], wp[1], wp[2] + 0.08, [0.95, 0.98, 1.0], 8, 0.24);
    dragState.type = null;
  } else if (hit.type === 'curtain') {
    world.curtainBreeze = 0.095;
    audio.playChime(-1);
    dragState.type = null;
  } else if (hit.type === 'plant') {
    world.plantShake = 1.0;
    audio.playWaterPlink();
    spawnSparkle(0.46, 0.65, -1.42, [0.85, 0.98, 0.88], 6, 0.16);
    dragState.type = null;
  } else if (hit.type === 'vase') {
    world.rainbowStrength = 1.0;
    audio.playChime(1);
    spawnSparkle(-0.88, 0.58, -1.42, [1.0, 0.86, 0.92], 10, 0.18);
    spawnSparkle(0.32, 0.06, 0.10, [0.96, 0.92, 1.0], 8, 0.22);
    dragState.type = null;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragState.active || e.pointerId !== dragState.pointerId) return;
  e.preventDefault();
  world.idleTimer = 0;

  const dx = e.clientX - dragState.lastX;
  const dy = e.clientY - dragState.lastY;
  dragState.lastX = e.clientX;
  dragState.lastY = e.clientY;
  const step = Math.hypot(dx, dy);
  dragState.movedDist += step;

  const ray = screenToRay(e.clientX, e.clientY);

  if (dragState.type === 'pouch' || dragState.type === 'spoon' || dragState.type === 'cloth') {
    // Smart curved 3D workspace plane bridging tray (z=0.38) and dog's muzzle (z~0.14)!
    const rect = canvas.getBoundingClientRect();
    const normY = (e.clientY - rect.top) / rect.height; // 0 top .. 1 bottom
    const planeZ = lerp(0.14, 0.42, smoothstep(0.28, 0.78, normY));
    const pt = rayPlaneZ(ray, planeZ);
    if (pt) {
      const tx = clamp(pt[0], -0.62, 0.62);
      const ty = clamp(pt[1], 0.08, 0.70);
      const tz = clamp(pt[2], 0.08, 0.52);
      const item = dragState.item;
      item.pos[0] = lerp(item.pos[0], tx, 0.45);
      item.pos[1] = lerp(item.pos[1], ty, 0.45);
      item.pos[2] = lerp(item.pos[2], tz, 0.45);

      // Magnetic cozy assist toward bowl or puppy's mouth!
      if (dragState.type === 'pouch' && item.open && item.fill > 0.01) {
        const dBowl = Math.hypot(item.pos[0] - FOOD_BOWL_POS[0], item.pos[2] - FOOD_BOWL_POS[2]);
        const dMouth = V3.dist(item.pos, dog.mouthWorld);
        if (dMouth < 0.24) {
          // Gently nestle nozzle near puppy's mouth
          item.pos[0] = lerp(item.pos[0], dog.mouthWorld[0] + 0.04, 0.14);
          item.pos[1] = lerp(item.pos[1], dog.mouthWorld[1] - 0.03, 0.14);
          item.pos[2] = lerp(item.pos[2], dog.mouthWorld[2] + 0.07, 0.18);
        } else if (dBowl < 0.16 && item.pos[1] < 0.34) {
          // Over the bowl: deposit creamy 3D paste swirls as finger moves!
          dragState.squeezeAccum += step;
          if (dragState.squeezeAccum > 14 && bowlBlobs.length < MAX_BOWL_BLOBS) {
            dragState.squeezeAccum = 0;
            depositBowlPaste(item);
          }
        }
      } else if (dragState.type === 'spoon') {
        const dBowl = Math.hypot(item.pos[0] - FOOD_BOWL_POS[0], item.pos[2] - FOOD_BOWL_POS[2]);
        if (dBowl < 0.15 && item.pos[1] < 0.19 && bowlBlobs.length > 0 && spoon.pasteAmt < 0.95) {
          // Scoop paste right out of the ceramic bowl!
          const top = bowlBlobs[bowlBlobs.length - 1];
          spoon.pasteAmt = Math.min(1.0, spoon.pasteAmt + 0.45);
          // Blend spoon paste color with scooped dollop
          for (let c = 0; c < 3; c++) {
            spoon.pasteCol[c] = lerp(spoon.pasteCol[c], top.color[c], 0.65);
          }
          top.scale -= 0.48;
          if (top.scale <= 0.15) bowlBlobs.pop();
          audio.playCeramicClink();
          audio.playSqueeze();
          spawnSparkle(spoon.pos[0], spoon.pos[1] + 0.03, spoon.pos[2], [1.0, 0.95, 0.80], 4, 0.06);
        }
        // Also allow dipping spoon near an open pouch to load paste directly!
        for (const p of pouches) {
          if (p.open && p.fill > 0.02 && V3.dist(spoon.pos, [p.pos[0], p.pos[1] + 0.06, p.pos[2]]) < 0.11 && spoon.pasteAmt < 0.9) {
            spoon.pasteAmt = 1.0;
            spoon.pasteCol = [...p.flavor.pasteCol];
            p.fill = Math.max(0, p.fill - 0.08);
            p.squeezePulse = 1.0;
            audio.playSqueeze();
          }
        }
      } else if (dragState.type === 'cloth') {
        cloth.wiggle = Math.sin(world.time * 18.0) * 0.15;
        const dNose = V3.dist(cloth.pos, dog.noseWorld);
        if (dNose < 0.22) {
          dragState.wipeAccum += step;
          dog.happySquint = Math.max(dog.happySquint, 0.95);
          if (dragState.wipeAccum > 18) {
            dragState.wipeAccum = 0;
            audio.playWipe();
            dog.wipeSmears(0.0055);
          }
        }
      }
    }
  } else if (dragState.type === 'ball') {
    const pt = rayPlaneY(ray, 0.11);
    if (pt) {
      const nx = clamp(pt[0], -0.82, 0.82);
      const nz = clamp(pt[2], -0.68, 0.35);
      ball.vel[0] = (nx - ball.pos[0]) * 14.0;
      ball.vel[2] = (nz - ball.pos[2]) * 14.0;
      ball.vel[1] = 0.25;
      ball.pos[0] = lerp(ball.pos[0], nx, 0.45);
      ball.pos[1] = 0.11;
      ball.pos[2] = lerp(ball.pos[2], nz, 0.45);
    }
  } else if (dragState.type === 'dog') {
    dragState.petAccum += step;
    dog.happySquint = Math.max(dog.happySquint, 0.95);
    dog.petGlow = 1.0;
    dog.tailSpeed = Math.max(dog.tailSpeed, 13.5);
    if (dog.state === 'BELLY_BLISS') {
      dog.bellyKick = 1.0;
    } else {
      dog.headTiltTarget = clamp((e.clientX - dragState.startX) * 0.004, -0.32, 0.32);
    }
    if (dragState.petAccum > 42) {
      dragState.petAccum = 0;
      world.happiness = clamp(world.happiness + 0.035, 0, 1);
      audio.playSigh();
      const sp = dog.state === 'BELLY_BLISS' ? dog.bodyWorld : dog.headWorld;
      spawnSparkle(sp[0], sp[1] + 0.08, sp[2], [1.0, 0.94, 0.72], 4, 0.14);
    }
  } else if (dragState.type === 'bg') {
    world.camOffsetTarget[0] = clamp(world.camOffsetTarget[0] - dx * 0.0009, -0.24, 0.24);
    world.camOffsetTarget[1] = clamp(world.camOffsetTarget[1] + dy * 0.0006, -0.10, 0.14);
  }
});

function depositBowlPaste(pouch) {
  pouch.fill = Math.max(0, pouch.fill - 0.045);
  pouch.squeezePulse = 1.0;
  const idx = bowlBlobs.length;
  const angle = idx * 1.15;
  const rad = Math.min(0.056, (idx % 10) * 0.0062);
  const layer = Math.floor(idx / 9);
  bowlBlobs.push({
    x: Math.cos(angle) * rad + (Math.random() - 0.5) * 0.012,
    y: 0.024 + layer * 0.014,
    z: Math.sin(angle) * rad + (Math.random() - 0.5) * 0.012,
    scale: 0.82 + Math.random() * 0.35,
    color: [...pouch.flavor.pasteCol],
    flavorIdx: pouch.id
  });
  audio.playSqueeze();
  spawnSparkle(FOOD_BOWL_POS[0], FOOD_BOWL_POS[1] + 0.06, FOOD_BOWL_POS[2], pouch.flavor.accent, 2, 0.06);
}

function endDrag(e) {
  if (!dragState.active || (e.pointerId !== undefined && e.pointerId !== dragState.pointerId)) return;
  canvas.classList.remove('grabbing');

  if (dragState.type === 'ball') {
    // Give the ball a cheerful gentle bounce if tapped without big drag!
    if (dragState.movedDist < 16) {
      ball.vel[0] = (Math.random() - 0.5) * 1.1 + (ball.pos[0] < 0 ? 0.55 : -0.55);
      ball.vel[1] = 1.05;
      ball.vel[2] = -0.35 + (Math.random() - 0.5) * 0.4;
      audio.playBallBounce(true);
    } else {
      ball.vel[1] = Math.max(ball.vel[1], 0.55);
    }
    if (dog.state === 'SITTING' || dog.state === 'WALKING') {
      dog.state = 'PLAYING_BALL';
      dog.stateTimer = 0;
    }
  } else if (dragState.type === 'pouch' && dragState.item && dragState.item.open && dragState.item.fill > 0.01) {
    // If released right over the food bowl, squeeze one extra dollop!
    const p = dragState.item;
    if (Math.hypot(p.pos[0] - FOOD_BOWL_POS[0], p.pos[2] - FOOD_BOWL_POS[2]) < 0.16 && p.pos[1] < 0.32 && bowlBlobs.length < MAX_BOWL_BLOBS) {
      depositBowlPaste(p);
    }
  } else if (dragState.type === 'dog' && dragState.movedDist < 14) {
    // Quick friendly tap on puppy -> happy yip & spin if joyful!
    if (dog.state === 'SITTING' && world.happiness > 0.45 && Math.random() < 0.45) {
      dog.triggerHappySpin();
    } else if (dog.state !== 'SLEEPING' && dog.state !== 'BELLY_BLISS') {
      audio.playYip();
      dog.earShake = 0.7;
    }
  }

  dragState.active = false;
  dragState.type = null;
  dragState.item = null;
  dragState.pointerId = null;
}

canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ============================================================================
// 11. SIMULATION UPDATE LOOP (Physics, Pouches, Paste Ribbon, Sparkles)
// ============================================================================
function updateWorld(dt) {
  world.time += dt;
  world.idleTimer += dt;
  audio.updateAmbient(dt);

  // Decay interactive room effects gently
  world.rainSlideBoost = damp(world.rainSlideBoost, 0, 1.4, dt);
  world.curtainBreeze = damp(world.curtainBreeze, 0.026, 1.2, dt);
  world.plantShake = damp(world.plantShake, 0, 3.2, dt);
  world.rainbowStrength = damp(world.rainbowStrength, 0.16 + world.happiness * 0.84, 0.8, dt);

  // Update Dog AI & Animation
  dog.update(dt, dragState);

  // Update Pouches (smooth spring return home, cap open animation, nozzle paste ribbon!)
  for (const p of pouches) {
    p.openAnim = damp(p.openAnim, p.open ? 1.0 : 0.0, 9.0, dt);
    p.squeezePulse = damp(p.squeezePulse, 0, 8.0, dt);
    p.popBounce = damp(p.popBounce, 0, 6.5, dt);

    const isDragged = dragState.active && dragState.type === 'pouch' && dragState.item === p;
    if (!isDragged) {
      // Gentle bounce animation when idle cue invites attention
      const cueWobble = (world.idleTimer > 4.0 && p.id === 0 && !p.open) ? Math.sin(world.time * 5.0) * 0.05 : 0;
      p.pos[0] = damp(p.pos[0], p.home[0], 9.0, dt);
      p.pos[1] = damp(p.pos[1], p.home[1] + Math.sin(p.popBounce * Math.PI) * 0.055, 9.0, dt);
      p.pos[2] = damp(p.pos[2], p.home[2], 9.0, dt);
      p.rot[0] = damp(p.rot[0], 0.16, 8.0, dt);
      p.rot[1] = damp(p.rot[1], -0.22 - p.id * 0.12, 8.0, dt);
      p.rot[2] = damp(p.rot[2], (p.id - 1) * -0.07 + cueWobble, 8.0, dt);
    } else {
      // Tilt gracefully toward dog's mouth or down toward the ceramic bowl!
      const dBowl = Math.hypot(p.pos[0] - FOOD_BOWL_POS[0], p.pos[2] - FOOD_BOWL_POS[2]);
      const dMouth = V3.dist(p.pos, dog.mouthWorld);
      if (dMouth < 0.28) {
        p.rot[0] = damp(p.rot[0], -0.42, 10.0, dt);
        p.rot[1] = damp(p.rot[1], 0.15, 10.0, dt);
        p.rot[2] = damp(p.rot[2], 0.35, 10.0, dt);
        // Continuous creamy paste bead extrusion from exact nozzle tip toward puppy's tongue!
        if (p.open && p.fill > 0.01 && Math.random() < dt * 20.0) {
          pasteRibbon.push({
            pos: [...p.nozzleWorld],
            vel: [
              (dog.mouthWorld[0] - p.nozzleWorld[0]) * 3.8,
              (dog.mouthWorld[1] - p.nozzleWorld[1]) * 3.8,
              (dog.mouthWorld[2] - p.nozzleWorld[2]) * 3.8
            ],
            col: [...p.flavor.pasteCol],
            r: 0.014,
            age: 0
          });
        }
      } else if (dBowl < 0.18 && p.pos[1] < 0.34) {
        // Tilt cleanly downward over the ceramic bowl to squeeze glossy swirls!
        p.rot[0] = damp(p.rot[0], -2.35, 10.0, dt);
        p.rot[1] = damp(p.rot[1], 0.0, 10.0, dt);
        p.rot[2] = damp(p.rot[2], 0.28, 10.0, dt);
        if (p.open && p.fill > 0.01 && bowlBlobs.length < MAX_BOWL_BLOBS) {
          // Also gently squeeze even if child holds pouch steadily over bowl!
          dragState.squeezeAccum += dt * 26.0;
          if (dragState.squeezeAccum > 14) {
            dragState.squeezeAccum = 0;
            depositBowlPaste(p);
          }
          if (Math.random() < dt * 22.0) {
            pasteRibbon.push({
              pos: [...p.nozzleWorld],
              vel: [(FOOD_BOWL_POS[0] - p.nozzleWorld[0]) * 2.5, -0.32, (FOOD_BOWL_POS[2] - p.nozzleWorld[2]) * 2.5],
              col: [...p.flavor.pasteCol],
              r: 0.014,
              age: 0
            });
          }
        }
      } else {
        p.rot[0] = damp(p.rot[0], 0.05, 8.0, dt);
        p.rot[1] = damp(p.rot[1], 0.0, 8.0, dt);
        p.rot[2] = damp(p.rot[2], 0.10, 8.0, dt);
      }
    }
  }

  // Update Active Paste Ribbon droplets
  for (let i = pasteRibbon.length - 1; i >= 0; i--) {
    const pr = pasteRibbon[i];
    pr.age += dt;
    pr.pos[0] += pr.vel[0] * dt;
    pr.pos[1] += pr.vel[1] * dt;
    pr.pos[2] += pr.vel[2] * dt;
    if (pr.age > 0.22) pasteRibbon.splice(i, 1);
  }

  // Update Spoon
  const spoonDragged = dragState.active && dragState.type === 'spoon';
  if (!spoonDragged) {
    spoon.pos[0] = damp(spoon.pos[0], spoon.home[0], 9.0, dt);
    spoon.pos[1] = damp(spoon.pos[1], spoon.home[1], 9.0, dt);
    spoon.pos[2] = damp(spoon.pos[2], spoon.home[2], 9.0, dt);
    spoon.rot[0] = damp(spoon.rot[0], 0.05, 8.0, dt);
    spoon.rot[1] = damp(spoon.rot[1], 0.52, 8.0, dt);
    spoon.rot[2] = damp(spoon.rot[2], 0.0, 8.0, dt);
  } else {
    spoon.rot[0] = damp(spoon.rot[0], 0.14, 10.0, dt);
    spoon.rot[1] = damp(spoon.rot[1], -0.25, 10.0, dt);
    spoon.rot[2] = damp(spoon.rot[2], 0.05, 10.0, dt);
  }

  // Update Soft Linen Cloth
  const clothDragged = dragState.active && dragState.type === 'cloth';
  if (!clothDragged) {
    cloth.pos[0] = damp(cloth.pos[0], cloth.home[0], 9.0, dt);
    cloth.pos[1] = damp(cloth.pos[1], cloth.home[1], 9.0, dt);
    cloth.pos[2] = damp(cloth.pos[2], cloth.home[2], 9.0, dt);
    cloth.rot[0] = damp(cloth.rot[0], 0, 8.0, dt);
    cloth.rot[1] = damp(cloth.rot[1], 0.18, 8.0, dt);
    cloth.rot[2] = damp(cloth.rot[2], 0, 8.0, dt);
    cloth.wiggle = damp(cloth.wiggle, 0, 8.0, dt);
  } else {
    cloth.rot[0] = damp(cloth.rot[0], 1.15, 10.0, dt);
    cloth.rot[2] = damp(cloth.rot[2], cloth.wiggle, 14.0, dt);
  }

  // Update Plush Ribbon Ball Physics (gentle bounces confined to cozy rug area!)
  const ballDragged = dragState.active && dragState.type === 'ball';
  if (!ballDragged) {
    ball.vel[1] -= 4.2 * dt; // soft playful gravity
    ball.pos[0] += ball.vel[0] * dt;
    ball.pos[1] += ball.vel[1] * dt;
    ball.pos[2] += ball.vel[2] * dt;
    // Floor bounce
    const floorY = ball.radius + 0.012;
    if (ball.pos[1] < floorY) {
      ball.pos[1] = floorY;
      if (Math.abs(ball.vel[1]) > 0.22) {
        ball.vel[1] = -ball.vel[1] * 0.52;
        audio.playBallBounce(false);
      } else {
        ball.vel[1] = 0;
      }
      // Rug rolling friction
      ball.vel[0] *= Math.exp(-3.4 * dt);
      ball.vel[2] *= Math.exp(-3.4 * dt);
    }
    // Keep ball inside cozy living room rug bounds
    if (ball.pos[0] < -0.82) { ball.pos[0] = -0.82; ball.vel[0] = Math.abs(ball.vel[0]) * 0.6; }
    if (ball.pos[0] > 0.78) { ball.pos[0] = 0.78; ball.vel[0] = -Math.abs(ball.vel[0]) * 0.6; }
    if (ball.pos[2] < -0.65) { ball.pos[2] = -0.65; ball.vel[2] = Math.abs(ball.vel[2]) * 0.6; }
    if (ball.pos[2] > 0.24) { ball.pos[2] = 0.24; ball.vel[2] = -Math.abs(ball.vel[2]) * 0.6; }
    // Roll rotation
    ball.rot[0] += ball.vel[2] * dt / ball.radius;
    ball.rot[2] -= ball.vel[0] * dt / ball.radius;
  }

  // Update Sparkle Motes
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const sp = sparkles[i];
    sp.age += dt;
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.z += sp.vz * dt;
    sp.vy *= 0.96;
    if (sp.age >= sp.life) sparkles.splice(i, 1);
  }
}

const drawList = [];
const alphaList = [];

function pushDraw(mesh, model, tex, baseColor, pbr, matMode = 0, furPart = 0, opts = null) {
  const item = {
    mesh, model, tex, baseColor, pbr, matMode, furPart,
    waveAmp: opts && opts.waveAmp ? opts.waveAmp : 0,
    noShadow: !!(opts && opts.noShadow),
    highlight: opts && opts.highlight ? opts.highlight : [0, 0, 0, 0]
  };
  if (opts && opts.alpha) alphaList.push(item);
  else drawList.push(item);
}

  }

  // 14. The Blenheim Cavalier King Charles Spaniel!
  dog.submitDrawCalls(pushDraw);
}

// Sun directional light setup (warm post-rain sun slanting from upper-left!)
const sunDir = V3.norm(V3.create(), [-0.52, 0.82, 0.24]);
const lightProj = M4.ortho(M4.create(), -1.6, 1.6, -1.6, 1.6, 0.2, 7.0);
const lightView = M4.lookAt(M4.create(), [sunDir[0] * 3.0, sunDir[1] * 3.0, sunDir[2] * 3.0], [0, 0.15, 0], [0, 1, 0]);
const lightVP = M4.mul(M4.create(), lightProj, lightView);

function renderFrame() {
  buildSceneDrawLists();

  // --- PASS 1: Soft Shadow Map ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);

  gl.useProgram(shadowProg.prog);
  gl.uniformMatrix4fv(shadowProg.u.uLightVP, false, lightVP);
  for (const d of drawList) {
    if (d.noShadow) continue;
    gl.uniformMatrix4fv(shadowProg.u.uModel, false, d.model);
    gl.bindVertexArray(d.mesh.vao);
    gl.drawElements(gl.TRIANGLES, d.mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  // --- PASS 2: Main Photorealistic PBR Scene ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, usePostFBO ? sceneFBO : null);
  gl.viewport(0, 0, fboW, fboH);
  gl.clearColor(0.88, 0.84, 0.78, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(mainProg.prog);
  gl.uniformMatrix4fv(mainProg.u.uVP, false, cam.vp);
  gl.uniformMatrix4fv(mainProg.u.uLightVP, false, lightVP);
  gl.uniform3fv(mainProg.u.uCamPos, cam.pos);
  gl.uniform3fv(mainProg.u.uSunDir, sunDir);

  // Subtle living post-rain golden warmth progression!
  const warmShift = 0.5 + 0.5 * Math.sin(world.time * 0.04);
  gl.uniform3f(mainProg.u.uSunColor, 1.55 + warmShift * 0.14, 1.38 + warmShift * 0.06, 1.12);
  gl.uniform3f(mainProg.u.uSkyColor, 0.76, 0.86, 0.96);
  gl.uniform3f(mainProg.u.uBounceColor, 0.72, 0.56, 0.42);
  gl.uniform1f(mainProg.u.uTime, world.time);
  gl.uniform1f(mainProg.u.uRainbowStrength, world.rainbowStrength);
  gl.uniform1f(mainProg.u.uRainSlide, world.rainSlideBoost);

  // Upload water ripples
  const flatRipples = new Float32Array(16);
  for (let i = 0; i < 4; i++) flatRipples.set(waterRipples[i], i * 4);
  gl.uniform4fv(mainProg.u.uRipples, flatRipples);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(mainProg.u.uShadowMap, 1);
  gl.uniform1i(mainProg.u.uTex, 0);

  const drawItem = (d) => {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, d.tex);
    gl.uniformMatrix4fv(mainProg.u.uModel, false, d.model);
    gl.uniform4fv(mainProg.u.uBaseColor, d.baseColor);
    gl.uniform4fv(mainProg.u.uPBR, d.pbr);
    gl.uniform1i(mainProg.u.uMatMode, d.matMode);
    gl.uniform1i(mainProg.u.uFurPart, d.furPart);
    gl.uniform1f(mainProg.u.uWaveAmp, d.waveAmp);
    gl.uniform4fv(mainProg.u.uHighlight, d.highlight);
    gl.bindVertexArray(d.mesh.vao);
    gl.drawElements(gl.TRIANGLES, d.mesh.count, gl.UNSIGNED_SHORT, 0);
  };

  // Opaque objects
  for (const d of drawList) drawItem(d);

  // Translucent objects (water surface, sheer curtains)
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  for (const d of alphaList) drawItem(d);

  // --- PASS 3: Volumetric Golden Sunbeams, Floating Dust Motes & Sparkles ---
  gl.useProgram(fxProg.prog);
  gl.uniformMatrix4fv(fxProg.u.uVP, false, cam.vp);
  gl.uniform1f(fxProg.u.uTime, world.time);
  gl.blendFunc(gl.ONE, gl.ONE); // soft additive sunlit glow

  // Diagonal post-rain sunbeam shafts slanting from window into the living room
  gl.uniform1i(fxProg.u.uFxMode, 0);
  const beamAlpha = 0.065 + world.rainbowStrength * 0.045;
  gl.uniform4f(fxProg.u.uColor, 1.0, 0.92, 0.72, beamAlpha);
  for (let i = 0; i < 2; i++) {
    const mb = M4.create();
    M4.translate(mb, mb, -0.35 + i * 0.42, 0.72, -0.68 + i * 0.16);
    M4.rotateY(mb, mb, 0.25);
    M4.rotateZ(mb, mb, -0.44);
    M4.rotateX(mb, mb, 0.34);
    gl.uniformMatrix4fv(fxProg.u.uModel, false, mb);
    gl.bindVertexArray(MESH.sunbeam.vao);
    gl.drawElements(gl.TRIANGLES, MESH.sunbeam.count, gl.UNSIGNED_SHORT, 0);
  }

  // Floating sunlit dust motes + joyful sparkles (billboarded toward camera)
  gl.uniform1i(fxProg.u.uFxMode, 1);
  gl.bindVertexArray(MESH.sparkle.vao);

  const drawBillboard = (x, y, z, size, col, alpha) => {
    const mbb = M4.create();
    M4.translate(mbb, mbb, x, y, z);
    // Align with inverse camera basis
    mbb[0] = cam.view[0] * size; mbb[1] = cam.view[4] * size; mbb[2] = cam.view[8] * size;
    mbb[4] = cam.view[1] * size; mbb[5] = cam.view[5] * size; mbb[6] = cam.view[9] * size;
    mbb[8] = cam.view[2] * size; mbb[9] = cam.view[6] * size; mbb[10] = cam.view[10] * size;
    gl.uniformMatrix4fv(fxProg.u.uModel, false, mbb);
    gl.uniform4f(fxProg.u.uColor, col[0], col[1], col[2], alpha);
    gl.drawElements(gl.TRIANGLES, MESH.sparkle.count, gl.UNSIGNED_SHORT, 0);
  };

  for (const dm of dustMotes) {
    const dx = dm.x + Math.sin(world.time * dm.speed + dm.phase) * 0.08;
    const dy = dm.y + Math.cos(world.time * dm.speed * 0.8 + dm.phase) * 0.06;
    const twinkle = 0.22 + 0.26 * Math.sin(world.time * 1.9 + dm.phase);
    drawBillboard(dx, dy, dm.z, dm.size, [1.0, 0.95, 0.80], twinkle);
  }
  for (const sp of sparkles) {
    const t = sp.age / sp.life;
    const a = Math.sin(t * Math.PI) * 0.95;
    drawBillboard(sp.x, sp.y, sp.z, sp.size * (0.7 + 0.5 * Math.sin(t * Math.PI)), sp.col, a);
  }

  gl.depthMask(true);
  gl.disable(gl.BLEND);

  // --- PASS 4: ACES Filmic Tone Mapping + Warm Sunlit Bloom ---
  if (usePostFBO) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(postProg.prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneColTex);
    gl.uniform1i(postProg.u.uScene, 0);
    gl.uniform2f(postProg.u.uTexelSize, 1.0 / fboW, 1.0 / fboH);
    gl.bindVertexArray(null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

// ============================================================================
// 13. MAIN LOOP
// ============================================================================
let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  resizeRenderTargets();
  updateWorld(dt);
  updateCamera(dt);
  renderFrame();
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
