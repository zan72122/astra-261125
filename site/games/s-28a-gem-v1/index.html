function findInterestingKibble() {
  // Prioritize rolling kibble (so exciting to chase!) or closest kibble on floor/bowl
  let best = null;
  let bestScore = Infinity;
  for (const k of world.kibbles) {
    if (k.onRamp) continue;
    const dist = Math.hypot(k.x - kitten.x, k.z - kitten.z);
    const spd = Math.hypot(k.vx, k.vz);
    const score = dist - (spd > 0.25 ? 0.75 : 0);
    if (score < bestScore) {
      bestScore = score;
      best = k;
    }
  }
  return best;
}

function updateKitten(dt) {
  const k = kitten;
  k.stateTime += dt;
  k.meowCooldown = Math.max(0, k.meowCooldown - dt);
  k.petting = Math.max(0, k.petting - dt * 1.4);

  // Check if any kibble is currently rolling down the ramp (kitten watches it wide-eyed!)
  let rampWatch = null;
  for (const p of world.kibbles) {
    if (p.onRamp) { rampWatch = p; break; }
  }

  // Smooth blinking
  k.blinkTimer -= dt;
  if (k.blinkTimer <= 0) {
    k.blinkTimer = 2.6 + Math.random() * 3.2;
  }
  const blinkWave = k.blinkTimer < 0.16 ? Math.sin((k.blinkTimer / 0.16) * Math.PI) : 0;

  // Occasional cute ear twitch
  if (Math.random() < dt * 0.45) k.earTwitchL = 1.0;
  if (Math.random() < dt * 0.45) k.earTwitchR = 1.0;
  k.earTwitchL = Math.max(0, k.earTwitchL - dt * 6.5);
  k.earTwitchR = Math.max(0, k.earTwitchR - dt * 6.5);

  // Target poses (blended smoothly every frame)
  let tSit = 0, tStretch = 0, tCrouch = 0, tBelly = 0, tNap = 0;
  let tHappyEyes = 0, tPupil = 0.25, tEarPerk = 0.6;
  let tPawL = 0, tPawR = 0, tEatNod = 0, tTongue = 0, tWiggle = 0;
  let lookAtWorld = null;
  let purrWant = 0;

  // Petting override (unless mid-walk)
  if (k.petting > 0.25 && k.state !== 'BELLY_ROLL') {
    purrWant = 0.95;
    tHappyEyes = 0.95;
    tPupil = 0.38;
    tEarPerk = 0.25;
    if (k.state === 'IDLE' || k.state === 'NAP' || k.state === 'GROOM') {
      k.petStroke += dt;
      if (k.petStroke > 1.55 && k.fullness >= 0.35) {
        k.petStroke = 0;
        setKittenState('BELLY_ROLL', 5.2);
        sound.playMeow('chirp');
      }
    }
  } else {
    k.petStroke = Math.max(0, k.petStroke - dt * 0.6);
  }

  // --- STATE MACHINE ---
  if (k.state === 'STRETCH') {
    // Classic morning front-paw stretch!
    const p = smoothstep(0.12, 0.35, k.stateTime / k.stateDur) * (1.0 - smoothstep(0.76, 0.96, k.stateTime / k.stateDur));
    tStretch = p;
    tHappyEyes = p * 0.85;
    tEarPerk = 0.35;
    if (k.stateTime > 0.6 && k.stateTime < 0.7 && k.meowCooldown <= 0) {
      sound.playMeow('stretch');
      k.meowCooldown = 2.0;
    }
    if (k.stateTime >= k.stateDur) {
      // Look eagerly at the bowl & jar to invite the child!
      setKittenState('IDLE', 3.5);
    }
  }
  else if (k.state === 'IDLE') {
    tSit = 1.0;
    tEarPerk = 0.75;

    // Look at most interesting thing: ramp kibble -> prism light -> moving ball -> jar -> pointer -> camera
    const ballSpeed = Math.hypot(world.ball.vx, world.ball.vz);
    if (rampWatch) {
      lookAtWorld = [rampWatch.x, rampWatch.y, rampWatch.z];
      tPupil = 0.42; tEarPerk = 1.0;
    } else if (world.prism.spotActive > 0.3) {
      lookAtWorld = [world.prism.spotX, 0.04, world.prism.spotZ];
      tPupil = 0.43;
      if (k.stateTime > 0.45) {
        k.walkTarget = [world.prism.spotX, world.prism.spotZ];
        k.nextAfterWalk = 'POUNCE_PRISM';
        setKittenState('STALK', 0.85);
      }
    } else if (ballSpeed > 0.35 || world.ball.dragging) {
      lookAtWorld = [world.ball.x, world.ball.y, world.ball.z];
      tPupil = 0.42;
      if (ballSpeed > 0.45 && k.stateTime > 0.25) {
        k.walkTarget = [world.ball.x, world.ball.z];
        k.nextAfterWalk = 'BAT_BALL';
        setKittenState('STALK', 0.75);
      }
    } else {
      const kibb = findInterestingKibble();
      if (kibb) {
        k.targetKibble = kibb;
        const kSpd = Math.hypot(kibb.vx, kibb.vz);
        lookAtWorld = [kibb.x, kibb.y, kibb.z];
        tPupil = 0.40;
        if (k.stateTime > 0.28) {
          if (kSpd > 0.35 && !kibb.inBowl && !kibb.batted) {
            k.walkTarget = [kibb.x, kibb.z];
            k.nextAfterWalk = 'BAT_KIBBLE';
            setKittenState('STALK', 0.72);
          } else {
            k.walkTarget = [kibb.x, kibb.z];
            k.nextAfterWalk = 'EAT';
            setKittenState('WALK', 6.0);
          }
        }
      } else if (k.thirst >= 0.85 && k.stateTime > 0.9) {
        // Thirsty after munching! Go drink water!
        k.walkTarget = [WATER_POS[0] + 0.34, WATER_POS[2] - 0.24];
        k.nextAfterWalk = 'DRINK';
        setKittenState('WALK', 6.0);
      } else if (!world.jarOpen && k.stateTime > 1.2) {
        // Glance cutely between the corked jar and the child
        if (Math.sin(k.stateTime * 1.1) > 0) {
          lookAtWorld = [JAR_POS[0], 0.65, JAR_POS[2]];
        } else {
          lookAtWorld = [0, 1.45, 3.2];
        }
        if (k.stateTime > 4.2 && k.meowCooldown <= 0) {
          sound.playMeow('sweet');
          k.meowCooldown = 7.0;
          world.jarWiggle = 0.7;
          setKittenState('GROOM', 2.8);
        }
      } else if (k.stateTime > k.stateDur) {
        // Choose charming autonomous behavior: groom, nap in sunbeam when full, or stretch!
        if (k.fullness >= 0.75 && Math.random() < 0.55) {
          k.walkTarget = [-0.28, 0.14];
          k.nextAfterWalk = 'NAP';
          setKittenState('WALK', 5.0);
        } else if (Math.random() < 0.55) {
          setKittenState('GROOM', 3.0);
        } else {
          setKittenState('STRETCH', 2.8);
        }
      }
    }
  }
  else if (k.state === 'STALK') {
    // Cute crouch & butt-wiggle before chasing rolling kibble / yarn ball / rainbow spot!
    tCrouch = 1.0;
    tPupil = 0.45;
    tEarPerk = 1.0;
    tWiggle = Math.sin(k.stateTime * 24.0) * smoothstep(0.1, 0.4, k.stateTime);
    if (k.nextAfterWalk === 'BAT_BALL') {
      k.walkTarget = [world.ball.x, world.ball.z];
    } else if (k.nextAfterWalk === 'POUNCE_PRISM') {
      k.walkTarget = [world.prism.spotX, world.prism.spotZ];
    } else if (k.targetKibble && world.kibbles.includes(k.targetKibble)) {
      k.walkTarget = [k.targetKibble.x, k.targetKibble.z];
    }
    if (k.walkTarget) {
      lookAtWorld = [k.walkTarget[0], 0.08, k.walkTarget[1]];
      k.targetYaw = Math.atan2(k.walkTarget[0] - k.x, k.walkTarget[1] - k.z);
    }
    if (k.stateTime >= k.stateDur) {
      if (k.meowCooldown <= 0) {
        sound.playMeow('chirp');
        k.meowCooldown = 3.0;
      }
      setKittenState('WALK', 5.0);
    }
  }
  else if (k.state === 'WALK') {
    // Dynamically track moving target
    if (k.nextAfterWalk === 'EAT' || k.nextAfterWalk === 'BAT_KIBBLE') {
      if (!k.targetKibble || !world.kibbles.includes(k.targetKibble)) {
        k.targetKibble = findInterestingKibble();
      }
      if (k.targetKibble) {
        k.walkTarget = [k.targetKibble.x, k.targetKibble.z];
      } else {
        setKittenState('IDLE', 2.0);
      }
    } else if (k.nextAfterWalk === 'BAT_BALL') {
      k.walkTarget = [world.ball.x, world.ball.z];
    } else if (k.nextAfterWalk === 'POUNCE_PRISM') {
      if (world.prism.spotActive < 0.1) setKittenState('IDLE', 1.8);
      else k.walkTarget = [world.prism.spotX, world.prism.spotZ];
    }

    if (k.walkTarget) {
      let tx = k.walkTarget[0], tz = k.walkTarget[1];
      let stopDist = 0.28;
      if (k.nextAfterWalk === 'EAT' && k.targetKibble && k.targetKibble.inBowl) {
        // Stand neatly at the edge of the flower bowl to eat
        const ang = Math.atan2(k.z - BOWL_POS[2], k.x - BOWL_POS[0]);
        tx = BOWL_POS[0] + Math.cos(ang) * 0.44;
        tz = BOWL_POS[2] + Math.sin(ang) * 0.44;
        stopDist = 0.14;
      } else if (k.nextAfterWalk === 'DRINK') {
        stopDist = 0.12;
      } else if (k.nextAfterWalk === 'BAT_BALL') {
        stopDist = 0.34;
      } else if (k.nextAfterWalk === 'NAP') {
        stopDist = 0.14;
      }

      const dx = tx - k.x;
      const dz = tz - k.z;
      const dist = Math.hypot(dx, dz);
      lookAtWorld = [k.walkTarget[0], 0.1, k.walkTarget[1]];
      tPupil = 0.38;

      if (dist > stopDist) {
        const desiredYaw = Math.atan2(dx, dz);
        k.targetYaw = desiredYaw;
        const playfulFast = (k.nextAfterWalk === 'BAT_BALL' || k.nextAfterWalk === 'BAT_KIBBLE' || k.nextAfterWalk === 'POUNCE_PRISM');
        const maxSpd = playfulFast ? 1.55 : 1.05;
        k.speed = damp(k.speed, Math.min(maxSpd, dist * 2.5 + 0.35), 7, dt);
        const mx = Math.sin(k.yaw) * k.speed * dt;
        const mz = Math.cos(k.yaw) * k.speed * dt;
        k.x = clamp(k.x + mx, -1.78, 1.72);
        k.z = clamp(k.z + mz, -0.82, 1.38);

        // Soft obstacle push-out from jar & bowls
        const pushOut = (ox, oz, minR) => {
          const pdx = k.x - ox, pdz = k.z - oz;
          const pd = Math.hypot(pdx, pdz);
          if (pd < minR && pd > 0.001) {
            k.x = ox + (pdx / pd) * minR;
            k.z = oz + (pdz / pd) * minR;
          }
        };
        pushOut(JAR_POS[0], JAR_POS[2], 0.56);
        pushOut(BOWL_POS[0], BOWL_POS[2], 0.42);
        pushOut(WATER_POS[0], WATER_POS[2], 0.40);

        k.walkPhase += dt * k.speed * 11.5;
        const stepTick = Math.floor(k.walkPhase / Math.PI);
        if (stepTick !== k.stepSoundPrev) {
          k.stepSoundPrev = stepTick;
          sound.playPawStep();
          k.bellVel += (Math.random() - 0.5) * 4.5;
        }
      } else {
        k.speed = 0;
        if (k.nextAfterWalk === 'EAT') {
          if (k.targetKibble) {
            k.targetYaw = Math.atan2(k.targetKibble.x - k.x, k.targetKibble.z - k.z);
          }
          setKittenState('EAT', 1.45);
        } else if (k.nextAfterWalk === 'BAT_KIBBLE') {
          k.pawBatSide = Math.random() < 0.5 ? 1 : -1;
          setKittenState('BAT_KIBBLE', 0.72);
        } else if (k.nextAfterWalk === 'BAT_BALL') {
          k.pawBatSide = Math.random() < 0.5 ? 1 : -1;
          setKittenState('BAT_BALL', 0.75);
        } else if (k.nextAfterWalk === 'POUNCE_PRISM') {
          k.pawBatSide = Math.random() < 0.5 ? 1 : -1;
          setKittenState('POUNCE_PRISM', 0.9);
        } else if (k.nextAfterWalk === 'DRINK') {
          k.targetYaw = Math.atan2(WATER_POS[0] - k.x, WATER_POS[2] - k.z);
          setKittenState('DRINK', 3.1);
        } else if (k.nextAfterWalk === 'NAP') {
          k.targetYaw = 0.4;
          setKittenState('NAP', 11.0);
        } else {
          setKittenState('IDLE', 2.5);
        }
      }
    }
  }
  else if (k.state === 'BAT_KIBBLE') {
    // Adorable playful white-sock paw bat ("ちょいちょい!") on a rolling kibble!
    tSit = 0.4;
    tPupil = 0.44;
    const batCurve = Math.sin(clamp(k.stateTime / 0.55, 0, 1) * Math.PI);
    if (k.pawBatSide > 0) tPawR = batCurve * 1.15; else tPawL = batCurve * 1.15;
    if (k.targetKibble && world.kibbles.includes(k.targetKibble)) {
      lookAtWorld = [k.targetKibble.x, k.targetKibble.y, k.targetKibble.z];
      if (!k.targetKibble.batted && k.stateTime > 0.22) {
        k.targetKibble.batted = true;
        // Gently knock the kibble rolling across the mat!
        const ang = k.yaw + k.pawBatSide * 0.55 + (Math.random() - 0.5) * 0.35;
        k.targetKibble.vx = Math.sin(ang) * 0.82;
        k.targetKibble.vz = Math.cos(ang) * 0.82;
        k.targetKibble.vy = 0.32;
        sound.playKibbleClick('wood', 0.75);
        sound.playBell(0.05);
        k.bellVel += 7.0;
      }
    }
    if (k.stateTime >= k.stateDur) {
      if (k.targetKibble && world.kibbles.includes(k.targetKibble)) {
        k.walkTarget = [k.targetKibble.x, k.targetKibble.z];
        k.nextAfterWalk = 'EAT';
        setKittenState('WALK', 4.5);
      } else {
        setKittenState('IDLE', 2.0);
      }
    }
  }
  else if (k.state === 'BAT_BALL') {
    tPupil = 0.45;
    const batCurve = Math.sin(clamp(k.stateTime / 0.55, 0, 1) * Math.PI);
    if (k.pawBatSide > 0) tPawR = batCurve * 1.2; else tPawL = batCurve * 1.2;
    lookAtWorld = [world.ball.x, world.ball.y, world.ball.z];
    if (k.stateTime > 0.22 && k.stateTime < 0.28) {
      const toCenterAng = Math.atan2(-world.ball.x * 0.5 + (Math.random() - 0.5) * 1.2, 0.35 - world.ball.z);
      world.ball.vx = Math.sin(toCenterAng) * 1.85;
      world.ball.vz = Math.cos(toCenterAng) * 1.85;
      world.ball.vy = 0.45;
      sound.playBell(0.11);
      nudgeKittenJoy(world.ball.x, world.ball.y + 0.1, world.ball.z);
    }
    if (k.stateTime >= k.stateDur) {
      setKittenState('IDLE', 1.8);
    }
  }
  else if (k.state === 'POUNCE_PRISM') {
    // Playfully pats the dancing rainbow sunlight spot on the wooden floor!
    tCrouch = 0.55;
    tPupil = 0.45;
    const pat = Math.abs(Math.sin(k.stateTime * 9.5));
    if (k.pawBatSide > 0) tPawR = pat * 0.95; else tPawL = pat * 0.95;
    lookAtWorld = [world.prism.spotX, 0.02, world.prism.spotZ];
    if (k.stateTime >= k.stateDur) {
      if (world.prism.spotActive > 0.35 && Math.random() < 0.7) {
        k.walkTarget = [world.prism.spotX, world.prism.spotZ];
        k.nextAfterWalk = 'POUNCE_PRISM';
        setKittenState('WALK', 3.0);
      } else {
        setKittenState('IDLE', 2.0);
      }
    }
  }
  else if (k.state === 'EAT') {
    // Super cute eating animation: dips head, crunches "kari-kari", happy crescent eyes, licks lips!
    tHappyEyes = 0.92;
    tPupil = 0.36;
    tEarPerk = 0.38;
    purrWant = 0.35;
    const isLicking = k.stateTime > k.stateDur - 0.38;
    if (!isLicking) {
      tEatNod = 0.85 + Math.sin(k.stateTime * 19.0) * 0.22;
      k.crunchTimer += dt;
      if (k.crunchTimer > 0.34) {
        k.crunchTimer = 0;
        sound.playCrunch();
        // Tiny golden kibble crumbs!
        const cx = k.x + Math.sin(k.yaw) * 0.30;
        const cz = k.z + Math.cos(k.yaw) * 0.30;
        for (let i = 0; i < 3; i++) {
          spawnParticle(
            cx + (Math.random() - 0.5) * 0.06, 0.10, cz + (Math.random() - 0.5) * 0.06,
            (Math.random() - 0.5) * 0.45, 0.45 + Math.random() * 0.35, (Math.random() - 0.5) * 0.45,
            0.42, 0.015, [0.76, 0.48, 0.24], 'crumb'
          );
        }
      }
      // Consume the kibble midway through munching
      if (k.stateTime > 0.65 && k.targetKibble) {
        const idx = world.kibbles.indexOf(k.targetKibble);
        if (idx >= 0) {
          world.kibbles.splice(idx, 1);
          world.eatenCount++;
          k.fullness = Math.min(1.0, k.fullness + 0.11);
          k.thirst = Math.min(1.2, k.thirst + 0.24);
          k.happy = Math.min(1.0, k.happy + 0.14);
          nudgeKittenJoy(k.x + Math.sin(k.yaw) * 0.25, 0.38, k.z + Math.cos(k.yaw) * 0.25);
        }
        k.targetKibble = null;
      }
    } else {
      // Cute pink nose-licking after munching!
      tEatNod = 0.15;
      tTongue = Math.max(0, Math.sin((k.stateTime - (k.stateDur - 0.38)) * 18.0));
    }

    if (k.stateTime >= k.stateDur) {
      // Check if another kibble is right next to her -> keep munching happily!
      const nextK = findInterestingKibble();
      if (nextK && Math.hypot(nextK.x - k.x, nextK.z - k.z) < 0.65 && k.thirst < 1.0) {
        k.targetKibble = nextK;
        k.targetYaw = Math.atan2(nextK.x - k.x, nextK.z - k.z);
        setKittenState('EAT', 1.25);
      } else if (k.thirst >= 0.92) {
        k.walkTarget = [WATER_POS[0] + 0.34, WATER_POS[2] - 0.24];
        k.nextAfterWalk = 'DRINK';
        setKittenState('WALK', 6.0);
      } else {
        if (world.eatenCount % 3 === 0 && k.meowCooldown <= 0) {
          sound.playMeow('happy');
          k.happyHopVel = 1.5;
          k.bellVel += 8.0;
          sound.playBell(0.05);
          k.meowCooldown = 3.2;
        }
        setKittenState('IDLE', 2.4);
      }
    }
  }
  else if (k.state === 'DRINK') {
    // Adorable lapping at the pale aqua water bowl with real ripples!
    tHappyEyes = 0.72;
    tEatNod = 0.78 + Math.sin(k.stateTime * 15.0) * 0.12;
    tTongue = Math.max(0, Math.sin(k.stateTime * 15.0));
    k.lapTimer += dt;
    if (k.lapTimer > 0.36) {
      k.lapTimer = 0;
      sound.playWaterDrop(true);
      addRipple(WATER_POS[0] + (Math.random() - 0.5) * 0.06, WATER_POS[2] + (Math.random() - 0.5) * 0.06, 0.65);
    }
    if (k.stateTime >= k.stateDur) {
      k.thirst = 0;
      nudgeKittenJoy(k.x, 0.38, k.z);
      setKittenState('GROOM', 2.5);
    }
  }
  else if (k.state === 'GROOM') {
    // Sits nicely, licks white-sock paw and washes her cheek!
    tSit = 1.0;
    tHappyEyes = 0.78;
    tEarPerk = 0.45;
    k.groomPhase += dt * 5.6;
    const wave = 0.5 + 0.5 * Math.sin(k.groomPhase);
    tPawR = 0.65 + wave * 0.55;
    tEatNod = 0.28 + wave * 0.22;
    tTongue = Math.max(0, Math.sin(k.groomPhase * 2.0)) * 0.7;
    if (k.stateTime >= k.stateDur || findInterestingKibble()) {
      setKittenState('IDLE', 2.5);
    }
  }
  else if (k.state === 'BELLY_ROLL') {
    // Blissful belly-up roll showing cream tummy & white-sock paws with pink toe beans!
    tBelly = 1.0;
    tHappyEyes = 0.95;
    tPupil = 0.38;
    tEarPerk = 0.3;
    purrWant = 0.92;
    tPawL = 0.4 + 0.35 * Math.sin(k.stateTime * 4.5);
    tPawR = 0.4 + 0.35 * Math.sin(k.stateTime * 4.5 + 1.8);
    if (k.petting > 0.2) {
      k.stateDur = Math.min(k.stateDur + dt * 0.8, 9.0);
    }
    if (k.stateTime >= k.stateDur) {
      setKittenState('IDLE', 2.4);
    }
  }
  else if (k.state === 'NAP') {
    // Cozy sunbeam nap in the golden morning light (wakes right up if you roll kibble or play!)
    tNap = 1.0;
    tHappyEyes = 1.0;
    tEarPerk = 0.2;
    purrWant = 0.55;
    if (findInterestingKibble() || Math.hypot(world.ball.vx, world.ball.vz) > 0.5 || world.prism.spotActive > 0.3 || k.petting > 0.6) {
      sound.playMeow('chirp');
      k.fullness = Math.max(0.2, k.fullness - 0.3);
      setKittenState('STRETCH', 2.2);
    } else if (k.stateTime >= k.stateDur) {
      k.fullness = 0.25;
      setKittenState('STRETCH', 2.5);
    }
  }

  // Smoothly damp all pose channels
  k.yaw = dampAngle(k.yaw, k.targetYaw, 6.2, dt);
  k.sitBlend = damp(k.sitBlend, tSit, 5.5, dt);
  k.stretchBlend = damp(k.stretchBlend, tStretch, 5.0, dt);
  k.crouchBlend = damp(k.crouchBlend, tCrouch, 7.5, dt);
  k.bellyBlend = damp(k.bellyBlend, tBelly, 4.5, dt);
  k.napBlend = damp(k.napBlend, tNap, 3.2, dt);
  k.happyEyes = damp(k.happyEyes, tHappyEyes, 7.5, dt);
  k.blinkClose = Math.max(blinkWave, k.happyEyes * 0.86);
  k.pupilSize = damp(k.pupilSize, tPupil, 5.0, dt);
  k.earPerk = damp(k.earPerk, tEarPerk, 6.0, dt);
  k.pawLiftL = damp(k.pawLiftL, tPawL, 12.0, dt);
  k.pawLiftR = damp(k.pawLiftR, tPawR, 12.0, dt);
  k.eatNod = damp(k.eatNod, tEatNod, 11.0, dt);
  k.tongueOut = damp(k.tongueOut, tTongue, 18.0, dt);
  k.buttWiggle = damp(k.buttWiggle, tWiggle, 14.0, dt);

  // Head look-at & adorable curious head-tilt
  let desiredHeadYaw = 0, desiredHeadPitch = 0, desiredHeadRoll = 0;
  if (!lookAtWorld && world.pointerActive && k.state !== 'NAP' && k.state !== 'EAT') {
    lookAtWorld = world.pointerWorld;
  }
  if (lookAtWorld && k.state !== 'EAT' && k.state !== 'DRINK' && k.state !== 'NAP') {
    const dx = lookAtWorld[0] - k.x;
    const dy = lookAtWorld[1] - 0.42;
    const dz = lookAtWorld[2] - k.z;
    const worldAng = Math.atan2(dx, dz);
    desiredHeadYaw = clamp(wrapAngle(worldAng - k.yaw), -0.82, 0.82);
    const horiz = Math.hypot(dx, dz) + 0.001;
    desiredHeadPitch = clamp(-Math.atan2(dy, horiz), -0.52, 0.55);
    desiredHeadRoll = clamp(desiredHeadYaw * 0.22 + Math.sin(world.time * 0.9) * 0.05, -0.22, 0.22);
  } else if (k.state === 'IDLE') {
    desiredHeadRoll = Math.sin(world.time * 1.1) * 0.09;
  }
  if (k.petting > 0.15) {
    desiredHeadPitch = -0.18; // leans head softly up into petting hand!
    desiredHeadRoll = Math.sin(world.time * 3.5) * 0.14;
  }

  k.headYaw = damp(k.headYaw, desiredHeadYaw, 7.0, dt);
  k.headPitch = damp(k.headPitch, desiredHeadPitch + k.eatNod * 0.72, 9.0, dt);
  k.headRoll = damp(k.headRoll, desiredHeadRoll, 5.5, dt);
  k.gazeX = clamp(k.headYaw * 0.45, -0.28, 0.28);
  k.gazeY = clamp(-k.headPitch * 0.35, -0.25, 0.25);

  // Tail wave, happy hop & collar bell spring physics
  k.tailWag += dt * (k.state === 'STALK' ? 9.0 : (k.happy > 0.6 ? 3.8 : 2.3));
  if (k.happyHop > 0 || k.happyHopVel > 0) {
    k.happyHopVel -= 14.0 * dt;
    k.happyHop += k.happyHopVel * dt;
    if (k.happyHop < 0) { k.happyHop = 0; k.happyHopVel = 0; }
  }
  const bellAcc = -38.0 * k.bellSwing - 4.8 * k.bellVel;
  k.bellVel += bellAcc * dt;
  k.bellSwing += k.bellVel * dt;

  // Send purr level to Web Audio
  sound.purrTarget = purrWant;
}

// ============================================================================
// 8. PHYSICS UPDATE (Rolling Kibble, Ramp Chute, Scoop, Yarn Ball, Prism, Dust)
// ============================================================================
function updateWorld(dt) {
  world.time += dt;
  const targetWarmth = clamp(world.eatenCount / 10, 0, 1);
  world.warmth = damp(world.warmth, targetWarmth, 0.35, dt);

  // Jar lid animation & gentle inviting wiggle while closed
  world.jarOpenAnim = damp(world.jarOpenAnim, world.jarOpen ? 1 : 0, 6.5, dt);
  world.jarWiggle = Math.max(0, world.jarWiggle - dt * 2.2);
  if (!world.jarOpen && Math.sin(world.time * 1.45) > 0.96) {
    world.jarWiggle = Math.max(world.jarWiggle, 0.52);
  }
  const tOpen = world.jarOpenAnim;
  const arcY = Math.sin(tOpen * Math.PI) * 0.38;
  world.lidPos[0] = lerp(JAR_POS[0], JAR_POS[0] + 0.46, tOpen);
  world.lidPos[1] = lerp(0.67, 0.055, tOpen) + arcY + (world.jarOpen ? 0 : Math.sin(world.time * 22) * 0.012 * world.jarWiggle);
  world.lidPos[2] = lerp(JAR_POS[2], JAR_POS[2] + 0.34, tOpen);
  world.lidRot[2] = lerp(0, 0.12, tOpen) + (world.jarOpen ? 0 : Math.sin(world.time * 26) * 0.08 * world.jarWiggle);

  // Auto scoop animation (dip into jar -> lift -> glide to bowl/ramp -> tilt & pour -> return)
  if (world.scoop.autoAnim) {
    const a = world.scoop.autoAnim;
    a.t += dt;
    const p = clamp(a.t / a.dur, 0, 1);
    if (p < 0.28) {
      const u = smoothstep(0, 0.28, p);
      world.scoop.x = lerp(1.15, JAR_POS[0], u);
      world.scoop.y = lerp(0.055, 0.86, u);
      world.scoop.z = lerp(0.72, JAR_POS[2], u);
      world.scoop.tilt = lerp(0, -0.35, u);
    } else if (p < 0.44) {
      const u = smoothstep(0.28, 0.44, p);
      world.scoop.x = JAR_POS[0];
      world.scoop.y = lerp(0.86, 0.56, Math.sin(u * Math.PI));
      world.scoop.z = JAR_POS[2];
      world.scoop.tilt = lerp(-0.35, 0.15, u);
      if (!a.scooped && p > 0.36) {
        a.scooped = true;
        world.scoop.pelletsInScoop = 6;
        sound.playScoopRustle();
      }
    } else if (p < 0.72) {
      const u = smoothstep(0.44, 0.72, p);
      const destY = a.dest === 'ramp' ? 0.96 : 0.52;
      world.scoop.x = lerp(JAR_POS[0], a.tx, u);
      world.scoop.y = lerp(0.86, destY, u) + Math.sin(u * Math.PI) * 0.18;
      world.scoop.z = lerp(JAR_POS[2], a.tz, u);
      world.scoop.tilt = lerp(0.15, 0.0, u);
    } else if (p < 0.84) {
      const u = smoothstep(0.72, 0.84, p);
      world.scoop.tilt = lerp(0.0, -1.15, u);
      if (!a.poured && p > 0.76) {
        a.poured = true;
        world.scoop.pelletsInScoop = 0;
        if (a.dest === 'ramp') {
          dropRampKibble(6);
        } else {
          sound.playScoopRustle();
          for (let i = 0; i < 6; i++) {
            const ang = Math.random() * Math.PI * 2;
            const rad = Math.random() * 0.11;
            spawnKibble(
              a.tx + Math.cos(ang) * rad,
              0.45 + i * 0.035,
              a.tz + Math.sin(ang) * rad,
              (Math.random() - 0.5) * 0.25,
              -0.2,
              (Math.random() - 0.5) * 0.25
            );
          }
        }
      }
    } else {
      const u = smoothstep(0.84, 1.0, p);
      world.scoop.x = lerp(a.tx, 1.15, u);
      world.scoop.y = lerp(0.52, 0.055, u) + Math.sin(u * Math.PI) * 0.12;
      world.scoop.z = lerp(a.tz, 0.72, u);
      world.scoop.tilt = lerp(-1.15, 0, u);
    }
    if (p >= 1) world.scoop.autoAnim = null;
  } else if (!world.scoop.dragging) {
    world.scoop.x = damp(world.scoop.x, 1.15, 6, dt);
    world.scoop.y = damp(world.scoop.y, 0.055, 6, dt);
    world.scoop.z = damp(world.scoop.z, 0.72, 6, dt);
    world.scoop.tilt = damp(world.scoop.tilt, 0, 8, dt);
  }

  // Update Round Dry Food Kibble Physics ("ころころ!")
  for (const p of world.kibbles) {
    p.age += dt;
    if (p === world.dragKibble) continue;

    if (p.onRamp) {
      // Roll smoothly down the curved beechwood chute!
      p.rampVel += 0.92 * dt;
      p.rampT += p.rampVel * dt;
      const pos = evalRampPoint(Math.min(1, p.rampT));
      p.x = pos[0] + p.rampLat;
      p.y = pos[1] + p.r;
      p.z = pos[2];
      p.rx += p.rampVel * dt * 16.0;
      p.rz -= p.rampVel * dt * 12.0;
      if (Math.random() < dt * 7.5) {
        sound.playKibbleClick('ramp', 0.45 + p.rampVel * 0.35);
      }
      if (p.rampT >= 1.0) {
        p.onRamp = false;
        const pEnd = evalRampPoint(1.0);
        const pPrev = evalRampPoint(0.95);
        const dir = V3.norm(V3.create(), [pEnd[0] - pPrev[0], 0.18, pEnd[2] - pPrev[2]]);
        const launch = 1.25 + Math.random() * 0.55;
        p.vx = dir[0] * launch + (Math.random() - 0.5) * 0.38;
        p.vy = 0.42 + Math.random() * 0.25;
        p.vz = dir[2] * launch + (Math.random() - 0.5) * 0.38;
        sound.playKibbleClick('wood', 0.7);
      }
      continue;
    }

    // Gravity & integration
    p.vy -= 9.2 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;

    // Bowl containment & ceramic clatter
    const bdx = p.x - BOWL_POS[0], bdz = p.z - BOWL_POS[2];
    const bDist = Math.hypot(bdx, bdz);
    const insideBowl = bDist < BOWL_R - p.r * 0.6 && p.y < 0.22;
    p.inBowl = insideBowl && p.y < 0.14;

    if (insideBowl) {
      const floorY = 0.036 + Math.pow(bDist / BOWL_R, 2) * 0.055 + p.r;
      if (p.y < floorY) {
        if (Math.abs(p.vy) > 0.35) sound.playKibbleClick('ceramic', Math.min(1, Math.abs(p.vy) * 0.45));
        p.y = floorY;
        p.vy = -p.vy * 0.26;
        p.vx *= Math.pow(0.08, dt);
        p.vz *= Math.pow(0.08, dt);
        // Gentle pull toward bowl center dish
        p.vx -= bdx * 1.1 * dt;
        p.vz -= bdz * 1.1 * dt;
      }
      if (bDist > BOWL_R - 0.055 && p.y < 0.14) {
        const nx = bdx / (bDist || 1), nz = bdz / (bDist || 1);
        p.x = BOWL_POS[0] + nx * (BOWL_R - 0.055);
        p.z = BOWL_POS[2] + nz * (BOWL_R - 0.055);
        const vn = p.vx * nx + p.vz * nz;
        if (vn > 0) {
          p.vx -= 1.45 * vn * nx;
          p.vz -= 1.45 * vn * nz;
          sound.playKibbleClick('ceramic', 0.45);
        }
      }
    } else {
      // Floor / mat height
      const onMat = Math.abs(p.x) < 1.62 && Math.abs(p.z - 0.24) < 1.08;
      const floorY = (onMat ? 0.014 : 0.0) + p.r;
      if (p.y < floorY) {
        if (Math.abs(p.vy) > 0.42) {
          sound.playKibbleClick('wood', Math.min(1, Math.abs(p.vy) * 0.38));
        }
        p.y = floorY;
        p.vy = -p.vy * 0.38;
        if (Math.abs(p.vy) < 0.14) p.vy = 0;
        const fric = onMat ? 0.22 : 0.38;
        p.vx *= Math.pow(fric, dt);
        p.vz *= Math.pow(fric, dt);
      }
      // Outer bowl wall bounce
      if (bDist < BOWL_R + p.r && p.y < 0.15) {
        const nx = bdx / (bDist || 1), nz = bdz / (bDist || 1);
        p.x = BOWL_POS[0] + nx * (BOWL_R + p.r);
        p.z = BOWL_POS[2] + nz * (BOWL_R + p.r);
        p.vx = nx * 0.4; p.vz = nz * 0.4;
        sound.playKibbleClick('ceramic', 0.4);
      }
    }

    // Bounce gently off water bowl & glass jar & play-area edges
    const bounceCyl = (cx, cz, rad, surf) => {
      const dx = p.x - cx, dz = p.z - cz;
      const d = Math.hypot(dx, dz);
      if (d < rad + p.r && p.y < 0.5) {
        const nx = dx / (d || 1), nz = dz / (d || 1);
        p.x = cx + nx * (rad + p.r);
        p.z = cz + nz * (rad + p.r);
        const vn = p.vx * nx + p.vz * nz;
        if (vn < 0) {
          p.vx -= 1.6 * vn * nx;
          p.vz -= 1.6 * vn * nz;
          sound.playKibbleClick(surf, 0.5);
        }
      }
    };
    bounceCyl(WATER_POS[0], WATER_POS[2], WATER_R + 0.02, 'ceramic');
    bounceCyl(JAR_POS[0], JAR_POS[2], JAR_R + 0.02, 'ceramic');

    // Keep within reachable sunlit kitchen area
    if (p.x < -2.1) { p.x = -2.1; p.vx = Math.abs(p.vx) * 0.55; }
    if (p.x >  2.05) { p.x =  2.05; p.vx = -Math.abs(p.vx) * 0.55; }
    if (p.z < -1.15) { p.z = -1.15; p.vz = Math.abs(p.vz) * 0.55; }
    if (p.z >  1.65) { p.z =  1.65; p.vz = -Math.abs(p.vz) * 0.55; }

    // True rolling rotation!
    p.rx += (p.vz / p.r) * dt;
    p.rz -= (p.vx / p.r) * dt;
  }

  // Pairwise soft separation between kibble pellets (especially nice stacking inside the bowl!)
  for (let i = 0; i < world.kibbles.length; i++) {
    const a = world.kibbles[i];
    if (a.onRamp) continue;
    for (let j = i + 1; j < world.kibbles.length; j++) {
      const b = world.kibbles[j];
      if (b.onRamp) continue;
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const d = Math.hypot(dx, dy, dz);
      const minD = (a.r + b.r) * 0.96;
      if (d > 0.0001 && d < minD) {
        const push = (minD - d) * 0.5;
        const nx = dx / d, ny = dy / d, nz = dz / d;
        a.x -= nx * push; a.y = Math.max(a.r, a.y - ny * push * 0.35); a.z -= nz * push;
        b.x += nx * push; b.y = Math.max(b.r, b.y + ny * push * 0.35); b.z += nz * push;
      }
    }
  }

  // Update Yarn Bell Ball physics
  const b = world.ball;
  if (!b.dragging) {
    b.vy -= 8.8 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    const onMat = Math.abs(b.x) < 1.62 && Math.abs(b.z - 0.24) < 1.08;
    const floorY = (onMat ? 0.014 : 0.0) + b.r;
    if (b.y < floorY) {
      if (Math.abs(b.vy) > 0.5) sound.playBell(0.06);
      b.y = floorY;
      b.vy = -b.vy * 0.45;
      if (Math.abs(b.vy) < 0.15) b.vy = 0;
      const fric = onMat ? 0.28 : 0.45;
      b.vx *= Math.pow(fric, dt);
      b.vz *= Math.pow(fric, dt);
    }
    b.rx += (b.vz / b.r) * dt;
    b.rz -= (b.vx / b.r) * dt;

    // Bounce off walls & kitchen obstacles
    if (b.x < -2.1) { b.x = -2.1; b.vx = Math.abs(b.vx) * 0.68; sound.playBell(0.06); }
    if (b.x >  2.05) { b.x =  2.05; b.vx = -Math.abs(b.vx) * 0.68; sound.playBell(0.06); }
    if (b.z < -1.1) { b.z = -1.1; b.vz = Math.abs(b.vz) * 0.68; sound.playBell(0.06); }
    if (b.z >  1.6) { b.z =  1.6; b.vz = -Math.abs(b.vz) * 0.68; sound.playBell(0.06); }

    const ballObst = [[BOWL_POS[0], BOWL_POS[2], BOWL_R + 0.04], [WATER_POS[0], WATER_POS[2], WATER_R + 0.04], [JAR_POS[0], JAR_POS[2], JAR_R + 0.04]];
    for (const [ox, oz, orad] of ballObst) {
      const dx = b.x - ox, dz = b.z - oz;
      const d = Math.hypot(dx, dz);
      if (d < orad + b.r && d > 0.001) {
        const nx = dx / d, nz = dz / d;
        b.x = ox + nx * (orad + b.r);
        b.z = oz + nz * (orad + b.r);
        const vn = b.vx * nx + b.vz * nz;
        if (vn < 0) {
          b.vx -= 1.65 * vn * nx;
          b.vz -= 1.65 * vn * nz;
          sound.playBell(0.07);
        }
      }
    }
  }

  // Update Water Ripples
  for (let i = 0; i < 4; i++) {
    if (world.ripples[i][3] > 0.001) {
      world.ripples[i][2] += dt;
      if (world.ripples[i][2] > 2.4) world.ripples[i][3] = 0;
    }
  }

  // Update Sun-Catcher Prism & Dancing Rainbow Light Spot
  const pr = world.prism;
  const pAcc = -16.0 * pr.swing - 1.6 * pr.swingVel;
  pr.swingVel += pAcc * dt;
  pr.swing += pr.swingVel * dt;
  if (pr.spotTimer > 0) {
    pr.spotTimer -= dt;
    pr.spotActive = damp(pr.spotActive, 1.0, 4.0, dt);
    pr.spotAngle += dt * 1.15;
    pr.spotX = -0.22 + Math.sin(pr.spotAngle * 1.1) * 0.92;
    pr.spotZ = 0.25 + Math.cos(pr.spotAngle * 1.65) * 0.52;
  } else {
    pr.spotActive = damp(pr.spotActive, 0.0, 2.2, dt);
  }

  // Curtain breeze
  world.curtainBoost = Math.max(0, world.curtainBoost - dt * 0.9);
  world.curtainSway = Math.sin(world.time * 1.35) * (0.04 + world.curtainBoost * 0.14);

  // Subtle cozy kettle morning steam wisp on the counter
  if (Math.random() < dt * (1.8 + world.warmth * 2.5)) {
    spawnParticle(
      -0.88 + (Math.random() - 0.5) * 0.08, 2.18, -1.78,
      0.06 + (Math.random() - 0.5) * 0.06, 0.28 + Math.random() * 0.15, 0.03,
      2.2, 0.12 + Math.random() * 0.08, [1.0, 0.98, 0.94], 'steam'
    );
  }

  // Update Particles
  for (let i = world.particles.length - 1; i >= 0; i--) {
    const pt = world.particles[i];
    pt.age += dt;
    if (pt.age >= pt.life) {
      world.particles.splice(i, 1);
      continue;
    }
    if (pt.kind === 'crumb') {
      pt.vy -= 7.5 * dt;
      pt.y = Math.max(0.015, pt.y + pt.vy * dt);
    } else {
      pt.y += pt.vy * dt;
    }
    pt.x += pt.vx * dt;
    pt.z += pt.vz * dt;
  }

  // Update Kitten AI & Animation
  updateKitten(dt);
}

// ============================================================================
// 9. CAMERA & RAYCASTING (Responsive Landscape & Portrait Framing + Touch)
// ============================================================================
const camera = {
  pos: V3.create(0.0, 2.18, 4.32),
  target: V3.create(0.0, 0.50, -0.10),
  fov: 37 * Math.PI / 180,
  aspect: 1,
  view: M4.create(),
  proj: M4.create(),
  viewProj: M4.create(),
  invViewProj: M4.create()
};

function updateCamera(dt) {
  const aspect = canvas.width / Math.max(1, canvas.height);
  camera.aspect = aspect;
  // Pull back cleanly on portrait/narrow screens so jar, ramp, bowls & kitten all fit comfortably!
  const narrow = clamp(1.22 - aspect, 0, 0.72);
  const baseZ = 4.28 + narrow * 2.45;
  const baseY = 2.15 + narrow * 1.10;
  const fovDeg = 37 + narrow * 11;
  camera.fov = fovDeg * Math.PI / 180;

  const swayX = Math.sin(world.time * 0.35) * 0.05 + kitten.x * 0.07;
  const swayY = Math.cos(world.time * 0.28) * 0.025;
  camera.pos[0] = damp(camera.pos[0], swayX, 2.0, dt);
  camera.pos[1] = damp(camera.pos[1], baseY + swayY, 2.0, dt);
  camera.pos[2] = damp(camera.pos[2], baseZ, 2.0, dt);

  camera.target[0] = damp(camera.target[0], kitten.x * 0.14, 2.2, dt);
  camera.target[1] = 0.46;
  camera.target[2] = 0.04;

  M4.lookAt(camera.view, camera.pos, camera.target, [0, 1, 0]);
  M4.perspective(camera.proj, camera.fov, aspect, 0.15, 28.0);
  M4.mul(camera.viewProj, camera.proj, camera.view);
  M4.invert(camera.invViewProj, camera.viewProj);
}

function screenToRay(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
  const pNear = M4.transformPoint(camera.invViewProj, [nx, ny, -1]);
  const pFar  = M4.transformPoint(camera.invViewProj, [nx, ny, 1]);
  const dir = V3.norm(V3.create(), [pFar[0] - pNear[0], pFar[1] - pNear[1], pFar[2] - pNear[2]]);
  return { orig: pNear, dir };
}

function rayPlaneY(ray, yVal = 0) {
  if (Math.abs(ray.dir[1]) < 0.0001) return null;
  const t = (yVal - ray.orig[1]) / ray.dir[1];
  if (t < 0) return null;
  return [ray.orig[0] + ray.dir[0] * t, yVal, ray.orig[2] + ray.dir[2] * t];
}

function raySphereHit(ray, cx, cy, cz, r) {
  const ox = ray.orig[0] - cx, oy = ray.orig[1] - cy, oz = ray.orig[2] - cz;
  const b = ox * ray.dir[0] + oy * ray.dir[1] + oz * ray.dir[2];
  const c = ox * ox + oy * oy + oz * oz - r * r;
  const disc = b * b - c;
  if (disc < 0) return -1;
  const t = -b - Math.sqrt(disc);
  return t > 0 ? t : -1;
}

// ============================================================================
// 10. POINTER INTERACTION (Tap & Drag Only — Tactile, Forgiving, Delightful!)
// ============================================================================
function onPointerDown(e) {
  e.preventDefault();
  sound.unlock();
  canvas.setPointerCapture(e.pointerId);

  const ray = screenToRay(e.clientX, e.clientY);
  const floorPt = rayPlaneY(ray, 0.04) || [0, 0.04, 0.3];
  world.pointerWorld = floorPt;
  world.pointerActive = true;
  world.lastPointerX = e.clientX;
  world.lastPointerY = e.clientY;
  world.pointerDownTime = world.time;
  world.pointerMoved = 0;
  world.dragTarget = null;
  world.dragKibble = null;

  // 1. Check Crystal Sun-Catcher Prism (top-left dangling gem!)
  if (raySphereHit(ray, PRISM_POS[0], PRISM_POS[1], PRISM_POS[2], 0.34) > 0) {
    world.prism.swingVel += 8.5;
    world.prism.spotTimer = 8.5;
    world.curtainBoost = 1.0;
    sound.playPrismChime();
    nudgeKittenJoy(PRISM_POS[0], PRISM_POS[1], PRISM_POS[2]);
    return;
  }

  // 2. Check Kitten (Petting & Tickling!)
  const kitHit = raySphereHit(ray, kitten.x, 0.34, kitten.z, 0.44);
  if (kitHit > 0) {
    world.dragTarget = 'kitten';
    kitten.petting = 1.0;
    if (kitten.meowCooldown <= 0) {
      sound.playMeow(kitten.state === 'BELLY_ROLL' ? 'chirp' : 'happy');
      kitten.meowCooldown = 1.8;
    }
    // Check if tapped near collar bell -> sweet jingle!
    const bellX = kitten.x + Math.sin(kitten.yaw) * 0.20;
    const bellZ = kitten.z + Math.cos(kitten.yaw) * 0.20;
    if (raySphereHit(ray, bellX, 0.36, bellZ, 0.16) > 0) {
      sound.playBell(0.11);
      kitten.bellVel += 12.0;
    }
    nudgeKittenJoy(kitten.x, 0.48, kitten.z);
    return;
  }

  // 3. Check Cork Lid
  if (raySphereHit(ray, world.lidPos[0], world.lidPos[1] + 0.06, world.lidPos[2], 0.28) > 0) {
    if (!world.jarOpen) {
      openJar(true);
    } else {
      world.jarOpen = false;
      sound.playCorkPop(false);
    }
    return;
  }

  // 4. Check Glass Kibble Jar (Tap to open / scoop, OR drag directly from jar to pour!)
  if (raySphereHit(ray, JAR_POS[0], 0.35, JAR_POS[2], 0.38) > 0) {
    if (!world.jarOpen) {
      openJar(true);
      return;
    }
    world.dragTarget = 'scoop';
    world.scoop.autoAnim = null;
    world.scoop.dragging = true;
    world.scoop.pelletsInScoop = 6;
    world.scoop.x = JAR_POS[0];
    world.scoop.y = 0.72;
    world.scoop.z = JAR_POS[2];
    sound.playScoopRustle();
    return;
  }

  // 5. Check Wooden Scoop directly
  if (raySphereHit(ray, world.scoop.x, world.scoop.y + 0.06, world.scoop.z, 0.26) > 0) {
    if (!world.jarOpen) openJar(false);
    world.dragTarget = 'scoop';
    world.scoop.autoAnim = null;
    world.scoop.dragging = true;
    world.scoop.pelletsInScoop = 6;
    sound.playScoopRustle();
    return;
  }

  // 6. Check Wooden Rolling Ramp ("ころころスロープ")
  for (let s = 0; s <= 5; s++) {
    const rp = evalRampPoint(s / 5);
    if (raySphereHit(ray, rp[0], rp[1] + 0.04, rp[2], 0.24) > 0) {
      if (!world.jarOpen) openJar(false);
      dropRampKibble(5);
      return;
    }
  }

  // 7. Check Yarn Bell Toy Ball
  if (raySphereHit(ray, world.ball.x, world.ball.y, world.ball.z, 0.24) > 0) {
    world.dragTarget = 'ball';
    world.ball.dragging = true;
    sound.playBell(0.09);
    return;
  }

  // 8. Check Water Bowl (Create sparkling 3D water ripples!)
  if (raySphereHit(ray, WATER_POS[0], 0.09, WATER_POS[2], WATER_R + 0.05) > 0) {
    world.dragTarget = 'water';
    addRipple(
      clamp(floorPt[0], WATER_POS[0] - 0.16, WATER_POS[0] + 0.16),
      clamp(floorPt[2], WATER_POS[2] - 0.16, WATER_POS[2] + 0.16),
      1.0
    );
    sound.playWaterDrop(false);
    // Invite kitten to come drink or sniff if not eating!
    if (kitten.state === 'IDLE' || kitten.state === 'GROOM') {
      kitten.thirst = Math.max(kitten.thirst, 0.92);
    }
    return;
  }

  // 9. Check Flower Food Bowl
  if (raySphereHit(ray, BOWL_POS[0], 0.08, BOWL_POS[2], BOWL_R + 0.06) > 0) {
    triggerAutoScoop('bowl', BOWL_POS[0], BOWL_POS[2]);
    return;
  }

  // 10. Check Individual Loose Kibble Pellet (Flick/Roll it!)
  let bestK = null, bestD = 0.22;
  for (const p of world.kibbles) {
    if (p.onRamp) continue;
    const d = Math.hypot(p.x - floorPt[0], p.z - floorPt[2]);
    if (d < bestD) { bestD = d; bestK = p; }
  }
  if (bestK) {
    world.dragTarget = 'kibble';
    world.dragKibble = bestK;
    bestK.batted = false;
    sound.playKibbleClick('wood', 0.55);
    return;
  }

  // 11. Tap left sunlit window area -> swish curtain & launch rainbow prism!
  if (ray.dir[0] < -0.35 && ray.dir[1] > -0.1) {
    world.prism.swingVel += 6.5;
    world.prism.spotTimer = 7.5;
    world.curtainBoost = 1.0;
    sound.playPrismChime();
    return;
  }

  // 12. Tap anywhere on the sunlit wooden floor / mat -> Toss & roll a round kibble there!
  world.dragTarget = 'floor';
  if (!world.jarOpen) openJar(false);
  const tx = clamp(floorPt[0], -1.75, 1.70);
  const tz = clamp(floorPt[2], -0.85, 1.45);
  // Launch gently from jar side toward tapped spot so it rolls "ころころ"!
  const sx = lerp(tx, JAR_POS[0], 0.32);
  const sz = lerp(tz, JAR_POS[2], 0.32);
  spawnKibble(sx, 0.36, sz, (tx - sx) * 2.2, 0.55, (tz - sz) * 2.2);
  sound.playKibbleClick('wood', 0.4);
}

function onPointerMove(e) {
  const dxPix = e.clientX - world.lastPointerX;
  const dyPix = e.clientY - world.lastPointerY;
  world.pointerMoved += Math.hypot(dxPix, dyPix);
  world.lastPointerX = e.clientX;
  world.lastPointerY = e.clientY;

  const ray = screenToRay(e.clientX, e.clientY);
  const floorPt = rayPlaneY(ray, 0.06);
  if (floorPt) world.pointerWorld = floorPt;
  world.pointerActive = true;

  if (!world.dragTarget) return;

  if (world.dragTarget === 'kitten') {
    if (Math.hypot(dxPix, dyPix) > 2.0) {
      kitten.petting = 1.0;
      if (Math.random() < 0.25) {
        nudgeKittenJoy(kitten.x, 0.45, kitten.z);
      }
    }
  } else if (world.dragTarget === 'scoop') {
    const pt = rayPlaneY(ray, 0.55);
    if (pt) {
      world.scoop.x = clamp(pt[0], -1.75, 1.85);
      world.scoop.y = 0.55;
      world.scoop.z = clamp(pt[2], -0.85, 1.45);
      world.scoop.tilt = clamp(-dxPix * 0.015, -0.45, 0.45);
      // Refill if dipped back over the open jar!
      if (Math.hypot(world.scoop.x - JAR_POS[0], world.scoop.z - JAR_POS[2]) < 0.35 && world.scoop.pelletsInScoop < 6) {
        world.scoop.pelletsInScoop = 6;
        sound.playScoopRustle();
      }
    }
  } else if (world.dragTarget === 'ball' && floorPt) {
    const nx = clamp(floorPt[0], -2.0, 2.0);
    const nz = clamp(floorPt[2], -1.0, 1.5);
    world.ball.vx = clamp((nx - world.ball.x) * 14, -4.2, 4.2);
    world.ball.vz = clamp((nz - world.ball.z) * 14, -4.2, 4.2);
    world.ball.x = nx;
    world.ball.z = nz;
    world.ball.y = world.ball.r + 0.04;
    if (Math.hypot(dxPix, dyPix) > 10 && Math.random() < 0.25) sound.playBell(0.05);
  } else if (world.dragTarget === 'kibble' && world.dragKibble && floorPt) {
    const p = world.dragKibble;
    const nx = clamp(floorPt[0], -1.9, 1.9);
    const nz = clamp(floorPt[2], -0.95, 1.5);
    p.vx = clamp((nx - p.x) * 16, -3.8, 3.8);
    p.vz = clamp((nz - p.z) * 16, -3.8, 3.8);
    p.x = nx; p.z = nz; p.y = 0.07;
  } else if (world.dragTarget === 'water' && floorPt) {
    if (Math.hypot(dxPix, dyPix) > 8) {
      addRipple(
        clamp(floorPt[0], WATER_POS[0] - 0.16, WATER_POS[0] + 0.16),
        clamp(floorPt[2], WATER_POS[2] - 0.16, WATER_POS[2] + 0.16),
        0.75
      );
      sound.playWaterDrop(true);
    }
  } else if (world.dragTarget === 'floor' && floorPt) {
    // Drag across the sunlit wooden floor to roll a joyful trail of round kibble!
    if (world.time - world.floorTrailTimer > 0.26 && Math.hypot(dxPix, dyPix) > 4) {
      world.floorTrailTimer = world.time;
      const tx = clamp(floorPt[0], -1.75, 1.70);
      const tz = clamp(floorPt[2], -0.85, 1.45);
      spawnKibble(tx, 0.18, tz, clamp(dxPix * 0.08, -1.8, 1.8), 0.25, clamp(dyPix * 0.08, -1.8, 1.8));
      sound.playKibbleClick('wood', 0.42);
    }
  }
}

function onPointerUp(e) {
  const wasTap = world.pointerMoved < 16 && (world.time - world.pointerDownTime) < 0.42;

  if (world.dragTarget === 'scoop') {
    world.scoop.dragging = false;
    if (wasTap) {
      // Quick tap on jar or scoop -> auto-scoop gracefully to bowl or wooden ramp!
      const goRamp = (world.eatenCount % 3 === 2);
      if (goRamp) {
        const rp = evalRampPoint(0.03);
        triggerAutoScoop('ramp', rp[0], rp[2]);
      } else {
        triggerAutoScoop('bowl', BOWL_POS[0], BOWL_POS[2]);
      }
    } else if (world.scoop.pelletsInScoop > 0) {
      // Pour kibble right where the child released the scoop!
      const sx = world.scoop.x, sy = world.scoop.y, sz = world.scoop.z;
      const topRamp = evalRampPoint(0.04);
      if (Math.hypot(sx - topRamp[0], sz - topRamp[2]) < 0.45) {
        dropRampKibble(world.scoop.pelletsInScoop);
      } else {
        sound.playScoopRustle();
        for (let i = 0; i < world.scoop.pelletsInScoop; i++) {
          spawnKibble(
            sx + (Math.random() - 0.5) * 0.12,
            sy - 0.04 + i * 0.03,
            sz + (Math.random() - 0.5) * 0.12,
            (Math.random() - 0.5) * 0.6,
            -0.25,
            (Math.random() - 0.5) * 0.6
          );
        }
      }
      world.scoop.pelletsInScoop = 0;
    }
  } else if (world.dragTarget === 'ball') {
    world.ball.dragging = false;
    if (wasTap) {
      // Friendly tap flicks the yarn ball playfully across the mat toward the kitten!
      const ang = Math.atan2(kitten.x - world.ball.x, kitten.z - world.ball.z) + (Math.random() - 0.5) * 0.5;
      world.ball.vx = Math.sin(ang) * 2.15;
      world.ball.vz = Math.cos(ang) * 2.15;
      world.ball.vy = 0.55;
      sound.playBell(0.11);
    }
  } else if (world.dragTarget === 'kibble' && world.dragKibble) {
    if (wasTap) {
      // Tap a pellet -> roll it playfully across the floor!
      const p = world.dragKibble;
      const ang = Math.atan2(kitten.x - p.x, kitten.z - p.z) + (Math.random() - 0.5) * 0.7;
      p.vx = Math.sin(ang) * 1.45;
      p.vz = Math.cos(ang) * 1.45;
      p.vy = 0.35;
    }
    world.dragKibble = null;
  }

  world.dragTarget = null;
  if (e.pointerType === 'touch') world.pointerActive = false;
}

canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('pointerup', onPointerUp, { passive: true });
window.addEventListener('pointercancel', onPointerUp, { passive: true });

// 11. DRAW QUEUE & HIERARCHICAL KITTEN RENDERER
// ============================================================================
const drawListOpaque = [];
const drawListTrans = [];
const scratchMat = M4.create();
const scratchNorm = new Float32Array(9);
const scratchLightMVP = M4.create();

function queueMesh(mesh, modelMat, opts) {
  const item = {
    mesh,
    model: new Float32Array(modelMat),
    tex: opts.tex || textures.white,
    color: opts.color || [1, 1, 1, 1],
    rough: opts.rough !== undefined ? opts.rough : 0.65,
    metal: opts.metal || 0.0,
    rim: opts.rim || 0.0,
    rimColor: opts.rimColor || [1.0, 0.90, 0.70],
    sss: opts.sss || 0.0,
    texScale: opts.texScale || [1, 1],
    matType: opts.matType || 0,
    extra: opts.extra || [0, 0, 0, 0],
    castShadow: opts.castShadow !== false,
    additive: !!opts.additive,
    noDepthWrite: !!opts.noDepthWrite
  };
  if (opts.transparent) drawListTrans.push(item);
  else drawListOpaque.push(item);
}

function pushTRS(base, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const m = base ? M4.copy(M4.create(), base) : M4.create();
  if (x || y || z) M4.translate(m, x, y, z);
  if (ry) M4.rotY(m, ry);
  if (rx) M4.rotX(m, rx);
  if (rz) M4.rotZ(m, rz);
  if (sx !== 1 || sy !== 1 || sz !== 1) M4.scale(m, sx, sy, sz);
  return m;
}

// Build complete articulated 3D Ginger Tabby White-Socks Kitten into draw queue!
function buildKittenDrawList() {
  const k = kitten;
  const breath = Math.sin(world.time * (k.state === 'NAP' ? 2.1 : 3.4)) * 0.018;
  const furOpts = (part, sockY = 0, extraZ = 0.6) => ({
    matType: 1,
    extra: [part, sockY, extraZ, 0],
    rim: 0.62,
    rimColor: [1.0, 0.87, 0.62],
    sss: part === 4 || part === 6 ? 0.55 : 0.14
  });

  // Root body height & posture from blended states
  const walkBob = Math.abs(Math.sin(k.walkPhase)) * 0.025 * Math.min(1, k.speed);
  const sitDrop = k.sitBlend * 0.04;
  const crouchDrop = k.crouchBlend * 0.10;
  const napDrop = k.napBlend * 0.15;
  const bellyDrop = k.bellyBlend * 0.145;
  const baseY = 0.315 + walkBob + k.happyHop - sitDrop - crouchDrop - napDrop - bellyDrop;

  const pitch =
    -k.sitBlend * 0.34 +
    k.stretchBlend * 0.36 +
    k.crouchBlend * 0.16 +
    k.eatNod * 0.22;
  const roll = k.bellyBlend * Math.PI * 0.94 + k.napBlend * 0.25 + k.buttWiggle * 0.08;

  const root = pushTRS(null, k.x, baseY, k.z, pitch, k.yaw + k.buttWiggle * 0.08, roll);

  // 1. Torso (smooth plump ginger tabby body with cream bib & belly)
  const torsoMat = pushTRS(root, 0, 0, 0, 0, 0, 0, 1.0 + breath + k.napBlend * 0.12, 1.0 + breath * 1.4 - k.napBlend * 0.14, 1.0 + k.stretchBlend * 0.22 - k.sitBlend * 0.10 - k.napBlend * 0.12);
  queueMesh(meshes.kittenTorso, torsoMat, furOpts(0));

  // Fluffy cream chest tuft
  const chestMat = pushTRS(root, 0, -0.02 + k.sitBlend * 0.04, 0.26, 0.2, 0, 0, 0.125, 0.13, 0.11);
  queueMesh(meshes.sphere, chestMat, furOpts(5));

  // 2. Neck & Head Hierarchy
  const headBaseY = 0.175 + k.sitBlend * 0.12 - k.stretchBlend * 0.16 - k.crouchBlend * 0.06 - k.eatNod * 0.12 - k.napBlend * 0.08;
  const headBaseZ = 0.285 + k.stretchBlend * 0.08 - k.sitBlend * 0.04 + k.eatNod * 0.06 - k.napBlend * 0.06;
  const headPivot = pushTRS(
    root,
    k.napBlend * 0.10,
    headBaseY,
    headBaseZ,
    k.headPitch - pitch * 0.72 + k.napBlend * 0.35,
    k.headYaw + k.napBlend * 0.95,
    k.headRoll - roll * 0.32
  );

  queueMesh(meshes.kittenHead, headPivot, furOpts(1));

  // Cute ω-shaped plump white muzzle cheeks & chin
  queueMesh(meshes.sphere, pushTRS(headPivot, -0.044, -0.052, 0.175, 0, 0, 0, 0.054, 0.044, 0.050), furOpts(5));
  queueMesh(meshes.sphere, pushTRS(headPivot,  0.044, -0.052, 0.175, 0, 0, 0, 0.054, 0.044, 0.050), furOpts(5));
  queueMesh(meshes.sphere, pushTRS(headPivot,  0.000, -0.082, 0.162, 0, 0, 0, 0.050, 0.036, 0.044), furOpts(5));

  // Tiny soft pink nose!
  queueMesh(meshes.sphere, pushTRS(headPivot, 0, -0.024, 0.214, 0.15, 0, 0, 0.025, 0.019, 0.020), furOpts(6, 0, 0.30));

  // Cute little pink tongue when licking lips or lapping water!
  if (k.tongueOut > 0.05) {
    const tMat = pushTRS(headPivot, 0, -0.072 - k.tongueOut * 0.015, 0.185 + k.tongueOut * 0.035, 0.45, 0, 0, 0.024, 0.012, 0.036 * k.tongueOut);
    queueMesh(meshes.sphere, tMat, { color: [0.95, 0.56, 0.60, 1], rough: 0.28, sss: 0.4 });
  }

  // Big Expressive Glossy Kitten Eyes + Smooth Blinking Eyelids
  for (const side of [-1, 1]) {
    const ex = side * 0.078, ey = 0.016, ez = 0.164;
    const eyeMat = pushTRS(headPivot, ex, ey, ez, 0, side * 0.14, 0, 0.050, 0.051, 0.046);
    queueMesh(meshes.sphere, eyeMat, {
      matType: 2,
      extra: [k.pupilSize, k.gazeX, k.gazeY, k.happyEyes],
      castShadow: false
    });

    // Upper eyelid slides cleanly over the front of the eyeball on blink / happy squint / nap
    const lidPitch = lerp(-0.48, 1.32, k.blinkClose);
    const lidMat = pushTRS(headPivot, ex, ey + 0.002, ez + 0.002, lidPitch, side * 0.14, 0);
    queueMesh(meshes.kittenEyelid, lidMat, furOpts(7));
  }

  // Cupped Ginger Ears with Soft Sunlit Translucent Pink Inner Ears!
  for (const side of [-1, 1]) {
    const tw = side < 0 ? k.earTwitchL : k.earTwitchR;
    const earTilt = (1.0 - k.earPerk) * 0.34 + tw * 0.28;
    const earBase = pushTRS(headPivot, side * 0.125, 0.132, 0.01, 0.14 - k.earPerk * 0.15, side * 0.22, -side * (0.34 + earTilt));
    queueMesh(meshes.kittenEar, earBase, furOpts(4));
    // Soft pink inner ear
    const innerMat = pushTRS(earBase, 0, 0.012, 0.014, 0, 0, 0, 0.66, 0.72, 0.55);
    queueMesh(meshes.kittenEar, innerMat, furOpts(6, 0, 0.78));
  }

  // Delicate Fine Cream Whiskers (3 per cheek!)
  for (const side of [-1, 1]) {
    for (let w = -1; w <= 1; w++) {
      const wm = pushTRS(headPivot, side * 0.11, -0.048 + w * 0.016, 0.168, w * 0.08, side * 0.18, w * 0.14 * side, 0.12, 0.0032, 0.0032);
      queueMesh(meshes.box, wm, { color: [0.98, 0.96, 0.92, 1], rough: 0.5, castShadow: false });
    }
  }

  // Soft Pastel Coral-Rose Ribbon Collar + Gleaming Gold Bell!
  const collarBase = pushTRS(root, 0, headBaseY - 0.10, headBaseZ - 0.06, 0.45 - pitch * 0.4, k.headYaw * 0.3, 0);
  queueMesh(meshes.cyl, pushTRS(collarBase, 0, 0, 0, 0, 0, 0, 0.132, 0.036, 0.132), {
    color: [0.89, 0.46, 0.48, 1], rough: 0.72, rim: 0.25
  });
  const bellMat = pushTRS(collarBase, Math.sin(k.bellSwing) * 0.025, -0.042, 0.125, 0, 0, k.bellSwing, 0.030, 0.030, 0.030);
  queueMesh(meshes.sphereLow, bellMat, {
    color: [0.96, 0.78, 0.30, 1], rough: 0.18, metal: 0.92
  });

  // 3. Four Articulated Legs with Crisp Snowy-White Socks & Tiny Pink Paw Pads!
  const gait = Math.min(1, k.speed * 1.15);
  const legSpecs = [
    { side: -1, front: true,  phase: 0,             lift: k.pawLiftL },
    { side:  1, front: true,  phase: Math.PI,       lift: k.pawLiftR },
    { side: -1, front: false, phase: Math.PI * 0.9, lift: k.bellyBlend * 0.35 },
    { side:  1, front: false, phase: Math.PI * 1.9, lift: k.bellyBlend * 0.35 }
  ];

  for (const lg of legSpecs) {
    const lx = lg.side * (lg.front ? 0.105 : 0.118);
    const ly = lg.front ? -0.08 : -0.075;
    const lz = lg.front ? 0.185 : -0.205;

    let hipPitch = Math.sin(k.walkPhase + lg.phase) * 0.58 * gait;
    let kneePitch = Math.max(0, -Math.cos(k.walkPhase + lg.phase)) * 0.52 * gait;
    let hipRoll = 0;

    if (lg.front) {
      // Sitting: front legs straight & neat together; Stretch: reach far forward!
      hipPitch += -k.sitBlend * 0.08 - k.stretchBlend * 1.18 - lg.lift * 1.05 - k.napBlend * 0.95;
      kneePitch += k.crouchBlend * 0.45 + lg.lift * 0.55 + k.napBlend * 1.1;
      hipRoll = lg.side * (-k.sitBlend * 0.08 + k.bellyBlend * 0.38);
    } else {
      // Back legs fold neatly under haunches when sitting or napping!
      hipPitch += -k.sitBlend * 0.95 + k.stretchBlend * 0.24 - k.crouchBlend * 0.42 - k.napBlend * 1.05;
      kneePitch += k.sitBlend * 1.15 + k.crouchBlend * 0.65 + k.napBlend * 1.15;
      hipRoll = lg.side * (k.sitBlend * 0.16 + k.bellyBlend * 0.45);
    }

    const upperPivot = pushTRS(root, lx, ly, lz, hipPitch - pitch * (lg.front ? 0.55 : 0.45), 0, hipRoll);
    const upperGeo = pushTRS(upperPivot, 0, -0.075, 0);
    queueMesh(meshes.kittenLegUpper, upperGeo, furOpts(2, -0.18)); // ginger tabby upper leg

    const lowerPivot = pushTRS(upperPivot, 0, -0.135, 0, kneePitch, 0, 0);
    const lowerGeo = pushTRS(lowerPivot, 0, -0.068, 0);
    // Crisp white sock starting right around mid-ankle!
    queueMesh(meshes.kittenLegLower, lowerGeo, furOpts(2, 0.015));

    // Plump Snowy-White Sock Paw!
    const pawPivot = pushTRS(lowerPivot, 0, -0.145, 0.015, -kneePitch * 0.55 - hipPitch * 0.35, 0, 0);
    queueMesh(meshes.kittenPaw, pawPivot, furOpts(5));

    // Adorable Tiny Pink Paw Pads (Nikukyuu!) underneath each white sock!
    queueMesh(meshes.sphereLow, pushTRS(pawPivot, 0, -0.025, 0.01, 0, 0, 0, 0.024, 0.010, 0.022), furOpts(6, 0, 0.45));
    for (const toe of [-1, 0, 1]) {
      queueMesh(meshes.sphereLow, pushTRS(pawPivot, toe * 0.018, -0.023, 0.042 - Math.abs(toe) * 0.008, 0, 0, 0, 0.011, 0.009, 0.012), furOpts(6, 0, 0.45));
    }
  }

  // 4. Fluffy Articulated 6-Segment Ginger-Ringed Tail (with cream tip!)
  let tailMat = pushTRS(root, 0, 0.065, -0.305, 0.35 + k.sitBlend * 0.2 - k.crouchBlend * 0.55 - k.napBlend * 0.4, 0, 0);
  const segCount = 6;
  for (let i = 0; i < segCount; i++) {
    const frac = i / (segCount - 1);
    const curlUp = (k.napBlend > 0.5) ? -0.18 : (0.24 - frac * 0.16 + k.stretchBlend * 0.15);
    const swish = Math.sin(k.tailWag - i * 0.55) * (0.14 + frac * 0.16) + k.napBlend * 0.42;
    tailMat = pushTRS(tailMat, 0, 0, i === 0 ? -0.03 : -0.088, curlUp, swish, 0);
    const taper = lerp(1.0, 0.66, frac);
    const segDraw = pushTRS(tailMat, 0, 0, -0.04, 0, 0, 0, taper, taper, 1.0);
    queueMesh(meshes.kittenTailSeg, segDraw, furOpts(3, frac));
  }
}

  for (let h = 0; h < 7; h++) {
    const a = (h / 7) * 6.28;
    const rad = h === 0 ? 0 : 0.08;
    queueMesh(meshes.sphereLow, pushTRS(null, 0.95 + Math.cos(a) * rad, 2.11 + (h % 2) * 0.05, -2.02 + Math.sin(a) * rad, 0, 0, 0, 0.085, 0.095, 0.085), {
      color: [0.34, 0.56, 0.30, 1], rough: 0.75, sss: 0.35
    });
  }
  // Ceramic morning coffee/milk mug on counter
  queueMesh(meshes.cyl, pushTRS(null, 0.22, 1.88, -1.96, 0, 0, 0, 0.095, 0.22, 0.095), {
    tex: textures.ceramic, color: [0.95, 0.88, 0.84, 1], rough: 0.22
  });

  // Left Wall & Sunlit Morning Window Frame
  queueMesh(meshes.box, pushTRS(null, -3.25, 1.8, -0.2, 0, 0, 0, 0.16, 4.2, 6.2), {
    color: [0.96, 0.93, 0.87, 1], rough: 0.78, castShadow: false
  });
  // Bright glowing morning window pane (warm golden sky glow)
  queueMesh(meshes.box, pushTRS(null, -3.14, 2.15, -0.2, 0, 0, 0, 0.04, 2.2, 2.3), {
    color: [1.35, 1.24, 0.98, 1], matType: 6, extra: [0, 0, 0, 0], castShadow: false
  });
  // White wooden window mullions
  queueMesh(meshes.box, pushTRS(null, -3.09, 2.15, -0.2, 0, 0, 0, 0.06, 2.25, 0.07), { color: [0.98, 0.97, 0.94, 1], rough: 0.5, castShadow: false });
  queueMesh(meshes.box, pushTRS(null, -3.09, 2.15, -0.2, 0, 0, 0, 0.06, 0.07, 2.35), { color: [0.98, 0.97, 0.94, 1], rough: 0.5, castShadow: false });
  // Fluttering sheer cream morning curtain panel (transparent)
  queueMesh(meshes.quadV, pushTRS(null, -2.75 + world.curtainSway * 0.4, 2.0, -1.08, 0, 1.22 + world.curtainSway, 0, 1.15, 2.55, 1), {
    color: [1.0, 0.98, 0.93, 0.48], rough: 0.95, transparent: true, castShadow: false, noDepthWrite: true
  });

  // 4. Hanging Crystal Sun-Catcher Prism (Top-left interactive gem!)
  const pSwing = world.prism.swing;
  // Thin gold thread
  queueMesh(meshes.cyl, pushTRS(null, PRISM_POS[0], PRISM_POS[1] + 0.55, PRISM_POS[2], 0, 0, 0, 0.005, 1.05, 0.005), {
    color: [0.95, 0.84, 0.50, 1], rough: 0.2, metal: 0.8, castShadow: false
  });
  // Faceted crystal prism catching morning sunlight
  const prismMat = pushTRS(null, PRISM_POS[0] + Math.sin(pSwing) * 0.06, PRISM_POS[1], PRISM_POS[2], 0, world.time * 0.65, pSwing * 0.6);
  queueMesh(meshes.prism, prismMat, {
    matType: 3, transparent: true, castShadow: false
  });
  // Soft diamond glint on prism
  const glintPulse = 0.55 + 0.45 * Math.sin(world.time * 3.4);
  queueMesh(meshes.quadV, pushTRS(null, PRISM_POS[0] + Math.sin(pSwing) * 0.06, PRISM_POS[1] + 0.02, PRISM_POS[2] + 0.08, 0, 0, 0, 0.24 * glintPulse, 0.24 * glintPulse, 1), {
    matType: 6, extra: [1, 0, 0, 0], color: [1.0, 0.96, 0.82, 0.62], transparent: true, additive: true, noDepthWrite: true, castShadow: false
  });

  // 5. Handcrafted Beechwood Rolling Kibble Ramp ("ころころスロープ")
  queueMesh(meshes.ramp, M4.create(), {
    tex: textures.beechWood,
    color: [0.97, 0.90, 0.78, 1],
    rough: 0.42
  });
  // Sturdy little wooden legs + inviting wooden start-tray at top of ramp
  const pStart = evalRampPoint(0.0);
  const pTop = evalRampPoint(0.06);
  const pMid = evalRampPoint(0.42);
  queueMesh(meshes.scoopCup, pushTRS(null, pStart[0] - 0.04, pStart[1] - 0.02, pStart[2] - 0.02, 0.22, 0.55, 0, 1.25, 0.85, 1.25), {
    tex: textures.beechWood, color: [0.98, 0.91, 0.78, 1], rough: 0.40
  });
  // Two inviting decorative kibble pellets peeking from the wooden ramp hopper!
  queueMesh(meshes.kibble, pushTRS(null, pStart[0] - 0.05, pStart[1] + 0.035, pStart[2] - 0.01), {
    tex: textures.kibble, color: [0.95, 0.70, 0.46, 1], rough: 0.42
  });
  queueMesh(meshes.kibble, pushTRS(null, pStart[0] + 0.01, pStart[1] + 0.025, pStart[2] - 0.04), {
    tex: textures.kibble, color: [0.88, 0.64, 0.42, 1], rough: 0.42
  });
  queueMesh(meshes.cyl, pushTRS(null, pTop[0], pTop[1] * 0.48, pTop[2], 0, 0, 0, 0.042, pTop[1] * 0.96, 0.042), {
    tex: textures.beechWood, color: [0.90, 0.80, 0.66, 1], rough: 0.48
  });
  queueMesh(meshes.cyl, pushTRS(null, pMid[0], pMid[1] * 0.48, pMid[2], 0, 0, 0, 0.036, pMid[1] * 0.96, 0.036), {
    tex: textures.beechWood, color: [0.90, 0.80, 0.66, 1], rough: 0.48
  });

  // 6. Scalloped Pastel-Blush Ceramic Flower Food Bowl
  queueMesh(meshes.foodBowl, pushTRS(null, BOWL_POS[0], 0.015, BOWL_POS[2]), {
    tex: textures.ceramic,
    color: [0.99, 0.88, 0.86, 1],
    rough: 0.18
  });

  // 7. Pale Aqua Ceramic Water Bowl + Sparkling Rippling Water Surface!
  queueMesh(meshes.waterBowl, pushTRS(null, WATER_POS[0], 0.015, WATER_POS[2]), {
    tex: textures.ceramic,
    color: [0.80, 0.93, 0.94, 1],
    rough: 0.16
  });
  queueMesh(meshes.disk, pushTRS(null, WATER_POS[0], 0.102, WATER_POS[2], 0, 0, 0, 0.258, 1, 0.258), {
    matType: 4,
    transparent: true,
    castShadow: false,
    noDepthWrite: true
  });

  // 8. Glass Kibble Jar (Opaque round kibble pile inside + Cork Lid + Transparent Glass Shell!)
  const jarWig = Math.sin(world.time * 24) * 0.025 * world.jarWiggle;
  for (const jp of world.jarPellets) {
    const pm = pushTRS(null, JAR_POS[0] + jp.x, jp.y, JAR_POS[2] + jp.z, 0, jp.ry, 0, 1.05, 1.05, 1.05);
    queueMesh(meshes.kibble, pm, {
      tex: textures.kibble,
      color: [0.92 * jp.shade, 0.68 * jp.shade, 0.46 * jp.shade, 1],
      rough: 0.48,
      castShadow: false
    });
  }
  // Cork Stopper Lid with Wooden Pull Knob
  queueMesh(meshes.corkLid, pushTRS(null, world.lidPos[0], world.lidPos[1], world.lidPos[2], world.lidRot[0], world.lidRot[1], world.lidRot[2]), {
    tex: textures.cork,
    color: [0.95, 0.86, 0.74, 1],
    rough: 0.84
  });
  // Transparent Glossy Glass Jar (rendered after opaque interior kibble!)
  queueMesh(meshes.glassJar, pushTRS(null, JAR_POS[0], 0.015, JAR_POS[2], 0, 0, jarWig), {
    matType: 3,
    transparent: true,
    castShadow: true,
    noDepthWrite: true
  });

  // 9. Handcrafted Beechwood Kibble Scoop (with round kibble mound inside when scooping!)
  const sc = world.scoop;
  const scMat = pushTRS(null, sc.x, sc.y, sc.z, sc.tilt, sc.yaw, 0);
  queueMesh(meshes.scoopCup, scMat, {
    tex: textures.beechWood, color: [0.96, 0.88, 0.74, 1], rough: 0.42
  });
  queueMesh(meshes.cyl, pushTRS(scMat, 0, 0.06, 0.21, 1.48, 0, 0, 0.022, 0.24, 0.022), {
    tex: textures.beechWood, color: [0.94, 0.84, 0.70, 1], rough: 0.44
  });
  // Visible round kibble sitting inside the scoop!
  for (let i = 0; i < sc.pelletsInScoop; i++) {
    const a = (i / 6) * Math.PI * 2;
    const rad = i === 0 ? 0 : 0.052;
    const km = pushTRS(scMat, Math.cos(a) * rad, 0.065 + (i % 2) * 0.028, Math.sin(a) * rad, i, i * 1.4, 0);
    queueMesh(meshes.kibble, km, {
      tex: textures.kibble, color: [0.92, 0.68, 0.46, 1], rough: 0.45
    });
  }

  // 10. All Active Rolling Round Dry Food Kibble Pellets!
  for (const p of world.kibbles) {
    const km = pushTRS(null, p.x, p.y, p.z, p.rx, p.ry, p.rz);
    queueMesh(meshes.kibble, km, {
      tex: textures.kibble,
      color: [0.95 * p.shade, 0.70 * p.shade, 0.46 * p.shade, 1],
      rough: 0.42,
      rim: 0.18,
      rimColor: [1.0, 0.88, 0.65]
    });
  }

  // 11. Cozy Dusty-Rose & Cream Yarn Toy Ball!
  const bl = world.ball;
  queueMesh(meshes.sphere, pushTRS(null, bl.x, bl.y, bl.z, bl.rx, 0, bl.rz, bl.r, bl.r, bl.r), {
    tex: textures.yarn,
    color: [0.98, 0.88, 0.86, 1],
    rough: 0.90,
    rim: 0.35,
    rimColor: [1.0, 0.90, 0.82]
  });

  // 12. The Star: Ginger Tabby White-Socks Kitten!
  buildKittenDrawList();

  // 13. Dancing Iridescent Rainbow Prism Spot on the Kitchen Floor!
  if (world.prism.spotActive > 0.01) {
    const spM = pushTRS(null, world.prism.spotX, 0.024, world.prism.spotZ, 0, 0, 0, 0.42, 1, 0.42);
    queueMesh(meshes.plane, spM, {
      matType: 6,
      extra: [3, 0, 0, 0],
      color: [1, 1, 1, world.prism.spotActive * 0.72],
      transparent: true,
      additive: true,
      noDepthWrite: true,
      castShadow: false
    });
  }

  // 14. Volumetric Golden Morning Sunbeam Shafts!
  for (let i = 0; i < 3; i++) {
    const sx = -1.65 + i * 0.68;
    const sz = -0.55 + i * 0.42;
    const beamMat = pushTRS(null, sx, 1.38, sz, 0, 0.25, -0.62, 0.85, 3.3, 1);
    queueMesh(meshes.quadV, beamMat, {
      matType: 6,
      extra: [2, 0, 0, 0],
      color: [1.0, 0.93, 0.74, 0.055 + world.warmth * 0.025],
      transparent: true,
      additive: true,
      noDepthWrite: true,
      castShadow: false
    });
  }

  // 15. Drifting Golden Sunlit Dust Motes & Active Particles (Crumbs, Sparkles, Steam)!
  const camYaw = Math.atan2(camera.pos[0], camera.pos[2]);
  for (const dm of world.dustMotes) {
    const mx = dm.x + Math.sin(world.time * dm.speed + dm.phase) * 0.18;
    const my = dm.y + Math.cos(world.time * dm.speed * 0.8 + dm.phase) * 0.14;
    const mz = dm.z + Math.sin(world.time * dm.speed * 0.6 + dm.phase * 1.5) * 0.14;
    const pulse = 0.45 + 0.55 * Math.sin(world.time * 1.8 + dm.phase);
    queueMesh(meshes.quadV, pushTRS(null, mx, my, mz, 0, camYaw, 0, dm.size, dm.size, 1), {
      matType: 6,
      extra: [1, 0, 0, 0],
      color: [1.0, 0.94, 0.76, 0.34 * pulse],
      transparent: true,
      additive: true,
      noDepthWrite: true,
      castShadow: false
    });
  }

  for (const pt of world.particles) {
    const u = pt.age / pt.life;
    if (pt.kind === 'crumb') {
      const s = pt.size * (1.0 - u * 0.6);
      queueMesh(meshes.sphereLow, pushTRS(null, pt.x, pt.y, pt.z, 0, 0, 0, s, s, s), {
        color: [pt.color[0], pt.color[1], pt.color[2], 1], rough: 0.6, castShadow: false
      });
    } else if (pt.kind === 'steam') {
      const s = pt.size * (0.6 + u * 1.6);
      const alpha = Math.sin(u * Math.PI) * 0.15;
      queueMesh(meshes.quadV, pushTRS(null, pt.x, pt.y, pt.z, 0, camYaw, 0, s, s, 1), {
        matType: 6, extra: [1, 0, 0, 0], color: [1.0, 0.97, 0.92, alpha],
        transparent: true, noDepthWrite: true, castShadow: false
      });
    } else {
      const s = pt.size * Math.sin(u * Math.PI);
      queueMesh(meshes.quadV, pushTRS(null, pt.x, pt.y, pt.z, 0, camYaw, 0, s, s, 1), {
        matType: 6, extra: [1, 0, 0, 0], color: [pt.color[0], pt.color[1], pt.color[2], 0.78 * (1 - u)],
        transparent: true, additive: true, noDepthWrite: true, castShadow: false
      });
    }
  }
}

// ============================================================================
// 13. WEBGL2 TWO-PASS RENDERER (Soft Shadow Map + PBR Morning Scene)
// ============================================================================
const lightView = M4.create();
const lightProj = M4.create();
const lightViewProj = M4.create();
const sunDir = V3.norm(V3.create(), [-0.76, 0.62, -0.22]);

function renderFrame() {
  buildSceneDrawList();

  // Gently rise the morning sun slightly as the morning warms up
  V3.norm(sunDir, [-0.76, 0.58 + world.warmth * 0.10, -0.22]);
  const lightEye = [sunDir[0] * 6.5, sunDir[1] * 6.5, sunDir[2] * 6.5];
  M4.lookAt(lightView, lightEye, [0, 0.25, 0.25], [0, 1, 0]);
  M4.ortho(lightProj, -3.4, 3.4, -2.6, 2.8, 1.0, 15.0);
  M4.mul(lightViewProj, lightProj, lightView);

  // --- PASS 1: Directional Shadow Map ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(2.2, 4.0);
  gl.useProgram(shadowProg);

  for (const item of drawListOpaque) {
    if (!item.castShadow) continue;
    M4.mul(scratchLightMVP, lightViewProj, item.model);
    gl.uniformMatrix4fv(shLoc.uLightMVP, false, scratchLightMVP);
    gl.bindVertexArray(item.mesh.vao);
    gl.drawElements(gl.TRIANGLES, item.mesh.count, gl.UNSIGNED_SHORT, 0);
  }
  gl.disable(gl.POLYGON_OFFSET_FILL);

  // --- PASS 2: Main Perspective PBR Pass ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.95, 0.87, 0.75, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(mainProg);
  gl.uniformMatrix4fv(mLoc.uViewProj, false, camera.viewProj);
  gl.uniformMatrix4fv(mLoc.uLightViewProj, false, lightViewProj);
  gl.uniform3fv(mLoc.uCamPos, camera.pos);
  gl.uniform3fv(mLoc.uSunDir, sunDir);
  gl.uniform3f(mLoc.uSunColor, 1.0, 0.89 + world.warmth * 0.05, 0.72 + world.warmth * 0.08);
  gl.uniform3f(mLoc.uSkyColor, 0.76, 0.84, 0.94);
  gl.uniform3f(mLoc.uGroundColor, 0.54, 0.40, 0.28);
  gl.uniform1f(mLoc.uTime, world.time);
  gl.uniform1f(mLoc.uWarmth, world.warmth);

  // Pack 4 water ripples
  const ripFlat = new Float32Array(16);
  for (let i = 0; i < 4; i++) {
    ripFlat[i * 4] = world.ripples[i][0];
    ripFlat[i * 4 + 1] = world.ripples[i][1];
    ripFlat[i * 4 + 2] = world.ripples[i][2];
    ripFlat[i * 4 + 3] = world.ripples[i][3];
  }
  gl.uniform4fv(mLoc.uRipples0, ripFlat);
  gl.uniform4f(mLoc.uPrismSpot, world.prism.spotX, world.prism.spotZ, world.prism.spotActive, world.time);

  // Bind Shadow Map to unit 1
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(mLoc.uShadowMap, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(mLoc.uTex, 0);

  const drawItem = (item) => {
    M4.normalMat3(scratchNorm, item.model);
    gl.uniformMatrix4fv(mLoc.uModel, false, item.model);
    gl.uniformMatrix3fv(mLoc.uNormalMat, false, scratchNorm);
    gl.uniform4fv(mLoc.uBaseColor, item.color);
    gl.uniform1f(mLoc.uRoughness, item.rough);
    gl.uniform1f(mLoc.uMetallic, item.metal);
    gl.uniform1f(mLoc.uRimStrength, item.rim);
    gl.uniform3fv(mLoc.uRimColor, item.rimColor);
    gl.uniform1f(mLoc.uSubsurface, item.sss);
    gl.uniform2fv(mLoc.uTexScale, item.texScale);
    gl.uniform1i(mLoc.uMatType, item.matType);
    gl.uniform4fv(mLoc.uExtra, item.extra);

    gl.bindTexture(gl.TEXTURE_2D, item.tex);
    gl.bindVertexArray(item.mesh.vao);
    gl.drawElements(gl.TRIANGLES, item.mesh.count, gl.UNSIGNED_SHORT, 0);
  };

  // Opaque Meshes
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  for (const item of drawListOpaque) {
    drawItem(item);
  }

  // Transparent & Additive Meshes (Glass Jar, Rippling Water, Curtain, Sunbeams, Prism, Dust!)
  gl.enable(gl.BLEND);
  for (const item of drawListTrans) {
    gl.depthMask(!item.noDepthWrite);
    if (item.additive) gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawItem(item);
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

// ============================================================================
// 14. RESIZE & MAIN LOOP
// ============================================================================
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}
window.addEventListener('resize', resize);
resize();

let prevTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - prevTime) * 0.001));
  prevTime = now;
  resize();
  updateWorld(dt);
  updateCamera(dt);
  sound.update(dt, world.time);
  renderFrame();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
})();
</script>
