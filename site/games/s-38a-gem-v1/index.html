<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>かぴばらの ぽかぽか</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8b88a;
      touch-action: none;
      overscroll-behavior: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #hand-demo {
      position: fixed;
      left: 0;
      top: 0;
      width: 58px;
      height: 70px;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-200px, -200px, 0);
      will-change: transform, opacity;
      z-index: 10;
      filter: drop-shadow(0 4px 10px rgba(90, 48, 22, 0.22));
    }
    #hand-demo svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hand-demo" aria-hidden="true">
    <svg viewBox="0 0 64 78" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Translucent gentle child hand/finger silhouette only (no wrist/arm/elbow) -->
      <path d="M27 8 C27 4.2 33 4.2 33 8 L33 32 C34.8 30.2 38.6 30.5 39.6 33.4 C41.6 32.0 45.2 32.8 45.8 35.8 C47.8 35.0 51.0 36.4 51.0 39.8 L51.0 49.5 C51.0 59.5 43.5 66.5 34.0 66.5 C25.2 66.5 18.8 60.5 16.5 52.8 L12.4 41.2 C11.1 37.6 15.6 34.5 18.4 37.2 L24.2 42.8 L24.2 8 Z"
            fill="rgba(255, 246, 234, 0.62)"
            stroke="rgba(255, 252, 246, 0.88)"
            stroke-width="2.2"
            stroke-linejoin="round"
            stroke-linecap="round"/>
      <ellipse cx="30" cy="11.5" rx="2.6" ry="3.2" fill="rgba(255, 255, 255, 0.55)"/>
    </svg>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/environment.js"></script>
  <script src="js/capybara.js"></script>
  <script src="js/props.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
