      ham.rotY = dampAngle(ham.rotY, WHEEL_POS.rotY - PI * 0.5, 10, dt);
      // Spin wheel enthusiastically
      const runIntensity = smoothstep(0.0, 0.5, ham.stateTime) * smoothstep(ham.stateDur, ham.stateDur - 0.7, ham.stateTime);
      world.wheelVel = lerp(world.wheelVel, 6.8 * runIntensity, 4.5 * dt);
      ham.walkPhase += dt * (4.0 + Math.abs(world.wheelVel) * 2.8);
      ham.speed = Math.abs(world.wheelVel) * 0.3;
      if (Math.abs(world.wheelVel) > 1.2) sfx.playWheelTick(world.wheelVel);
      // Chubby cheeks bounce hilariously while jogging!
      const chub = totalCheekFill();
      ham.cheekVelL += Math.sin(ham.walkPhase) * chub * 22 * dt;
      ham.cheekVelR -= Math.sin(ham.walkPhase) * chub * 22 * dt;
      wantEar = 0.92;
      wantHappy = 0.45;
      if (ham.stateTime >= ham.stateDur) {
        // Hop gently off wheel to front-left
        ham.targetX = WHEEL_POS.x - 0.45;
        ham.targetZ = WHEEL_POS.z + 0.58;
        ham.nextAction = 'idle';
        ham.hopVY = 1.2;
        setHamState('walk', 2.5);
      }
      break;
    }

    case 'bridge_perch': {
      // Standing adorably atop the curved birch bridge surveying the twilight room!
      ham.x = damp(ham.x, BRIDGE_POS.x, 8, dt);
      ham.z = damp(ham.z, BRIDGE_POS.z, 8, dt);
      ham.rotY = dampAngle(ham.rotY, 0.15 + Math.sin(world.time * 1.4) * 0.35, 6, dt);
      wantStand = 0.88;
      wantEar = 0.96;
      wantNose = 0.95;
      wantYaw = Math.sin(world.time * 2.2) * 0.38;
      if (ham.stateTime >= ham.stateDur) {
        ham.targetX = BRIDGE_POS.x + randRange(-0.2, 0.2);
        ham.targetZ = BRIDGE_POS.z + 0.62;
        ham.nextAction = 'idle';
        ham.hopVY = 1.1;
        setHamState('walk', 2.6);
      }
      break;
    }

    case 'dig': {
      // Head down, rump slightly up, rapid alternating front-paw digging kicking wood chips!
      ham.digPhase += dt * 18.0;
      wantPitch = -0.34;
      wantEar = 0.75;
      wantNose = 1.0;
      ham.digTimer -= dt;
      if (ham.digTimer <= 0) {
        ham.digTimer = 0.22;
        const fx = Math.sin(ham.rotY), fz = Math.cos(ham.rotY);
        disturbBedding(ham.x + fx * 0.20, ham.z + fz * 0.20, 0.34, 0.95, false);
        // Tiny chance hamster itself digs up a hidden wheat kernel!
        if (Math.random() < 0.18) {
          spawnGrain(ham.x + fx * 0.22, ham.y + 0.12, ham.z + fz * 0.22, fx * 0.35, 1.1, fz * 0.35, 'wheat', false);
        }
      }
      if (ham.stateTime >= ham.stateDur) {
        setHamState('idle', 1.2);
      }
      break;
    }

    case 'drink': {
      const a = Math.atan2(WATER_POS.x - ham.x, WATER_POS.z - ham.z);
      ham.rotY = dampAngle(ham.rotY, a, 10, dt);
      wantPitch = -0.36 + Math.sin(world.time * 7.5) * 0.08;
      wantEar = 0.6;
      wantHappy = 0.55;
      ham.thirst = Math.max(0, ham.thirst - dt * 0.45);
      if (Math.sin(world.time * 4.5) > 0.92 && world.waterRippleAge > 0.35) {
        world.waterRippleAge = 0;
        sfx.playWaterPlip();
      }
      if (ham.stateTime >= ham.stateDur) {
        setHamState('groom', 1.8);
      }
      break;
    }

    case 'house_peek': {
      // Cute peek-a-boo inside the wooden house doorway!
      const t = ham.stateTime;
      const inX = HOUSE_POS.x + Math.sin(HOUSE_POS.rotY) * 0.05;
      const inZ = HOUSE_POS.z + Math.cos(HOUSE_POS.rotY) * 0.05;
      const peekX = HOUSE_POS.x + Math.sin(HOUSE_POS.rotY) * 0.46;
      const peekZ = HOUSE_POS.z + Math.cos(HOUSE_POS.rotY) * 0.46;
      if (t < 1.3) {
        ham.inHouse = true;
        ham.x = damp(ham.x, inX, 6, dt);
        ham.z = damp(ham.z, inZ, 6, dt);
        ham.rotY = dampAngle(ham.rotY, HOUSE_POS.rotY, 7, dt);
      } else if (t < ham.stateDur - 0.5) {
        // Poke adorable nose & whiskers out the arched doorway!
        ham.inHouse = false;
        ham.x = damp(ham.x, peekX, 5, dt);
        ham.z = damp(ham.z, peekZ, 5, dt);
        ham.rotY = dampAngle(ham.rotY, HOUSE_POS.rotY + 0.12, 7, dt);
        wantEar = 0.95;
        wantNose = 1.0;
        wantYaw = Math.sin(t * 2.6) * 0.32;
      } else {
        // Trot cheerfully back out!
        ham.inHouse = false;
        ham.targetX = -0.35;
        ham.targetZ = 0.15;
        ham.nextAction = 'idle';
        setHamState('walk', 3.0);
      }
      break;
    }

    case 'sleep': {
      wantSleep = 1.0;
      wantLoaf = 0.65;
      wantEar = 0.08;
      wantHappy = 1.0;
      wantNose = 0.05;
      wantYaw = 0.55;
      wantPitch = -0.18;
      if (ham.stateTime >= ham.stateDur) {
        setHamState('stretch', 2.2);
      }
      break;
    }

    case 'stretch': {
      // Big adorable front-paw stretch + tiny pink yawn!
      const p = Math.sin(clamp(ham.stateTime / ham.stateDur, 0, 1) * PI);
      wantStretch = p;
      wantEar = 0.25 + 0.65 * (1 - p);
      wantHappy = p * 0.9;
      wantMouth = p * 0.95;
      wantPitch = 0.25 * p;
      if (ham.stateTime >= ham.stateDur) {
        setHamState('idle', 1.4);
      }
      break;
    }
  }

  // Smooth Gaze Tracking toward child's finger or dragged wheat!
  if ((input.down || draggedStalk) && ham.state !== 'sleep' && ham.state !== 'petted' && ham.state !== 'groom') {
    const gx = draggedStalk && stalkHead ? stalkHead[0] : input.worldHover[0];
    const gz = draggedStalk && stalkHead ? stalkHead[2] : input.worldHover[2];
    const desired = Math.atan2(gx - ham.x, gz - ham.z);
    const rel = clamp(angleDiff(ham.rotY, desired), -0.68, 0.68);
    wantYaw = lerp(wantYaw, rel, 0.72);
    wantEar = Math.max(wantEar, 0.88);
  }

  // Smoothly damp all pose channels for lifelike organic motion
  ham.standAmt   = damp(ham.standAmt, wantStand, 9.5, dt);
  ham.loafAmt    = damp(ham.loafAmt, wantLoaf, 7.0, dt);
  ham.sleepAmt   = damp(ham.sleepAmt, wantSleep, 4.5, dt);
  ham.stretchAmt = damp(ham.stretchAmt, wantStretch, 8.0, dt);
  ham.happyEyes  = damp(ham.happyEyes, wantHappy, 8.5, dt);
  ham.earPerk    = damp(ham.earPerk, wantEar, 10.0, dt);
  ham.headYaw    = damp(ham.headYaw, wantYaw, 9.0, dt);
  ham.headPitch  = damp(ham.headPitch, wantPitch, 9.0, dt);
  ham.headRoll   = damp(ham.headRoll, wantRoll, 9.0, dt);
  ham.mouthOpen  = damp(ham.mouthOpen, wantMouth, 16.0, dt);
  ham.noseTwitch = damp(ham.noseTwitch, wantNose, 10.0, dt);
  ham.eyeBlink   = Math.max(naturalBlink, ham.sleepAmt);

  // Ground vertical placement (or inside wheel bottom track / atop birch bridge!)
  if (ham.state === 'wheel') {
    ham.y = damp(ham.y, WHEEL_POS.y + 0.16, 12, dt);
  } else if (ham.state === 'bridge_perch') {
    ham.y = damp(ham.y, BRIDGE_POS.y + 0.31 + ham.hopY, 12, dt);
  } else {
    const targetY = beddingHeight(ham.x, ham.z) + ham.hopY;
    ham.y = damp(ham.y, targetY, 18, dt);
  }
}

// ============================================================================
// 11. RENDERING HELPERS & DRAW PIPELINE
// ============================================================================
const tmpMat = M4.create();
const tmpNorm = new Float32Array(9);
const stackMats = Array.from({ length: 12 }, () => M4.create());

function bindTexture(unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}

let activePass = 'pbr'; // 'shadow' | 'pbr'

function drawMesh(mesh, modelMat, opts = {}) {
  if (activePass === 'shadow') {
    if (opts.noShadow) return;
    gl.uniformMatrix4fv(shadowProg.u.uModel, false, modelMat);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, mesh.idxType, 0);
    return;
  }
  const u = pbrProg.u;
  gl.uniformMatrix4fv(u.uModel, false, modelMat);
  M4.normalMat3(tmpNorm, modelMat);
  gl.uniformMatrix3fv(u.uNormalMat, false, tmpNorm);

  bindTexture(0, opts.albedo || TEX.white);
  bindTexture(1, opts.normal || TEX.flatNorm);

  const c = opts.color || [1, 1, 1, 1];
  gl.uniform4f(u.uBaseColor, c[0], c[1], c[2], c.length > 3 ? c[3] : 1);
  const ts = opts.texScale || [1, 1];
  gl.uniform2f(u.uTexScale, ts[0], ts[1]);
  gl.uniform1f(u.uRoughness, opts.roughness !== undefined ? opts.roughness : 0.65);
  gl.uniform1f(u.uMetallic, opts.metallic || 0.0);
  gl.uniform1f(u.uFurAmount, opts.fur || 0.0);
  gl.uniform1f(u.uClearcoat, opts.clearcoat || 0.0);
  gl.uniform1f(u.uNormalStrength, opts.normalStrength !== undefined ? opts.normalStrength : (opts.normal ? 1.0 : 0.0));
  const sss = opts.sss || [0, 0, 0];
  gl.uniform3f(u.uSubsurface, sss[0], sss[1], sss[2]);
  const em = opts.emissive || [0, 0, 0];
  gl.uniform3f(u.uEmissive, em[0], em[1], em[2]);

  gl.bindVertexArray(mesh.vao);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.idxType, 0);
}

function drawInstancedMesh(inst, opts = {}) {
  if (inst.active <= 0) return;
  if (activePass === 'shadow') {
    if (opts.noShadow) return;
    gl.useProgram(shadowInstProg.prog);
    gl.uniformMatrix4fv(shadowInstProg.u.uLightVP, false, world.lightVP);
    gl.bindVertexArray(inst.vao);
    gl.drawElementsInstanced(gl.TRIANGLES, inst.count, inst.idxType, 0, inst.active);
    gl.useProgram(shadowProg.prog);
    return;
  }
  gl.useProgram(pbrInstProg.prog);
  setGlobalPBRUniforms(pbrInstProg);
  const u = pbrInstProg.u;
  bindTexture(0, opts.albedo || TEX.white);
  bindTexture(1, opts.normal || TEX.flatNorm);
  const c = opts.color || [1, 1, 1, 1];
  gl.uniform4f(u.uBaseColor, c[0], c[1], c[2], c.length > 3 ? c[3] : 1);
  const ts = opts.texScale || [1, 1];
  gl.uniform2f(u.uTexScale, ts[0], ts[1]);
  gl.uniform1f(u.uRoughness, opts.roughness !== undefined ? opts.roughness : 0.65);
  gl.uniform1f(u.uMetallic, opts.metallic || 0.0);
  gl.uniform1f(u.uFurAmount, opts.fur || 0.0);
  gl.uniform1f(u.uClearcoat, opts.clearcoat || 0.0);
  gl.uniform1f(u.uNormalStrength, opts.normalStrength !== undefined ? opts.normalStrength : (opts.normal ? 1.0 : 0.0));
  const sss = opts.sss || [0, 0, 0];
  gl.uniform3f(u.uSubsurface, sss[0], sss[1], sss[2]);
  gl.uniform3f(u.uEmissive, 0, 0, 0);

  gl.bindVertexArray(inst.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, inst.count, inst.idxType, 0, inst.active);
  gl.useProgram(pbrProg.prog);
}

function setGlobalPBRUniforms(p) {
  const u = p.u;
  gl.uniformMatrix4fv(u.uVP, false, world.vpMat);
  gl.uniformMatrix4fv(u.uLightVP, false, world.lightVP);
  gl.uniform1i(u.uAlbedoTex, 0);
  gl.uniform1i(u.uNormalTex, 1);
  gl.uniform1i(u.uShadowTex, 2);
  bindTexture(2, shadowTex);
  gl.uniform3fv(u.uCamPos, world.camPos);
  gl.uniform3fv(u.uSunDir, world.sunDir);
  gl.uniform3fv(u.uSunColor, world.sunColor);
  gl.uniform3fv(u.uRimDir, world.rimDir);
  gl.uniform3fv(u.uRimColor, world.rimColor);
  gl.uniform3fv(u.uSkyColor, world.skyColor);
  gl.uniform3fv(u.uGroundColor, world.groundColor);
  gl.uniform3f(u.uLampPos, LAMP_POS.x - 0.15, LAMP_POS.y + 1.15, LAMP_POS.z + 0.15);
  gl.uniform3fv(u.uLampColor, world.lampColor);
  gl.uniform3f(u.uHamsterPos, ham.x, ham.y, ham.z);
  gl.uniform1f(u.uShadowTexel, 1.0 / SHADOW_SIZE);
}

function writeInstance(inst, idx, m, tint) {
  const off = idx * 20;
  inst.instData.set(m, off);
  inst.instData[off+16] = tint[0];
  inst.instData[off+17] = tint[1];
  inst.instData[off+18] = tint[2];
  inst.instData[off+19] = tint[3] !== undefined ? tint[3] : 1;
}
function uploadInstances(inst) {
  if (inst.active <= 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, inst.instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst.instData.subarray(0, inst.active * 20));
}

// Prepare all instanced buffers once per frame
function packAllInstances() {
  // 1. Wood Shavings
  instShavings.active = shavings.length;
  for (let i = 0; i < shavings.length; i++) {
    const s = shavings[i];
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, s.x, s.y, s.z);
    M4.rotateY(tmpMat, tmpMat, s.ry);
    M4.rotateX(tmpMat, tmpMat, s.rx);
    M4.rotateZ(tmpMat, tmpMat, s.rz);
    M4.scale(tmpMat, tmpMat, s.scale, s.scale, s.scale);
    writeInstance(instShavings, i, tmpMat, [s.tint[0], s.tint[1], s.tint[2], 1]);
  }
  uploadInstances(instShavings);

  // 2. Loose Wheat Grains & Sunflower Seeds
  let wCount = 0, sCount = 0;
  for (let i = 0; i < grains.length; i++) {
    const g = grains[i];
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, g.x, g.y, g.z);
    M4.rotateY(tmpMat, tmpMat, g.ry);
    M4.rotateX(tmpMat, tmpMat, g.rx + PI * 0.5);
    M4.rotateZ(tmpMat, tmpMat, g.rz);
    if (g.kind === 'sunflower') {
      if (sCount < instSunGrains.maxInstances) {
        M4.scale(tmpMat, tmpMat, 1.45, 1.55, 0.95);
        writeInstance(instSunGrains, sCount++, tmpMat, [1, 1, 1, 1]);
      }
    } else {
      if (wCount < instWheatGrains.maxInstances) {
        M4.scale(tmpMat, tmpMat, 1.15, 1.15, 1.15);
        writeInstance(instWheatGrains, wCount++, tmpMat, [1.02, 0.98, 0.88, 1]);
      }
    }
  }
  instWheatGrains.active = wCount;
  instSunGrains.active = sCount;
  uploadInstances(instWheatGrains);

  // 3. Wheat Stalk Kernels (braided herringbone ears!)
  let kCount = 0;
  for (const st of wheatStalks) {
    if (st.growScale < 0.03) continue;
    const len = st.length * st.growScale;
    const lx = st.leanX + st.bendX;
    const lz = st.leanZ + st.bendZ;
    for (let j = 0; j < st.kernels.length; j++) {
      const kn = st.kernels[j];
      if (!kn.present || kCount >= instStalkKernels.maxInstances) continue;
      const frac = 0.58 + kn.t * 0.36;
      const bend = frac * frac;
      let kx, ky, kz, rotY, rotX, rotZ;
      if (st.state === 'dropped') {
        const d = len * (frac - 0.15);
        kx = st.x + Math.cos(st.dropRotY) * d - Math.sin(st.dropRotY) * kn.side * 0.036;
        ky = st.y + 0.045 + Math.sin(kn.t * PI) * 0.015;
        kz = st.z + Math.sin(st.dropRotY) * d + Math.cos(st.dropRotY) * kn.side * 0.036;
        rotY = -st.dropRotY + kn.side * 0.5;
        rotX = PI * 0.5;
        rotZ = 0;
      } else {
        kx = st.x + lx * len * bend + kn.side * 0.032;
        ky = st.y + len * frac * 0.95;
        kz = st.z + lz * len * bend + (j % 3 - 1) * 0.014;
        rotY = kn.side * 0.4;
        rotX = lz * 0.7;
        rotZ = -lx * 0.7 - kn.angle;
      }
      M4.identity(tmpMat);
      M4.translate(tmpMat, tmpMat, kx, ky, kz);
      M4.rotateY(tmpMat, tmpMat, rotY);
      M4.rotateX(tmpMat, tmpMat, rotX);
      M4.rotateZ(tmpMat, tmpMat, rotZ);
      const sc = kn.scale * st.growScale * 1.08;
      M4.scale(tmpMat, tmpMat, sc, sc, sc);
      writeInstance(instStalkKernels, kCount++, tmpMat, [1.04, 0.98, 0.85, 1]);
    }
  }
  instStalkKernels.active = kCount;
  uploadInstances(instStalkKernels);
  uploadInstances(instSunGrains);
}

// ============================================================================
// 12. DRAW HAMSTER (EXPRESSIVE ARTICULATED GOLDEN HAMSTER)
// ============================================================================
function drawHamster(transparentPass = false) {
  const breath = Math.sin(world.time * (ham.sleepAmt > 0.5 ? 2.1 : 4.2)) * 0.022;
  const walkBob = Math.abs(Math.sin(ham.walkPhase)) * clamp(ham.speed * 0.038, 0, 0.045);
  const loafSqX = 1.0 + ham.loafAmt * 0.24;
  const loafSqY = 1.0 - ham.loafAmt * 0.26 + breath;
  const loafSqZ = 1.0 + ham.loafAmt * 0.14 + ham.stretchAmt * 0.24;

  // Root transform on ground
  const MRoot = stackMats[0];
  M4.identity(MRoot);
  M4.translate(MRoot, MRoot, ham.x, ham.y + 0.19 * (1 - ham.loafAmt * 0.28) + walkBob + ham.standAmt * 0.06, ham.z);
  M4.rotateY(MRoot, MRoot, ham.rotY);

  // Spine pitch: tilts upright when standing/eating/grooming/unpacking!
  const spinePitch = -ham.standAmt * 0.94 + ham.stretchAmt * 0.18 + (ham.state === 'dig' ? 0.25 : 0);
  const bodyRoll = ham.headRoll * 0.35 + (ham.sleepAmt * 0.18);

  const MBody = stackMats[1];
  M4.copy(MBody, MRoot);
  M4.rotateX(MBody, MBody, spinePitch);
  M4.rotateZ(MBody, MBody, bodyRoll);

  if (!transparentPass) {
    // --- 1. Plump Pear Torso ---
    M4.copy(tmpMat, MBody);
    M4.scale(tmpMat, tmpMat, loafSqX, loafSqY, loafSqZ);
    drawMesh(MESH.hamBody, tmpMat, {
      albedo: TEX.fur, normal: TEX.furNorm,
      roughness: 0.86, fur: 1.0, normalStrength: 1.15,
      color: [1.0, 0.97, 0.93, 1]
    });

    // --- 2. Tiny Stubby Pink Tail ---
    const tailWig = Math.sin(world.time * 12 + ham.walkPhase) * (ham.state === 'dig' ? 0.45 : 0.18);
    M4.copy(tmpMat, MBody);
    M4.translate(tmpMat, tmpMat, 0, -0.02, -0.34 * loafSqZ);
    M4.rotateY(tmpMat, tmpMat, tailWig);
    M4.scale(tmpMat, tmpMat, 0.044, 0.040, 0.056);
    drawMesh(MESH.sphereLow, tmpMat, {
      color: [0.95, 0.72, 0.72, 1], roughness: 0.65, fur: 0.3, sss: [0.45, 0.18, 0.18]
    });

    // --- 3. Back Feet (Hind Paws) ---
    for (const side of [-1, 1]) {
      const stride = Math.sin(ham.walkPhase + (side > 0 ? 0 : PI)) * clamp(ham.speed * 0.10, 0, 0.11);
      M4.copy(tmpMat, MRoot);
      M4.translate(tmpMat, tmpMat, side * 0.145 * loafSqX, -0.155 + ham.loafAmt * 0.03, -0.11 + stride);
      M4.rotateY(tmpMat, tmpMat, side * 0.24);
      M4.scale(tmpMat, tmpMat, 1.15, 0.95, 1.35);
      drawMesh(MESH.hamPaw, tmpMat, {
        color: [0.96, 0.74, 0.73, 1], roughness: 0.58, sss: [0.42, 0.16, 0.16]
      });
    }

    // --- 4. Expressive Front Paws (Walking / Begging / Eating / Unpacking / Washing / Digging!) ---
    for (const side of [-1, 1]) {
      const MPaw = stackMats[2];
      M4.copy(MPaw, MBody);
      let px = side * 0.14, py = -0.16, pz = 0.20;
      let rx = 0, ry = side * 0.12, rz = 0;

      if (ham.state === 'groom') {
        // Rhythmic circular face-washing over nose & cheeks!
        const ph = ham.groomPhase + (side > 0 ? 0.35 : 0);
        px = side * (0.075 + Math.cos(ph) * 0.045);
        py = -0.02 + Math.sin(ph) * 0.095;
        pz = 0.36 + Math.cos(ph) * 0.04;
        rx = -0.8;
      } else if (ham.state === 'unpack') {
        // Both paws sweeping from behind the chubby cheeks forward to push grains out!
        const push = Math.sin(ham.unpackPhase) * 0.5 + 0.5;
        const cheekOut = 0.18 + totalCheekFill() * 0.13;
        px = side * lerp(cheekOut + 0.03, 0.08, push);
        py = -0.03 + push * 0.05;
        pz = lerp(0.24, 0.42, push);
        ry = -side * 0.45;
      } else if (ham.state === 'eat_ground' || ham.state === 'eat_stalk') {
        // Both tiny paws holding the wheat kernel right up to the mouth!
        const nib = Math.sin(ham.nibblePhase + side) * 0.018;
        px = side * 0.058;
        py = -0.05 + nib;
        pz = 0.38;
        ry = -side * 0.42;
        rx = -0.5;
      } else if (ham.state === 'dig') {
        const dph = ham.digPhase + (side > 0 ? PI : 0);
        px = side * 0.11;
        py = -0.17 + Math.sin(dph) * 0.065;
        pz = 0.23 + Math.cos(dph) * 0.09;
      } else if (ham.standAmt > 0.35) {
        // Cute tucked chest paws fluttering while standing/begging!
        const flut = Math.sin(world.time * 9 + side) * 0.02;
        px = side * 0.095;
        py = -0.06 + flut;
        pz = 0.32;
        rx = -0.55;
      } else if (ham.stretchAmt > 0.05) {
        // Extended far forward during cute stretch!
        px = side * 0.11;
        py = -0.17;
        pz = 0.22 + ham.stretchAmt * 0.24;
      } else {
        // Normal adorable trot stride
        const st = Math.sin(ham.walkPhase + (side > 0 ? PI : 0)) * clamp(ham.speed * 0.11, 0, 0.12);
        px = side * 0.135 * loafSqX;
        py = -0.155 + ham.loafAmt * 0.03 + Math.max(0, st * 0.4);
        pz = 0.18 + st;
      }
      M4.translate(MPaw, MPaw, px, py, pz);
      M4.rotateX(MPaw, MPaw, rx);
      M4.rotateY(MPaw, MPaw, ry);
      M4.rotateZ(MPaw, MPaw, rz);
      drawMesh(MESH.hamPaw, MPaw, {
        color: [0.97, 0.74, 0.74, 1], roughness: 0.56, sss: [0.46, 0.16, 0.16]
      });
    }

    // Held Wheat Kernel or Sunflower Seed between tiny paws while nibbling!
    if (ham.heldGrainKind) {
      M4.copy(tmpMat, MBody);
      M4.translate(tmpMat, tmpMat, 0, -0.04 + Math.sin(ham.nibblePhase) * 0.012, 0.42);
      M4.rotateZ(tmpMat, tmpMat, 0.35 + Math.sin(ham.nibblePhase * 0.5) * 0.25);
      M4.rotateX(tmpMat, tmpMat, 0.4);
      const isSun = ham.heldGrainKind === 'sunflower';
      M4.scale(tmpMat, tmpMat, isSun ? 1.55 : 1.3, isSun ? 1.65 : 1.3, isSun ? 1.0 : 1.3);
      drawMesh(MESH.kernel, tmpMat, {
        albedo: isSun ? TEX.sunflower : TEX.wheat,
        normal: isSun ? TEX.flatNorm : TEX.wheatNorm,
        roughness: 0.48
      });
    }
  }

  // --- 5. Head Transform (Counter-pitched so head stays cute & level when standing!) ---
  const MHead = stackMats[3];
  M4.copy(MHead, MBody);
  M4.translate(MHead, MHead, 0, 0.055 - ham.loafAmt * 0.03, 0.285 * loafSqZ);
  M4.rotateX(MHead, MHead, -spinePitch * 0.78 + ham.headPitch);
  M4.rotateY(MHead, MHead, ham.headYaw);
  M4.rotateZ(MHead, MHead, ham.headRoll);

  if (!transparentPass) {
    // Head skull
    drawMesh(MESH.hamHead, MHead, {
      albedo: TEX.headFur, normal: TEX.headFurNorm,
      roughness: 0.84, fur: 1.0, normalStrength: 1.1
    });

    // --- 6. SIGNATURE DYNAMIC SPRING-PHYSICS CHEEK POUCHES (左・右のほっぺ袋!) ---
    for (const side of [-1, 1]) {
      const fill = side < 0 ? ham.cheekFillL : ham.cheekFillR;
      const spr  = side < 0 ? ham.cheekSpringL : ham.cheekSpringR;
      const fEff = clamp(fill + spr * 0.12, -0.08, 1.35);

      // Scales dramatically from soft natural cheek -> huge adorable chubby peanut cheek!
      const sx = 0.76 + fEff * 1.18 + Math.max(0, spr * 0.10);
      const sy = 0.78 + fEff * 0.76 - Math.max(0, spr * 0.05);
      const sz = 0.82 + fEff * 0.92;
      const ox = side * (0.125 + fEff * 0.095);
      const oy = -0.032 - fEff * 0.022;
      const oz = 0.055 - fEff * 0.055;

      M4.copy(tmpMat, MHead);
      M4.translate(tmpMat, tmpMat, ox, oy, oz);
      M4.rotateY(tmpMat, tmpMat, side * (0.18 + fEff * 0.16));
      M4.rotateZ(tmpMat, tmpMat, -side * (0.10 + fEff * 0.12));
      M4.scale(tmpMat, tmpMat, sx, sy, sz);
      drawMesh(MESH.hamCheek, tmpMat, {
        albedo: TEX.headFur, normal: TEX.headFurNorm,
        roughness: 0.84, fur: 1.05, normalStrength: 0.95,
        color: [1.03, 0.98, 0.92, 1]
      });
    }

    // --- 7. Fluffy Cream Muzzle Puffs (ω whisker pads) + Twitching Rosy Pink Nose + Cute Mouth ---
    for (const side of [-1, 1]) {
      M4.copy(tmpMat, MHead);
      M4.translate(tmpMat, tmpMat, side * 0.044, -0.056, 0.214);
      M4.scale(tmpMat, tmpMat, 0.054, 0.044, 0.046);
      drawMesh(MESH.sphereLow, tmpMat, {
        color: [0.99, 0.95, 0.89, 1], roughness: 0.88, fur: 0.95
      });
    }
    const noseBob = Math.sin(world.time * 24) * 0.008 * ham.noseTwitch;
    M4.copy(tmpMat, MHead);
    M4.translate(tmpMat, tmpMat, 0, -0.028 + noseBob, 0.252);
    M4.scale(tmpMat, tmpMat, 0.030, 0.024, 0.022);
    drawMesh(MESH.sphereLow, tmpMat, {
      color: [0.96, 0.56, 0.62, 1], roughness: 0.24, clearcoat: 0.65, sss: [0.55, 0.2, 0.2]
    });

    if (ham.mouthOpen > 0.06) {
      M4.copy(tmpMat, MHead);
      M4.translate(tmpMat, tmpMat, 0, -0.064, 0.218);
      M4.scale(tmpMat, tmpMat, 0.026 * (0.6 + ham.mouthOpen * 0.6), 0.024 * ham.mouthOpen, 0.020);
      drawMesh(MESH.sphereLow, tmpMat, {
        color: [0.82, 0.36, 0.42, 1], roughness: 0.35
      });
    }

    // --- 8. Glossy Marble Eyes with Dual Catchlights + Blinking / Happy Crescent Eyelids ---
    for (const side of [-1, 1]) {
      const ex = side * 0.118, ey = 0.048, ez = 0.162;
      const squint = Math.max(ham.eyeBlink, ham.happyEyes * 0.82);

      // Glossy dark-espresso eyeball
      M4.copy(tmpMat, MHead);
      M4.translate(tmpMat, tmpMat, ex, ey, ez);
      M4.scale(tmpMat, tmpMat, 0.044, 0.046 * (1.0 - squint * 0.72), 0.042);
      drawMesh(MESH.sphere, tmpMat, {
        color: [0.06, 0.04, 0.035, 1], roughness: 0.04, clearcoat: 1.0
      });

      // Soft fur upper eyelid (closes smoothly on blink & happy squint!)
      if (squint > 0.05) {
        M4.copy(tmpMat, MHead);
        M4.translate(tmpMat, tmpMat, ex * 1.01, ey + 0.024 * (1 - squint * 0.75), ez + 0.008);
        M4.rotateZ(tmpMat, tmpMat, -side * ham.happyEyes * 0.28);
        M4.scale(tmpMat, tmpMat, 0.050, 0.028 * squint + 0.008, 0.046);
        drawMesh(MESH.sphereLow, tmpMat, {
          color: [0.86, 0.60, 0.34, 1], roughness: 0.85, fur: 0.8
        });
      }
    }

    // --- 9. Translucent Cupped Petal Ears (Glowing Rosy Pink in Sunset Backlight!) ---
    for (const side of [-1, 1]) {
      const wiggle = Math.sin(world.time * 4.5 + side * 2.1) * 0.06;
      M4.copy(tmpMat, MHead);
      M4.translate(tmpMat, tmpMat, side * 0.145, 0.145, -0.025);
      M4.rotateY(tmpMat, tmpMat, side * (0.38 - ham.earPerk * 0.25));
      M4.rotateX(tmpMat, tmpMat, lerp(-0.55, 0.18, ham.earPerk) + wiggle);
      M4.rotateZ(tmpMat, tmpMat, -side * lerp(0.55, 0.22, ham.earPerk));
      drawMesh(MESH.hamEar, tmpMat, {
        color: [0.92, 0.68, 0.58, 1], roughness: 0.76, fur: 0.55,
        sss: [0.95, 0.36, 0.32]
      });
    }
  } else {
    // Transparent Pass: Delicate Translucent Whiskers!
    for (const side of [-1, 1]) {
      for (let w = 0; w < 3; w++) {
        const wTwitch = Math.sin(world.time * 20 + w * 1.7 + side) * 0.08 * ham.noseTwitch;
        M4.copy(tmpMat, MHead);
        M4.translate(tmpMat, tmpMat, side * 0.095, -0.038 + (w - 1) * 0.018, 0.205);
        M4.rotateY(tmpMat, tmpMat, side * (0.25 + (w - 1) * 0.12));
        M4.rotateZ(tmpMat, tmpMat, -side * (PI * 0.5 + (w - 1) * 0.16 + wTwitch));
        M4.scale(tmpMat, tmpMat, 0.0026, 0.155, 0.0026);
        M4.translate(tmpMat, tmpMat, 0, 0.5, 0);
        drawMesh(MESH.cyl, tmpMat, {
          color: [1.0, 0.96, 0.90, 0.52], roughness: 0.4, noShadow: true
        });
      }
    }
  }
}

// ============================================================================
// 13. DRAW SCENE PROPS & ROOM ARCHITECTURE
// ============================================================================
function drawOpaqueScene() {
  // --- 1. Warm Walnut Desk Surface ---
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, 0, -0.15, -0.2);
  M4.scale(tmpMat, tmpMat, 12.0, 0.30, 8.2);
  drawMesh(MESH.box, tmpMat, {
    albedo: TEX.walnut, normal: TEX.walnutNorm, texScale: [3.2, 2.2],
    roughness: 0.42, clearcoat: 0.22
  });

  // --- 2. Cozy Bedroom Plaster Wall framing the Twilight Window ---
  // Window opening: x in [-2.35, 2.15], y in [0.75, 4.10] at z = -3.35
  const wallOpts = { albedo: TEX.wall, normal: TEX.wallNorm, texScale: [2.5, 2.5], roughness: 0.92, noShadow: true };
  // Left wall pillar
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, -5.2, 2.4, -3.35); M4.scale(tmpMat, tmpMat, 5.7, 6.2, 0.25);
  drawMesh(MESH.box, tmpMat, wallOpts);
  // Right wall pillar
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, 5.0, 2.4, -3.35); M4.scale(tmpMat, tmpMat, 5.7, 6.2, 0.25);
  drawMesh(MESH.box, tmpMat, wallOpts);
  // Lower wall below windowsill
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, -0.1, 0.2, -3.35); M4.scale(tmpMat, tmpMat, 5.2, 1.35, 0.25);
  drawMesh(MESH.box, tmpMat, wallOpts);
  // Upper wall header above window
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, -0.1, 4.85, -3.35); M4.scale(tmpMat, tmpMat, 5.2, 1.6, 0.25);
  drawMesh(MESH.box, tmpMat, wallOpts);

  // Wooden Window Frame, Sill & Mullions
  const winWood = { albedo: TEX.birch, normal: TEX.birchNorm, color: [0.85, 0.72, 0.60, 1], roughness: 0.62, noShadow: true };
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, -0.1, 0.82, -3.18); M4.scale(tmpMat, tmpMat, 4.85, 0.14, 0.42);
  drawMesh(MESH.box, tmpMat, winWood);
  // Vertical center & side mullions
  for (const mx of [-2.35, -0.1, 2.15]) {
    M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, mx, 2.45, -3.28); M4.scale(tmpMat, tmpMat, 0.12, 3.35, 0.16);
    drawMesh(MESH.box, tmpMat, winWood);
  }
  // Horizontal cross bar
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, -0.1, 2.45, -3.28); M4.scale(tmpMat, tmpMat, 4.6, 0.10, 0.14);
  drawMesh(MESH.box, tmpMat, winWood);

  // Gently Swaying Sheer Linen Curtains flanking the window
  const cSway = Math.sin(world.time * 1.1) * 0.04 + world.breezeAnim * Math.sin(world.time * 3.8) * 0.12;
  for (const side of [-1, 1]) {
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, side < 0 ? -2.28 : 2.12, 2.55, -3.02);
    M4.rotateY(tmpMat, tmpMat, side * -0.15 + cSway);
    drawMesh(MESH.curtain, tmpMat, {
      albedo: TEX.linen, normal: TEX.linenNorm, roughness: 0.88,
      color: [1.0, 0.96, 0.90, 1], sss: [0.68, 0.52, 0.36], noShadow: true
    });
  }

  // Cozy Terracotta Houseplant Pot on the Twilight Windowsill
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, -1.62, 1.06, -3.14); M4.scale(tmpMat, tmpMat, 0.19, 0.34, 0.19);
  drawMesh(MESH.cyl, tmpMat, { color: [0.76, 0.44, 0.32, 1], roughness: 0.72, noShadow: true });
  for (let l = 0; l < 5; l++) {
    const la = (l / 5) * TAU + 0.4;
    const leafSway = Math.sin(world.time * 1.5 + l) * 0.05 + world.breezeAnim * 0.14;
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, -1.62 + Math.cos(la) * 0.14, 1.34 + (l % 2) * 0.08, -3.14 + Math.sin(la) * 0.10);
    M4.rotateZ(tmpMat, tmpMat, Math.cos(la) * -0.45 + leafSway);
    M4.rotateX(tmpMat, tmpMat, Math.sin(la) * 0.35);
    M4.scale(tmpMat, tmpMat, 0.14, 0.05, 0.22);
    drawMesh(MESH.sphereLow, tmpMat, {
      color: [0.34, 0.54, 0.34, 1], roughness: 0.62, sss: [0.35, 0.58, 0.22], noShadow: true
    });
  }

  // --- 3. Wooden Enclosure Base & Rim Posts ---
  const encWood = { albedo: TEX.birch, normal: TEX.birchNorm, texScale: [2.2, 1.0], roughness: 0.58 };
  // Back wall wooden panel (low cozy wall)
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, 0, 0.26, -1.80); M4.scale(tmpMat, tmpMat, 5.45, 0.54, 0.12);
  drawMesh(MESH.box, tmpMat, encWood);
  // Left & Right low wooden rims
  for (const sx of [-2.66, 2.66]) {
    M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, sx, 0.22, -0.05); M4.scale(tmpMat, tmpMat, 0.12, 0.46, 3.62);
    drawMesh(MESH.box, tmpMat, encWood);
  }
  // Front low wooden lip (low so child sees right in!)
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, 0, 0.10, 1.72); M4.scale(tmpMat, tmpMat, 5.45, 0.22, 0.12);
  drawMesh(MESH.box, tmpMat, encWood);
  // Four corner wooden posts
  for (const cx of [-2.66, 2.66]) {
    for (const cz of [-1.80, 1.72]) {
      const h = cz < 0 ? 1.05 : 0.72;
      M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, cx, h * 0.5, cz); M4.scale(tmpMat, tmpMat, 0.16, h, 0.16);
      drawMesh(MESH.box, tmpMat, encWood);
    }
  }

  // --- 4. Aspen Wood-Shavings Bedding Terrain ---
  M4.identity(tmpMat);
  drawMesh(MESH.bedding, tmpMat, {
    albedo: TEX.bedding, normal: TEX.beddingNorm, roughness: 0.92, normalStrength: 1.35
  });

  // --- 5. Cozy Cotton Nest Pillow right in front of Wooden House ---
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU + 0.3;
    const rx = Math.cos(a) * 0.22, rz = Math.sin(a) * 0.17;
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, NEST_POS.x + rx, NEST_POS.y + 0.035, NEST_POS.z + rz);
    M4.scale(tmpMat, tmpMat, 0.14, 0.055, 0.12);
    drawMesh(MESH.sphereLow, tmpMat, {
      color: [0.98, 0.94, 0.87, 1], roughness: 0.95, fur: 0.65
    });
  }

  // --- 6. Wooden House (木のおうち) ---
  const knockJig = Math.sin(world.houseKnockAnim * PI * 4) * world.houseKnockAnim * 0.04;
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, HOUSE_POS.x, HOUSE_POS.y, HOUSE_POS.z);
  M4.rotateY(tmpMat, tmpMat, HOUSE_POS.rotY);
  M4.rotateZ(tmpMat, tmpMat, knockJig);
  drawMesh(MESH.house, tmpMat, {
    albedo: TEX.birch, normal: TEX.birchNorm, texScale: [1.4, 1.4], roughness: 0.62
  });

  // --- 7. Little Natural Birch Arch Bridge ---
  for (let i = 0; i < 7; i++) {
    const t = (i / 6) - 0.5;
    const bx = BRIDGE_POS.x + t * 0.72;
    const by = BRIDGE_POS.y + 0.09 + Math.cos(t * PI) * 0.20;
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, bx, by, BRIDGE_POS.z);
    M4.rotateX(tmpMat, tmpMat, PI * 0.5);
    M4.scale(tmpMat, tmpMat, 0.056, 0.52, 0.056);
    drawMesh(MESH.cyl, tmpMat, {
      albedo: TEX.birch, normal: TEX.birchNorm,
      color: [0.92 - (i % 2) * 0.07, 0.80 - (i % 2) * 0.06, 0.66, 1], roughness: 0.72
    });
  }

  // --- 8. Wooden Exercise Wheel (Stand + Rotating Drum + Cork Track!) ---
  const MW = stackMats[4];
  M4.identity(MW);
  M4.translate(MW, MW, WHEEL_POS.x, WHEEL_POS.y, WHEEL_POS.z);
  M4.rotateY(MW, MW, WHEEL_POS.rotY);

  // Stand base & upright post
  M4.copy(tmpMat, MW); M4.translate(tmpMat, tmpMat, 0, 0.03, -0.10); M4.scale(tmpMat, tmpMat, 0.62, 0.06, 0.42);
  drawMesh(MESH.box, tmpMat, encWood);
  M4.copy(tmpMat, MW); M4.translate(tmpMat, tmpMat, 0, 0.42, -0.25); M4.scale(tmpMat, tmpMat, 0.14, 0.82, 0.07);
  drawMesh(MESH.box, tmpMat, encWood);

  // Spinning drum + cork lining + center hub
  const MWSpin = stackMats[5];
  M4.copy(MWSpin, MW);
  M4.translate(MWSpin, MWSpin, 0, 0.74, 0.0);
  M4.rotateZ(MWSpin, MWSpin, world.wheelAngle);
  M4.rotateX(MWSpin, MWSpin, PI * 0.5);
  drawMesh(MESH.wheelDrum, MWSpin, {
    albedo: TEX.birch, normal: TEX.birchNorm, roughness: 0.56
  });
  drawMesh(MESH.wheelCork, MWSpin, {
    albedo: TEX.cork, normal: TEX.corkNorm, texScale: [3.0, 1.0], roughness: 0.88
  });
  // Center wooden axle nut + subtle wood ribs on back wall so spinning is clearly visible!
  M4.copy(tmpMat, MWSpin); M4.translate(tmpMat, tmpMat, 0, -0.13, 0); M4.scale(tmpMat, tmpMat, 0.09, 0.09, 0.09);
  drawMesh(MESH.cyl, tmpMat, { albedo: TEX.walnut, roughness: 0.5 });
  for (let r = 0; r < 6; r++) {
    M4.copy(tmpMat, MWSpin);
    M4.translate(tmpMat, tmpMat, 0, -0.145, 0);
    M4.rotateY(tmpMat, tmpMat, (r / 6) * TAU);
    M4.scale(tmpMat, tmpMat, 0.032, 0.018, 0.56);
    drawMesh(MESH.box, tmpMat, { albedo: TEX.walnut, roughness: 0.62 });
  }

  // --- 9. Glazed Ceramic Food Bowl ---
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, BOWL_POS.x, BOWL_POS.y, BOWL_POS.z);
  drawMesh(MESH.bowl, tmpMat, {
    albedo: TEX.ceramic, normal: TEX.ceramicNorm,
    roughness: 0.16, clearcoat: 0.72, normalStrength: 0.35
  });

  // --- 10. Stoneware Water Dish Base ---
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, WATER_POS.x, WATER_POS.y, WATER_POS.z);
  drawMesh(MESH.waterDish, tmpMat, {
    albedo: TEX.ceramic, normal: TEX.ceramicNorm,
    color: [0.90, 0.95, 0.98, 1], roughness: 0.14, clearcoat: 0.8
  });

  // --- 11. Woven Rattan Wheat Basket ---
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, BASKET_POS.x, BASKET_POS.y, BASKET_POS.z);
  drawMesh(MESH.basket, tmpMat, {
    albedo: TEX.basket, normal: TEX.basketNorm, texScale: [3.2, 1.8],
    roughness: 0.82, normalStrength: 1.4
  });

  // --- 12. Wheat Stalk Stems & Delicate Awns ---
  const stalkOpts = { albedo: TEX.wheat, normal: TEX.wheatNorm, roughness: 0.68, color: [0.96, 0.88, 0.65, 1] };
  for (const st of wheatStalks) {
    if (st.growScale < 0.03) continue;
    const len = st.length * st.growScale;
    const lx = st.leanX + st.bendX;
    const lz = st.leanZ + st.bendZ;

    if (st.state === 'dropped') {
      M4.identity(tmpMat);
      M4.translate(tmpMat, tmpMat, st.x + Math.cos(st.dropRotY)*len*0.35, st.y + 0.03, st.z + Math.sin(st.dropRotY)*len*0.35);
      M4.rotateY(tmpMat, tmpMat, -st.dropRotY + PI * 0.5);
      M4.rotateX(tmpMat, tmpMat, PI * 0.5);
      M4.scale(tmpMat, tmpMat, 0.015, len * 0.88, 0.015);
      drawMesh(MESH.cyl, tmpMat, stalkOpts);
    } else {
      // 2-segment gracefully bent golden straw stem
      const midX = st.x + lx * len * 0.25;
      const midY = st.y + len * 0.46;
      const midZ = st.z + lz * len * 0.25;
      M4.identity(tmpMat);
      M4.translate(tmpMat, tmpMat, (st.x + midX)*0.5, (st.y + midY)*0.5, (st.z + midZ)*0.5);
      M4.rotateZ(tmpMat, tmpMat, -lx * 0.45);
      M4.rotateX(tmpMat, tmpMat, lz * 0.45);
      M4.scale(tmpMat, tmpMat, 0.016, len * 0.52, 0.016);
      drawMesh(MESH.cyl, tmpMat, stalkOpts);

      const topX = st.x + lx * len * 0.82;
      const topY = st.y + len * 0.94;
      const topZ = st.z + lz * len * 0.82;
      M4.identity(tmpMat);
      M4.translate(tmpMat, tmpMat, (midX + topX)*0.5, (midY + topY)*0.5, (midZ + topZ)*0.5);
      M4.rotateZ(tmpMat, tmpMat, -lx * 0.88);
      M4.rotateX(tmpMat, tmpMat, lz * 0.88);
      M4.scale(tmpMat, tmpMat, 0.013, len * 0.54, 0.013);
      drawMesh(MESH.cyl, tmpMat, stalkOpts);

      // Delicate fine golden wheat awns (beards) fanning from the top of the ear!
      if (st.remaining > 0) {
        for (let a = 0; a < 4; a++) {
          const fan = (a - 1.5) * 0.16;
          M4.identity(tmpMat);
          M4.translate(tmpMat, tmpMat, topX, topY + 0.07, topZ);
          M4.rotateZ(tmpMat, tmpMat, -lx * 0.9 + fan);
          M4.rotateX(tmpMat, tmpMat, lz * 0.9 + (a % 2 - 0.5) * 0.14);
          M4.scale(tmpMat, tmpMat, 0.0035, 0.24 * st.growScale, 0.0035);
          drawMesh(MESH.cyl, tmpMat, { color: [1.0, 0.92, 0.68, 1], roughness: 0.6, noShadow: true });
        }
      }
    }
  }

  // --- 13. Glass Wheat Jar Inner Golden Grain Fill + Cork Stopper ---
  const jarTilt = Math.sin(world.jarTiltAnim * PI) * 0.55;
  const MJar = stackMats[6];
  M4.identity(MJar);
  M4.translate(MJar, MJar, JAR_POS.x, JAR_POS.y + jarTilt * 0.26, JAR_POS.z);
  M4.rotateZ(MJar, MJar, jarTilt);

  // Grain contents visible inside jar
  M4.copy(tmpMat, MJar);
  M4.translate(tmpMat, tmpMat, 0, 0.23, 0);
  drawMesh(MESH.jarContents, tmpMat, {
    albedo: TEX.wheat, normal: TEX.beddingNorm, texScale: [3, 2],
    color: [0.98, 0.86, 0.52, 1], roughness: 0.62
  });
  // Cork lid (pops slightly up when pouring!)
  M4.copy(tmpMat, MJar);
  M4.translate(tmpMat, tmpMat, jarTilt * 0.12, 0.64 + jarTilt * 0.22, 0);
  M4.rotateZ(tmpMat, tmpMat, -jarTilt * 0.5);
  drawMesh(MESH.cork, tmpMat, {
    albedo: TEX.cork, normal: TEX.corkNorm, roughness: 0.86
  });

  // --- 14. Warm Twilight Bedside Table Lamp ---
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, LAMP_POS.x, LAMP_POS.y, LAMP_POS.z);
  drawMesh(MESH.lampBase, tmpMat, {
    albedo: TEX.ceramic, normal: TEX.ceramicNorm,
    color: [0.92, 0.72, 0.62, 1], roughness: 0.26, clearcoat: 0.55
  });
  // Brass neck stem
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, LAMP_POS.x, LAMP_POS.y + 0.88, LAMP_POS.z);
  M4.scale(tmpMat, tmpMat, 0.036, 0.24, 0.036);
  drawMesh(MESH.cyl, tmpMat, { color: [0.88, 0.72, 0.36, 1], roughness: 0.25, metallic: 0.85 });
  // Glowing Pleated Linen Lamp Shade
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, LAMP_POS.x, LAMP_POS.y + 0.92, LAMP_POS.z);
  const g = world.lampGlow;
  drawMesh(MESH.lampShade, tmpMat, {
    albedo: TEX.linen, normal: TEX.linenNorm, texScale: [4, 2],
    color: [1.0, 0.95, 0.86, 1], roughness: 0.82,
    sss: [0.95, 0.62, 0.28],
    emissive: [1.15 * g, 0.72 * g, 0.28 * g]
  });
  // Tiny dangling brass pull-chain + bead (bounces when clicked!)
  const pullDrop = Math.sin(world.lampPullAnim * PI) * 0.14;
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, LAMP_POS.x - 0.14, LAMP_POS.y + 0.76 - pullDrop * 0.5, LAMP_POS.z + 0.14);
  M4.scale(tmpMat, tmpMat, 0.008, 0.32 + pullDrop, 0.008);
  drawMesh(MESH.cyl, tmpMat, { color: [0.88, 0.72, 0.36, 1], roughness: 0.25, metallic: 0.9, noShadow: true });
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, LAMP_POS.x - 0.14, LAMP_POS.y + 0.60 - pullDrop, LAMP_POS.z + 0.14);
  M4.scale(tmpMat, tmpMat, 0.026, 0.034, 0.026);
  drawMesh(MESH.sphereLow, tmpMat, { color: [0.95, 0.78, 0.42, 1], roughness: 0.22, metallic: 0.9, noShadow: true });

  // --- 15. Instanced Shavings, Loose Grains, Sunflower Seeds & Stalk Kernels ---
  drawInstancedMesh(instShavings, {
    albedo: TEX.birch, normal: TEX.birchNorm, roughness: 0.88, noShadow: true
  });
  drawInstancedMesh(instWheatGrains, {
    albedo: TEX.wheat, normal: TEX.wheatNorm, roughness: 0.44, clearcoat: 0.18
  });
  drawInstancedMesh(instSunGrains, {
    albedo: TEX.sunflower, roughness: 0.36, clearcoat: 0.25
  });
  drawInstancedMesh(instStalkKernels, {
    albedo: TEX.wheat, normal: TEX.wheatNorm, roughness: 0.48
  });

  // --- 16. The Star: Golden Hamster! ---
  drawHamster(false);
}

function drawTranslucentAndFX() {
  gl.enable(gl.BLEND);
  gl.depthMask(false);

  // A. Standard Alpha Blending: Rippling Water, Crystal Glass Panels, Glass Jar, Hamster Whiskers
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  // Rippling Water Surface in Stoneware Dish
  gl.useProgram(waterProg.prog);
  gl.uniformMatrix4fv(waterProg.u.uVP, false, world.vpMat);
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, WATER_POS.x, WATER_POS.y + 0.11, WATER_POS.z);
  gl.uniformMatrix4fv(waterProg.u.uModel, false, tmpMat);
  gl.uniform1f(waterProg.u.uTime, world.time);
  gl.uniform1f(waterProg.u.uRippleAge, world.waterRippleAge);
  gl.uniform3fv(waterProg.u.uCamPos, world.camPos);
  gl.uniform3fv(waterProg.u.uSunColor, world.sunColor);
  gl.uniform3fv(waterProg.u.uSkyColor, world.skyColor);
  gl.bindVertexArray(MESH.waterDisk.vao);
  gl.drawElements(gl.TRIANGLES, MESH.waterDisk.count, MESH.waterDisk.idxType, 0);

  // PBR Translucent Pass (glass jar shell, subtle habitat glass walls, hamster whiskers)
  gl.useProgram(pbrProg.prog);
  setGlobalPBRUniforms(pbrProg);

  // Hamster whiskers
  drawHamster(true);

  // Glass Wheat Jar outer shell
  const jarTilt = Math.sin(world.jarTiltAnim * PI) * 0.55;
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, JAR_POS.x, JAR_POS.y + jarTilt * 0.26, JAR_POS.z);
  M4.rotateZ(tmpMat, tmpMat, jarTilt);
  drawMesh(MESH.jar, tmpMat, {
    color: [0.95, 0.98, 1.0, 0.28], roughness: 0.05, clearcoat: 0.95, noShadow: true
  });

  // Subtle low crystal-clear front & side enclosure glass panes (subtle rim shimmer only!)
  const glassOpts = { color: [0.95, 0.98, 1.0, 0.085], roughness: 0.05, clearcoat: 0.85, noShadow: true };
  M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, 0, 0.44, 1.72); M4.scale(tmpMat, tmpMat, 5.18, 0.50, 0.02);
  drawMesh(MESH.box, tmpMat, glassOpts);
  for (const sx of [-2.66, 2.66]) {
    M4.identity(tmpMat); M4.translate(tmpMat, tmpMat, sx, 0.62, -0.05); M4.scale(tmpMat, tmpMat, 0.02, 0.54, 3.36);
    drawMesh(MESH.box, tmpMat, glassOpts);
  }

  // B. Additive Volumetric Sunbeams, Lamp Glow Halo, Floating Dust Motes & Cozy Sparkles!
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(fxProg.prog);
  gl.uniformMatrix4fv(fxProg.u.uVP, false, world.vpMat);
  gl.bindVertexArray(MESH.plane.vao);

  // 1. Slanted Golden-Hour Volumetric Sunbeams streaming from the window
  const beamVis = smoothstep(0.85, 0.12, world.dusk) * 0.13;
  if (beamVis > 0.004) {
    gl.uniform1i(fxProg.u.uMode, 0);
    for (let b = 0; b < 3; b++) {
      M4.identity(tmpMat);
      M4.translate(tmpMat, tmpMat, -1.2 + b * 1.15, 1.55, -1.35 + b * 0.12);
      M4.rotateY(tmpMat, tmpMat, 0.12);
      M4.rotateZ(tmpMat, tmpMat, -0.46);
      M4.rotateX(tmpMat, tmpMat, 0.28);
      M4.scale(tmpMat, tmpMat, 1.25 + b * 0.15, 3.8, 1.0);
      gl.uniformMatrix4fv(fxProg.u.uModel, false, tmpMat);
      gl.uniform4f(fxProg.u.uColor, world.sunColor[0], world.sunColor[1] * 0.88, world.sunColor[2] * 0.65, beamVis * (1.0 - b * 0.14));
      gl.drawElements(gl.TRIANGLES, MESH.plane.count, MESH.plane.idxType, 0);
    }
  }

  // Billboard basis aligned toward camera
  gl.uniform1i(fxProg.u.uMode, 1);
  const camPitch = -Math.atan2(world.camPos[1] - world.camTarget[1], world.camPos[2] - world.camTarget[2]);

  // 2. Warm Bedside Lamp Soft Aura Halo
  if (world.lampGlow > 0.02) {
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, LAMP_POS.x, LAMP_POS.y + 1.24, LAMP_POS.z + 0.15);
    M4.rotateX(tmpMat, tmpMat, camPitch);
    M4.scale(tmpMat, tmpMat, 1.85, 1.85, 1.0);
    gl.uniformMatrix4fv(fxProg.u.uModel, false, tmpMat);
    gl.uniform4f(fxProg.u.uColor, 1.0, 0.68, 0.28, 0.24 * world.lampGlow);
    gl.drawElements(gl.TRIANGLES, MESH.plane.count, MESH.plane.idxType, 0);
  }

  // 3. Drifting Golden Sunbeam Dust Motes
  const moteAlpha = lerp(0.45, 0.18, world.dusk) + world.lampGlow * 0.12;
  for (let i = 0; i < dustMotes.length; i++) {
    const m = dustMotes[i];
    const mx = m.x + Math.sin(world.time * m.speed + m.phase) * 0.22 + world.breezeAnim * 0.15;
    const my = m.y + Math.cos(world.time * m.speed * 0.8 + m.phase) * 0.14;
    const mz = m.z + Math.sin(world.time * m.speed * 0.6 + m.phase * 1.4) * 0.16;
    const pulse = 0.55 + 0.45 * Math.sin(world.time * 1.7 + m.phase);
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, mx, my, mz);
    M4.rotateX(tmpMat, tmpMat, camPitch);
    M4.scale(tmpMat, tmpMat, m.size, m.size, 1.0);
    gl.uniformMatrix4fv(fxProg.u.uModel, false, tmpMat);
    gl.uniform4f(fxProg.u.uColor, 1.0, 0.88, 0.64, moteAlpha * pulse);
    gl.drawElements(gl.TRIANGLES, MESH.plane.count, MESH.plane.idxType, 0);
  }

  // 4. Warm Organic Petting / Nibbling / Discovery Sparkles
  for (let i = 0; i < sparkles.length; i++) {
    const sp = sparkles[i];
    const t = sp.life / sp.maxLife;
    const a = Math.sin(t * PI) * 0.85;
    const sc = sp.size * (0.6 + 0.6 * Math.sin(t * PI));
    M4.identity(tmpMat);
    M4.translate(tmpMat, tmpMat, sp.x, sp.y, sp.z);
    M4.rotateX(tmpMat, tmpMat, camPitch);
    M4.scale(tmpMat, tmpMat, sc, sc, 1.0);
    gl.uniformMatrix4fv(fxProg.u.uModel, false, tmpMat);
    gl.uniform4f(fxProg.u.uColor, sp.color[0], sp.color[1], sp.color[2], a);
    gl.drawElements(gl.TRIANGLES, MESH.plane.count, MESH.plane.idxType, 0);
  }

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

// ============================================================================
// 14. MAIN RENDER & ANIMATION LOOP
// ============================================================================
let dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}
window.addEventListener('resize', resize);
resize();

const lightView = M4.create();
const lightProj = M4.create();

function updateCamera(dt) {
  const aspect = canvas.width / Math.max(1, canvas.height);
  // Responsive framing so every interactive toy (basket, hamster, bowl, wheel, house, jar, lamp) stays comfortably visible on phones, tablets & desktop!
  const pullBack = aspect < 1.35 ? lerp(1.0, 1.72, clamp((1.35 - aspect) / 0.85, 0, 1)) : 1.0;

  // Subtle living-room breathing & gentle gaze toward the hamster
  const swayX = Math.sin(world.time * 0.28) * 0.08 + ham.x * 0.14;
  const swayY = Math.cos(world.time * 0.22) * 0.04;
  const wantPosX = swayX;
  const wantPosY = (3.55 + swayY) * lerp(1.0, 1.24, pullBack - 1.0);
  const wantPosZ = 5.65 * pullBack;

  world.camPos[0] = damp(world.camPos[0], wantPosX, 2.5, dt);
  world.camPos[1] = damp(world.camPos[1], wantPosY, 2.5, dt);
  world.camPos[2] = damp(world.camPos[2], wantPosZ, 2.5, dt);

  world.camTarget[0] = damp(world.camTarget[0], ham.x * 0.18, 2.5, dt);
  world.camTarget[1] = 0.62;
  world.camTarget[2] = -0.18;

  const fovy = (aspect < 1.0 ? 44 : 37) * PI / 180;
  M4.perspective(world.projMat, fovy, aspect, 0.2, 32.0);
  M4.lookAt(world.viewMat, world.camPos, world.camTarget, [0, 1, 0]);
  M4.mul(world.vpMat, world.projMat, world.viewMat);
  M4.invert(world.invVPMat, world.vpMat);

  // Tight orthographic shadow frustum aligned to sunset directional light
  const sd = world.sunDir;
  M4.lookAt(lightView, [sd[0] * 7.5, sd[1] * 7.5, sd[2] * 7.5], [0, 0.2, -0.1], [0, 1, 0]);
  M4.ortho(lightProj, -3.7, 3.7, -3.0, 3.2, 1.0, 16.0);
  M4.mul(world.lightVP, lightProj, lightView);
}

function renderFrame() {
  packAllInstances();

  // --- PASS 1: Shadow Depth Map ---
  activePass = 'shadow';
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT); // eliminates shadow acne cleanly

  gl.useProgram(shadowProg.prog);
  gl.uniformMatrix4fv(shadowProg.u.uLightVP, false, world.lightVP);
  drawOpaqueScene();

  gl.cullFace(gl.BACK);
  gl.disable(gl.CULL_FACE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // --- PASS 2: Main Perspective Scene ---
  activePass = 'pbr';
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.11, 0.08, 0.07, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  // 2a. Twilight Sky Window Backdrop (behind window opening at z = -3.85)
  gl.useProgram(skyProg.prog);
  gl.uniformMatrix4fv(skyProg.u.uVP, false, world.vpMat);
  M4.identity(tmpMat);
  M4.translate(tmpMat, tmpMat, -0.1, 2.45, -3.85);
  M4.scale(tmpMat, tmpMat, 5.2, 3.75, 1.0);
  gl.uniformMatrix4fv(skyProg.u.uModel, false, tmpMat);
  gl.uniform1f(skyProg.u.uTime, world.time);
  gl.uniform1f(skyProg.u.uDusk, world.dusk);
  gl.uniform3fv(skyProg.u.uSkyZenith, world.skyZenith);
  gl.uniform3fv(skyProg.u.uSkyMid, world.skyMid);
  gl.uniform3fv(skyProg.u.uSkyHorizon, world.skyHorizon);
  gl.bindVertexArray(MESH.plane.vao);
  gl.drawElements(gl.TRIANGLES, MESH.plane.count, MESH.plane.idxType, 0);

  // 2b. Opaque PBR 3D World + Hamster
  gl.useProgram(pbrProg.prog);
  setGlobalPBRUniforms(pbrProg);
  drawOpaqueScene();

  // 2c. Translucent Glass, Rippling Water, Whiskers & Additive Sunbeams / Sparkles
  drawTranslucentAndFX();
}

let lastNow = performance.now();
function tick(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) * 0.001));
  lastNow = now;
  world.time += dt;

  updateAtmosphere(dt);
  updateShavingsAndGrains(dt);
  updateHamster(dt);
  updateCamera(dt);
  renderFrame();

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

})();
</script>
