<script>
(() => {
'use strict';

// ============================================================================
// 1. MATH & DETERMINISTIC RANDOM UTILITIES
// ============================================================================
const PI = Math.PI;
const TAU = PI * 2;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const angleDiff = (a, b) => {
  let d = (b - a) % TAU;
  if (d > PI) d -= TAU;
  if (d < -PI) d += TAU;
  return d;
};
const dampAngle = (a, b, lambda, dt) => a + angleDiff(a, b) * (1 - Math.exp(-lambda * dt));

function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261125);
const randRange = (a, b) => a + rng() * (b - a);

// Column-major Mat4 helpers
const M4 = {
  create: () => {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  identity: (m) => {
    m.fill(0);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  copy: (out, a) => { out.set(a); return out; },
  mul: (out, a, b) => {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],
          a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11],
          a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0, b1, b2, b3;
    b0=b[0]; b1=b[1]; b2=b[2]; b3=b[3];
    out[0]=b0*a00+b1*a10+b2*a20+b3*a30; out[1]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[2]=b0*a02+b1*a12+b2*a22+b3*a32; out[3]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[4]; b1=b[5]; b2=b[6]; b3=b[7];
    out[4]=b0*a00+b1*a10+b2*a20+b3*a30; out[5]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[6]=b0*a02+b1*a12+b2*a22+b3*a32; out[7]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[8]; b1=b[9]; b2=b[10]; b3=b[11];
    out[8]=b0*a00+b1*a10+b2*a20+b3*a30; out[9]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[10]=b0*a02+b1*a12+b2*a22+b3*a32; out[11]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[12]; b1=b[13]; b2=b[14]; b3=b[15];
    out[12]=b0*a00+b1*a10+b2*a20+b3*a30; out[13]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[14]=b0*a02+b1*a12+b2*a22+b3*a32; out[15]=b0*a03+b1*a13+b2*a23+b3*a33;
    return out;
  },
  translate: (out, a, x, y, z) => {
    if (out !== a) out.set(a);
    out[12] = a[0]*x + a[4]*y + a[8]*z + a[12];
    out[13] = a[1]*x + a[5]*y + a[9]*z + a[13];
    out[14] = a[2]*x + a[6]*y + a[10]*z + a[14];
    out[15] = a[3]*x + a[7]*y + a[11]*z + a[15];
    return out;
  },
  scale: (out, a, x, y, z) => {
    out[0]=a[0]*x; out[1]=a[1]*x; out[2]=a[2]*x; out[3]=a[3]*x;
    out[4]=a[4]*y; out[5]=a[5]*y; out[6]=a[6]*y; out[7]=a[7]*y;
    out[8]=a[8]*z; out[9]=a[9]*z; out[10]=a[10]*z; out[11]=a[11]*z;
    out[12]=a[12]; out[13]=a[13]; out[14]=a[14]; out[15]=a[15];
    return out;
  },
  rotateX: (out, a, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11];
    if (out !== a) { out.set(a); }
    out[4]=a10*c+a20*s; out[5]=a11*c+a21*s; out[6]=a12*c+a22*s; out[7]=a13*c+a23*s;
    out[8]=a20*c-a10*s; out[9]=a21*c-a11*s; out[10]=a22*c-a12*s; out[11]=a23*c-a13*s;
    return out;
  },
  rotateY: (out, a, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a20=a[8],a21=a[9],a22=a[10],a23=a[11];
    if (out !== a) { out.set(a); }
    out[0]=a00*c-a20*s; out[1]=a01*c-a21*s; out[2]=a02*c-a22*s; out[3]=a03*c-a23*s;
    out[8]=a00*s+a20*c; out[9]=a01*s+a21*c; out[10]=a02*s+a22*c; out[11]=a03*s+a23*c;
    return out;
  },
  rotateZ: (out, a, rad) => {
    const s = Math.sin(rad), c = Math.cos(rad);
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7];
    if (out !== a) { out.set(a); }
    out[0]=a00*c+a10*s; out[1]=a01*c+a11*s; out[2]=a02*c+a12*s; out[3]=a03*c+a13*s;
    out[4]=a10*c-a00*s; out[5]=a11*c-a01*s; out[6]=a12*c-a02*s; out[7]=a13*c-a03*s;
    return out;
  },
  perspective: (out, fovy, aspect, near, far) => {
    const f = 1.0 / Math.tan(fovy * 0.5);
    const nf = 1 / (near - far);
    out.fill(0);
    out[0] = f / aspect;
    out[5] = f;
    out[10] = (far + near) * nf;
    out[11] = -1;
    out[14] = (2 * far * near) * nf;
    return out;
  },
  ortho: (out, l, r, b, t, n, f) => {
    const lr = 1 / (l - r), bt = 1 / (b - t), nf = 1 / (n - f);
    out.fill(0);
    out[0] = -2 * lr;
    out[5] = -2 * bt;
    out[10] = 2 * nf;
    out[12] = (l + r) * lr;
    out[13] = (t + b) * bt;
    out[14] = (f + n) * nf;
    out[15] = 1;
    return out;
  },
  lookAt: (out, eye, center, up) => {
    let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    let len = Math.hypot(zx, zy, zz);
    if (len > 1e-6) { zx /= len; zy /= len; zz /= len; }
    let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
    len = Math.hypot(xx, xy, xz);
    if (len > 1e-6) { xx /= len; xy /= len; xz /= len; }
    const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
    out[0]=xx; out[1]=yx; out[2]=zx; out[3]=0;
    out[4]=xy; out[5]=yy; out[6]=zy; out[7]=0;
    out[8]=xz; out[9]=yz; out[10]=zz; out[11]=0;
    out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
    out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
    out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
    out[15]=1;
    return out;
  },
  invert: (out, a) => {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],
          a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11],
          a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
          b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
          b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det = b00*b11 - b01*b10 + b02*b09 + b03*b08 - b04*b07 + b05*b06;
    if (!det) return null;
    det = 1.0 / det;
    out[0]=(a11*b11-a12*b10+a13*b09)*det;
    out[1]=(a02*b10-a01*b11-a03*b09)*det;
    out[2]=(a31*b05-a32*b04+a33*b03)*det;
    out[3]=(a22*b04-a21*b05-a23*b03)*det;
    out[4]=(a12*b08-a10*b11-a13*b07)*det;
    out[5]=(a00*b11-a02*b08+a03*b07)*det;
    out[6]=(a32*b02-a30*b05-a33*b01)*det;
    out[7]=(a20*b05-a22*b02+a23*b01)*det;
    out[8]=(a10*b10-a11*b08+a13*b06)*det;
    out[9]=(a01*b08-a00*b10-a03*b06)*det;
    out[10]=(a30*b04-a31*b02+a33*b00)*det;
    out[11]=(a21*b02-a20*b04-a23*b00)*det;
    out[12]=(a11*b07-a10*b09-a12*b06)*det;
    out[13]=(a00*b09-a01*b07+a02*b06)*det;
    out[14]=(a31*b01-a30*b03-a32*b00)*det;
    out[15]=(a20*b03-a21*b01+a22*b00)*det;
    return out;
  },
  normalMat3: (out, m) => {
    const a00=m[0],a01=m[1],a02=m[2],
          a10=m[4],a11=m[5],a12=m[6],
          a20=m[8],a21=m[9],a22=m[10];
    const b01 = a22*a11 - a12*a21;
    const b11 = -a22*a10 + a12*a20;
    const b21 = a21*a10 - a11*a20;
    let det = a00*b01 + a01*b11 + a02*b21;
    if (Math.abs(det) < 1e-8) {
      out[0]=1;out[1]=0;out[2]=0;out[3]=0;out[4]=1;out[5]=0;out[6]=0;out[7]=0;out[8]=1;
      return out;
    }
    det = 1.0 / det;
    out[0] = b01 * det;
    out[1] = b11 * det;
    out[2] = b21 * det;
    out[3] = (-a22*a01 + a02*a21) * det;
    out[4] = (a22*a00 - a02*a20) * det;
    out[5] = (-a21*a00 + a01*a20) * det;
    out[6] = (a12*a01 - a02*a11) * det;
    out[7] = (-a12*a00 + a02*a10) * det;
    out[8] = (a11*a00 - a01*a10) * det;
    return out;
  },
  transformPoint: (m, x, y, z) => [
    m[0]*x + m[4]*y + m[8]*z + m[12],
    m[1]*x + m[5]*y + m[9]*z + m[13],
    m[2]*x + m[6]*y + m[10]*z + m[14]
  ]
};

// ============================================================================
// 2. PROCEDURAL WEB AUDIO FOLEY ENGINE (ZERO EXTERNAL ASSETS)
// ============================================================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.noiseBuf = null;
    this.master = null;
    this.lastRustle = 0;
    this.lastWheel = 0;
  }
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.72;
      this.master.connect(this.ctx.destination);
      // Pre-generate 2s warm noise buffer
      const sr = this.ctx.sampleRate;
      const len = sr * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, sr);
      const data = this.noiseBuf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.08 * w) / 1.08;
        data[i] = w * 0.65 + last * 1.6;
      }
      this.startAmbience();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  }
  startAmbience() {
    if (!this.ctx) return;
    // Ultra-gentle twilight room air hum (barely audible cozy warmth)
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 260;
    const g = this.ctx.createGain();
    g.gain.value = 0.025;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
  }
  playNoiseBurst(freq, q, dur, vol, hp = 0) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const offset = Math.random() * 1.4;
    const f = this.ctx.createBiquadFilter();
    f.type = hp ? 'highpass' : 'bandpass';
    f.frequency.setValueAtTime(freq, t);
    f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.012, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, offset, dur + 0.02);
  }
  playNibble() {
    // Crisp tiny hamster crunch (カリッ)
    const f = 2200 + Math.random() * 1300;
    this.playNoiseBurst(f, 3.2, 0.045, 0.17);
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(880 + Math.random() * 420, t);
    o.frequency.exponentialRampToValueAtTime(340, t + 0.032);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.055, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.036);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.04);
  }
  playStuffCheek(fillRatio) {
    // Plush puff + tiny happy pop (ぷくっ)
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    const base = 240 + fillRatio * 130;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 1.55, t + 0.085);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.12);
    this.playNoiseBurst(1600, 1.5, 0.06, 0.06);
  }
  playCheekSquish(fillRatio) {
    // Soft bouncy squish (ぷにっ)
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    const f0 = 210 + fillRatio * 80;
    o.frequency.setValueAtTime(f0 * 1.3, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.78, t + 0.065);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.15, t + 0.15);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.18);
  }
  playSqueak(happy = true) {
    // Delicate adorable hamster chirp
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    const f1 = happy ? 1180 + Math.random() * 240 : 940 + Math.random() * 140;
    const f2 = happy ? f1 * 1.28 : f1 * 0.88;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + 0.09);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.12);
  }
  playPurr() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    this.playNoiseBurst(900 + Math.random() * 350, 4.0, 0.032, 0.055);
  }
  playGrainClink(inBowl = false) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    const f = inBowl ? (1850 + Math.random() * 950) : (680 + Math.random() * 320);
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.86, t + (inBowl ? 0.06 : 0.03));
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(inBowl ? 0.065 : 0.032, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (inBowl ? 0.07 : 0.035));
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.08);
  }
  playWheatRustle(intensity = 1) {
    const now = performance.now();
    if (now - this.lastRustle < 55) return;
    this.lastRustle = now;
    this.playNoiseBurst(2600 + Math.random() * 1400, 1.4, 0.085, 0.09 * clamp(intensity, 0.3, 1.3));
  }
  playBeddingRustle(intensity = 1) {
    const now = performance.now();
    if (now - this.lastRustle < 65) return;
    this.lastRustle = now;
    this.playNoiseBurst(1350 + Math.random() * 600, 1.1, 0.095, 0.10 * clamp(intensity, 0.25, 1.3));
  }
  playWoodKnock() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    for (let k = 0; k < 2; k++) {
      const dt = k * 0.105;
      const o = this.ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(310 + k * 45, t + dt);
      o.frequency.exponentialRampToValueAtTime(160, t + dt + 0.065);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.linearRampToValueAtTime(0.14, t + dt + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.075);
      o.connect(g); g.connect(this.master);
      o.start(t + dt); o.stop(t + dt + 0.08);
    }
  }
  playLampClick(on) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(on ? 1400 : 950, t);
    o.frequency.exponentialRampToValueAtTime(220, t + 0.022);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.026);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.03);
    this.playNoiseBurst(3200, 2.0, 0.025, 0.08);
  }
  playWaterPlip() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(620 + Math.random() * 140, t);

function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);

  const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    console.error(log);
    throw new Error('Program link failed: ' + log);

  gl.deleteShader(vs);
  gl.deleteShader(fs);
  const u = {};
  const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name] = gl.getUniformLocation(p, info.name);

  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvasEl);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return tex;
}

function heightCanvasToNormalTex(srcCanvas, strength = 2.0) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const ctx = srcCanvas.getContext('2d');
  const src = ctx.getImageData(0, 0, w, h).data;
  const outC = document.createElement('canvas');
  outC.width = w; outC.height = h;
  const octx = outC.getContext('2d');
  const img = octx.createImageData(w, h);
  const dst = img.data;
  const getH = (x, y) => {
    const xi = ((x % w) + w) % w;
    const yi = ((y % h) + h) % h;
    const idx = (yi * w + xi) * 4;
    return (src[idx] * 0.3 + src[idx+1] * 0.59 + src[idx+2] * 0.11) / 255;
  };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (getH(x + 1, y) - getH(x - 1, y)) * strength;
      const dy = (getH(x, y + 1) - getH(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1.0;
      const inv = 1 / Math.hypot(nx, ny, nz);
      nx *= inv; ny *= inv; nz *= inv;
      const idx = (y * w + x) * 4;
      dst[idx]   = Math.round((nx * 0.5 + 0.5) * 255);
      dst[idx+1] = Math.round((ny * 0.5 + 0.5) * 255);
      dst[idx+2] = Math.round((nz * 0.5 + 0.5) * 255);
      dst[idx+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  return uploadTexture(outC);
}

function makeFlatTex(r, g, b, a = 255) {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 4;
  const x = c.getContext('2d');
  x.fillStyle = `rgba(${r},${g},${b},${a/255})`;
  x.fillRect(0, 0, 4, 4);
  return uploadTexture(c);
}

// ============================================================================
// 5. PROCEDURAL 3D GEOMETRY LIBRARY
// ============================================================================
// Vertex layout: pos(3), norm(3), uv(2), color(4) = 12 floats
function buildMesh(verts, indices) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  const stride = 12 * 4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, stride, 32);

  const ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  const idxArr = verts.length / 12 > 65535 ? new Uint32Array(indices) : new Uint16Array(indices);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxArr, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {
    vao, vbo, ebo,
    count: indices.length,
    idxType: idxArr instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT
  };
}

function createInstancedMesh(baseMesh, maxInstances) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, baseMesh.vbo);
  const stride = 12 * 4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, stride, 32);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, baseMesh.ebo);

  // Per-instance buffer: mat4 (16 floats) + tint vec4 (4 floats) = 20 floats
  const instData = new Float32Array(maxInstances * 20);
  const instBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, instData.byteLength, gl.DYNAMIC_DRAW);
  const istride = 20 * 4;
  for (let i = 0; i < 4; i++) {
    gl.enableVertexAttribArray(4 + i);
    gl.vertexAttribPointer(4 + i, 4, gl.FLOAT, false, istride, i * 16);
    gl.vertexAttribDivisor(4 + i, 1);
  }
  gl.enableVertexAttribArray(8);
  gl.vertexAttribPointer(8, 4, gl.FLOAT, false, istride, 64);
  gl.vertexAttribDivisor(8, 1);
  gl.bindVertexArray(null);
  return {
    vao, instBuf, instData, maxInstances,
    count: baseMesh.count, idxType: baseMesh.idxType, active: 0
  };
}

function computeSmoothNormals(verts, indices) {
  const n = verts.length / 12;
  for (let i = 0; i < n; i++) {
    verts[i*12+3] = 0; verts[i*12+4] = 0; verts[i*12+5] = 0;
  }
  for (let i = 0; i < indices.length; i += 3) {
    const a = indices[i]*12, b = indices[i+1]*12, c = indices[i+2]*12;
    const e1x = verts[b]-verts[a], e1y = verts[b+1]-verts[a+1], e1z = verts[b+2]-verts[a+2];
    const e2x = verts[c]-verts[a], e2y = verts[c+1]-verts[a+1], e2z = verts[c+2]-verts[a+2];
    const nx = e1y*e2z - e1z*e2y, ny = e1z*e2x - e1x*e2z, nz = e1x*e2y - e1y*e2x;
    verts[a+3]+=nx; verts[a+4]+=ny; verts[a+5]+=nz;
    verts[b+3]+=nx; verts[b+4]+=ny; verts[b+5]+=nz;
    verts[c+3]+=nx; verts[c+4]+=ny; verts[c+5]+=nz;
  }
  for (let i = 0; i < n; i++) {
    const k = i*12+3;
    const l = Math.hypot(verts[k], verts[k+1], verts[k+2]) || 1;
    verts[k]/=l; verts[k+1]/=l; verts[k+2]/=l;
  }
}

function createParametricSphere(segU, segV, deformFn) {
  const verts = [], idx = [];
  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV;
    const phi = v * PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let iu = 0; iu <= segU; iu++) {
      const u = iu / segU;
      const theta = u * TAU;
      let x = sp * Math.sin(theta);
      let y = cp;
      let z = sp * Math.cos(theta);
      let r = 1, g = 1, b = 1;
      if (deformFn) {
        const res = deformFn(x, y, z, u, v);
        x = res[0]; y = res[1]; z = res[2];
        if (res.length > 3) { r = res[3]; g = res[4]; b = res[5]; }
      }
      verts.push(x, y, z, 0, 1, 0, u, v, r, g, b, 1);
    }
  }
  const row = segU + 1;
  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * row + iu;
      const b = a + row;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  computeSmoothNormals(verts, idx);
  return buildMesh(verts, idx);
}

function createBoxMesh(w, h, d, colorFn) {
  const hw = w*0.5, hh = h*0.5, hd = d*0.5;
  const faces = [
    { n:[0,0,1],  v:[[-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]] },
    { n:[0,0,-1], v:[[hw,-hh,-hd],[-hw,-hh,-hd],[-hw,hh,-hd],[hw,hh,-hd]] },
    { n:[0,1,0],  v:[[-hw,hh,hd],[hw,hh,hd],[hw,hh,-hd],[-hw,hh,-hd]] },
    { n:[0,-1,0], v:[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,-hh,hd],[-hw,-hh,hd]] },
    { n:[1,0,0],  v:[[hw,-hh,hd],[hw,-hh,-hd],[hw,hh,-hd],[hw,hh,hd]] },
    { n:[-1,0,0], v:[[-hw,-hh,-hd],[-hw,-hh,hd],[-hw,hh,hd],[-hw,hh,-hd]] }
  ];
  const uvs = [[0,0],[1,0],[1,1],[0,1]];
  const verts = [], idx = [];
  for (const f of faces) {
    const base = verts.length / 12;
    for (let i = 0; i < 4; i++) {
      const p = f.v[i];
      const col = colorFn ? colorFn(p[0], p[1], p[2], f.n) : [1,1,1];
      verts.push(p[0], p[1], p[2], f.n[0], f.n[1], f.n[2], uvs[i][0], uvs[i][1], col[0], col[1], col[2], 1);
    }
    idx.push(base, base+1, base+2, base, base+2, base+3);
  }
  return buildMesh(verts, idx);
}

function createLatheMesh(profile, segs, closedEnds = false) {
  // profile: array of [radius, y, vTex, ao]
  const verts = [], idx = [];
  const rows = profile.length;
  for (let ir = 0; ir < rows; ir++) {
    const [rad, py, vt, ao = 1] = profile[ir];
    for (let is = 0; is <= segs; is++) {
      const u = is / segs;
      const th = u * TAU;
      const x = Math.cos(th) * rad;
      const z = Math.sin(th) * rad;
      verts.push(x, py, z, 0, 1, 0, u, vt, ao, ao, ao, 1);
    }
  }
  const stride = segs + 1;
  for (let ir = 0; ir < rows - 1; ir++) {
    for (let is = 0; is < segs; is++) {
      const a = ir * stride + is;
      const b = a + stride;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  computeSmoothNormals(verts, idx);
  return buildMesh(verts, idx);
}

function createCylinderMesh(rTop, rBot, h, segs = 20) {
  const hh = h * 0.5;
  return createLatheMesh([
    [0.0001, -hh, 0, 0.85],
    [rBot, -hh, 0.05, 0.92],
    [rBot, -hh + 0.005, 0.08, 0.96],
    [rTop, hh - 0.005, 0.92, 1.0],
    [rTop, hh, 0.95, 1.0],
    [0.0001, hh, 1.0, 1.0]
  ], segs);
}

function createPlaneMesh(w, h, segX = 1, segY = 1) {
  const verts = [], idx = [];
  for (let iy = 0; iy <= segY; iy++) {
    const v = iy / segY;
    for (let ix = 0; ix <= segX; ix++) {
      const u = ix / segX;
      verts.push((u - 0.5) * w, (v - 0.5) * h, 0, 0, 0, 1, u, v, 1, 1, 1, 1);
    }
  }
  const row = segX + 1;
  for (let iy = 0; iy < segY; iy++) {
    for (let ix = 0; ix < segX; ix++) {
      const a = iy * row + ix;
      const b = a + row;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  return buildMesh(verts, idx);
}

function createDiskMesh(radius, segs = 28) {
  const verts = [0, 0, 0, 0, 1, 0, 0.5, 0.5, 1, 1, 1, 1];
  const idx = [];
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * TAU;
    const c = Math.cos(a), s = Math.sin(a);
    verts.push(c * radius, 0, s * radius, 0, 1, 0, 0.5 + c * 0.5, 0.5 + s * 0.5, 1, 1, 1, 1);
  }
  for (let i = 1; i <= segs; i++) idx.push(0, i + 1, i);
  return buildMesh(verts, idx);
}

// Bedding terrain height function (shared by terrain mesh, hamster feet, grains & shavings!)
function beddingHeight(x, z) {
  // Slight gentle cozy mounds around perimeter, subtle nest hollow near house (-1.05, -0.45), flat near bowl & wheel
  let h = 0.085
    + 0.022 * Math.sin(x * 1.65 + 0.4) * Math.cos(z * 1.9 - 0.3)
    + 0.014 * Math.cos(x * 3.1 - z * 2.4);
  // Gentle raised banks near back & left walls
  const edgeBoost = smoothstep(1.35, 2.5, Math.abs(x)) * 0.055 + smoothstep(0.95, 1.75, -z) * 0.065;
  h += edgeBoost;
  // Soft cozy nest dip right outside the wooden house entrance (-1.05, -0.42)
  const dn = Math.hypot(x - (-1.05), z - (-0.42));
  h -= 0.038 * Math.exp(-dn * dn * 5.2);
  // Keep area under wheel & bowl nicely level
  const db = Math.hypot(x - 0.72, z - 0.62);
  if (db < 0.55) h = lerp(0.075, h, smoothstep(0.32, 0.55, db));
  const dw = Math.hypot(x - 1.48, z - (-0.92));
  if (dw < 0.75) h = lerp(0.08, h, smoothstep(0.45, 0.75, dw));
  return h;
}

function createBeddingTerrain() {
  const segX = 48, segZ = 36;
  const W = 5.1, D = 3.5;
  const verts = [], idx = [];
  for (let iz = 0; iz <= segZ; iz++) {
    const v = iz / segZ;
    const z = (v - 0.5) * D;
    for (let ix = 0; ix <= segX; ix++) {
      const u = ix / segX;
      const x = (u - 0.5) * W;
      const y = beddingHeight(x, z);
      // Warm soft AO near enclosure edges and inside nest dip
      const edgeAO = 1.0 - 0.16 * smoothstep(2.0, 2.55, Math.abs(x)) - 0.14 * smoothstep(1.3, 1.75, Math.abs(z));
      const dn = Math.hypot(x - (-1.05), z - (-0.42));
      const nestTint = smoothstep(0.42, 0.12, dn);
      const r = edgeAO * lerp(1.0, 1.04, nestTint);
      const g = edgeAO * lerp(1.0, 0.99, nestTint);
      const b = edgeAO * lerp(1.0, 0.94, nestTint);
      verts.push(x, y, z, 0, 1, 0, u * 4.5, v * 3.2, r, g, b, 1);
    }
  }
  const row = segX + 1;
  for (let iz = 0; iz < segZ; iz++) {
    for (let ix = 0; ix < segX; ix++) {
      const a = iz * row + ix;
      const b = a + row;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  computeSmoothNormals(verts, idx);
  return buildMesh(verts, idx);
}

// Curled wooden wood-chip shaving flake (for instancing!)
function createWoodShavingMesh() {
  const verts = [], idx = [];
  const segU = 5, segV = 3;
  for (let iv = 0; iv <= segV; iv++) {
    const v = iv / segV;
    const z = (v - 0.5) * 0.085;
    for (let iu = 0; iu <= segU; iu++) {
      const u = iu / segU;
      const x = (u - 0.5) * 0.14;
      const curl = Math.sin(u * PI) * 0.024 + (v - 0.5) * (u - 0.5) * 0.05;
      verts.push(x, curl, z, 0, 1, 0, u, v, 1, 1, 1, 1);
    }
  }
  const row = segU + 1;
  for (let iv = 0; iv < segV; iv++) {
    for (let iu = 0; iu < segU; iu++) {
      const a = iv * row + iu, b = a + row;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  computeSmoothNormals(verts, idx);
  return buildMesh(verts, idx);
}

// Custom sculpted Wooden House with real arched doorway!
function createWoodenHouseMesh() {
  // Combine clean walls with an arched front entrance (back wall, left, right, front-left, front-right, front-arch-top, floor, roof)
  const verts = [], idx = [];
  function pushQuad(p0, p1, p2, p3, n, uvScale = 1, col = [1,1,1]) {
    const base = verts.length / 12;
    const pts = [p0, p1, p2, p3];
    const uvs = [[0,0],[uvScale,0],[uvScale,uvScale],[0,uvScale]];
    for (let i = 0; i < 4; i++) {
      verts.push(pts[i][0], pts[i][1], pts[i][2], n[0], n[1], n[2], uvs[i][0], uvs[i][1], col[0], col[1], col[2], 1);
    }
    idx.push(base, base+1, base+2, base, base+2, base+3);
  }
  function pushBox(cx, cy, cz, w, h, d, ao = 1) {
    const x0=cx-w/2, x1=cx+w/2, y0=cy-h/2, y1=cy+h/2, z0=cz-d/2, z1=cz+d/2;
    const c = [ao, ao, ao];
    pushQuad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1], 1, c);
    pushQuad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1], 1, c);
    pushQuad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],[0,1,0], 1, c);
    pushQuad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0], 1, c);
    pushQuad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[1,0,0], 1, c);
    pushQuad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[-1,0,0], 1, c);
  }
  const W = 1.18, H = 0.78, D = 0.96, T = 0.085;
  // Back wall
  pushBox(0, H/2, -D/2 + T/2, W, H, T, 0.95);
  // Left & Right walls
  pushBox(-W/2 + T/2, H/2, 0, T, H, D, 0.98);
  pushBox( W/2 - T/2, H/2, 0, T, H, D, 0.98);
  // Dark cozy interior back-inner liner so doorway looks deep and inviting
  pushBox(0, H/2, -D/2 + T + 0.02, W - T*2, H - 0.06, 0.04, 0.28);
  pushBox(0, 0.04, 0, W - T*1.5, 0.06, D - T*1.5, 0.35);
  // Front wall piers left & right of doorway (door width = 0.48, height = 0.52)
  const pierW = (W - 0.48) * 0.5;
  pushBox(-W/2 + pierW/2, H/2, D/2 - T/2, pierW, H, T, 1.0);
  pushBox( W/2 - pierW/2, H/2, D/2 - T/2, pierW, H, T, 1.0);
  // Front lintel above doorway
  const lintelH = H - 0.50;
  pushBox(0, H - lintelH/2, D/2 - T/2, 0.52, lintelH, T, 1.0);
  // Cute corner arch blocks inside upper doorway corners for rounded arch look
  pushBox(-0.21, 0.47, D/2 - T/2, 0.09, 0.09, T * 0.98, 0.92);
  pushBox( 0.21, 0.47, D/2 - T/2, 0.09, 0.09, T * 0.98, 0.92);
  // Slightly overhanging cozy birch roof slab + raised wooden rim
  pushBox(0, H + 0.045, 0.02, W + 0.16, 0.09, D + 0.16, 1.03);
  // Cute tiny decorative front roof lip
  pushBox(0, H + 0.085, D/2 + 0.04, W + 0.18, 0.045, 0.06, 1.04);
  return buildMesh(verts, idx);
}

// Open-front Exercise Wheel Drum (wood rim + back disc)
function createWheelDrumMesh(radius, depth, segs = 36) {
  // Lathe a hollow open-front drum with back wall!
  const rOut = radius, rIn = radius - 0.045;
  const zBack = -depth * 0.5, zFront = depth * 0.5;
  // Since lathe rotates around Y, we build around Y then rotate X by PI/2 in scene!
  return createLatheMesh([
    [0.001, zBack - 0.03, 0.0, 0.95],
    [rOut, zBack - 0.03, 0.25, 0.96],
    [rOut, zFront, 0.65, 1.0],
    [rIn, zFront, 0.72, 1.0],
    [rIn, zBack + 0.01, 0.95, 0.85],
    [0.001, zBack + 0.01, 1.0, 0.88]
  ], segs);
}
function createWheelCorkMesh(radius, depth, segs = 36) {
  const rIn = radius - 0.048, rC = radius - 0.064;
  const zBack = -depth * 0.5 + 0.02, zFront = depth * 0.5 - 0.015;
  return createLatheMesh([
    [rIn, zFront, 0.0, 0.96],
    [rC, zFront, 0.1, 1.0],
    [rC, zBack, 0.9, 0.92],
    [rIn, zBack, 1.0, 0.9]
  ], segs);
}

  M.hamBody = createParametricSphere(28, 22, (x, y, z, u, v) => {
    // z > 0 is front (chest), z < 0 is rump
    const rump = smoothstep(0.5, -0.7, z);
    const rx = (0.25 + 0.075 * rump) * (1.0 - 0.08 * Math.max(0, y));
    const ry = 0.235 + 0.035 * rump;
    const rz = 0.34;
    let py = y * ry;
    if (y < -0.35) py = lerp(py, -ry * 0.78, smoothstep(-0.35, -1.0, y) * 0.35);
    return [x * rx, py, z * rz];
  });

  // Cute rounded head with soft tapered snout
  M.hamHead = createParametricSphere(26, 20, (x, y, z, u, v) => {
    const snout = smoothstep(0.25, 1.0, z);
    const rx = 0.215 * (1.0 - 0.42 * snout);

  for (let i = 0; i < shavings.length; i++) {
    const s = shavings[i];
    const dx = s.x - wx, dz = s.z - wz;
    const d2 = dx*dx + dz*dz;
    if (d2 < radius * radius) {
      const d = Math.sqrt(d2) + 0.001;
      const f = (1 - d / radius) * impulse;
      s.vx += (dx / d) * f * randRange(0.7, 1.4);
      s.vz += (dz / d) * f * randRange(0.7, 1.4);
      s.vy += f * randRange(0.65, 1.35);
      s.vrot += randRange(-8, 8) * f;
      moved++;
    }
  }
  if (moved > 0) {
    sfx.playBeddingRustle(clamp(moved * 0.06, 0.3, 1.2));
  }
  // Chance to unearth a hidden golden grain or special striped sunflower seed when dragging bedding!
  if (fromFinger && Math.random() < 0.26) {
    const isSunflower = Math.random() < 0.34;
    spawnGrain(
      wx + randRange(-0.12, 0.12),
      beddingHeight(wx, wz) + 0.06,
      wz + randRange(-0.12, 0.12),
      randRange(-0.5, 0.5),
      randRange(1.2, 1.9),
      randRange(-0.5, 0.5),
      isSunflower ? 'sunflower' : 'wheat',
      false
    );
    spawnSparkle(wx, beddingHeight(wx, wz) + 0.12, wz, isSunflower ? [1.0, 0.88, 0.5] : [1.0, 0.82, 0.42], 4);
  }
}

const MAX_GRAINS = 180;
const instWheatGrains = createInstancedMesh(MESH.kernel, MAX_GRAINS);
const instSunGrains = createInstancedMesh(MESH.kernel, 48);

function spawnGrain(x, y, z, vx, vy, vz, kind = 'wheat', isHoard = false) {
  if (grains.length >= MAX_GRAINS - 2) {
    // Recycle oldest non-hoard grain first, else oldest hoard
    let idx = grains.findIndex(g => !g.isHoard && !g.claimed);
    if (idx < 0) idx = 0;
    grains.splice(idx, 1);
  }
  grains.push({
    x, y, z, vx, vy, vz,
    rx: randRange(0, TAU), ry: randRange(0, TAU), rz: randRange(0, TAU),
    kind, // 'wheat' | 'sunflower'
    isHoard,
    inBowl: false,
    settled: false,
    claimed: false,
    age: 0
  });
}

// --- Interactive Wheat Stalks (麦の穂) ---
const wheatStalks = [];
const KERNELS_PER_STALK = 16;
const instStalkKernels = createInstancedMesh(MESH.kernel, 12 * KERNELS_PER_STALK);

function createWheatStalk(slotIndex) {
  const angle = (slotIndex / 7) * TAU + 0.35;
  const dist = (slotIndex === 0) ? 0.02 : randRange(0.11, 0.22);
  const bx = BASKET_POS.x + Math.cos(angle) * dist;
  const bz = BASKET_POS.z + Math.sin(angle) * dist;
  const leanX = Math.cos(angle) * randRange(0.14, 0.36) + 0.08;
  const leanZ = Math.sin(angle) * randRange(0.14, 0.32) - 0.04;
  const kernels = [];
  for (let k = 0; k < KERNELS_PER_STALK; k++) {
    const t = k / (KERNELS_PER_STALK - 1);
    const side = (k & 1) ? 1 : -1;
    kernels.push({
      t, side,
      angle: side * 0.52 + (k % 3 - 1) * 0.18,
      present: true,
      scale: 0.92 + Math.sin(t * PI) * 0.32
    });
  }
  return {
    slotIndex,
    state: 'basket', // 'basket' | 'dragged' | 'dropped' | 'regrowing'
    baseX: bx, baseY: BASKET_POS.y + 0.18, baseZ: bz,
    x: bx, y: BASKET_POS.y + 0.18, z: bz,
    vx: 0, vy: 0, vz: 0,
    leanX, leanZ,
    bendX: 0, bendZ: 0,
    bendVX: 0, bendVZ: 0,
    length: randRange(1.02, 1.24),
    dropRotY: randRange(0, TAU),
    growScale: 1.0,
    shakeAccum: 0,
    kernels,
    remaining: KERNELS_PER_STALK
  };
}
for (let i = 0; i < 7; i++) {
  wheatStalks.push(createWheatStalk(i));
}

function getStalkHeadWorldPos(st) {
  if (st.state === 'dropped') {
    const len = st.length * 0.72;
    return [
      st.x + Math.cos(st.dropRotY) * len * 0.5,
      st.y + 0.06,
      st.z + Math.sin(st.dropRotY) * len * 0.5
    ];
  }
  const lx = st.leanX + st.bendX;
  const lz = st.leanZ + st.bendZ;
  const len = st.length * st.growScale;
  return [
    st.x + lx * len * 0.68,
    st.y + len * 0.88,
    st.z + lz * len * 0.68
  ];
}

function popKernelFromStalk(st, dropToWorld = true, targetVel = null) {
  // Pop from top downward for authentic stripping!
  for (let i = st.kernels.length - 1; i >= 0; i--) {
    const kn = st.kernels[i];
    if (kn.present) {
      kn.present = false;
      st.remaining--;
      const head = getStalkHeadWorldPos(st);
      if (dropToWorld) {
        const vx = targetVel ? targetVel[0] : randRange(-0.55, 0.55);
        const vy = targetVel ? targetVel[1] : randRange(0.45, 1.15);
        const vz = targetVel ? targetVel[2] : randRange(-0.55, 0.55);
        spawnGrain(head[0] + randRange(-0.04,0.04), head[1], head[2] + randRange(-0.04,0.04), vx, vy, vz, 'wheat', false);
      }
      spawnSparkle(head[0], head[1], head[2], [1.0, 0.86, 0.45], 2);
      st.bendVX += randRange(-1.4, 1.4);
      st.bendVZ += randRange(-1.4, 1.4);
      return head;
    }
  }
  return null;
}

function regrowStalkInSlot(slotIndex) {
  if (wheatStalks.some(s => s.slotIndex === slotIndex && (s.state === 'basket' || s.state === 'regrowing'))) {
    return;
  }
  const st = createWheatStalk(slotIndex);
  st.state = 'regrowing';
  st.growScale = 0.02;
  wheatStalks.push(st);
}

function totalCheekFill() {
  return (ham.cheekFillL + ham.cheekFillR) * 0.5;
}
function stuffOneGrain(kind = 'wheat') {
  const side = (ham.cheekFillL <= ham.cheekFillR) ? -1 : 1;
  const add = (kind === 'sunflower') ? 0.21 : 0.165;
  if (side < 0) {
    ham.cheekFillL = clamp(ham.cheekFillL + add, 0, 1.05);
    ham.cheekVelL += 5.4;
  } else {
    ham.cheekFillR = clamp(ham.cheekFillR + add, 0, 1.05);
    ham.cheekVelR += 5.4;
  }
  ham.storedGrains.push(kind);
  ham.thirst += 0.16;
  sfx.playStuffCheek(totalCheekFill());
  spawnSparkle(ham.x, ham.y + 0.42, ham.z, [1.0, 0.90, 0.55], 4);
}
function pokeHamsterCheek(side) {
  if (side < 0) ham.cheekVelL -= 6.8;
  else ham.cheekVelR -= 6.8;
  ham.headRoll = side * -0.28;
  ham.happyEyes = 1.0;
  sfx.playCheekSquish(totalCheekFill());
  sfx.playSqueak(true);
  spawnSparkle(ham.x, ham.y + 0.36, ham.z, [1.0, 0.84, 0.72], 5);
}

function setHamState(st, dur = 2.0) {
  ham.state = st;
  ham.stateTime = 0;
  ham.stateDur = dur;
  if (st !== 'eat_ground' && st !== 'eat_stalk') {
    ham.heldGrainKind = null;
  }
  if (st !== 'house_peek') {
    ham.inHouse = false;
  }
}

function findBestLooseGrain() {
  let best = null, bestScore = 999;
  for (let i = 0; i < grains.length; i++) {
    const g = grains[i];
    if (g.isHoard || g.claimed) continue;
    if (g.y > 0.55) continue;
    const d = Math.hypot(g.x - ham.x, g.z - ham.z);
    // Prefer sunflower seeds & bowl grains!
    const bonus = (g.kind === 'sunflower' ? -0.9 : 0) + (g.inBowl ? -0.35 : 0);
    if (d + bonus < bestScore) {
      bestScore = d + bonus;
      best = g;
    }
  }
  return best;
}

function findDroppedStalk() {
  let best = null, bestD = 999;
  for (const st of wheatStalks) {
    if (st.state === 'dropped' && st.remaining > 0) {
      const hp = getStalkHeadWorldPos(st);
      const d = Math.hypot(hp[0] - ham.x, hp[2] - ham.z);
      if (d < bestD) { bestD = d; best = st; }
    }
  }
  return best;
}

function avoidObstacles(tx, tz) {
  // Clamp to comfortable interior habitat bounds
  tx = clamp(tx, -2.05, 1.85);
  tz = clamp(tz, -1.25, 1.30);
  // Keep out of basket footprint
  let dx = tx - BASKET_POS.x, dz = tz - BASKET_POS.z;
  let d = Math.hypot(dx, dz);
  if (d < 0.66) { const s = 0.66 / (d + 0.001); tx = BASKET_POS.x + dx*s; tz = BASKET_POS.z + dz*s; }
  // Keep out of jar footprint
  dx = tx - JAR_POS.x; dz = tz - JAR_POS.z; d = Math.hypot(dx, dz);
  if (d < 0.50) { const s = 0.50 / (d + 0.001); tx = JAR_POS.x + dx*s; tz = JAR_POS.z + dz*s; }
  // Keep out of wooden house solid walls (except front doorway approach)
  dx = tx - HOUSE_POS.x; dz = tz - HOUSE_POS.z; d = Math.hypot(dx, dz);
  if (d < 0.72) { const s = 0.72 / (d + 0.001); tx = HOUSE_POS.x + dx*s; tz = HOUSE_POS.z + dz*s; }
  // Keep out of wheel base unless heading to wheel
  if (ham.nextAction !== 'wheel' && ham.state !== 'wheel') {
    dx = tx - WHEEL_POS.x; dz = tz - WHEEL_POS.z; d = Math.hypot(dx, dz);
    if (d < 0.66) { const s = 0.66 / (d + 0.001); tx = WHEEL_POS.x + dx*s; tz = WHEEL_POS.z + dz*s; }
  }
  return [clamp(tx, -2.05, 1.85), clamp(tz, -1.25, 1.30)];
}

function chooseNextHamsterBehavior() {
  // 1. If cheeks are stuffed really full (> 0.85), waddle to the nest & unpack!
  if (totalCheekFill() >= 0.84 && ham.storedGrains.length >= 6) {
    ham.targetX = NEST_POS.x + randRange(-0.08, 0.08);
    ham.targetZ = NEST_POS.z + randRange(0.06, 0.16);
    ham.nextAction = 'unpack';
    setHamState('walk', 5.0);
    return;
  }

  // 2. If loose grains exist and cheeks have room, trot to munch/stuff!
  const gr = findBestLooseGrain();
  if (gr && totalCheekFill() < 0.96) {
    ham.targetGrain = gr;
    // If grain is in bowl, stand nicely right beside bowl rim
    if (gr.inBowl) {
      const a = Math.atan2(ham.z - BOWL_POS.z, ham.x - BOWL_POS.x);
      ham.targetX = BOWL_POS.x + Math.cos(a) * 0.44;
      ham.targetZ = BOWL_POS.z + Math.sin(a) * 0.44;
    } else {
      ham.targetX = gr.x;
      ham.targetZ = gr.z;
    }
    ham.nextAction = 'eat_ground';
    setHamState('walk', 4.5);
    return;
  }

  // 3. If a dropped wheat stalk is on the floor with kernels, go nibble it!
  const ds = findDroppedStalk();
  if (ds && totalCheekFill() < 0.92) {
    const hp = getStalkHeadWorldPos(ds);
    ham.targetStalk = ds;
    const p = avoidObstacles(hp[0], hp[2] + 0.18);
    ham.targetX = p[0]; ham.targetZ = p[1];
    ham.nextAction = 'eat_dropped';
    setHamState('walk', 4.5);
    return;
  }

  // 4. If thirsty after snacking, trot to the stoneware water dish for a cute drink!
  if (ham.thirst > 0.72) {
    ham.targetX = WATER_POS.x - 0.34;
    ham.targetZ = WATER_POS.z + 0.16;
    ham.nextAction = 'drink';
    setHamState('walk', 4.5);
    return;
  }

  // 5. Variety of adorable everyday Golden Hamster behaviors!
  const r = Math.random();
  if (r < 0.20) {
    // Face-washing groom (くしくし洗顔)
    setHamState('groom', randRange(2.8, 4.2));
  } else if (r < 0.34) {
    // Hop into the cork wooden wheel for a cheerful jog!
    ham.targetX = WHEEL_POS.x - 0.16;
    ham.targetZ = WHEEL_POS.z + 0.34;
    ham.nextAction = 'wheel';
    setHamState('walk', 4.5);
  } else if (r < 0.46) {
    // Peek-a-boo at the cozy wooden house!
    ham.targetX = NEST_POS.x;
    ham.targetZ = NEST_POS.z;
    ham.nextAction = (ham.storedGrains.length >= 3 && Math.random() < 0.6) ? 'unpack' : 'house_peek';
    setHamState('walk', 4.5);
  } else if (r < 0.56) {
    // Playful digging in the wood shavings!
    const p = avoidObstacles(randRange(-1.1, 0.9), randRange(-0.4, 0.9));
    ham.targetX = p[0]; ham.targetZ = p[1];
    ham.nextAction = 'dig';
    setHamState('walk', 4.0);
  } else if (r < 0.65) {
    // Big adorable stretch & yawn!
    setHamState('stretch', 2.4);
  } else if (r < 0.74 && world.skyPhase > 0.52) {
    // Cozy twilight nap near the nest!
    ham.targetX = NEST_POS.x + 0.12;
    ham.targetZ = NEST_POS.z + 0.14;
    ham.nextAction = 'sleep';
    setHamState('walk', 4.5);
  } else {
    // Curious wandering explore (sometimes sniffing near bridge or bowl)
    const spots = [
      [0.05, 0.22], [-0.45, 0.55], [0.42, -0.35], [-0.12, -0.58], [0.92, -0.12], [-0.88, 0.25]
    ];
    const sp = spots[Math.floor(Math.random() * spots.length)];
    const p = avoidObstacles(sp[0] + randRange(-0.25, 0.25), sp[1] + randRange(-0.22, 0.22));
    ham.targetX = p[0]; ham.targetZ = p[1];
    ham.nextAction = 'idle';
    setHamState('walk', 4.0);
  }
}

// 9. POINTER / TOUCH INTERACTION SYSTEM (TAP & DRAG ONLY)
// ============================================================================
const input = {
  down: false,
  pointerId: -1,
  startX: 0, startY: 0,
  x: 0, y: 0,
  prevX: 0, prevY: 0,
  movedDist: 0,
  mode: 'none', // 'none' | 'stalk' | 'pet' | 'wheel' | 'bedding' | 'jar'
  activeStalk: null,
  worldHover: [0, 0.5, 0],
  rayOrigin: [0, 0, 0],
  rayDir: [0, 0, -1],
  beddingSparkTimer: 0
};

function screenToRay(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ndcY = 1 - ((clientY - rect.top) / rect.height) * 2;
  const pNear = unproject(ndcX, ndcY, -1);
  const pFar  = unproject(ndcX, ndcY, 1);
  const dx = pFar[0] - pNear[0], dy = pFar[1] - pNear[1], dz = pFar[2] - pNear[2];
  const len = Math.hypot(dx, dy, dz) || 1;
  return { o: pNear, d: [dx/len, dy/len, dz/len] };
}
function unproject(nx, ny, nz) {
  const m = world.invVPMat;
  const x = m[0]*nx + m[4]*ny + m[8]*nz + m[12];
  const y = m[1]*nx + m[5]*ny + m[9]*nz + m[13];
  const z = m[2]*nx + m[6]*ny + m[10]*nz + m[14];
  const w = m[3]*nx + m[7]*ny + m[11]*nz + m[15];
  return [x/w, y/w, z/w];
}
function raySphereDist(o, d, cx, cy, cz, r) {
  const ox = o[0] - cx, oy = o[1] - cy, oz = o[2] - cz;
  const b = ox*d[0] + oy*d[1] + oz*d[2];
  const c = ox*ox + oy*oy + oz*oz - r*r;
  const disc = b*b - c;
  if (disc < 0) return -1;
  const t = -b - Math.sqrt(disc);
  return t > 0 ? t : -1;
}
function rayPlaneY(o, d, planeY) {
  if (Math.abs(d[1]) < 1e-4) return null;
  const t = (planeY - o[1]) / d[1];
  if (t < 0) return null;
  return [o[0] + d[0]*t, planeY, o[2] + d[2]*t];
}

function pourFromJar(count = 5) {
  world.jarTiltAnim = 1.0;
  sfx.playWheatRustle(1.1);
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const targetX = BOWL_POS.x + randRange(-0.18, 0.18);
      const targetZ = BOWL_POS.z + randRange(-0.18, 0.18);
      const sx = JAR_POS.x - 0.18;
      const sy = JAR_POS.y + 0.68;
      const sz = JAR_POS.z - 0.08;
      const flight = 0.48 + i * 0.03;
      const vx = (targetX - sx) / flight;
      const vz = (targetZ - sz) / flight;
      const vy = 1.65 + randRange(-0.15, 0.25);
      const kind = (Math.random() < 0.14) ? 'sunflower' : 'wheat';
      spawnGrain(sx, sy, sz, vx, vy, vz, kind, false);
      sfx.playGrainClink(true);
    }, i * 65);
  }
}

function handlePointerDown(e) {
  sfx.unlock();
  canvas.setPointerCapture?.(e.pointerId);
  input.down = true;
  input.pointerId = e.pointerId;
  input.startX = input.prevX = input.x = e.clientX;
  input.startY = input.prevY = input.y = e.clientY;
  input.movedDist = 0;
  input.mode = 'none';
  input.activeStalk = null;

  const ray = screenToRay(e.clientX, e.clientY);
  input.rayOrigin = ray.o;
  input.rayDir = ray.d;

  // 1. Check Wheat Stalks (generous hit around basket & stalk heads!)
  let bestStalk = null, bestT = 999;
  for (const st of wheatStalks) {
    if (st.state === 'regrowing' || st.remaining <= 0) continue;
    const hp = getStalkHeadWorldPos(st);
    const t1 = raySphereDist(ray.o, ray.d, hp[0], hp[1], hp[2], 0.36);
    const t2 = raySphereDist(ray.o, ray.d, (st.x + hp[0])*0.5, (st.y + hp[1])*0.5, (st.z + hp[2])*0.5, 0.34);
    const t = (t1 > 0 && t2 > 0) ? Math.min(t1, t2) : Math.max(t1, t2);
    if (t > 0 && t < bestT) { bestT = t; bestStalk = st; }
  }
  // Also allow tapping anywhere on the basket itself to grab a lush stalk!
  if (!bestStalk) {
    const tb = raySphereDist(ray.o, ray.d, BASKET_POS.x, BASKET_POS.y + 0.42, BASKET_POS.z, 0.56);
    if (tb > 0) {
      bestStalk = wheatStalks.find(s => s.state === 'basket' && s.remaining > 0);
    }
  }
  if (bestStalk) {
    input.mode = 'stalk';
    input.activeStalk = bestStalk;
    bestStalk.state = 'dragged';
    canvas.classList.add('dragging');
    sfx.playWheatRustle(1.0);
    const p = rayPlaneY(ray.o, ray.d, 0.62);
    if (p) input.worldHover = p;
    return;
  }

  // 2. Check Hamster (petting / cheek-squish / wake!)
  const hamT = raySphereDist(ray.o, ray.d, ham.x, ham.y + 0.28, ham.z, 0.48);
  if (hamT > 0 && !ham.inHouse) {
    input.mode = 'pet';
    ham.petRubAccum = 0;
    canvas.classList.add('dragging');
    // Immediate cute acknowledgment
    if (ham.state === 'sleep') {
      setHamState('stretch', 2.0);
      sfx.playSqueak(true);
    } else if (totalCheekFill() > 0.25) {
      // Determine left or right cheek poke
      const hitPt = [ray.o[0]+ray.d[0]*hamT, ray.o[1]+ray.d[1]*hamT, ray.o[2]+ray.d[2]*hamT];
      const rx = Math.cos(ham.rotY), rz = -Math.sin(ham.rotY);
      const side = ((hitPt[0]-ham.x)*rx + (hitPt[2]-ham.z)*rz) >= 0 ? 1 : -1;
      pokeHamsterCheek(side);
    } else {
      ham.hopVY = Math.max(ham.hopVY, 1.35);
      ham.earPerk = 1.0;
      sfx.playSqueak(true);
      spawnSparkle(ham.x, ham.y + 0.44, ham.z, [1.0, 0.88, 0.65], 4);
    }
    return;
  }

  // 3. Check Warm Desk Lamp
  const lampT = raySphereDist(ray.o, ray.d, LAMP_POS.x, LAMP_POS.y + 0.92, LAMP_POS.z, 0.68);
  if (lampT > 0) {
    world.lampOn = !world.lampOn;
    world.lampPullAnim = 1.0;
    sfx.playLampClick(world.lampOn);
    if (world.lampOn) {
      spawnSparkle(LAMP_POS.x, LAMP_POS.y + 1.05, LAMP_POS.z, [1.0, 0.84, 0.42], 6);
    }
    return;
  }

  // 4. Check Corked Glass Wheat Jar
  const jarT = raySphereDist(ray.o, ray.d, JAR_POS.x, JAR_POS.y + 0.34, JAR_POS.z, 0.42);
  if (jarT > 0) {
    input.mode = 'jar';
    pourFromJar(5);
    return;
  }

  // 5. Check Wooden Exercise Wheel
  const wheelT = raySphereDist(ray.o, ray.d, WHEEL_POS.x, WHEEL_POS.y + 0.72, WHEEL_POS.z, 0.72);
  if (wheelT > 0) {
    input.mode = 'wheel';
    world.wheelVel += 5.5;
    sfx.playWheelTick(6);
    if (ham.state !== 'wheel' && ham.state !== 'eat_stalk' && ham.state !== 'unpack') {
      ham.targetX = WHEEL_POS.x - 0.16;
      ham.targetZ = WHEEL_POS.z + 0.34;
      ham.nextAction = 'wheel';
      setHamState('walk', 4.5);
    }
    return;
  }

  // 6. Check Wooden House (gentle knock -> peek-a-boo or unpack!)
  const houseT = raySphereDist(ray.o, ray.d, HOUSE_POS.x, HOUSE_POS.y + 0.44, HOUSE_POS.z, 0.68);
  if (houseT > 0) {
    world.houseKnockAnim = 1.0;
    sfx.playWoodKnock();
    if (ham.state === 'house_peek' || ham.inHouse) {
      ham.peekAmt = 1.0;
      ham.stateTime = Math.max(ham.stateTime, ham.stateDur - 0.6);
      sfx.playSqueak(true);
    } else if (ham.storedGrains.length >= 2) {
      ham.targetX = NEST_POS.x;
      ham.targetZ = NEST_POS.z + 0.10;
      ham.nextAction = 'unpack';
      setHamState('walk', 4.5);
    } else {
      ham.targetX = NEST_POS.x;
      ham.targetZ = NEST_POS.z;
      ham.nextAction = 'house_peek';
      setHamState('walk', 4.5);
    }
    return;
  }

  // 7. Check Stoneware Water Dish
  const waterT = raySphereDist(ray.o, ray.d, WATER_POS.x, WATER_POS.y + 0.12, WATER_POS.z, 0.36);
  if (waterT > 0) {
    world.waterRippleAge = 0;
    sfx.playWaterPlip();
    spawnSparkle(WATER_POS.x, WATER_POS.y + 0.22, WATER_POS.z, [0.78, 0.92, 1.0], 4);
    if (ham.state === 'idle' || ham.state === 'walk') {
      ham.targetX = WATER_POS.x - 0.34;
      ham.targetZ = WATER_POS.z + 0.16;
      ham.nextAction = 'drink';
      setHamState('walk', 4.5);
    }
    return;
  }

  // 8. Check Ceramic Bowl (jiggle grains inside or attract hamster!)
  const bowlT = raySphereDist(ray.o, ray.d, BOWL_POS.x, BOWL_POS.y + 0.14, BOWL_POS.z, 0.46);
  if (bowlT > 0) {
    let bounced = 0;
    for (const g of grains) {
      if (g.inBowl) {
        g.vy = randRange(0.75, 1.35);
        g.vx = randRange(-0.25, 0.25);
        g.vz = randRange(-0.25, 0.25);
        g.settled = false;
        bounced++;
      }
    }
    sfx.playGrainClink(true);
    if (bounced === 0) {
      // Friendly gift: tapping an empty bowl shakes 2 stray golden grains from the jar over!
      pourFromJar(3);
    } else if (ham.state === 'idle' || ham.state === 'groom' || ham.state === 'sleep') {
      chooseNextHamsterBehavior();
    }
    return;
  }

  // 8b. Check Birch Arch Bridge (tap to coax hamster to hop up and look around!)
  const bridgeT = raySphereDist(ray.o, ray.d, BRIDGE_POS.x, BRIDGE_POS.y + 0.24, BRIDGE_POS.z, 0.48);
  if (bridgeT > 0) {
    sfx.playWoodKnock();
    if (ham.state !== 'eat_stalk' && ham.state !== 'unpack' && ham.state !== 'petted') {
      ham.targetX = BRIDGE_POS.x;
      ham.targetZ = BRIDGE_POS.z;
      ham.nextAction = 'bridge_perch';
      setHamState('walk', 4.2);
    }
    return;
  }

  // 9. Check Twilight Window (upper back region)
  if (ray.d[2] < -0.15) {
    const tWin = (-3.25 - ray.o[2]) / ray.d[2];
    if (tWin > 0) {
      const wx = ray.o[0] + ray.d[0]*tWin;
      const wy = ray.o[1] + ray.d[1]*tWin;
      if (wx > -2.5 && wx < 2.3 && wy > 0.8 && wy < 4.2) {
        world.skyTargetBoost += 0.22;
        world.breezeAnim = 1.0;
        sfx.playBreezeChime();
        for (let i = 0; i < 6; i++) {
          spawnSparkle(randRange(-1.8, 1.8), randRange(1.2, 2.4), randRange(-1.4, 0.5), [1.0, 0.88, 0.62], 2);
        }
        return;
      }
    }
  }

  // 10. Bedding Floor Tap & Drag!
  const floorPt = rayPlaneY(ray.o, ray.d, 0.10);
  if (floorPt && Math.abs(floorPt[0]) < 2.5 && floorPt[2] > -1.72 && floorPt[2] < 1.68) {
    input.mode = 'bedding';
    input.worldHover = floorPt;
    disturbBedding(floorPt[0], floorPt[2], 0.42, 1.05, false);
    // Call hamster curiously over to investigate!
    if (ham.state !== 'eat_stalk' && ham.state !== 'unpack' && ham.state !== 'petted') {
      const p = avoidObstacles(floorPt[0], floorPt[2]);
      ham.targetX = p[0]; ham.targetZ = p[1];
      ham.nextAction = 'dig';
      setHamState('walk', 4.0);
    }
  }
}

function handlePointerMove(e) {
  const ray = screenToRay(e.clientX, e.clientY);
  input.rayOrigin = ray.o;
  input.rayDir = ray.d;

  if (!input.down || e.pointerId !== input.pointerId) return;
  const dx = e.clientX - input.prevX;
  const dy = e.clientY - input.prevY;
  const step = Math.hypot(dx, dy);
  input.movedDist += step;
  input.prevX = input.x = e.clientX;
  input.prevY = input.y = e.clientY;

  if (input.mode === 'stalk' && input.activeStalk) {
    const p = rayPlaneY(ray.o, ray.d, 0.62);
    if (p) {
      const prevH = input.worldHover;
      const moveD = Math.hypot(p[0] - prevH[0], p[2] - prevH[2]);
      input.worldHover = [clamp(p[0], -2.6, 2.4), 0.62, clamp(p[2], -1.6, 1.75)];
      const st = input.activeStalk;
      st.bendVX += clamp((p[0] - prevH[0]) * 4.5, -1.8, 1.8);
      st.bendVZ += clamp((p[2] - prevH[2]) * 4.5, -1.8, 1.8);

      // Shaking the stalk vigorously OR rubbing over the ceramic bowl sheds golden grains!
      const overBowl = Math.hypot(p[0] - BOWL_POS.x, p[2] - BOWL_POS.z) < 0.56;
      st.shakeAccum += moveD * (overBowl ? 2.4 : 1.15);
      if (moveD > 0.08) sfx.playWheatRustle(moveD * 4.0);
      if (st.shakeAccum > 0.72 && st.remaining > 0) {
        st.shakeAccum = 0;
        const hp = popKernelFromStalk(st, true, overBowl ? [
          (BOWL_POS.x - p[0]) * 1.4 + randRange(-0.18, 0.18),
          0.35,
          (BOWL_POS.z - p[2]) * 1.4 + randRange(-0.18, 0.18)
        ] : null);
        if (hp) sfx.playWheatRustle(1.1);
      }
    }
  } else if (input.mode === 'pet') {
    // Gentle stroking back and forth melts the hamster into a happy mochi loaf!
    ham.petRubAccum += step;
    if (ham.petRubAccum > 14 && !ham.inHouse) {
      if (ham.state !== 'petted') {
        setHamState('petted', 1.6);
      } else {
        ham.stateTime = 0;
      }
      ham.petDecay = 0.65;
      ham.happyEyes = 1.0;
      ham.headRoll = clamp(dx * 0.015, -0.25, 0.25);
      if (ham.purrTimer <= 0) {
        ham.purrTimer = 0.16;
        sfx.playPurr();
        spawnSparkle(ham.x, ham.y + 0.34, ham.z, [1.0, 0.85, 0.72], 2);
      }
    }
  } else if (input.mode === 'wheel') {
    world.wheelVel = clamp(world.wheelVel - dy * 0.12 + dx * 0.06, -12, 12);
    sfx.playWheelTick(world.wheelVel);
  } else if (input.mode === 'bedding') {
    const p = rayPlaneY(ray.o, ray.d, 0.10);
    if (p && Math.abs(p[0]) < 2.42 && p[2] > -1.62 && p[2] < 1.58) {
      const dist = Math.hypot(p[0] - input.worldHover[0], p[2] - input.worldHover[2]);
      if (dist > 0.09) {
        input.worldHover = p;
        disturbBedding(p[0], p[2], 0.44, 1.35, true);
      }
    }
  }
}

function handlePointerUp(e) {
  if (!input.down || e.pointerId !== input.pointerId) return;
  canvas.classList.remove('dragging');
  if (input.mode === 'stalk' && input.activeStalk) {
    const st = input.activeStalk;
    if (input.movedDist < 18) {
      // Quick tap on a wheat stalk in basket: shake 3 grains cheerfully into the enclosure!
      for (let i = 0; i < 3; i++) {
        popKernelFromStalk(st, true, [
          randRange(0.7, 1.65),
          randRange(1.2, 1.85),
          randRange(-0.8, 0.4)
        ]);
      }
      // Return gently to basket if still plenty of kernels
      if (st.remaining > 2) {
        st.state = 'basket';
        st.x = st.baseX; st.y = st.baseY; st.z = st.baseZ;
      } else {
        const slot = st.slotIndex;
        st.state = 'dropped';
        st.x = clamp(BASKET_POS.x + 0.55, -2.0, 1.75);
        st.z = clamp(BASKET_POS.z - 0.15, -1.2, 1.25);
        st.y = beddingHeight(st.x, st.z) + 0.04;
        setTimeout(() => regrowStalkInSlot(slot), 900);
      }
    } else {
      // Dropped in the habitat!
      const overBasket = Math.hypot(st.x - BASKET_POS.x, st.z - BASKET_POS.z) < 0.52;
      if (overBasket && st.remaining > 2) {
        st.state = 'basket';
        st.x = st.baseX; st.y = st.baseY; st.z = st.baseZ;
      } else {
        const slot = st.slotIndex;
        st.state = 'dropped';
        st.x = clamp(st.x, -2.0, 1.75);
        st.z = clamp(st.z, -1.2, 1.25);
        st.y = beddingHeight(st.x, st.z) + 0.04;
        st.dropRotY = randRange(0, TAU);
        setTimeout(() => regrowStalkInSlot(slot), 900);
        // Keep max 2 dropped stalks so floor stays neat
        const dropped = wheatStalks.filter(s => s.state === 'dropped');
        if (dropped.length > 2) {
          const idx = wheatStalks.indexOf(dropped[0]);
          if (idx >= 0) wheatStalks.splice(idx, 1);
        }
      }
    }
    input.activeStalk = null;
  } else if (input.mode === 'pet') {
    if (ham.state === 'petted') {
      // After a cozy pet, follow up with adorable face-washing!
      setHamState('groom', 2.4);
    }
  }
  input.down = false;
  input.mode = 'none';
}

canvas.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove);
window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerUp);

// ============================================================================
// 10. SIMULATION UPDATE LOOP (ATMOSPHERE, PHYSICS, HAMSTER AI & ANIMATION)
// ============================================================================
function updateAtmosphere(dt) {
  // Gentle 3.5-minute golden hour -> rose sunset -> starry twilight -> golden dawn cycle
  // Plus smooth user tap boosts on the window!
  world.skyPhase = (world.skyPhase + dt * 0.0042) % 1.0;
  if (world.skyTargetBoost > 0.001) {
    const step = Math.min(world.skyTargetBoost, dt * 0.42);
    world.skyPhase = (world.skyPhase + step) % 1.0;
    world.skyTargetBoost -= step;
  }
  // Map phase into continuous dusk intensity (0 = golden afternoon, 0.5 = coral sunset, 1.0 = starry indigo twilight)
  // Smooth triangle wave with cozy long golden/twilight plateaus
  const dusk = 0.5 - 0.5 * Math.cos(world.skyPhase * TAU);
  world.dusk = dusk;

  // Sun direction gently lowers as dusk deepens
  const sunElev = lerp(0.76, 0.24, dusk);
  const sLen = Math.hypot(-0.66, sunElev, 0.30);
  world.sunDir = [-0.66 / sLen, sunElev / sLen, 0.30 / sLen];

  // Rich sunset lighting color progression
  // Stage A (dusk 0): warm honey gold
  // Stage B (dusk 0.5): rosy apricot-coral sunset
  // Stage C (dusk 1.0): soft dreamy lavender-blue moonlight from window + warm cozy lamp!
  const t1 = clamp(dusk * 2.0, 0, 1);
  const t2 = clamp((dusk - 0.5) * 2.0, 0, 1);

  const mix3 = (a, b, t) => [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];

  world.sunColor = dusk < 0.5
    ? mix3([1.35, 1.04, 0.68], [1.28, 0.68, 0.40], t1)
    : mix3([1.28, 0.68, 0.40], [0.44, 0.46, 0.72], t2);

  world.rimColor = dusk < 0.5
    ? mix3([1.10, 0.74, 0.42], [1.18, 0.54, 0.38], t1)
    : mix3([1.18, 0.54, 0.38], [0.42, 0.48, 0.85], t2);

  world.skyColor = dusk < 0.5
    ? mix3([0.46, 0.42, 0.56], [0.42, 0.32, 0.46], t1)
    : mix3([0.42, 0.32, 0.46], [0.22, 0.24, 0.42], t2);

  world.groundColor = dusk < 0.5
    ? mix3([0.42, 0.29, 0.20], [0.36, 0.22, 0.16], t1)
    : mix3([0.36, 0.22, 0.16], [0.22, 0.16, 0.14], t2);

  world.skyZenith = dusk < 0.5
    ? mix3([0.28, 0.42, 0.72], [0.24, 0.22, 0.48], t1)
    : mix3([0.24, 0.22, 0.48], [0.06, 0.08, 0.22], t2);

  world.skyMid = dusk < 0.5
    ? mix3([0.82, 0.56, 0.46], [0.76, 0.36, 0.44], t1)
    : mix3([0.76, 0.36, 0.44], [0.18, 0.16, 0.36], t2);

  world.skyHorizon = dusk < 0.5
    ? mix3([1.10, 0.78, 0.44], [1.05, 0.52, 0.32], t1)
    : mix3([1.05, 0.52, 0.32], [0.34, 0.24, 0.40], t2);

  // Warm bedside lamp glow (brightens slightly in twilight for cozy contrast!)
  const targetLamp = world.lampOn ? lerp(0.85, 1.35, dusk) : 0.0;
  world.lampGlow = damp(world.lampGlow, targetLamp, 8, dt);
  world.lampColor = [1.85 * world.lampGlow, 1.18 * world.lampGlow, 0.56 * world.lampGlow];

  // Prop micro-animations
  world.lampPullAnim = Math.max(0, world.lampPullAnim - dt * 2.2);
  world.houseKnockAnim = Math.max(0, world.houseKnockAnim - dt * 2.8);
  world.jarTiltAnim = Math.max(0, world.jarTiltAnim - dt * 1.9);
  world.breezeAnim = Math.max(0, world.breezeAnim - dt * 0.7);
  world.waterRippleAge += dt;

  // Exercise wheel physics
  world.wheelAngle += world.wheelVel * dt;
  world.wheelVel *= Math.exp(-1.15 * dt);
  if (Math.abs(world.wheelVel) < 0.02) world.wheelVel = 0;
}

function updateShavingsAndGrains(dt) {
  // Update disturbed wood shavings
  for (let i = 0; i < shavings.length; i++) {
    const s = shavings[i];
    const groundY = beddingHeight(s.x, s.z) + 0.012;
    if (s.y > groundY + 0.002 || Math.abs(s.vy) > 0.01 || Math.abs(s.vx) > 0.01 || Math.abs(s.vz) > 0.01) {
      s.vy -= 6.8 * dt;
      s.x = clamp(s.x + s.vx * dt, -2.42, 2.42);
      s.z = clamp(s.z + s.vz * dt, -1.62, 1.58);
      s.y += s.vy * dt;
      s.ry += s.vrot * dt;
      s.rx += s.vrot * 0.4 * dt;
      const gy = beddingHeight(s.x, s.z) + 0.012;
      if (s.y <= gy) {
        s.y = gy;
        s.vy = -s.vy * 0.22;
        if (Math.abs(s.vy) < 0.08) s.vy = 0;
        s.vx *= 0.65; s.vz *= 0.65; s.vrot *= 0.65;
        s.rx = damp(s.rx, 0, 12, dt);
      }
    }
  }

  // Update loose grains & hoard grains
  for (let i = 0; i < grains.length; i++) {
    const g = grains[i];
    g.age += dt;
    if (g.settled) continue;
    g.vy -= 7.8 * dt;
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    g.z += g.vz * dt;
    g.rx += g.vx * 4.0 * dt;
    g.rz += g.vz * 4.0 * dt;

    // Keep inside habitat walls
    if (g.x < -2.35) { g.x = -2.35; g.vx = Math.abs(g.vx) * 0.4; }
    if (g.x >  2.35) { g.x =  2.35; g.vx = -Math.abs(g.vx) * 0.4; }
    if (g.z < -1.55) { g.z = -1.55; g.vz = Math.abs(g.vz) * 0.4; }
    if (g.z >  1.52) { g.z =  1.52; g.vz = -Math.abs(g.vz) * 0.4; }

    // Check Ceramic Bowl containment!
    const db = Math.hypot(g.x - BOWL_POS.x, g.z - BOWL_POS.z);
    let floorY = beddingHeight(g.x, g.z) + 0.025;
    let landedInBowl = false;
    if (db < 0.34 && g.y >= BOWL_POS.y + 0.04) {
      floorY = BOWL_POS.y + 0.085 + db * 0.14;
      landedInBowl = true;
      // Gentle pull inward toward bowl center so grains gather naturally
      g.vx -= (g.x - BOWL_POS.x) * 1.8 * dt;
      g.vz -= (g.z - BOWL_POS.z) * 1.8 * dt;
    } else if (g.isHoard) {
      // Pile slightly higher in the nest hoard as it grows!
      const dn = Math.hypot(g.x - NEST_POS.x, g.z - NEST_POS.z);
      floorY += Math.max(0, 0.09 - dn * 0.25) * clamp(world.hoardCount / 22, 0, 1);
    }

    if (g.y <= floorY) {
      const impact = Math.abs(g.vy);
      g.y = floorY;
      g.inBowl = landedInBowl;
      if (impact > 0.65) {
        sfx.playGrainClink(landedInBowl);
        g.vy = impact * (landedInBowl ? 0.34 : 0.22);
        g.vx *= 0.62; g.vz *= 0.62;
      } else {
        g.vy = 0; g.vx *= 0.5; g.vz *= 0.5;
        if (Math.hypot(g.vx, g.vz) < 0.04) {
          g.vx = g.vz = 0;
          g.settled = true;
        }
      }
    }
  }

  // Update Wheat Stalks (spring bend, sway, regrow, dragged follow)
  for (let i = wheatStalks.length - 1; i >= 0; i--) {
    const st = wheatStalks[i];
    if (st.state === 'regrowing') {
      st.growScale = damp(st.growScale, 1.0, 4.5, dt);
      if (st.growScale > 0.985) {
        st.growScale = 1.0;
        st.state = 'basket';
      }
    } else if (st.state === 'dragged') {
      // Smoothly position stem so its golden wheat head hovers near pointer!
      const targetX = input.worldHover[0] - st.leanX * st.length * 0.55;
      const targetY = input.worldHover[1] - st.length * 0.72;
      const targetZ = input.worldHover[2] - st.leanZ * st.length * 0.55;
      st.x = damp(st.x, targetX, 18, dt);
      st.y = damp(st.y, targetY, 18, dt);
      st.z = damp(st.z, targetZ, 18, dt);
    } else if (st.state === 'dropped' && st.remaining <= 0) {
      st.growScale = damp(st.growScale, 0, 3.0, dt);
      if (st.growScale < 0.05) { wheatStalks.splice(i, 1); continue; }
    }

    // Spring-damper bend + gentle twilight breeze sway
    const breeze = (0.04 + world.breezeAnim * 0.14) * Math.sin(world.time * 1.8 + st.slotIndex * 1.1);
    const fx = (breeze - st.bendX) * 28.0 - st.bendVX * 5.2;
    const fz = (breeze * 0.6 - st.bendZ) * 28.0 - st.bendVZ * 5.2;
    st.bendVX += fx * dt;
    st.bendVZ += fz * dt;
    st.bendX = clamp(st.bendX + st.bendVX * dt, -0.55, 0.55);
    st.bendZ = clamp(st.bendZ + st.bendVZ * dt, -0.55, 0.55);
  }

  // Update Sparkles
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const sp = sparkles[i];
    sp.life += dt;
    if (sp.life >= sp.maxLife) { sparkles.splice(i, 1); continue; }
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.z += sp.vz * dt;
    sp.vy *= 0.96;
  }
}

function updateHamster(dt) {
  ham.stateTime += dt;
  ham.purrTimer = Math.max(0, ham.purrTimer - dt);

  // Cheek spring-damper physics (bouncy chubby jiggle!)
  const kSpring = 64.0, kDamp = 7.2;
  ham.cheekVelL += (-ham.cheekSpringL * kSpring - ham.cheekVelL * kDamp) * dt;
  ham.cheekSpringL += ham.cheekVelL * dt;
  ham.cheekVelR += (-ham.cheekSpringR * kSpring - ham.cheekVelR * kDamp) * dt;
  ham.cheekSpringR += ham.cheekVelR * dt;

  // Natural blinking
  ham.blinkTimer -= dt;
  if (ham.blinkTimer <= 0) {
    ham.blinkTimer = randRange(2.4, 5.2);
  }
  const naturalBlink = (ham.blinkTimer < 0.14) ? Math.sin((ham.blinkTimer / 0.14) * PI) : 0;

  // Hop physics
  if (ham.hopY > 0 || ham.hopVY !== 0) {
    ham.hopVY -= 9.5 * dt;
    ham.hopY += ham.hopVY * dt;
    if (ham.hopY <= 0) { ham.hopY = 0; ham.hopVY = 0; }
  }

  // Check if player is currently holding a wheat stalk near the hamster!
  const draggedStalk = (input.mode === 'stalk' && input.activeStalk && input.activeStalk.remaining > 0) ? input.activeStalk : null;
  let stalkHead = null, stalkDist = 999;
  if (draggedStalk) {
    stalkHead = getStalkHeadWorldPos(draggedStalk);
    stalkDist = Math.hypot(stalkHead[0] - ham.x, stalkHead[2] - ham.z);
    // Wake up immediately if wheat is waved nearby!
    if (ham.state === 'sleep' && stalkDist < 2.2) {
      setHamState('idle', 0.4);
      sfx.playSqueak(true);
    }
    if (ham.state !== 'petted' && ham.state !== 'unpack' && ham.state !== 'house_peek') {
      if (stalkDist < 0.92 && totalCheekFill() < 0.98) {
        if (ham.state !== 'eat_stalk') {
          setHamState('eat_stalk', 99);
          ham.eatActionTimer = 0.22;
          sfx.playSqueak(true);
        }
      } else if (stalkDist < 2.6 && ham.state !== 'eat_stalk') {
        // Eagerly trot toward the held wheat stalk!
        const p = avoidObstacles(stalkHead[0], stalkHead[2]);
        ham.targetX = p[0]; ham.targetZ = p[1];
        if (ham.state !== 'walk' && ham.state !== 'beg') {
          ham.nextAction = 'beg';
          setHamState('walk', 4.0);
        }
      }
    }
  } else if (ham.state === 'eat_stalk') {
    // Player released the stalk!
    setHamState('idle', 1.0);
  }

  // State machine execution
  let wantStand = 0, wantLoaf = 0, wantSleep = 0, wantStretch = 0;
  let wantHappy = 0, wantEar = 0.65, wantYaw = 0, wantPitch = 0, wantRoll = 0;
  let wantMouth = 0, wantNose = 0.25;
  ham.speed = 0;

  switch (ham.state) {
    case 'idle': {
      wantEar = 0.72 + 0.15 * Math.sin(world.time * 1.9);
      wantYaw = Math.sin(world.time * 1.3) * 0.28;
      wantPitch = 0.05 + 0.06 * Math.sin(world.time * 2.1);
      wantNose = 0.45;
      // Cute occasional mini-stand sniff
      if (ham.stateTime > 0.7 && ham.stateTime < 1.55) {
        wantStand = 0.78;
        wantPitch = 0.22;
        wantNose = 0.95;
      }
      if (ham.stateTime >= ham.stateDur) {
        chooseNextHamsterBehavior();
      }
      break;
    }

    case 'walk': {
      // Continuously track dragged wheat if walking to it
      if (draggedStalk && stalkHead) {
        const p = avoidObstacles(stalkHead[0], stalkHead[2]);
        ham.targetX = p[0]; ham.targetZ = p[1];
      }
      const dx = ham.targetX - ham.x;
      const dz = ham.targetZ - ham.z;
      const dist = Math.hypot(dx, dz);
      const arrival = (ham.nextAction === 'eat_ground' || ham.nextAction === 'eat_dropped') ? 0.26 : 0.16;

      if (dist <= arrival || ham.stateTime > ham.stateDur) {
        const act = ham.nextAction || 'idle';
        ham.nextAction = null;
        if (act === 'eat_ground' && ham.targetGrain && grains.includes(ham.targetGrain)) {
          setHamState('eat_ground', 2.0);
          ham.eatActionTimer = 0.18;
        } else if (act === 'eat_dropped' && ham.targetStalk && ham.targetStalk.remaining > 0) {
          setHamState('eat_ground', 2.4);
          ham.eatActionTimer = 0.18;
        } else if (act === 'unpack') {
          setHamState('unpack', 3.4);
          ham.eatActionTimer = 0.42;
        } else if (act === 'wheel') {
          setHamState('wheel', randRange(3.2, 5.2));
        } else if (act === 'dig') {
          setHamState('dig', randRange(1.8, 2.8));
        } else if (act === 'drink') {
          setHamState('drink', randRange(2.2, 3.2));
        } else if (act === 'house_peek') {
          setHamState('house_peek', randRange(3.6, 5.0));
        } else if (act === 'bridge_perch') {
          ham.hopVY = 1.65;
          sfx.playSqueak(true);
          setHamState('bridge_perch', randRange(2.8, 4.0));
        } else if (act === 'sleep') {
          setHamState('sleep', randRange(6.5, 11.0));
        } else if (act === 'beg') {
          setHamState('beg', 2.0);
        } else {
          setHamState('idle', randRange(1.5, 2.6));
        }
      } else {
        const desiredRot = Math.atan2(dx, dz);
        ham.rotY = dampAngle(ham.rotY, desiredRot, 10.5, dt);
        // Chubby-cheek waddle is slightly slower and extra bouncy!
        const chub = totalCheekFill();
        const spd = lerp(1.18, 0.84, chub);
        const step = Math.min(dist, spd * dt);
        ham.x += (dx / dist) * step;
        ham.z += (dz / dist) * step;
        ham.speed = spd;
        ham.walkPhase += dt * (11.5 + chub * 2.0);
        // Cute chubby cheek sympathetic bounce while trotting!
        const jiggle = Math.sin(ham.walkPhase) * chub * 1.4;
        ham.cheekVelL += jiggle * dt * 16;
        ham.cheekVelR -= jiggle * dt * 16;
        wantEar = 0.85;
        wantNose = 0.65;
        wantRoll = Math.sin(ham.walkPhase) * (0.04 + chub * 0.08);
      }
      break;
    }

    case 'beg': {
      wantStand = 1.0;
      wantEar = 1.0;
      wantPitch = 0.34;
      wantNose = 1.0;
      if (stalkHead) {
        const a = Math.atan2(stalkHead[0] - ham.x, stalkHead[2] - ham.z);
        ham.rotY = dampAngle(ham.rotY, a, 12, dt);
      }
      if (!draggedStalk || ham.stateTime > ham.stateDur) {
        setHamState('idle', 1.2);
      }
      break;
    }

    case 'eat_stalk': {
      // Standing adorably upright, grabbing the dragged wheat ear & stuffing cheeks!
      wantStand = 1.0;
      wantEar = 0.92;
      wantHappy = 0.65;
      wantNose = 0.9;
      if (stalkHead && draggedStalk) {
        const a = Math.atan2(stalkHead[0] - ham.x, stalkHead[2] - ham.z);
        ham.rotY = dampAngle(ham.rotY, a, 14, dt);
        // Keep close to stalk if player pulls slightly
        if (stalkDist > 0.42 && stalkDist < 1.15) {
          const pull = (stalkDist - 0.38) * 3.0 * dt;
          ham.x += ((stalkHead[0] - ham.x) / stalkDist) * pull;
          ham.z += ((stalkHead[2] - ham.z) / stalkDist) * pull;
          ham.walkPhase += dt * 10;
        }
        wantPitch = clamp((stalkHead[1] - (ham.y + 0.46)) * 1.2, -0.15, 0.45);
        ham.nibblePhase += dt * 20;
        wantMouth = 0.4 + 0.35 * Math.sin(ham.nibblePhase);

        ham.nibbleSubTimer -= dt;
        if (ham.nibbleSubTimer <= 0) {
          ham.nibbleSubTimer = randRange(0.11, 0.18);
          sfx.playNibble();
        }
        ham.eatActionTimer -= dt;
        if (ham.eatActionTimer <= 0) {
          ham.eatActionTimer = 0.46;
          if (draggedStalk.remaining > 0 && totalCheekFill() < 0.98) {
            popKernelFromStalk(draggedStalk, false);
            stuffOneGrain('wheat');
            ham.heldGrainKind = 'wheat';
            if (totalCheekFill() >= 0.95) {
              // Cheeks are completely full!! Do happy squeak and head to unpack!
              sfx.playSqueak(true);
              ham.targetX = NEST_POS.x;
              ham.targetZ = NEST_POS.z + 0.12;
              ham.nextAction = 'unpack';
              setHamState('walk', 5.0);
            }
          } else {
            setHamState('groom', 2.0);
          }
        }
      } else {
        setHamState('idle', 0.8);
      }
      break;
    }

    case 'eat_ground': {
      // Sitting plumply on haunches, holding a grain in both tiny pink paws, nibbling & stuffing!
      wantStand = 0.86;
      wantEar = 0.84;
      wantHappy = 0.72;
      wantPitch = -0.12 + 0.06 * Math.sin(ham.nibblePhase * 0.5);
      ham.nibblePhase += dt * 22;
      wantMouth = 0.38 + 0.32 * Math.sin(ham.nibblePhase);

      if (ham.targetGrain && grains.includes(ham.targetGrain)) {
        const a = Math.atan2(ham.targetGrain.x - ham.x, ham.targetGrain.z - ham.z);
        ham.rotY = dampAngle(ham.rotY, a, 12, dt);
        ham.heldGrainKind = ham.targetGrain.kind;
      } else if (ham.targetStalk && ham.targetStalk.remaining > 0) {
        const hp = getStalkHeadWorldPos(ham.targetStalk);
        const a = Math.atan2(hp[0] - ham.x, hp[2] - ham.z);
        ham.rotY = dampAngle(ham.rotY, a, 12, dt);
        ham.heldGrainKind = 'wheat';
      }

      ham.nibbleSubTimer -= dt;
      if (ham.nibbleSubTimer <= 0) {
        ham.nibbleSubTimer = randRange(0.11, 0.18);
        sfx.playNibble();
      }

      ham.eatActionTimer -= dt;
      if (ham.eatActionTimer <= 0) {
        // Finish picking up and stuffing into cheek!
        if (ham.targetGrain && grains.includes(ham.targetGrain)) {
          const kind = ham.targetGrain.kind;
          const idx = grains.indexOf(ham.targetGrain);
          if (idx >= 0) grains.splice(idx, 1);
          ham.targetGrain = null;
          stuffOneGrain(kind);
          if (kind === 'sunflower') {
            ham.hopVY = 1.4;
            sfx.playSqueak(true);
            spawnSparkle(ham.x, ham.y + 0.45, ham.z, [1.0, 0.92, 0.48], 8);
          }
          // Check if another grain is right next to it (e.g. in the bowl!)
          const nextG = findBestLooseGrain();
          if (nextG && Math.hypot(nextG.x - ham.x, nextG.z - ham.z) < 0.55 && totalCheekFill() < 0.95) {
            ham.targetGrain = nextG;
            ham.eatActionTimer = 0.52;
            ham.stateTime = 0;
          } else {
            ham.heldGrainKind = null;
            setHamState('idle', 0.9);
          }
        } else if (ham.targetStalk && ham.targetStalk.remaining > 0 && totalCheekFill() < 0.95) {
          popKernelFromStalk(ham.targetStalk, false);
          stuffOneGrain('wheat');
          ham.eatActionTimer = 0.55;
          ham.stateTime = 0;
        } else {
          ham.targetStalk = null;
          ham.heldGrainKind = null;
          setHamState('idle', 0.9);
        }
      }
      break;
    }

    case 'unpack': {
      // THE MAGIC PAYOFF: Sitting by the wooden house nest, pushing both paws along chubby cheeks to spill a cascade of golden wheat!
      wantStand = 0.92;
      wantEar = 0.78;
      wantHappy = 0.85;
      // Face front-right so the child has a perfect view of the cheeks emptying!
      ham.rotY = dampAngle(ham.rotY, 0.45, 7, dt);
      ham.unpackPhase += dt * 7.8;
      wantPitch = -0.18 + Math.sin(ham.unpackPhase) * 0.14;
      wantMouth = 0.45 + 0.35 * Math.max(0, Math.sin(ham.unpackPhase));

      ham.eatActionTimer -= dt;
      if (ham.eatActionTimer <= 0 && ham.storedGrains.length > 0) {
        ham.eatActionTimer = 0.24;
        const kind = ham.storedGrains.pop();
        if (ham.cheekFillL >= ham.cheekFillR) {
          ham.cheekFillL = Math.max(0, ham.cheekFillL - 0.18);
          ham.cheekVelL -= 5.8;
        } else {
          ham.cheekFillR = Math.max(0, ham.cheekFillR - 0.18);
          ham.cheekVelR -= 5.8;
        }
        // Spit grain gracefully out in front of mouth into the nest hoard!
        const fx = Math.sin(ham.rotY), fz = Math.cos(ham.rotY);
        spawnGrain(
          ham.x + fx * 0.24 + randRange(-0.05, 0.05),
          ham.y + 0.34,
          ham.z + fz * 0.24 + randRange(-0.05, 0.05),
          fx * randRange(0.45, 0.95) + randRange(-0.28, 0.28),
          randRange(0.35, 0.85),
          fz * randRange(0.45, 0.95) + randRange(-0.28, 0.28),
          kind,
          true
        );
        world.hoardCount++;
        sfx.playGrainClink(false);
        spawnSparkle(ham.x + fx * 0.26, ham.y + 0.28, ham.z + fz * 0.26, [1.0, 0.88, 0.44], 3);
      }

      if (ham.storedGrains.length === 0 && ham.stateTime > 0.8) {
        ham.cheekFillL = 0; ham.cheekFillR = 0;
        ham.hopVY = 1.5;
        sfx.playSqueak(true);
        spawnSparkle(ham.x, ham.y + 0.44, ham.z, [1.0, 0.92, 0.58], 8);
        setHamState('groom', 2.4);
      }
      break;
    }

    case 'petted': {
      // Melted happy mochi loaf!
      wantLoaf = 1.0;
      wantEar = 0.14;
      wantHappy = 1.0;
      wantPitch = 0.10;
      wantNose = 0.15;
      ham.petDecay -= dt;
      if (ham.petDecay <= 0 && !input.down) {
        setHamState('groom', 2.2);
      }
      break;
    }

    case 'groom': {
      // Cute face-washing (くしくし洗顔) — paws circling snout & behind ears!
      wantStand = 0.95;
      wantEar = 0.52 + 0.2 * Math.sin(ham.groomPhase * 2);
      wantHappy = 0.85;
      ham.groomPhase += dt * 11.5;
      wantPitch = -0.14 + 0.16 * Math.sin(ham.groomPhase);
      wantRoll = 0.12 * Math.sin(ham.groomPhase * 0.5);
      if (ham.stateTime >= ham.stateDur) {
        setHamState('idle', 1.4);
      }
      break;
    }

    case 'wheel': {
      // Hop onto cork running track and run joyfully!
      const wx = WHEEL_POS.x + Math.sin(WHEEL_POS.rotY) * 0.04;
      const wz = WHEEL_POS.z + Math.cos(WHEEL_POS.rotY) * 0.04;
      ham.x = damp(ham.x, wx, 10, dt);
      ham.z = damp(ham.z, wz, 10, dt);
