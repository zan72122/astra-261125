    // 10. Fallen Leaves & Berries on the Sunlit Yard
    for (const ft of fallenTreats) {
      const m = transformTRS(ft.pos, ft.rot[1], ft.rot[0], ft.rot[2], [1, 1, 1]);
      if (ft.isBerry) passFn(MESH.berry, m, 9, [0.36, 0.06, 0.24], [0, 0.3, 0, 1]);
      else passFn(MESH.leafHeart, m, 1, [0.28, 0.64, 0.18], [0, 0.1, 0, 1]);
    }

    // 11. Interactive Mulberry Branches (in basket or held/offered)
    for (const b of branches) {
      drawBranch(b, passFn, now);
    }

    // 12. Our Stars: Mama & Baby Reticulated Giraffes!
    mama.draw(passFn);
    if (baby.active) baby.draw(passFn);

    // 13. Sunlit Butterflies
    for (const bf of butterflies) {
      const flap = Math.sin(bf.phase) * (bf.perchOn ? 0.22 : 1.05);
      const yaw = Math.atan2(bf.vel[0], bf.vel[2] || 0.001);
      const baseM = transformTRS(bf.pos, yaw, 0.12, 0, [bf.scale, bf.scale, bf.scale]);
      // Tiny dark body
      passFn(MESH.sphere, M4.mul(baseM, M4.scale(0.012, 0.012, 0.055)), 0, [0.16, 0.12, 0.10], [0.9, 0, 0, 1]);
      // Right & left flapping wings (dedicated left mesh, zero negative scale!)
      passFn(MESH.wing, M4.mul(baseM, M4.rotZ(flap)), 10, bf.col, [0.65, 0, 0, 1]);
      passFn(MESH.wingLeft, M4.mul(baseM, M4.rotZ(-flap)), 10, bf.col, [0.65, 0, 0, 1]);
    }
  } else {
    // Transparent Pass: Shimmering Water Surface inside Bucket
    const wm = transformTRS([BUCKET_POS[0], BUCKET_POS[1] + 0.285, BUCKET_POS[2]], 0, 0, 0, [1, 1, 1]);
    passFn(MESH.waterDisc, wm, 6, [1, 1, 1], [0, 0, 0, 0.84]);
  }
}

/* ============================================================================
   9. POINTER INTERACTION (5歳児のタップ＆ドラッグに完全最適化)
   ============================================================================ */
let heldBranch = null;
let offeredBranch = null;
let activePointerId = null;
let pointerDownPos = [0, 0];
let pointerDownTime = 0;
let pointerMoved = false;
let pointerAirTarget = null;
let dragPlaneZ = 2.05;
let lastRustlePos = [0, 0, 0];
let waterDipCooldown = 0;

let curCamPos = [0, 3.08, 6.25];
let curCamTarget = [0, 2.82, -1.2];
let curVP = M4.ident();
let curInvVP = M4.ident();

function screenToRay(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
  const pNear = M4.transformPoint(curInvVP, [nx, ny, -1]);
  const pFar = M4.transformPoint(curInvVP, [nx, ny, 1]);
  return { orig: pNear, dir: V3.norm(V3.sub(pFar, pNear)) };
}

function raySphereDist(ray, center, radius) {
  const oc = V3.sub(center, ray.orig);
  const proj = V3.dot(oc, ray.dir);
  if (proj < 0) return Infinity;
  const closest = V3.add(ray.orig, V3.scale(ray.dir, proj));
  const d = V3.dist(closest, center);
  return d <= radius ? proj : Infinity;
}

function rayPlaneZ(ray, zPlane) {
  if (Math.abs(ray.dir[2]) < 1e-4) return [0, 3.0, zPlane];
  const t = (zPlane - ray.orig[2]) / ray.dir[2];
  const ct = clamp(t, 0.8, 12.0);
  return V3.add(ray.orig, V3.scale(ray.dir, ct));
}

function liftBranch(b, mode = 'held') {
  if (offeredBranch && offeredBranch !== b) {
    offeredBranch.state = 'basket';
    offeredBranch = null;
  }
  b.state = mode;
  b.bendVel += rand(-2.2, 2.2);
  Sound.playRustle(0.85);
  if (mode === 'held') {
    heldBranch = b;
    canvas.classList.add('dragging');
  } else {
    offeredBranch = b;
  }
}

canvas.addEventListener('pointerdown', e => {
  Sound.init();
  if (activePointerId !== null) return;
  activePointerId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  pointerDownPos = [e.clientX, e.clientY];
  pointerDownTime = performance.now();
  pointerMoved = false;

  const ray = screenToRay(e.clientX, e.clientY);

  // 1. Check already-offered branch or basket mulberry branches (generous hitbox for 5-year-old!)
  let bestB = null, bestBD = Infinity;
  for (const b of branches) {
    if (b.state === 'spent') continue;
    const center = [b.pos[0], b.pos[1] + 0.42, b.pos[2]];
    const d = raySphereDist(ray, center, 0.46);
    if (d < bestBD) { bestBD = d; bestB = b; }
  }
  if (bestB) {
    liftBranch(bestB, 'held');
    dragPlaneZ = 2.08;
    const p = rayPlaneZ(ray, dragPlaneZ);
    bestB.targetPos = [clamp(p[0], -2.35, 2.35), clamp(p[1] - 0.35, 1.55, 4.65), dragPlaneZ];
    lastRustlePos = [...bestB.targetPos];
    return;
  }

  // 2. Check Water Bucket
  if (raySphereDist(ray, [BUCKET_POS[0], BUCKET_POS[1] + 0.25, BUCKET_POS[2]], 0.46) < Infinity) {
    addRipple(rand(-0.1, 0.1), rand(-0.1, 0.1), 1.0, performance.now() * 0.001);
    spawnWaterSplash([BUCKET_POS[0], BUCKET_POS[1] + 0.30, BUCKET_POS[2]], 18, 1.05);
    Sound.playSplash(true);
    // Giraffe peeks curiously at the splashing water!
    if (mama && V3.dist(mama.pos, BUCKET_POS) < 4.5) mama.earPerk = 0.9;
    return;
  }

  // 3. Check Hanging Wooden Wind Chime
  if (raySphereDist(ray, [CHIME_BASE[0], CHIME_BASE[1] - 0.28, CHIME_BASE[2]], 0.48) < Infinity) {
    ringChime(1.1);
    return;
  }

  // 4. Check Overhanging Mulberry Tree Bough (upper right)
  if (raySphereDist(ray, [1.85, 4.65, 0.72], 0.95) < Infinity) {
    shakeOverheadTree(1.15);
    return;
  }

  // 5. Check Butterflies (tap to make them dance!)
  for (const bf of butterflies) {
    if (raySphereDist(ray, bf.pos, 0.42) < Infinity) {
      bf.perchOn = null;
      bf.perchTimer = 0;
      bf.vel = [rand(-1.8, 1.8), rand(0.9, 1.8), rand(-1.2, 1.2)];
      spawnHappySparkles(bf.pos, 6, true);
      Sound.playChime(5);
      return;
    }
  }

  // 6. Check Petting Mama or Baby Giraffe!
  const giraffes = baby.active ? [baby, mama] : [mama];
  for (const g of giraffes) {
    const muz = g.getMuzzleWorld();
    if (raySphereDist(ray, muz, 0.48 * g.scale + 0.12) < Infinity) {
      g.onPet('nose'); return;
    }
    if (raySphereDist(ray, g.headWorldPos, 0.52 * g.scale + 0.1) < Infinity) {
      g.onPet('ear'); return;
    }
    const nb = g.getNeckBaseWorld();
    const midNeck = V3.lerp(nb, g.headWorldPos, 0.5);
    if (raySphereDist(ray, midNeck, 0.45 * g.scale + 0.1) < Infinity) {
      g.onPet('neck'); return;
    }
  }

  // 7. Gentle breeze & curious air-follow on any other touch
  const airP = rayPlaneZ(ray, 1.85);
  pointerAirTarget = [clamp(airP[0], -3.0, 3.0), clamp(airP[1], 1.2, 5.0), 1.85];
  spawnHappySparkles(pointerAirTarget, 4, true);
});

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointerId) return;
  const dist2d = Math.hypot(e.clientX - pointerDownPos[0], e.clientY - pointerDownPos[1]);
  if (dist2d > 14) pointerMoved = true;

  const ray = screenToRay(e.clientX, e.clientY);

  if (heldBranch) {
    // Smoothly adjust depth if hovering near water bucket on left!
    const pFront = rayPlaneZ(ray, 3.05);
    const overBucket = Math.hypot(pFront[0] - BUCKET_POS[0], pFront[1] - (BUCKET_POS[1] + 0.55)) < 0.72;
    dragPlaneZ = damp(dragPlaneZ, overBucket ? 3.08 : 1.98, 0.35, 1);

    const p = rayPlaneZ(ray, dragPlaneZ);
    const tx = clamp(p[0], -2.45, 2.45);
    const ty = clamp(p[1] - 0.30, 1.45, 4.75);
    heldBranch.targetPos = [tx, ty, dragPlaneZ];

    // Rustle gently when waving the branch!
    if (V3.dist(heldBranch.targetPos, lastRustlePos) > 0.65) {
      Sound.playRustle(0.45);
      lastRustlePos = [...heldBranch.targetPos];
      if (heldBranch.wetness > 0.2) {
        spawnWaterSplash([tx, ty + 0.45, dragPlaneZ], 3, 0.4);
      }
    }

    // Dip branch into the water bucket to wash & coat leaves in glistening dewdrops!
    if (overBucket && ty < BUCKET_POS[1] + 0.42 && waterDipCooldown <= 0) {
      waterDipCooldown = 0.55;
      heldBranch.wetness = 1.0;
      addRipple(rand(-0.08, 0.08), rand(-0.08, 0.08), 1.0, performance.now() * 0.001);
      spawnWaterSplash([BUCKET_POS[0], BUCKET_POS[1] + 0.30, BUCKET_POS[2]], 20, 1.0);
      Sound.playSplash(true);
    }

    // Swiping branch past the wooden chime rings it too!
    if (V3.dist([tx, ty + 0.4, dragPlaneZ], [CHIME_BASE[0], CHIME_BASE[1] - 0.3, CHIME_BASE[2]]) < 0.8) {
      if (Math.abs(chime.velZ) < 0.5) ringChime(0.8);
    }
    return;
  }

  // Swiping over water bucket, chime, or petting giraffes while dragging
  if (raySphereDist(ray, [BUCKET_POS[0], BUCKET_POS[1] + 0.25, BUCKET_POS[2]], 0.42) < Infinity && waterDipCooldown <= 0) {
    waterDipCooldown = 0.28;
    addRipple(rand(-0.12, 0.12), rand(-0.12, 0.12), 0.7, performance.now() * 0.001);
    spawnWaterSplash([BUCKET_POS[0], BUCKET_POS[1] + 0.29, BUCKET_POS[2]], 6, 0.6);
    Sound.playSplash(false);
    return;
  }
  if (raySphereDist(ray, [CHIME_BASE[0], CHIME_BASE[1] - 0.28, CHIME_BASE[2]], 0.42) < Infinity && Math.abs(chime.velZ) < 0.6) {
    ringChime(0.9);
    return;
  }

  const airP = rayPlaneZ(ray, 1.85);
  pointerAirTarget = [clamp(airP[0], -3.0, 3.0), clamp(airP[1], 1.2, 5.0), 1.85];
});

function releasePointer(e) {
  if (e.pointerId !== activePointerId) return;
  activePointerId = null;
  pointerAirTarget = null;
  canvas.classList.remove('dragging');

  if (heldBranch) {
    const b = heldBranch;
    heldBranch = null;
    const quickTap = !pointerMoved && (performance.now() - pointerDownTime < 420);
    if (quickTap || b.pos[1] > DECK_Y + 0.55) {
      // Gently hover in an inviting offered spot so even a 5-year-old who only taps can feed easily!
      b.state = 'offered';
      offeredBranch = b;
      if (quickTap) {
        const babyHere = baby.active && !baby.peeking;
        const targetX = babyHere && Math.random() < 0.45 ? -0.65 : 0.25;
        const targetY = babyHere && targetX < 0 ? 2.45 : 3.05;
        b.targetPos = [targetX, targetY, 1.92];
      } else {
        b.targetPos = [clamp(b.pos[0], -1.8, 1.8), clamp(b.pos[1], 2.15, 4.15), 1.92];
      }
    } else {
      // Returned near basket
      b.state = 'basket';
      Sound.playRustle(0.4);
    }
  }
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

/* ============================================================================
   10. SIMULATION UPDATE & MAIN RENDER LOOP
   ============================================================================ */
initMeshes();

const SUN_DIR = V3.norm([0.36, 0.89, 0.28]); // Radiant midday sun!
let lastTime = performance.now() * 0.001;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function updateSimulation(dt, now) {
  Sound.tick(dt);
  if (waterDipCooldown > 0) waterDipCooldown -= dt;

  // 1. Update Mulberry Branches (spring physics + automatic fresh basket refill!)
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (b.growIn < 1) b.growIn = Math.min(1, b.growIn + dt * 2.2);

    if (b.state === 'spent') {
      b.spentTimer += dt;
      b.pos[1] -= dt * 1.4;
      b.rotZ += dt * 1.8;
      if (b.spentTimer > 0.75) {
        // Replenish basket with a fresh, vibrant mulberry branch!
        branches[i] = createMulberryBranch(b.slotIdx);
        Sound.playRustle(0.35);
      }
      continue;
    }

    if (b.state === 'basket') {
      b.targetPos = [...b.restPos];
      b.rotZ = damp(b.rotZ, b.restRotZ + Math.sin(now * 1.7 + b.slotIdx) * 0.035, 6, dt);
      b.rotX = damp(b.rotX, b.restRotX, 6, dt);
    } else if (b.state === 'held') {
      const vx = (b.targetPos[0] - b.pos[0]);
      b.rotZ = damp(b.rotZ, clamp(-vx * 0.55, -0.65, 0.65), 8, dt);
      b.rotX = damp(b.rotX, -0.25, 8, dt);
    } else if (b.state === 'offered') {
      const hoverY = Math.sin(now * 2.1) * 0.05;
      b.rotZ = damp(b.rotZ, Math.sin(now * 1.4) * 0.09, 5, dt);
      b.rotX = damp(b.rotX, -0.28, 5, dt);
      b.pos[1] = damp(b.pos[1], b.targetPos[1] + hoverY, 7, dt);
    }

    const stiffness = b.state === 'held' ? 18 : 8;
    b.pos[0] = damp(b.pos[0], b.targetPos[0], stiffness, dt);
    if (b.state !== 'offered') b.pos[1] = damp(b.pos[1], b.targetPos[1], stiffness, dt);
    b.pos[2] = damp(b.pos[2], b.targetPos[2], stiffness, dt);

    // Branch spring bend
    b.bendVel += (-b.bend * 28.0 - b.bendVel * 5.0) * dt;
    b.bend += b.bendVel * dt;

    // Wet sparkle droplets dripping off freshly washed branch!
    if (b.wetness > 0.15) {
      b.wetness = Math.max(0, b.wetness - dt * 0.035);
      if (Math.random() < dt * 2.5) {
        spawnParticle(
          [b.pos[0] + rand(-0.18, 0.18), b.pos[1] + rand(0.25, 0.65), b.pos[2] + rand(-0.1, 0.1)],
          [rand(-0.08, 0.08), -0.35, rand(-0.08, 0.08)],
          [0.82, 0.96, 1.0, 0.85], 0.045, 0.55, 3.2, 0.2
        );
      }
    }
  }

  // 2. Update Overhanging Tree Bough spring & leaf regrowth
  overheadTree.velZ += (-overheadTree.swayZ * 12.0 - overheadTree.velZ * 2.4 + Math.sin(now * 1.3) * 0.18) * dt;
  overheadTree.swayZ += overheadTree.velZ * dt;
  overheadTree.velY += (-overheadTree.swayY * 10.0 - overheadTree.velY * 2.6) * dt;
  overheadTree.swayY += overheadTree.velY * dt;
  for (const c of overheadTree.clusters) {
    if (c.eaten) {
      c.regrow -= dt;
      if (c.regrow <= 0) c.eaten = false;
    }
  }

  // 3. Update Fallen Leaves & Berries
  for (let i = fallenTreats.length - 1; i >= 0; i--) {
    const ft = fallenTreats[i];
    ft.life -= dt;
    if (ft.life <= 0) { fallenTreats.splice(i, 1); continue; }
    if (!ft.landed) {
      if (ft.isBerry) {
        ft.vel[1] -= 4.8 * dt;
      } else {
        ft.vel[1] = Math.max(ft.vel[1] - 1.2 * dt, -0.75);
        ft.vel[0] += Math.sin(now * 4.5 + i) * 0.8 * dt;
        ft.rot[0] += dt * 1.8; ft.rot[1] += dt * 1.4;
      }
      ft.pos[0] += ft.vel[0] * dt;
      ft.pos[1] += ft.vel[1] * dt;
      ft.pos[2] += ft.vel[2] * dt;
      if (ft.pos[1] <= 0.06) {
        ft.pos[1] = 0.06; ft.landed = true;
        ft.rot[0] = 0.05; ft.rot[2] = 0;
      }
    }
  }

  // 4. Update Wooden Wind Chime Physics
  chime.velZ += (-chime.angleZ * 14.0 - chime.velZ * 1.8 + Math.sin(now * 1.5) * 0.15) * dt;
  chime.angleZ += chime.velZ * dt;
  chime.velX += (-chime.angleX * 14.0 - chime.velX * 1.8) * dt;
  chime.angleX += chime.velX * dt;
  for (const tb of chime.tubes) {
    tb.vel += (-tb.ang * 22.0 - tb.vel * 2.2) * dt;
    tb.ang += tb.vel * dt;
  }

  // 5. Update Mama & Baby Giraffes
  const activeBranch = heldBranch || offeredBranch;
  mama.update(dt, now, activeBranch, pointerAirTarget, baby);
  if (baby.active) {
    baby.update(dt, now, activeBranch, pointerAirTarget, mama);
  }

  // 6. Update Sunlit Butterflies (sometimes landing right on a giraffe's nose!)
  for (let i = 0; i < butterflies.length; i++) {
    const bf = butterflies[i];
    bf.phase += dt * (bf.perchOn ? 5.0 : 19.0);

    if (bf.perchOn) {
      bf.perchTimer -= dt;
      const muz = bf.perchOn.getMuzzleWorld();
      bf.pos = [muz[0], muz[1] + 0.12 * bf.perchOn.scale, muz[2] + 0.04];
      if (bf.perchTimer <= 0 || bf.perchOn.pluckState !== 'idle') {
        // Cute little startled nose twitch & butterfly flutters up!
        bf.perchOn.butterflyOnNose = null;
        bf.perchOn.earL = 0.7;
        bf.perchOn = null;
        bf.vel = [rand(-1.2, 1.2), 1.35, rand(-0.6, 0.8)];
      }
      continue;
    }

    // Gentle figure-8 fluttering around the sunny enclosure & branches
    const goalX = Math.sin(now * 0.42 + i * 2.1) * 2.3;
    const goalY = 3.15 + Math.sin(now * 0.85 + i * 1.7) * 0.95;
    const goalZ = 0.55 + Math.cos(now * 0.36 + i * 2.4) * 1.65;
    bf.vel[0] = damp(bf.vel[0], (goalX - bf.pos[0]) * 1.15, 2.2, dt);
    bf.vel[1] = damp(bf.vel[1], (goalY - bf.pos[1]) * 1.35 + Math.sin(bf.phase * 0.5) * 0.25, 2.5, dt);
    bf.vel[2] = damp(bf.vel[2], (goalZ - bf.pos[2]) * 1.15, 2.2, dt);
    bf.pos[0] += bf.vel[0] * dt;
    bf.pos[1] = clamp(bf.pos[1] + bf.vel[1] * dt, 1.4, 5.2);
    bf.pos[2] += bf.vel[2] * dt;

    // Occasionally perch adorably on mama or baby giraffe's nose when idle!
    if (i === 0 && Math.random() < dt * 0.06) {
      const host = (baby.active && !baby.peeking && Math.random() < 0.5) ? baby : mama;
      if (!host.butterflyOnNose && host.pluckState === 'idle' && V3.dist(bf.pos, host.getMuzzleWorld()) < 2.2) {
        bf.perchOn = host;
        bf.perchTimer = rand(2.2, 3.6);
        host.butterflyOnNose = bf;
      }
    }
  }

  // Subtle midday sunlight glint off the basket's fresh mulberry leaves when idle
  if (!heldBranch && !offeredBranch && Math.random() < dt * 0.9) {
    spawnParticle(
      [BASKET_POS[0] + rand(-0.28, 0.28), BASKET_POS[1] + rand(0.45, 0.85), BASKET_POS[2] + rand(-0.1, 0.1)],
      [rand(-0.08, 0.08), rand(0.12, 0.28), rand(-0.08, 0.08)],
      [1.0, 0.98, 0.80, 0.72], rand(0.04, 0.075), rand(0.7, 1.2), -0.05, 1.0
    );
  }

  // 7. Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vel[1] -= p.gravity * dt;
    const dr = Math.exp(-p.drag * dt);
    p.vel[0] *= dr; p.vel[1] *= dr; p.vel[2] *= dr;
    p.pos[0] += p.vel[0] * dt;
    p.pos[1] += p.vel[1] * dt;
    p.pos[2] += p.vel[2] * dt;
  }
}

function render(now) {
  const w = canvas.width, h = canvas.height;
  const aspect = w / h;

  // Responsive portrait/landscape camera framing so all props & giraffes look gorgeous on any screen!
  const portraitBoost = aspect < 0.95 ? (0.95 - aspect) * 2.1 : 0;
  const desiredCamPos = [
    Math.sin(now * 0.25) * 0.08,
    3.12 + Math.sin(now * 0.4) * 0.03 + portraitBoost * 0.22,
    6.15 + portraitBoost * 1.35
  ];
  const desiredCamTarget = [
    mama.headWorldPos[0] * 0.08,
    2.92 + (heldBranch ? (heldBranch.pos[1] - 3.0) * 0.08 : 0),
    -0.8
  ];
  curCamPos[0] = lerp(curCamPos[0], desiredCamPos[0], 0.08);
  curCamPos[1] = lerp(curCamPos[1], desiredCamPos[1], 0.08);
  curCamPos[2] = lerp(curCamPos[2], desiredCamPos[2], 0.08);
  curCamTarget[0] = lerp(curCamTarget[0], desiredCamTarget[0], 0.08);
  curCamTarget[1] = lerp(curCamTarget[1], desiredCamTarget[1], 0.08);
  curCamTarget[2] = lerp(curCamTarget[2], desiredCamTarget[2], 0.08);

  const fov = (aspect < 0.85 ? 54 : 46) * Math.PI / 180;
  const proj = M4.perspective(fov, aspect, 0.2, 120);
  const view = M4.lookAt(curCamPos, curCamTarget, [0, 1, 0]);
  curVP = M4.mul(proj, view);
  curInvVP = M4.invert(curVP);

  // Midday Directional Shadow Map Matrix
  const lightCenter = [0, 1.8, 0.2];
  const lightEye = V3.add(lightCenter, V3.scale(SUN_DIR, 18.0));
  const lightView = M4.lookAt(lightEye, lightCenter, [0, 1, 0]);
  const lightProj = M4.ortho(-7.5, 7.5, -5.8, 7.2, 2.0, 36.0);
  const lightVP = M4.mul(lightProj, lightView);

  // --- PASS 1: Real-time Midday Shadow Map ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(shadowProg);
  gl.uniformMatrix4fv(uShadow.uLightVP, false, lightVP);

  drawScene((mesh, model) => {
    gl.uniformMatrix4fv(uShadow.uModel, false, model);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }, now, false);

  // --- PASS 2: Main Screen Render ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.55, 0.80, 0.98, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 2A. Midday Sky Dome + Drifting Cumulus Clouds
  gl.depthMask(false);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(uSky.uInvVP, false, curInvVP);
  gl.uniform3fv(uSky.uCamPos, curCamPos);
  gl.uniform3fv(uSky.uSunDir, SUN_DIR);
  gl.uniform1f(uSky.uTime, now);
  gl.bindVertexArray(null);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2B. Opaque 3D Photorealistic World
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);
  gl.useProgram(mainProg);
  gl.uniformMatrix4fv(uMain.uVP, false, curVP);
  gl.uniformMatrix4fv(uMain.uLightVP, false, lightVP);
  gl.uniform3fv(uMain.uCamPos, curCamPos);
  gl.uniform3fv(uMain.uSunDir, SUN_DIR);
  gl.uniform1f(uMain.uTime, now);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(uMain.uShadowMap, 0);

  const rippleArr = new Float32Array(16);
  for (let i = 0; i < 4; i++) {
    rippleArr[i*4]   = ripples[i].x;
    rippleArr[i*4+1] = ripples[i].z;
    rippleArr[i*4+2] = ripples[i].t;
    rippleArr[i*4+3] = ripples[i].amp;
  }
  gl.uniform4fv(uMain['uRipples[0]'], rippleArr);

  const drawMainMesh = (mesh, model, matType, color, extra, sway = 0) => {
    gl.uniformMatrix4fv(uMain.uModel, false, model);
    gl.uniform1i(uMain.uMatType, matType);
    gl.uniform3fv(uMain.uColor, color);
    gl.uniform4fv(uMain.uExtra, extra);
    gl.uniform1f(uMain.uSway, sway);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  };

  drawScene(drawMainMesh, now, false);

  // 2C. Transparent Shimmering Water Surface
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  drawScene(drawMainMesh, now, true);

  // 2D. Sunlit Floating Pollen Motes + Water Droplets + Leaf Bits + Happy Sparkles
  let pCount = 0;
  for (const pm of pollen) {
    if (pCount >= MAX_PARTICLES) break;
    const o = pCount * 8;
    partData[o]   = pm.x + Math.sin(now * pm.sp + pm.ph) * 0.45;
    partData[o+1] = pm.y + Math.cos(now * pm.sp * 0.8 + pm.ph) * 0.25;
    partData[o+2] = pm.z + Math.sin(now * pm.sp * 0.6 - pm.ph) * 0.35;
    partData[o+3] = 1.0; partData[o+4] = 0.98; partData[o+5] = 0.82;
    partData[o+6] = 0.38 + 0.22 * Math.sin(now * 2.2 + pm.ph);
    partData[o+7] = pm.sz;
    pCount++;
  }
  for (const p of particles) {
    if (pCount >= MAX_PARTICLES) break;
    const o = pCount * 8;
    const fade = clamp(p.life / p.maxLife, 0, 1);
    partData[o]   = p.pos[0]; partData[o+1] = p.pos[1]; partData[o+2] = p.pos[2];
    partData[o+3] = p.col[0]; partData[o+4] = p.col[1]; partData[o+5] = p.col[2];
    partData[o+6] = p.col[3] * fade;
    partData[o+7] = p.size * (0.55 + 0.45 * fade);
    pCount++;
  }

  if (pCount > 0) {
    gl.useProgram(partProg);
    gl.uniformMatrix4fv(uPart.uVP, false, curVP);
    gl.uniform1f(uPart.uPixelScale, h * 0.72);
    gl.bindVertexArray(partVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, partVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, partData.subarray(0, pCount * 8));
    gl.drawArrays(gl.POINTS, 0, pCount);
  }

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

function loop(ms) {
  const now = ms * 0.001;
  const dt = clamp(now - lastTime, 0.001, 0.05);
  lastTime = now;
  updateSimulation(dt, now);
  render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
