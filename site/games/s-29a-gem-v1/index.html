}

function startAutoAction(type, dur) {
  state.autoAction = { type, t: 0, dur, didEffect: false };
}

function handleTap(hitId, ray) {
  if (!hitId) {
    // Tapping golden straw kicks up cheerful straw wisps!
    const p = rayPlaneZ(ray, 0.1);
    if (p[1] < 0.52) {
      SFX.strawStep();
      for (let i = 0; i < 8; i++) {
        spawnParticle({
          x: clamp(p[0], -1.2, 1.2) + rand(-0.1, 0.1), y: 0.12, z: rand(-0.4, 0.4),
          vx: rand(-0.35, 0.35), vy: rand(0.35, 0.75), vz: rand(-0.2, 0.2),
          size: 0.032, maxLife: 0.75, gravity: -1.4, r: 0.96, g: 0.80, b: 0.42, a: 0.85
        });
      }
    }
    return;
  }

  if (hitId === "bell") {
    state.bell.vel = 6.5 * (Math.random() > 0.5 ? 1 : -1);
    SFX.barnBell(false);
    state.calf.lookTarget = [-1.06, 1.38, 0.52];
    state.calf.earL = 0.45; state.calf.earR = 0.25;
    return;
  }
  if (hitId === "sparrow") {
    state.sparrow.hopVel = 1.6;
    state.sparrow.chirpTimer = 0.6;
    SFX.birdChirp(true);
    state.calf.lookTarget = [...state.sparrow.pos];
    return;
  }
  if (hitId === "butterfly") {
    state.butterfly.mode = "orbit";
    state.butterfly.timer = 4.2;
    SFX.warmChime([880, 1174.66]);
    return;
  }
  if (hitId === "crown" && state.hasCrown && !state.crownOnCalf) {
    startAutoAction("wearCrown", 0.85);
    return;
  }
  if (hitId === "ribbon" && state.hasRibbon && !state.ribbonOnCalf) {
    startAutoAction("wearRibbon", 0.85);
    return;
  }

  // Milk preparation & care auto-actions on simple tap (so 5yo never gets stuck!)
  if (hitId === "tin") {
    if (isBottleEmptyAfterFeed()) resetBottleForNextRound();
    if (!state.capped && state.powderScoops < 2) {
      startAutoAction("scoop", 0.95);
    } else if (state.capped && state.mixProgress < 1) {
      startAutoAction("shake", 0.65);
    } else {
      SFX.powderPour();
    }
    return;
  }
  if (hitId === "pitcher") {
    if (isBottleEmptyAfterFeed()) resetBottleForNextRound();
    if (!state.capped && state.waterAmount < 0.98) {
      startAutoAction("pour", 1.25);
    } else {
      SFX.waterDrop(0.5);
    }
    return;
  }
  if (hitId === "cap" && !state.capped) {
    if (state.powderScoops >= 1 || state.waterAmount >= 0.25) {
      // Allow capping once something is inside; if both ready, snaps on!
      if (state.powderScoops >= 1 && state.waterAmount >= 0.4) {
        startAutoAction("cap", 0.55);
      } else {
        // Playful tiny bounce showing cap is excited
        SFX.capPop();
        state.cap.pos[1] += 0.06;
      }
    } else {
      SFX.capPop();
      state.cap.pos[1] += 0.05;
    }
    return;
  }
  if (hitId === "bottle") {
    if (isBottleEmptyAfterFeed()) {
      resetBottleForNextRound();
      return;
    }
    if (!state.capped && state.powderScoops >= 1 && state.waterAmount >= 0.4) {
      startAutoAction("cap", 0.55);
    } else if (state.capped && state.mixProgress < 0.99) {
      startAutoAction("shake", 0.65);
    } else if (state.capped && state.mixProgress >= 0.99 && state.milkAmount > 0.01) {
      // Effortless tap-to-offer feeding!
      state.midPauseWait = 0;
      state.autoFeedTimer = 3.2;
      SFX.calfMoo("eager");
    } else if (!state.capped && state.powderScoops < 1) {
      // Gentle playful clink
      SFX.capPop();
    }
    return;
  }
  if (hitId === "towel") {
    startAutoAction("wipe", 1.05);
    return;
  }
  if (hitId === "brush") {
    startAutoAction("brush", 1.25);
    return;
  }
  if (hitId === "calfNose" || hitId === "calf" || hitId === "calfBody") {
    if (state.capped && state.mixProgress >= 0.99 && state.milkAmount > 0.01 && hitId === "calfNose") {
      // Tapping calf's expectant nose when milk is ready lifts bottle to feed!
      state.midPauseWait = 0;
      state.autoFeedTimer = 3.2;
      SFX.calfMoo("eager");
    } else {
      // Adorable nose boop / gentle pet reaction!
      state.calf.bliss = Math.min(1, state.calf.bliss + 0.65);
      state.calf.tongueTimer = 0.85;
      state.calf.tailSpeed = 7.5;
      SFX.calfMoo(state.milkAmount > 0.05 && state.mixProgress >= 0.99 ? "eager" : "happy");
      if (state.ribbonOnCalf) SFX.barnBell(true);
      spawnSparkles(state.calf.headWorld, 6);
    }
  }
}

function spawnSparkles(center, count = 5) {
  for (let i = 0; i < count; i++) {
    spawnParticle({
      x: center[0] + rand(-0.18, 0.18),
      y: center[1] + rand(-0.10, 0.18),
      z: center[2] + rand(-0.10, 0.14),
      vx: rand(-0.14, 0.14), vy: rand(0.16, 0.42), vz: rand(-0.10, 0.10),
      size: rand(0.025, 0.048), maxLife: rand(0.65, 1.15),
      r: 1.0, g: 0.94, b: 0.72, a: 0.85, additive: true
    });
  }
}

function spawnPowderPuff(pos, count = 14) {
  for (let i = 0; i < count; i++) {
    spawnParticle({
      x: pos[0] + rand(-0.025, 0.025),
      y: pos[1] + rand(-0.02, 0.02),
      z: pos[2] + rand(-0.025, 0.025),
      vx: rand(-0.08, 0.08), vy: rand(-0.35, -0.12), vz: rand(-0.08, 0.08),
      size: rand(0.022, 0.044), grow: 0.025, maxLife: rand(0.45, 0.8),
      r: 1.0, g: 0.97, b: 0.88, a: 0.72, gravity: -0.55
    });
  }
}

function onPointerDown(e) {
  e.preventDefault();
  SFX.init();
  const pt = state.pointer;
  if (pt.down) return;
  pt.down = true;
  pt.id = e.pointerId;
  pt.x = pt.startX = pt.prevX = e.clientX;
  pt.y = pt.startY = pt.prevY = e.clientY;
  pt.moved = 0;
  canvas.setPointerCapture?.(e.pointerId);

  const ray = screenToRay(e.clientX, e.clientY);
  const hit = hitTest(ray);
  pt.grabbed = hit;

  if (hit && hit !== "calf" && hit !== "calfNose" && hit !== "calfBody" && hit !== "bell" && hit !== "sparrow" && hit !== "butterfly") {
    state.autoAction = null;
    if (hit === "bottle") {
      state.autoFeedTimer = 0;
      if (isBottleEmptyAfterFeed()) resetBottleForNextRound();
      pt.dragPlaneZ = 0.82;
    } else if (hit === "towel" || hit === "brush" || hit === "crown" || hit === "ribbon") {
      pt.dragPlaneZ = 0.56;
    } else {
      pt.dragPlaneZ = 0.94;
    }
    pt.worldPos = rayPlaneZ(ray, pt.dragPlaneZ);
    pt.prevWorldPos = [...pt.worldPos];
    canvas.classList.add("dragging");
  }
}

function onPointerMove(e) {
  const pt = state.pointer;
  if (!pt.down || e.pointerId !== pt.id) return;
  e.preventDefault();
  pt.prevX = pt.x; pt.prevY = pt.y;
  pt.x = e.clientX; pt.y = e.clientY;
  const dx = pt.x - pt.prevX, dy = pt.y - pt.prevY;
  pt.moved += Math.hypot(dx, dy);

  const ray = screenToRay(e.clientX, e.clientY);
  pt.prevWorldPos = [...pt.worldPos];
  pt.worldPos = rayPlaneZ(ray, pt.dragPlaneZ);

  // Direct petting when dragging on the calf!
  if (pt.grabbed === "calf" || pt.grabbed === "calfNose" || pt.grabbed === "calfBody") {
    const speed = Math.hypot(dx, dy);
    if (speed > 2) {
      state.calf.bliss = Math.min(1, state.calf.bliss + speed * 0.008);
      state.calf.tailSpeed = 7.0;
      const p3 = rayPlaneZ(ray, 0.35);
      state.calf.lookTarget = [clamp(p3[0], -0.6, 0.6), clamp(p3[1], 0.8, 1.4), 0.75];
      if (pt.petSparkleCd <= 0) {
        pt.petSparkleCd = 0.14;
        spawnSparkles([clamp(p3[0], -0.35, 0.35), clamp(p3[1], 0.95, 1.38), 0.38], 2);
        SFX.petPurr();
      }
    }
  }
}

function onPointerUp(e) {
  const pt = state.pointer;
  if (!pt.down || e.pointerId !== pt.id) return;
  e.preventDefault();
  canvas.classList.remove("dragging");
  const wasTap = pt.moved < 14;
  const hit = pt.grabbed;
  const ray = screenToRay(e.clientX, e.clientY);

  pt.down = false;
  pt.id = null;
  pt.grabbed = null;

  if (wasTap) {
    handleTap(hit, ray);
  }
}

canvas.addEventListener("pointerdown", onPointerDown);
canvas.addEventListener("pointermove", onPointerMove);
canvas.addEventListener("pointerup", onPointerUp);
canvas.addEventListener("pointercancel", onPointerUp);

// ============================================================================
// 10. SIMULATION UPDATE (Milk Physics, Nursing Loop, Calf Life, Barn Friends)
// ============================================================================
let waterSoundTimer = 0;

function triggerFeedComplete() {
  state.milkAmount = 0;
  state.drinking = false;
  state.autoFeedTimer = 0;
  state.roundsDone++;
  state.celebrateTimer = 4.2;
  state.calf.pranceTimer = 2.6;
  state.calf.tummyFull = 1.0;
  state.calf.milkMustache = 1.0;
  state.calf.tongueTimer = 1.8;
  state.calf.bliss = 0.95;

  SFX.calfMoo("happy");
  setTimeout(() => SFX.warmChime([523.25, 659.25, 783.99, 1046.5, 1318.5]), 220);

  // Unlock delightful morning discoveries progressively!
  if (state.roundsDone >= 1 && !state.butterfly.active) {
    state.butterfly.active = true;
    state.butterfly.pos = [-1.45, 1.75, -1.2];
    state.butterfly.mode = "nose";
    state.butterfly.timer = 6.0;
  }
  if (state.roundsDone >= 2 && !state.hasCrown) {
    state.hasCrown = true;
    state.crown.pos = [...PROP_HOME.crown];
  }
  if (state.roundsDone >= 3 && !state.hasRibbon) {
    state.hasRibbon = true;
    state.ribbon.pos = [...PROP_HOME.ribbon];
  }
  if (state.roundsDone >= 2 && !state.sparrow.onRail) {
    state.sparrow.onRail = true;
    state.sparrow.home = [0.78, 0.98, 0.52];
  }
}

function update(dt) {
  dt = Math.min(dt, 0.05);
  state.time += dt;
  const t = state.time;
  const pt = state.pointer;
  if (pt.petSparkleCd > 0) pt.petSparkleCd -= dt;
  if (waterSoundTimer > 0) waterSoundTimer -= dt;
  state.streamActive = Math.max(0, state.streamActive - dt * 5);

  // Occasional gentle distant morning birdsong
  state.nextBirdTime -= dt;
  if (state.nextBirdTime <= 0) {
    state.nextBirdTime = rand(6.5, 13.5);
    SFX.birdChirp(false);
  }

  // ---- Auto-action playback (when 5yo taps a prop instead of dragging) ----
  let act = state.autoAction;
  if (act) {
    act.t += dt;
    const p = clamp(act.t / act.dur, 0, 1);
    const bp = state.bottle.pos;

    if (act.type === "scoop") {
      const arc = Math.sin(p * PI);
      const start = [PROP_HOME.tin[0] + 0.02, BENCH_Y + 0.15, PROP_HOME.tin[2]];
      const over = [bp[0] - 0.02, bp[1] + 0.34, bp[2]];
      const k = p < 0.45 ? smoothstep(0, 0.45, p) : (p > 0.72 ? 1 - smoothstep(0.72, 1, p) : 1);
      state.scoop.pos = v3Lerp(start, over, k);
      state.scoop.pos[1] += arc * 0.08;
      state.scoop.hasPowder = p > 0.12 && p < 0.56;
      const tip = smoothstep(0.42, 0.60, p) * (1 - smoothstep(0.68, 0.85, p));
      state.scoop.rot = [0.25, 0.3, -0.45 - tip * 1.65];
      if (p > 0.50 && !act.didEffect) {
        act.didEffect = true;
        state.powderScoops = Math.min(2, state.powderScoops + 1);
        SFX.powderPour();
        spawnPowderPuff([bp[0], bp[1] + 0.25, bp[2]], 18);
        state.calf.lookTarget = [bp[0], bp[1] + 0.2, bp[2]];
        if (state.powderScoops === 2) SFX.warmChime([587.33, 783.99]);
      }
    } else if (act.type === "pour") {
      const start = PROP_HOME.pitcher;
      const over = [bp[0] - 0.23, bp[1] + 0.31, bp[2]];
      const k = p < 0.28 ? smoothstep(0, 0.28, p) : (p > 0.78 ? 1 - smoothstep(0.78, 1, p) : 1);
      state.pitcher.pos = v3Lerp(start, over, k);
      const tilt = smoothstep(0.24, 0.38, p) * (1 - smoothstep(0.72, 0.86, p));
      state.pitcher.rot = [0, 0.08, -tilt * 1.05];
      if (tilt > 0.55 && state.waterAmount < 1) {
        state.waterAmount = Math.min(1, state.waterAmount + dt * 1.35);
        state.streamActive = 1;
        const pMat = m4TRS(state.pitcher.pos, state.pitcher.rot, [1, 1, 1]);
        state.streamFrom = m4TransformPoint(pMat, [0.10, 0.22, 0]);
        state.streamTo = [bp[0], bp[1] + 0.03 + state.waterAmount * 0.16, bp[2]];
        if (waterSoundTimer <= 0) { waterSoundTimer = 0.085; SFX.waterDrop(state.waterAmount); }
        if (Math.random() < 0.4) {
          spawnParticle({
            x: bp[0] + rand(-0.02, 0.02), y: bp[1] + 0.24, z: bp[2] + rand(-0.02, 0.02),
            vx: rand(-0.04, 0.04), vy: rand(0.18, 0.32), vz: rand(-0.04, 0.04),
            size: 0.045, grow: 0.04, maxLife: 0.9, r: 1, g: 0.98, b: 0.95, a: 0.28
          });
        }
        if (state.waterAmount >= 0.99 && !act.didEffect) {
          act.didEffect = true;
          SFX.warmChime([659.25, 880]);
        }
      }
    } else if (act.type === "cap") {
      const target = [bp[0], bp[1] + 0.235, bp[2]];
      state.cap.pos = v3Lerp(PROP_HOME.cap, target, smoothstep(0, 1, p));
      state.cap.pos[1] += Math.sin(p * PI) * 0.14;
      if (p >= 0.95 && !act.didEffect) {
        act.didEffect = true;
        state.capped = true;
        SFX.capPop();
        spawnSparkles(target, 6);
      }
    } else if (act.type === "shake") {
      const env = Math.sin(p * PI);
      const osc = Math.sin(p * TAU * 3.5);
      state.bottle.pos = [
        PROP_HOME.bottle[0] + osc * 0.10 * env,
        PROP_HOME.bottle[1] + 0.22 * env + Math.abs(osc) * 0.05 * env,
        PROP_HOME.bottle[2]
      ];
      state.bottle.rot = [0.08 * env, 0, osc * 0.48 * env];
      state.bottle.sloshVX += osc * 16 * dt;
      state.mixProgress = Math.min(1, state.mixProgress + dt * 0.65);
      SFX.shakeSlosh(0.95);
      if (state.mixProgress >= 0.99 && state.milkAmount <= 0 && !act.didEffect) {
        act.didEffect = true;
        state.milkAmount = 1.0;
        SFX.warmChime([523.25, 659.25, 783.99]);
        SFX.calfMoo("eager");
        spawnSparkles(v3Add(state.bottle.pos, [0, 0.16, 0]), 10);
      }
    } else if (act.type === "wipe") {
      const nose = state.calf.noseWorld;
      const k = p < 0.25 ? smoothstep(0, 0.25, p) : (p > 0.8 ? 1 - smoothstep(0.8, 1, p) : 1);
      const rub = Math.sin(p * TAU * 3.5) * 0.065 * k;
      state.towel.pos = v3Lerp(PROP_HOME.towel, [nose[0] + rub, nose[1] - 0.01, nose[2] + 0.09], k);
      state.towel.rot = [0.65 * k, 0, rub * 2.4];
      if (k > 0.7) {
        state.calf.milkMustache = Math.max(0, state.calf.milkMustache - dt * 1.9);
        state.calf.bliss = Math.min(1, state.calf.bliss + dt * 0.8);
        SFX.softStroke(true);
        if (state.calf.milkMustache <= 0.02 && !act.didEffect) {
          act.didEffect = true;
          SFX.calfMoo("happy");
          SFX.warmChime([659.25, 783.99, 1046.5]);
          spawnSparkles(nose, 8);
        }
      }
    } else if (act.type === "brush") {
      const head = state.calf.headWorld;
      const k = p < 0.22 ? smoothstep(0, 0.22, p) : (p > 0.82 ? 1 - smoothstep(0.82, 1, p) : 1);
      const stroke = Math.sin(p * TAU * 3.0) * 0.13 * k;
      state.brush.pos = v3Lerp(PROP_HOME.brush, [head[0] + stroke, head[1] + 0.09, head[2] + 0.12], k);
      state.brush.rot = [0.45 * k, -0.35, stroke * 1.4];
      if (k > 0.7) {
        state.calf.coatSheen = Math.min(1, state.calf.coatSheen + dt * 0.65);
        state.calf.bliss = Math.min(1, state.calf.bliss + dt * 1.1);
        state.calf.tailSpeed = 7.5;
        SFX.softStroke(false);
        if (Math.random() < 0.35) spawnSparkles([head[0] + stroke, head[1] + 0.08, head[2] + 0.1], 1);
        if (p > 0.75 && !act.didEffect) {
          act.didEffect = true;
          SFX.calfMoo("happy");
          if (state.ribbonOnCalf) SFX.barnBell(true);
        }
      }
    } else if (act.type === "wearCrown") {
      const target = [state.calf.headWorld[0], state.calf.headWorld[1] + 0.14, state.calf.headWorld[2]];
      state.crown.pos = v3Lerp(PROP_HOME.crown, target, smoothstep(0, 1, p));
      state.crown.pos[1] += Math.sin(p * PI) * 0.18;
      if (p >= 0.95 && !act.didEffect) {
        act.didEffect = true;
        state.crownOnCalf = true;
        SFX.warmChime([523.25, 659.25, 783.99, 1046.5]);
        SFX.calfMoo("happy");
        spawnSparkles(target, 12);
      }
    } else if (act.type === "wearRibbon") {
      const target = [state.calf.pos[0], 0.92, state.calf.pos[2] + 0.34];
      state.ribbon.pos = v3Lerp(PROP_HOME.ribbon, target, smoothstep(0, 1, p));
      state.ribbon.pos[1] += Math.sin(p * PI) * 0.16;
      if (p >= 0.95 && !act.didEffect) {
        act.didEffect = true;
        state.ribbonOnCalf = true;
        SFX.barnBell(true);
        SFX.warmChime([587.33, 739.99, 880, 1174.66]);
        SFX.calfMoo("happy");
        spawnSparkles(target, 12);
      }
    }

    if (p >= 1) state.autoAction = null;
  }

  // ---- Direct Dragging Interactions ----
  const grab = pt.down ? pt.grabbed : null;
  const bottleMouth = [state.bottle.pos[0], state.bottle.pos[1] + 0.24, state.bottle.pos[2]];

  // 1) Dragging Scoop from Milk Powder Tin
  if (grab === "tin") {
    if (isBottleEmptyAfterFeed()) resetBottleForNextRound();
    const target = [clamp(pt.worldPos[0], -1.0, 1.0), clamp(pt.worldPos[1], BENCH_Y + 0.12, 1.45), PROP_HOME.bottle[2]];
    state.scoop.pos = v3Lerp(state.scoop.pos, target, 1 - Math.exp(-18 * dt));
    if (v3Dist(state.scoop.pos, [PROP_HOME.tin[0], BENCH_Y + 0.14, PROP_HOME.tin[2]]) < 0.22) {
      state.scoop.hasPowder = true;
    }
    const overBottle = !state.capped && v3Dist(state.scoop.pos, [bottleMouth[0], bottleMouth[1] + 0.10, bottleMouth[2]]) < 0.24;
    state.scoop.rot[2] = damp(state.scoop.rot[2], overBottle ? -2.0 : -0.35, 14, dt);
    if (overBottle && state.scoop.hasPowder && state.powderScoops < 2) {
      state.scoop.hasPowder = false;
      state.powderScoops++;
      SFX.powderPour();
      spawnPowderPuff(bottleMouth, 18);
      if (state.powderScoops === 2) SFX.warmChime([587.33, 783.99]);
    }
  } else if (!act || act.type !== "scoop") {
    state.scoop.pos = v3Lerp(state.scoop.pos, [PROP_HOME.tin[0] + 0.02, BENCH_Y + 0.15, PROP_HOME.tin[2]], 1 - Math.exp(-10 * dt));
    state.scoop.rot = [damp(state.scoop.rot[0], 0.25, 10, dt), damp(state.scoop.rot[1], 0.3, 10, dt), damp(state.scoop.rot[2], -0.45, 10, dt)];
    state.scoop.hasPowder = false;
  }

  // 2) Dragging Warm Water Pitcher
  if (grab === "pitcher") {
    if (isBottleEmptyAfterFeed()) resetBottleForNextRound();
    const target = [clamp(pt.worldPos[0], -1.1, 0.9), clamp(pt.worldPos[1], BENCH_Y + 0.04, 1.45), PROP_HOME.bottle[2]];
    state.pitcher.pos = v3Lerp(state.pitcher.pos, target, 1 - Math.exp(-16 * dt));
    const nearBottle = !state.capped && Math.hypot(state.pitcher.pos[0] - (state.bottle.pos[0] - 0.20), state.pitcher.pos[1] - (state.bottle.pos[1] + 0.28)) < 0.38;
    state.pitcher.rot[2] = damp(state.pitcher.rot[2], nearBottle ? -1.04 : -0.1, 12, dt);
    if (nearBottle && state.waterAmount < 1) {
      state.waterAmount = Math.min(1, state.waterAmount + dt * 0.92);
      state.streamActive = 1;
      const pMat = m4TRS(state.pitcher.pos, state.pitcher.rot, [1, 1, 1]);
      state.streamFrom = m4TransformPoint(pMat, [0.10, 0.22, 0]);
      state.streamTo = [state.bottle.pos[0], state.bottle.pos[1] + 0.03 + state.waterAmount * 0.16, state.bottle.pos[2]];
      if (waterSoundTimer <= 0) { waterSoundTimer = 0.09; SFX.waterDrop(state.waterAmount); }
      if (state.waterAmount >= 0.99) SFX.warmChime([659.25, 880]);
    }
  } else if (!act || act.type !== "pour") {
    state.pitcher.pos = v3Lerp(state.pitcher.pos, PROP_HOME.pitcher, 1 - Math.exp(-9 * dt));
    state.pitcher.rot = [0, damp(state.pitcher.rot[1], 0.22, 9, dt), damp(state.pitcher.rot[2], 0, 9, dt)];
  }

  // 3) Dragging Rubber Nipple Cap
  if (grab === "cap" && !state.capped) {
    const target = [clamp(pt.worldPos[0], -0.9, 0.9), clamp(pt.worldPos[1], BENCH_Y + 0.02, 1.45), PROP_HOME.bottle[2]];
    state.cap.pos = v3Lerp(state.cap.pos, target, 1 - Math.exp(-18 * dt));
    if (v3Dist(state.cap.pos, bottleMouth) < 0.22 && state.powderScoops >= 1 && state.waterAmount >= 0.4) {
      state.capped = true;
      pt.grabbed = null;
      SFX.capPop();
      spawnSparkles(bottleMouth, 7);
    }
  } else if (!state.capped && (!act || act.type !== "cap")) {
    state.cap.pos = v3Lerp(state.cap.pos, PROP_HOME.cap, 1 - Math.exp(-10 * dt));
  }

  // 4) Dragging / Shaking / Feeding with the Nursing Bottle
  let wantDrink = false;
  const milkReady = state.capped && state.mixProgress >= 0.99 && state.milkAmount > 0.01;

  if (grab === "bottle") {
    const prev = [...state.bottle.pos];
    let tx = clamp(pt.worldPos[0], -0.95, 0.95);
    let ty = clamp(pt.worldPos[1] - 0.10, BENCH_Y, 1.48);
    let tz = 0.84;

    // If milk is ready and child drags near calf's mouth, magnetize smoothly into cozy nursing pose!
    const distToMouth = Math.hypot(tx - state.calf.mouthWorld[0], (ty + 0.14) - state.calf.mouthWorld[1]);
    if (milkReady && distToMouth < 0.44 && state.midPauseWait <= 0) {
      tx = lerp(tx, state.calf.mouthWorld[0] + 0.01, 0.78);
      ty = lerp(ty, state.calf.mouthWorld[1] + 0.10, 0.78);
      tz = state.calf.mouthWorld[2] + 0.33;
      wantDrink = true;
    }

    state.bottle.pos = v3Lerp(state.bottle.pos, [tx, ty, tz], 1 - Math.exp(-18 * dt));
    const vx = (state.bottle.pos[0] - prev[0]) / dt;
    const vy = (state.bottle.pos[1] - prev[1]) / dt;
    const spd = Math.hypot(vx, vy);

    // Shaking to mix powder + warm water into creamy milk!
    if (state.capped && state.mixProgress < 1 && spd > 0.45) {
      state.mixProgress = Math.min(1, state.mixProgress + spd * dt * 0.24);
      state.bottle.sloshVX += clamp(vx * 2.5, -14, 14) * dt;
      state.bottle.rot[2] = damp(state.bottle.rot[2], clamp(-vx * 0.24, -0.58, 0.58), 14, dt);
      SFX.shakeSlosh(spd * 0.45);
      if (state.mixProgress >= 0.99 && state.milkAmount <= 0) {
        state.milkAmount = 1.0;
        SFX.warmChime([523.25, 659.25, 783.99]);
        SFX.calfMoo("eager");
        spawnSparkles(v3Add(state.bottle.pos, [0, 0.15, 0]), 10);
      }
    } else if (wantDrink) {
      // Natural nursing angle: nipple angled gently toward calf's mouth!
      state.bottle.rot[0] = damp(state.bottle.rot[0], -1.85, 11, dt);
      state.bottle.rot[2] = damp(state.bottle.rot[2], 0.10, 11, dt);
    } else {
      state.bottle.rot[0] = damp(state.bottle.rot[0], 0.05, 10, dt);
      state.bottle.rot[2] = damp(state.bottle.rot[2], clamp(-vx * 0.14, -0.35, 0.35), 10, dt);
    }
  } else if (state.autoFeedTimer > 0 && milkReady) {
    state.autoFeedTimer -= dt;
    if (state.midPauseWait <= 0) {
      const m = state.calf.mouthWorld;
      const targetPos = [m[0] + 0.01, m[1] + 0.10, m[2] + 0.33];
      state.bottle.pos = v3Lerp(state.bottle.pos, targetPos, 1 - Math.exp(-10 * dt));
      state.bottle.rot[0] = damp(state.bottle.rot[0], -1.85, 10, dt);
      state.bottle.rot[2] = damp(state.bottle.rot[2], 0.08, 10, dt);
      if (v3Dist(state.bottle.pos, targetPos) < 0.20) {
        wantDrink = true;
      }
    } else {
      // Gentle pullback during cute mid-feed breath pause
      state.bottle.pos = v3Lerp(state.bottle.pos, [0.16, 0.92, 0.88], 1 - Math.exp(-7 * dt));
      state.bottle.rot[0] = damp(state.bottle.rot[0], -0.45, 7, dt);
    }
  } else if (!act || act.type !== "shake") {
    state.bottle.pos = v3Lerp(state.bottle.pos, PROP_HOME.bottle, 1 - Math.exp(-9 * dt));
    state.bottle.rot[0] = damp(state.bottle.rot[0], 0, 9, dt);
    state.bottle.rot[1] = damp(state.bottle.rot[1], 0, 9, dt);
    state.bottle.rot[2] = damp(state.bottle.rot[2], 0, 9, dt);
  }

  // Spring physics for bottle liquid sloshing
  state.bottle.sloshVX += (-state.bottle.sloshX * 36 - state.bottle.sloshVX * 4.5) * dt;
  state.bottle.sloshX = clamp(state.bottle.sloshX + state.bottle.sloshVX * dt, -0.45, 0.45);

  // ---- Nursing "Goku-Goku" Logic ----
  if (state.midPauseWait > 0) state.midPauseWait -= dt;
  state.drinking = wantDrink && milkReady && state.midPauseWait <= 0;

  if (state.drinking) {
    const prevPhase = state.drinkGulpPhase;
    state.drinkGulpPhase += dt * 2.15; // Cozy rhythmic ~2.15 gulps per second!
    state.milkAmount = Math.max(0, state.milkAmount - dt * 0.135);
    state.calf.tummyFull = Math.max(state.calf.tummyFull, 1.0 - state.milkAmount);
    state.calf.bliss = damp(state.calf.bliss, 0.85, 4, dt);
    state.calf.tailSpeed = 9.5;
    state.calf.milkMustache = Math.min(1, state.calf.milkMustache + dt * 0.16);

    // Every full gulp cycle triggers audible "goku!", throat swallow, and rising bubbles inside bottle!
    if (Math.floor(state.drinkGulpPhase) > Math.floor(prevPhase)) {
      SFX.gulp(1.0 - state.milkAmount);
      state.calf.buntPhase = 1.0;
      if (state.ribbonOnCalf && Math.random() < 0.35) SFX.barnBell(true);
      // Rising air bubbles inside the clear glass bottle!
      for (let i = 0; i < 3; i++) {
        spawnParticle({
          x: state.bottle.pos[0] + rand(-0.025, 0.025),
          y: state.bottle.pos[1] + rand(-0.02, 0.05),
          z: state.bottle.pos[2] + rand(-0.02, 0.02),
          vx: rand(-0.03, 0.03), vy: rand(0.14, 0.24), vz: rand(0.05, 0.12),
          size: rand(0.016, 0.028), maxLife: 0.55,
          r: 1.0, g: 0.99, b: 0.96, a: 0.75
        });
      }
    }

    // Adorable mid-feed happy breath break & milk-mustache lick at ~48%
    if (!state.midPauseDone && state.milkAmount < 0.50) {
      state.midPauseDone = true;
      state.midPauseWait = 1.45;
      state.calf.tongueTimer = 1.15;
      SFX.calfMoo("sigh");
      spawnSparkles(state.calf.noseWorld, 5);
    }

    // Finished last drop!
    if (state.milkAmount <= 0.005) {
      triggerFeedComplete();
    }
  } else {
    state.calf.buntPhase = Math.max(0, state.calf.buntPhase - dt * 3.5);
  }

  // 5) Dragging Soft White Cotton Towel (wipes adorable milk mustache!)
  if (grab === "towel") {
    const target = [clamp(pt.worldPos[0], -1.0, 1.0), clamp(pt.worldPos[1], BENCH_Y + 0.02, 1.5), 0.58];
    state.towel.pos = v3Lerp(state.towel.pos, target, 1 - Math.exp(-18 * dt));
    state.towel.rot = [0.65, 0, clamp((pt.worldPos[0] - pt.prevWorldPos[0]) * 6, -0.5, 0.5)];
    if (v3Dist(state.towel.pos, state.calf.noseWorld) < 0.34) {
      const move = v3Dist(pt.worldPos, pt.prevWorldPos);
      if (move > 0.003) {
        const hadMilk = state.calf.milkMustache > 0.08;
        state.calf.milkMustache = Math.max(0, state.calf.milkMustache - move * 2.4);
        state.calf.bliss = Math.min(1, state.calf.bliss + move * 1.4);
        SFX.softStroke(true);
        if (Math.random() < 0.35) spawnSparkles(state.calf.noseWorld, 1);
        if (hadMilk && state.calf.milkMustache <= 0.08) {
          SFX.calfMoo("happy");
          SFX.warmChime([659.25, 783.99, 1046.5]);
          spawnSparkles(state.calf.noseWorld, 9);
        }
      }
    }
  } else if (!act || act.type !== "wipe") {
    state.towel.pos = v3Lerp(state.towel.pos, PROP_HOME.towel, 1 - Math.exp(-9 * dt));
    state.towel.rot = [damp(state.towel.rot[0], 0, 9, dt), damp(state.towel.rot[1], -0.18, 9, dt), damp(state.towel.rot[2], 0, 9, dt)];
  }

  // 6) Dragging Soft Wooden Grooming Brush (polishes calf coat to silky sheen!)
  if (grab === "brush") {
    const target = [clamp(pt.worldPos[0], -1.0, 1.0), clamp(pt.worldPos[1], BENCH_Y + 0.02, 1.55), 0.52];
    state.brush.pos = v3Lerp(state.brush.pos, target, 1 - Math.exp(-18 * dt));
    state.brush.rot = [0.48, -0.25, clamp((pt.worldPos[0] - pt.prevWorldPos[0]) * 5, -0.5, 0.5)];
    if (v3Dist(state.brush.pos, state.calf.headWorld) < 0.46 || v3Dist(state.brush.pos, [state.calf.pos[0], 0.85, 0.1]) < 0.48) {
      const move = v3Dist(pt.worldPos, pt.prevWorldPos);
      if (move > 0.003) {
        const prevProg = state.calf.brushProgress;
        state.calf.brushProgress = Math.min(1, state.calf.brushProgress + move * 0.9);
        state.calf.coatSheen = Math.min(1, state.calf.coatSheen + move * 0.85);
        state.calf.bliss = Math.min(1, state.calf.bliss + move * 1.6);
        state.calf.tailSpeed = 8.0;
        SFX.softStroke(false);
        if (Math.random() < 0.45) spawnSparkles(state.brush.pos, 1);
        if (prevProg < 0.95 && state.calf.brushProgress >= 0.95) {
          SFX.calfMoo("happy");
          SFX.warmChime([523.25, 659.25, 783.99, 1046.5]);
          spawnSparkles(state.calf.headWorld, 12);
          state.calf.pranceTimer = 1.6;
        }
      }
    }
  } else if (!act || act.type !== "brush") {
    state.brush.pos = v3Lerp(state.brush.pos, PROP_HOME.brush, 1 - Math.exp(-9 * dt));
    state.brush.rot = [damp(state.brush.rot[0], 0, 9, dt), damp(state.brush.rot[1], -0.35, 9, dt), damp(state.brush.rot[2], 0, 9, dt)];
  }

  // 7) Dragging Unlockable Flower Crown & Ribbon
  if (grab === "crown" && state.hasCrown && !state.crownOnCalf) {
    state.crown.pos = v3Lerp(state.crown.pos, [clamp(pt.worldPos[0], -1.1, 1.1), clamp(pt.worldPos[1], 0.6, 1.6), 0.35], 1 - Math.exp(-16 * dt));
    if (v3Dist(state.crown.pos, state.calf.headWorld) < 0.36) {
      state.crownOnCalf = true; pt.grabbed = null;
      SFX.warmChime([523.25, 659.25, 783.99, 1046.5]);
      SFX.calfMoo("happy");
      spawnSparkles(state.calf.headWorld, 12);
    }
  } else if (state.hasCrown && !state.crownOnCalf && (!act || act.type !== "wearCrown")) {
    state.crown.pos = v3Lerp(state.crown.pos, PROP_HOME.crown, 1 - Math.exp(-8 * dt));
  }

  if (grab === "ribbon" && state.hasRibbon && !state.ribbonOnCalf) {
    state.ribbon.pos = v3Lerp(state.ribbon.pos, [clamp(pt.worldPos[0], -1.1, 1.1), clamp(pt.worldPos[1], 0.6, 1.6), 0.35], 1 - Math.exp(-16 * dt));
    if (v3Dist(state.ribbon.pos, [state.calf.pos[0], 0.94, 0.25]) < 0.38) {
      state.ribbonOnCalf = true; pt.grabbed = null;
      SFX.barnBell(true);
      SFX.warmChime([587.33, 739.99, 880, 1174.66]);
      SFX.calfMoo("happy");
      spawnSparkles([state.calf.pos[0], 0.94, 0.25], 12);
    }
  } else if (state.hasRibbon && !state.ribbonOnCalf && (!act || act.type !== "wearRibbon")) {
    state.ribbon.pos = v3Lerp(state.ribbon.pos, PROP_HOME.ribbon, 1 - Math.exp(-8 * dt));
  }

  // Gentle auto-refresh of empty bottle after happy care period so loop flows effortlessly
  if (isBottleEmptyAfterFeed() && state.celebrateTimer <= 0 && state.calf.milkMustache < 0.15 && !pt.down && !act) {
    state.autoResetTimer += dt;
    if (state.autoResetTimer > 6.5) {
      resetBottleForNextRound();
    }
  } else {
    state.autoResetTimer = 0;
  }
  if (state.celebrateTimer > 0) state.celebrateTimer -= dt;

  // ---- Warm Rising Steam Wisps from Pitcher & Mixed Warm Milk Bottle ----
  if (Math.random() < dt * 4.5) {
    spawnParticle({
      x: state.pitcher.pos[0] + rand(-0.025, 0.025),
      y: state.pitcher.pos[1] + 0.23,
      z: state.pitcher.pos[2] + rand(-0.025, 0.025),
      vx: rand(-0.03, 0.03), vy: rand(0.12, 0.22), vz: rand(-0.02, 0.02),
      size: 0.034, grow: 0.048, maxLife: rand(1.1, 1.7),
      r: 1.0, g: 0.98, b: 0.94, a: 0.20
    });
  }
  if ((state.waterAmount > 0.25 && !state.capped) || (milkReady && !state.drinking)) {
    if (Math.random() < dt * 3.8) {
      spawnParticle({
        x: state.bottle.pos[0] + rand(-0.02, 0.02),
        y: state.bottle.pos[1] + (state.capped ? 0.34 : 0.25),
        z: state.bottle.pos[2] + rand(-0.02, 0.02),
        vx: rand(-0.025, 0.025), vy: rand(0.11, 0.20), vz: rand(-0.02, 0.02),
        size: 0.028, grow: 0.042, maxLife: rand(0.95, 1.45),
        r: 1.0, g: 0.98, b: 0.92, a: 0.22
      });
    }
  }

  // ---- Brass Bell Pendulum ----
  state.bell.vel += (-Math.sin(state.bell.angle) * 28 - state.bell.vel * 1.9) * dt;
  state.bell.angle += state.bell.vel * dt;

  // ---- Morning Sparrow ----
  const sp = state.sparrow;
  sp.pos = v3Lerp(sp.pos, sp.home, 1 - Math.exp(-3.5 * dt));
  if (sp.hopY > 0 || sp.hopVel > 0) {
    sp.hopVel -= 9.5 * dt;
    sp.hopY = Math.max(0, sp.hopY + sp.hopVel * dt);
    if (sp.hopY <= 0) sp.hopVel = 0;
  }
  if (sp.chirpTimer > 0) sp.chirpTimer -= dt;

  // ---- Golden-White Morning Butterfly ----
  const bf = state.butterfly;
  if (bf.active) {
    bf.wingPhase += dt * (bf.mode === "nose" && v3Dist(bf.pos, bf.target) < 0.08 ? 4.5 : 19.0);
    bf.timer -= dt;
    if (bf.mode === "nose") {
      bf.target = [state.calf.noseWorld[0], state.calf.noseWorld[1] + 0.055, state.calf.noseWorld[2] + 0.03];
      if (bf.timer <= 0) { bf.mode = "orbit"; bf.timer = rand(5, 8); }
    } else {
      const ang = t * 0.9;
      bf.target = [Math.sin(ang) * 0.65, 1.38 + Math.sin(t * 2.1) * 0.20, 0.15 + Math.cos(ang * 0.7) * 0.45];
      if (bf.timer <= 0 && !state.drinking) { bf.mode = "nose"; bf.timer = rand(4.5, 7); }
    }
    bf.pos = v3Lerp(bf.pos, bf.target, 1 - Math.exp(-2.8 * dt));
  }

  // ---- Jersey Calf Procedural Life & Adorable Behavior ----
  const cf = state.calf;
  cf.bliss = Math.max(0, cf.bliss - dt * (state.drinking ? 0.05 : 0.22));
  cf.tailSpeed = damp(cf.tailSpeed, milkReady ? 6.2 : 2.1, 2.5, dt);
  cf.tailAngle += dt * cf.tailSpeed;

  // Joyful post-meal hop-prance ("zoomies" in golden straw!)
  if (cf.pranceTimer > 0) {
    cf.pranceTimer -= dt;
    cf.hopPhase += dt * 7.8;
    const h = Math.max(0, Math.sin(cf.hopPhase));
    cf.hopY = h * 0.12;
    if (Math.sin(cf.hopPhase) > 0.92 && Math.random() < 0.45) {
      SFX.strawStep();
      if (state.ribbonOnCalf) SFX.barnBell(true);
      for (let i = 0; i < 3; i++) {
        spawnParticle({
          x: cf.pos[0] + rand(-0.28, 0.28), y: 0.08, z: cf.pos[2] + rand(-0.2, 0.2),
          vx: rand(-0.45, 0.45), vy: rand(0.35, 0.8), vz: rand(-0.25, 0.35),
          size: 0.034, maxLife: 0.8, gravity: -1.6, r: 0.96, g: 0.80, b: 0.44, a: 0.85
        });
      }
    }
  } else {
    cf.hopY = damp(cf.hopY, 0, 10, dt);
  }

  // Natural blinking
  cf.blinkTimer -= dt;
  if (cf.blinkTimer <= 0) {
    cf.blinkTimer = rand(2.4, 5.2);
    cf.blink = 1.0;
  }
  cf.blink = Math.max(0, cf.blink - dt * 6.5);

  // Cute tongue licking milky nose
  if (cf.tongueTimer > 0) {
    cf.tongueTimer -= dt;
    cf.tongueOut = damp(cf.tongueOut, Math.sin(t * 9.5) * 0.5 + 0.5, 14, dt);
  } else if (cf.milkMustache > 0.35 && !state.drinking && Math.sin(t * 0.7) > 0.86) {
    cf.tongueOut = damp(cf.tongueOut, 0.75, 10, dt);
  } else {
    cf.tongueOut = damp(cf.tongueOut, 0, 10, dt);
  }

  // Where is the calf looking? (Follows active prop, bottle, butterfly, or child's touch!)
  if (state.drinking) {
    cf.lookTarget = [state.bottle.pos[0], state.bottle.pos[1] - 0.06, state.bottle.pos[2]];
  } else if (grab === "bottle" || (milkReady && !pt.down)) {
    cf.lookTarget = [state.bottle.pos[0], state.bottle.pos[1] + 0.16, state.bottle.pos[2]];
  } else if (grab === "pitcher") {
    cf.lookTarget = state.pitcher.pos;
  } else if (grab === "tin") {
    cf.lookTarget = state.scoop.pos;
  } else if (grab === "towel") {
    cf.lookTarget = state.towel.pos;
  } else if (grab === "brush") {
    cf.lookTarget = state.brush.pos;
  } else if (bf.active && bf.mode === "nose") {
    cf.lookTarget = bf.pos;
  } else if (Math.abs(state.bell.vel) > 0.8) {
    cf.lookTarget = [-1.06, 1.38, 0.52];
  } else {
    // Gentle curious gaze toward bench props & child
    cf.lookTarget = [Math.sin(t * 0.45) * 0.32, 0.92 + Math.sin(t * 0.7) * 0.08, 1.15];
  }

  // Lean lovingly over the pen rail when milk is ready, drinking, or being cared for
  const eagerLean = state.drinking ? 0.24 : (milkReady ? 0.19 : (grab === "towel" || grab === "brush" || grab === "calf" ? 0.14 : 0.04));
  cf.leanZ = damp(cf.leanZ, eagerLean, 4.5, dt);

  const toLook = v3Sub(cf.lookTarget, [cf.pos[0], 1.15, cf.pos[2] + 0.35 + cf.leanZ]);
  const targetYaw = clamp(Math.atan2(toLook[0], Math.max(0.35, toLook[2])) * 0.72, -0.52, 0.52);
  const targetPitch = clamp(-Math.atan2(toLook[1], Math.hypot(toLook[0], toLook[2])) * 0.65, -0.35, 0.38);
  const buntPitch = Math.sin(cf.buntPhase * PI) * -0.09;
  const pranceRoll = cf.pranceTimer > 0 ? Math.sin(cf.hopPhase * 1.0) * 0.14 : 0;

  cf.headYaw = damp(cf.headYaw, targetYaw, 6.5, dt);
  cf.headPitch = damp(cf.headPitch, targetPitch + buntPitch + (state.drinking ? -0.14 : 0), 7.5, dt);
  cf.headRoll = damp(cf.headRoll, -targetYaw * 0.24 + pranceRoll + (cf.bliss * 0.08 * Math.sin(t * 2.2)), 6.0, dt);

  // Expressive independent Jersey ears!
  cf.earFlickTimer -= dt;
  if (cf.earFlickTimer <= 0) {
    cf.earFlickTimer = rand(2.5, 6.2);
    cf.earFlickSide = Math.random() > 0.5 ? 1 : -1;
  }
  const gulpEarBounce = state.drinking ? Math.sin(state.drinkGulpPhase * TAU) * 0.16 : 0;
  const eagerEar = milkReady ? 0.26 : 0;
  const blissDroop = cf.bliss * -0.22;
  const flick = cf.earFlickTimer > 2.2 ? Math.sin(cf.earFlickTimer * 26) * 0.22 : 0;
  cf.earL = damp(cf.earL, eagerEar + blissDroop + gulpEarBounce + (cf.earFlickSide < 0 ? flick : 0), 10, dt);
  cf.earR = damp(cf.earR, eagerEar + blissDroop + gulpEarBounce + (cf.earFlickSide > 0 ? flick : 0), 10, dt);

  // Jaw suckling rhythm
  const targetJaw = state.drinking
    ? 0.24 + (Math.sin(state.drinkGulpPhase * TAU) * 0.5 + 0.5) * 0.18
    : (milkReady && grab === "bottle" && v3Dist(state.bottle.pos, cf.mouthWorld) < 0.65 ? 0.18 : 0.02 + cf.tongueOut * 0.14);
  cf.jawOpen = damp(cf.jawOpen, targetJaw, 18, dt);

  // ---- Update Particles ----
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.vy += p.gravity * dt;
    p.vx *= p.drag; p.vy *= p.drag; p.vz *= p.drag;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.size += p.grow * dt;
  }
}

// ============================================================================
// 11. SCENE RENDERER (Shadow Pass + Main PBR Pass + Transparent & FX Pass)
// ============================================================================
const opaqueList = [];
const transList = [];

function queueMesh(mesh, model, opts = {}) {
  const item = {
    mesh,
    model,
    color: opts.color || [1, 1, 1, 1],
    emissive: opts.emissive || [0, 0, 0],
    roughness: opts.roughness ?? 0.65,
    metallic: opts.metallic ?? 0.0,
    furSheen: opts.furSheen ?? 0.0,
    subsurface: opts.subsurface ?? 0.0,
    tex: opts.tex || null,
    texStrength: opts.texStrength ?? (opts.tex ? 1.0 : 0.0),
    texScale: opts.texScale || [1, 1],
    glowPulse: opts.glowPulse ?? 0.0,
    glass: opts.glass ? 1.0 : 0.0,
    castShadow: opts.castShadow !== false,
    recvShadow: opts.recvShadow !== false ? 1.0 : 0.0,
    doubleSided: !!opts.doubleSided,
    sunWindow: opts.sunWindow ? 1.0 : 0.0,
    sortOrder: opts.sortOrder ?? (opts.glass ? 3 : 1)
  };
  if (item.color[3] < 0.99 || item.glass > 0.5) transList.push(item);
  else opaqueList.push(item);
}

// Determine which prop should catch a subtle morning sunlit breath glint (zero arrows/icons!)
function getSubtleGlint(propName) {
  if (state.pointer.down || state.autoAction) return 0;
  const pulse = (Math.sin(state.time * 2.8) * 0.5 + 0.5) * 0.85 + 0.15;
  const milkReady = state.capped && state.mixProgress >= 0.99 && state.milkAmount > 0.01;
  if (!state.capped) {
    if (state.powderScoops < 2 && propName === "tin") return pulse;
    if (state.waterAmount < 0.85 && propName === "pitcher") return pulse * (state.powderScoops >= 1 ? 1.0 : 0.6);
    if (state.powderScoops >= 1 && state.waterAmount >= 0.45 && propName === "cap") return pulse * 1.15;
  } else if (state.mixProgress < 0.99) {
    if (propName === "bottle") return pulse * 1.15;
  } else if (milkReady) {
    if (propName === "bottle") return pulse * 1.1;
  } else {
    if (state.calf.milkMustache > 0.2 && propName === "towel") return pulse;
    if (state.calf.milkMustache <= 0.2 && state.calf.coatSheen < 0.65 && propName === "brush") return pulse;
    if (state.hasCrown && !state.crownOnCalf && propName === "crown") return pulse;
    if (state.hasRibbon && !state.ribbonOnCalf && propName === "ribbon") return pulse;
  }
  return 0;
}

function buildScene() {
  opaqueList.length = 0;
  transList.length = 0;
  const t = state.time;

  // ==========================================================================
  // A. SUN-DRENCHED MORNING WOODEN BARN ENVIRONMENT
  // ==========================================================================
  // Straw-covered barn floor
  queueMesh(MESH.box, m4TRS([0, -0.05, -0.4], [0, 0, 0], [5.8, 0.1, 4.8]), {
    color: [0.88, 0.72, 0.44, 1], roughness: 0.92, tex: TEX.straw, texScale: [3.2, 2.8], castShadow: false
  });
  // Sculpted golden straw mounds & 580+ 3D individual sunlit straw blades!
  queueMesh(MESH.sphere, m4TRS([-0.9, 0.02, -0.9], [0, 0.3, 0], [1.1, 0.13, 0.9]), {
    color: [0.92, 0.77, 0.45, 1], roughness: 0.92, tex: TEX.straw, texScale: [2.5, 2.5], castShadow: false
  });
  queueMesh(MESH.sphere, m4TRS([0.95, 0.02, -0.75], [0, -0.4, 0], [1.0, 0.14, 0.85]), {
    color: [0.90, 0.75, 0.43, 1], roughness: 0.92, tex: TEX.straw, texScale: [2.5, 2.5], castShadow: false
  });
  queueMesh(MESH.strawField, m4Identity(), {
    color: [1, 1, 1, 1], roughness: 0.82, furSheen: 0.25, doubleSided: true, castShadow: false
  });

  // Back wooden barn wall (warm aged cedar planks)
  queueMesh(MESH.box, m4TRS([0, 1.35, -2.18], [0, 0, 0], [6.2, 3.2, 0.12]), {
    color: [0.76, 0.56, 0.39, 1], roughness: 0.86, tex: TEX.wood, texScale: [3.0, 2.0], castShadow: false
  });
  // Side barn timber walls
  queueMesh(MESH.box, m4TRS([-2.45, 1.35, -0.2], [0, 0, 0], [0.14, 3.2, 4.8]), {
    color: [0.70, 0.51, 0.35, 1], roughness: 0.88, tex: TEX.wood, texScale: [2.5, 2.0], castShadow: false
  });
  queueMesh(MESH.box, m4TRS([2.45, 1.35, -0.2], [0, 0, 0], [0.14, 3.2, 4.8]), {
    color: [0.72, 0.53, 0.36, 1], roughness: 0.88, tex: TEX.wood, texScale: [2.5, 2.0], castShadow: false
  });

  // High Morning Sunlit Barn Window (upper-left) with warm cedar slats!
  queueMesh(MESH.box, m4TRS([-1.05, 1.98, -2.09], [0, 0, 0], [1.22, 0.86, 0.04]), {
    color: [1, 1, 1, 1], sunWindow: true, castShadow: false, recvShadow: false
  });
  // Window frame & sill
  const winFrameCol = [0.62, 0.44, 0.29, 1];
  queueMesh(MESH.box, m4TRS([-1.05, 1.53, -1.96], [0, 0, 0], [1.34, 0.08, 0.28]), { color: winFrameCol, roughness: 0.82, tex: TEX.wood });
  queueMesh(MESH.box, m4TRS([-1.05, 2.43, -2.02], [0, 0, 0], [1.34, 0.08, 0.16]), { color: winFrameCol, roughness: 0.82, tex: TEX.wood });
  queueMesh(MESH.box, m4TRS([-1.68, 1.98, -2.02], [0, 0, 0], [0.09, 0.96, 0.16]), { color: winFrameCol, roughness: 0.82, tex: TEX.wood });
  queueMesh(MESH.box, m4TRS([-0.42, 1.98, -2.02], [0, 0, 0], [0.09, 0.96, 0.16]), { color: winFrameCol, roughness: 0.82, tex: TEX.wood });
  queueMesh(MESH.box, m4TRS([-1.05, 1.98, -2.03], [0, 0, 0], [0.055, 0.88, 0.08]), { color: winFrameCol, roughness: 0.82, tex: TEX.wood });
  queueMesh(MESH.box, m4TRS([-1.05, 1.98, -2.03], [0, 0, 0], [1.24, 0.05, 0.08]), { color: winFrameCol, roughness: 0.82, tex: TEX.wood });

  // Vertical structural timber beams & diagonal barn brace

  queueMesh(MESH.box, m4TRS([1.2, 2.08, -2.04], [0, 0, -0.58], [0.95, 0.11, 0.11]), {

  // Little Terracotta Pot with White Morning Daisies on the Sunlit Windowsill
  const potM = m4Translate(-0.62, 1.57, -1.92);
  queueMesh(MESH.cyl, m4Mul(potM, m4TRS([0, 0.055, 0], [0, 0, 0], [0.058, 0.11, 0.058])), {
    color: [0.78, 0.44, 0.30, 1], roughness: 0.78
  });
  queueMesh(MESH.sphere, m4Mul(potM, m4TRS([0, 0.135, 0], [0, 0, 0], [0.082, 0.055, 0.075])), {

  for (const [dx, dy, dz] of [[-0.04, 0.18, 0.03], [0.035, 0.19, 0.02], [0.0, 0.21, -0.02], [-0.02, 0.16, -0.04]]) {
    queueMesh(MESH.sphere, m4Mul(potM, m4TRS([dx, dy, dz], [0, 0, 0], [0.022, 0.012, 0.022])), {

    });
    queueMesh(MESH.sphere, m4Mul(potM, m4TRS([dx, dy + 0.006, dz], [0, 0, 0], [0.009, 0.009, 0.009])), {
      color: [0.98, 0.78, 0.22, 1], roughness: 0.45
    });
  }

  // Rustic Galvanized Steel Milk Can in background right corner (authentic dairy barn!)
  queueMesh(MESH.milkCan, m4TRS([1.38, 0.02, -1.42], [0, 0.4, 0], [1, 1, 1]), {
    color: [0.76, 0.78, 0.80, 1], roughness: 0.36, metallic: 0.78
  });
  queueMesh(MESH.box, m4TRS([1.56, 0.38, -1.42], [0, 0, 0.2], [0.08, 0.025, 0.025]), {
    color: [0.68, 0.70, 0.72, 1], roughness: 0.38, metallic: 0.78
  });

  // Calf Pen Wooden Posts & Smooth Front Feeding Rail
  const postCol = [0.74, 0.55, 0.37, 1];
  for (const px of [-1.22, 1.22]) {
    queueMesh(MESH.box, m4TRS([px, 0.74, 0.52], [0, 0, 0], [0.13, 1.48, 0.13]), {
      color: postCol, roughness: 0.80, tex: TEX.wood, texScale: [0.5, 1.6]
    });
  }
  // Smooth low front horizontal rail (calf leans adorably right over this!)
  queueMesh(MESH.box, m4TRS([0, 0.50, 0.52], [0, 0, 0], [2.52, 0.11, 0.075]), {
    color: [0.80, 0.62, 0.43, 1], roughness: 0.76, tex: TEX.wood, texScale: [2.2, 0.3]
  });
  // Left & right side half-rails leaving wide inviting center window for calf's head & neck!
  queueMesh(MESH.box, m4TRS([-0.92, 0.88, 0.52], [0, 0, 0], [0.66, 0.095, 0.07]), {
    color: [0.82, 0.64, 0.45, 1], roughness: 0.75, tex: TEX.wood, texScale: [0.8, 0.3]
  });
  queueMesh(MESH.box, m4TRS([0.92, 0.88, 0.52], [0, 0, 0], [0.66, 0.095, 0.07]), {
    color: [0.82, 0.64, 0.45, 1], roughness: 0.75, tex: TEX.wood, texScale: [0.8, 0.3]
  });
  // Side pen rails running back into barn
  for (const sx of [-1.22, 1.22]) {
    queueMesh(MESH.box, m4TRS([sx, 0.88, -0.58], [0, 0, 0], [0.07, 0.095, 2.2]), {
      color: [0.76, 0.58, 0.40, 1], roughness: 0.80, tex: TEX.wood, texScale: [2.0, 0.3]
    });
    queueMesh(MESH.box, m4TRS([sx, 0.48, -0.58], [0, 0, 0], [0.07, 0.095, 2.2]), {
      color: [0.74, 0.56, 0.38, 1], roughness: 0.80, tex: TEX.wood, texScale: [2.0, 0.3]
    });
  }

  // Hanging Brass Barn Bell on Left Post Bracket
  queueMesh(MESH.box, m4TRS([-1.10, 1.46, 0.52], [0, 0, 0], [0.24, 0.04, 0.04]), {
    color: [0.42, 0.34, 0.28, 1], roughness: 0.55, metallic: 0.65
  });
  const bellM = m4Mul(m4Translate(-1.06, 1.44, 0.52), m4RotZ(state.bell.angle));
  queueMesh(MESH.bell, m4Mul(bellM, m4Translate(0, -0.11, 0)), {
    color: [0.92, 0.76, 0.42, 1], roughness: 0.28, metallic: 0.86
  });
  queueMesh(MESH.sphere, m4Mul(bellM, m4TRS([0, -0.115, 0], [0, 0, 0], [0.015, 0.015, 0.015])), {
    color: [0.78, 0.60, 0.28, 1], roughness: 0.32, metallic: 0.82
  });

  // Foreground Warm Wooden Feeding Bench / Table (right in front of child!)
  queueMesh(MESH.box, m4TRS([0, BENCH_Y - 0.035, 1.00], [0, 0, 0], [2.25, 0.07, 0.58]), {
    color: [0.85, 0.67, 0.47, 1], roughness: 0.70, tex: TEX.wood, texScale: [2.2, 0.7]
  });
  for (const lx of [-0.95, 0.95]) {
    queueMesh(MESH.box, m4TRS([lx, BENCH_Y * 0.5 - 0.04, 1.00], [0, 0, 0], [0.10, BENCH_Y, 0.42]), {
      color: [0.70, 0.52, 0.35, 1], roughness: 0.82, tex: TEX.wood
    });
  }

  // ==========================================================================
  // B. THE PALE-FAWN JERSEY CALF (Sculpted, Expressive, Plush!)
  // ==========================================================================
  const cf = state.calf;
  const breath = Math.sin(t * 2.1) * 0.014;
  const weightShift = Math.sin(t * 0.75) * 0.018;
  const bodyY = 0.61 + cf.hopY + breath * 0.4;
  const bodyPos = [cf.pos[0] + weightShift, bodyY, cf.pos[2] + cf.leanZ * 0.55];
  const bodyPitch = (cf.pranceTimer > 0 ? -cf.hopY * 1.4 : 0) + cf.leanZ * 0.16;
  const bodyM = m4TRS(bodyPos, [bodyPitch, cf.yaw + Math.sin(t * 0.55) * 0.03, weightShift * 0.6], [1, 1, 1]);

  const calfFurMat = {
    color: [1.0, 0.99, 0.97, 1],
    roughness: lerp(0.80, 0.56, cf.coatSheen),
    furSheen: lerp(0.85, 1.25, cf.coatSheen),
    tex: TEX.fur,
    texStrength: 0.42,
    texScale: [2.6, 2.2]
  };

  // Torso (gently fuller tummy as she drinks!)
  const tummyScale = 1.0 + cf.tummyFull * 0.055 + breath;
  queueMesh(MESH.calfTorso, m4Mul(bodyM, m4Scale(tummyScale, 1.0 + breath * 0.8, 1.0)), calfFurMat);

  // 4 Delicate Calf Legs (front legs lift joyfully during hop-prance!)
  const legDefs = [
    { x: -0.125, z:  0.26, front: true,  ph: 0.0 },
    { x:  0.125, z:  0.26, front: true,  ph: 0.6 },
    { x: -0.130, z: -0.27, front: false, ph: 1.8 },
    { x:  0.130, z: -0.27, front: false, ph: 2.4 }
  ];
  for (const lg of legDefs) {
    const step = cf.pranceTimer > 0
      ? Math.sin(cf.hopPhase + lg.ph) * (lg.front ? 0.52 : 0.25)
      : (lg.front ? cf.leanZ * 0.45 : -cf.leanZ * 0.2);
    const kneeBend = cf.pranceTimer > 0 && lg.front ? Math.max(0, Math.sin(cf.hopPhase + lg.ph)) * 0.65 : 0.04;
    const hipM = m4Mul(bodyM, m4TRS([lg.x, -0.04, lg.z], [step, 0, 0], [1, 1, 1]));
    queueMesh(MESH.calfLegUpper, hipM, calfFurMat);
    const kneeM = m4Mul(hipM, m4TRS([0, -0.26, 0.005], [-step * 0.55 - kneeBend, 0, 0], [1, 1, 1]));
    queueMesh(MESH.calfLegLower, kneeM, calfFurMat);
  }

  // Happy Wagging Tail!
  const tailWag = Math.sin(cf.tailAngle) * (state.drinking ? 0.62 : (cf.bliss > 0.3 ? 0.48 : 0.22));
  const tailLift = state.drinking || cf.pranceTimer > 0 ? 0.42 : 0.14;
  const tailM = m4Mul(bodyM, m4TRS([0, 0.08, -0.42], [tailLift, 0, tailWag], [1, 1, 1]));
  queueMesh(MESH.calfTail, tailM, calfFurMat);

  // Graceful Neck (leaning affectionately toward child)
  const neckM = m4Mul(bodyM, m4TRS([0, 0.14, 0.31], [0.22 + cf.leanZ * 0.72 + cf.headPitch * 0.35, cf.headYaw * 0.38, cf.headRoll * 0.35], [1, 1, 1]));
  queueMesh(MESH.calfNeck, neckM, calfFurMat);

  // Unlockable Sweet Pastel Ribbon + Tiny Gold Bell around Neck!
  if (state.ribbonOnCalf) {
    const ribM = m4Mul(neckM, m4TRS([0, 0.13, 0.06], [0.35, 0, 0], [0.125, 0.022, 0.135]));
    queueMesh(MESH.cyl, ribM, { color: [0.95, 0.62, 0.68, 1], roughness: 0.55 });
    const bellNeckM = m4Mul(neckM, m4TRS([0, 0.09, 0.19], [0, 0, Math.sin(t * 7) * (state.drinking ? 0.2 : 0.05)], [0.025, 0.025, 0.025]));
    queueMesh(MESH.sphere, bellNeckM, { color: [0.95, 0.80, 0.38, 1], roughness: 0.25, metallic: 0.88 });
  }

  // Adorable Sculpted Jersey Calf Head!
  const headM = m4Mul(neckM, m4TRS([0, 0.29, 0.14], [-0.15 + cf.headPitch * 0.65, cf.headYaw * 0.62, cf.headRoll * 0.65], [1, 1, 1]));
  queueMesh(MESH.calfHead, headM, { ...calfFurMat, subsurface: 0.22 });

  // Cache live world positions of head, nose, and mouth for interactions & nursing!
  cf.headWorld  = m4TransformPoint(headM, [0, 0.04, 0.04]);
  cf.noseWorld  = m4TransformPoint(headM, [0, -0.072, 0.265]);
  cf.mouthWorld = m4TransformPoint(headM, [0, -0.105, 0.235]);

  // Soft fluffy forehead hair tuft between ears
  queueMesh(MESH.foreheadTuft, m4Mul(headM, m4TRS([0, 0.145, -0.03], [-0.15, 0, 0], [1, 1, 1])), {
    ...calfFurMat, color: [0.95, 0.84, 0.66, 1]
  });

  // Wet Dark Nostril Indentations (subtle glossy detail on muzzle)
  for (const s of [-1, 1]) {
    queueMesh(MESH.sphere, m4Mul(headM, m4TRS([s * 0.033, -0.068, 0.264], [0, s * 0.3, 0], [0.011, 0.0085, 0.007])), {
      color: [0.12, 0.09, 0.09, 1], roughness: 0.22
    });
  }

  // Articulated Lower Jaw & Cute Pink Tongue
  const jawM = m4Mul(headM, m4TRS([0, -0.098, 0.095], [cf.jawOpen, 0, 0], [1, 1, 1]));
  queueMesh(MESH.calfJaw, jawM, calfFurMat);
  if (cf.tongueOut > 0.04) {
    const tongueCurl = Math.sin(t * 10) * 0.16;
    const tongueM = m4Mul(jawM, m4TRS([tongueCurl * 0.04, 0.012, 0.09 + cf.tongueOut * 0.065], [-0.28 * cf.tongueOut, tongueCurl, 0], [1, 1, 0.7 + cf.tongueOut * 0.5]));
    queueMesh(MESH.calfTongue, tongueM, { color: [0.96, 0.58, 0.64, 1], roughness: 0.28, subsurface: 0.55 });
  }

  // Creamy White Milk Mustache around Muzzle (appears while drinking, wipes away with towel!)
  if (cf.milkMustache > 0.03) {
    const ms = cf.milkMustache;
    const blobs = [
      [0.0,   -0.062, 0.268, 0.036, 0.018, 0.014],
      [-0.034,-0.072, 0.258, 0.028, 0.016, 0.013],
      [ 0.036,-0.070, 0.258, 0.027, 0.015, 0.013],
      [ 0.012,-0.048, 0.265, 0.016, 0.014, 0.011],
      [-0.016,-0.092, 0.246, 0.024, 0.014, 0.012]
    ];
    for (const [bx, by, bz, sx, sy, sz] of blobs) {
      queueMesh(MESH.milkBlob, m4Mul(headM, m4TRS([bx, by, bz], [0, 0, 0], [sx * ms, sy * ms, sz * ms])), {
        color: [1.0, 0.99, 0.94, clamp(ms * 1.15, 0, 0.96)], roughness: 0.34, subsurface: 0.4, castShadow: false
      });
    }
  }

  // Big Liquid Expressive Jersey Eyes + Bright Morning Catchlights + Soft Upper Eyelids + Delicate Lashes!
  const lidClose = clamp(Math.max(cf.blink, cf.bliss * 0.62), 0, 0.94);
  for (const s of [-1, 1]) {
    const eyeM = m4Mul(headM, m4TRS([s * 0.102, 0.028, 0.052], [0.05, s * 0.44, 0], [1, 1, 1]));
    // Glossy deep dark-brown eye
    queueMesh(MESH.eyeBall, eyeM, { color: [1, 1, 1, 1], roughness: 0.04, metallic: 0.04 });
    // Crisp morning window catchlight glint (gives instant puppy/calf sparkle!)
    if (lidClose < 0.75) {
      queueMesh(MESH.sphere, m4Mul(eyeM, m4TRS([-0.008, 0.009, 0.0245], [0, 0, 0], [0.0055, 0.0055, 0.003])), {
        color: [1, 1, 1, 1], emissive: [1.2, 1.15, 1.05], roughness: 0.05, castShadow: false, recvShadow: false
      });
    }
    // Soft furry upper hemisphere eyelid (wide open at -0.82, closed smoothly at +0.26!)
    const lidPitch = lerp(-0.82, 0.26, lidClose);
    const lidM = m4Mul(eyeM, m4TRS([0, 0.002, 0.0], [lidPitch, 0, 0], [1, 1, 1]));
    queueMesh(MESH.eyelid, lidM, { color: [0.80, 0.64, 0.46, 1], roughness: 0.82, furSheen: 0.4, doubleSided: true });
    // Delicate Jersey eyelashes
    queueMesh(MESH.lash, m4Mul(eyeM, m4TRS([s * 0.004, 0.022 - lidClose * 0.018, 0.024], [0.25, s * 0.15, -s * 0.25], [1, 1, 1])), {
      color: [0.16, 0.11, 0.08, 1], roughness: 0.7
    });
    // Subtle warm rose cheek glow when in pure bliss (petted, brushed, or drinking warm milk!)
    if (cf.bliss > 0.12) {
      queueMesh(MESH.sphere, m4Mul(headM, m4TRS([s * 0.112, -0.022, 0.075], [0, s * 0.4, 0], [0.032, 0.022, 0.018])), {
        color: [0.98, 0.62, 0.56, cf.bliss * 0.34], roughness: 0.9, castShadow: false, sortOrder: 0
      });
    }
  }

  // Wide Velvety Cupped Jersey Ears (subsurface backlit by morning sun, positive determinant meshes!)
  for (const s of [-1, 1]) {
    const ea = s < 0 ? cf.earL : cf.earR;
    const earBase = m4Mul(headM, m4TRS([s * 0.108, 0.082, -0.045], [0.10, s * -0.28 + s * ea * 0.35, s * (-0.12 + ea * 0.55)], [1, 1, 1]));
    queueMesh(s > 0 ? MESH.calfEarR : MESH.calfEarL, earBase, {
      ...calfFurMat, subsurface: 0.65, doubleSided: true
    });
  }

  // Unlockable White Clover & Buttercup Flower Crown on Calf's Head!
  function drawFlowerCrown(baseM, glow = 0) {
    queueMesh(MESH.cyl, m4Mul(baseM, m4Scale(0.105, 0.014, 0.105)), {
      color: [0.42, 0.64, 0.34, 1], roughness: 0.78, glowPulse: glow
    });
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      const fx = Math.cos(a) * 0.105, fz = Math.sin(a) * 0.105;
      const isButtercup = i % 2 === 1;
      const fm = m4Mul(baseM, m4TRS([fx, 0.016, fz], [0.2, -a, 0], [1, 1, 1]));
      queueMesh(MESH.sphere, m4Mul(fm, m4Scale(0.022, 0.012, 0.022)), {
        color: isButtercup ? [1.0, 0.88, 0.32, 1] : [1.0, 0.98, 0.94, 1],
        roughness: 0.55, subsurface: 0.4, glowPulse: glow
      });
      queueMesh(MESH.sphere, m4Mul(fm, m4TRS([0, 0.008, 0], [0, 0, 0], [0.009, 0.009, 0.009])), {
        color: [0.96, 0.72, 0.22, 1], roughness: 0.5
      });
    }
  }
  if (state.crownOnCalf) {
    drawFlowerCrown(m4Mul(headM, m4TRS([0, 0.135, -0.02], [-0.14, 0, 0], [1, 1, 1])), 0);
  } else if (state.hasCrown) {
    drawFlowerCrown(m4TRS(state.crown.pos, state.crown.rot, [1, 1, 1]), getSubtleGlint("crown"));
  }
  if (state.hasRibbon && !state.ribbonOnCalf) {
    const rm = m4TRS(state.ribbon.pos, state.ribbon.rot, [1, 1, 1]);
    queueMesh(MESH.cyl, m4Mul(rm, m4Scale(0.085, 0.022, 0.085)), {
      color: [0.95, 0.62, 0.68, 1], roughness: 0.55, glowPulse: getSubtleGlint("ribbon")
    });
    queueMesh(MESH.sphere, m4Mul(rm, m4TRS([0, 0.01, 0.085], [0, 0, 0], [0.022, 0.022, 0.022])), {
      color: [0.96, 0.80, 0.36, 1], roughness: 0.25, metallic: 0.85, glowPulse: getSubtleGlint("ribbon")
    });
  }

  // ==========================================================================
  // C. BARN FRIENDS (Golden-White Butterfly & Plump Morning Sparrow)
  // ==========================================================================
  if (state.butterfly.active) {
    const bf = state.butterfly;
    const flap = Math.sin(bf.wingPhase) * 0.88;
    const bfM = m4TRS(bf.pos, [0.15, Math.sin(t * 1.4) * 0.5, 0], [1, 1, 1]);
    queueMesh(MESH.sphere, m4Mul(bfM, m4Scale(0.006, 0.007, 0.022)), { color: [0.35, 0.26, 0.18, 1], roughness: 0.7 });
    queueMesh(MESH.wingR, m4Mul(bfM, m4RotZ(flap)), { color: [1, 1, 1, 0.94], roughness: 0.45, subsurface: 0.7, doubleSided: true, castShadow: false });
    queueMesh(MESH.wingL, m4Mul(bfM, m4RotZ(-flap)), { color: [1, 1, 1, 0.94], roughness: 0.45, subsurface: 0.7, doubleSided: true, castShadow: false });
  }

  // Plump Morning Sparrow perched on window sill (later visits fence rail!)
  const sp = state.sparrow;
  const spYaw = sp.onRail ? -0.8 : 0.4 + Math.sin(t * 1.2) * 0.25;
  const spM = m4TRS([sp.pos[0], sp.pos[1] + sp.hopY, sp.pos[2]], [0, spYaw, 0], [1, 1, 1]);
  queueMesh(MESH.sphere, m4Mul(spM, m4Scale(0.048, 0.042, 0.062)), { color: [0.68, 0.52, 0.38, 1], roughness: 0.82, furSheen: 0.5 });
  queueMesh(MESH.sphere, m4Mul(spM, m4TRS([0, 0.036, 0.038], [0, 0, 0], [0.032, 0.030, 0.034])), { color: [0.62, 0.44, 0.30, 1], roughness: 0.8 });
  queueMesh(MESH.sphere, m4Mul(spM, m4TRS([0, -0.008, 0.015], [0, 0, 0], [0.042, 0.034, 0.052])), { color: [0.92, 0.87, 0.79, 1], roughness: 0.82 });
  // Tiny sparrow beak & eyes
  queueMesh(MESH.cyl, m4Mul(spM, m4TRS([0, 0.034, 0.072], [PI * 0.5, 0, 0], [0.008, 0.018, 0.008])), { color: [0.88, 0.68, 0.28, 1], roughness: 0.45 });

  // ==========================================================================
  // D. FOREGROUND FEEDING BENCH PROPS (Tactile, High-Craft Materiality!)
  // ==========================================================================

  // 1) Cream Enamel Warm Water Pitcher
  const pitM = m4TRS(state.pitcher.pos, state.pitcher.rot, [1, 1, 1]);
  const pitGlint = getSubtleGlint("pitcher");
  queueMesh(MESH.pitcherBody, pitM, {
    color: [1, 1, 1, 1], roughness: 0.26, metallic: 0.05, doubleSided: true, glowPulse: pitGlint
  });
  queueMesh(MESH.pitcherHandle, m4Mul(pitM, m4TRS([-0.066, 0.115, 0], [0, 0, 0], [1, 1, 1])), {
    color: [0.35, 0.50, 0.62, 1], roughness: 0.30, glowPulse: pitGlint
  });
  // Glistening warm water surface visible inside pitcher
  queueMesh(MESH.cyl, m4Mul(pitM, m4TRS([0, 0.165, 0], [0, 0, 0], [0.064, 0.008, 0.064])), {
    color: [0.76, 0.88, 0.95, 0.72], roughness: 0.08, castShadow: false
  });

  // Dynamic glistening water stream while pouring!
  if (state.streamActive > 0.05) {
    const mid = v3Lerp(state.streamFrom, state.streamTo, 0.5);
    const diff = v3Sub(state.streamTo, state.streamFrom);
    const len = v3Len(diff);
    const tiltZ = Math.atan2(diff[0], -diff[1]);
    queueMesh(MESH.stream, m4TRS(mid, [0, 0, tiltZ], [1, len, 1]), {
      color: [0.85, 0.94, 1.0, 0.68 * state.streamActive], roughness: 0.06, glass: true, castShadow: false
    });
  }

  // 2) Milk Replacer Powder Tin + Wooden Scoop
  const tinGlint = getSubtleGlint("tin");
  const tinM = m4TRS(PROP_HOME.tin, [0, 0.15, 0], [1, 1, 1]);
  queueMesh(MESH.powderTin, tinM, { color: [1, 1, 1, 1], roughness: 0.36, metallic: 0.15, glowPulse: tinGlint });
  queueMesh(MESH.powderSurface, m4Mul(tinM, m4Translate(0, 0.118, 0)), {
    color: [0.99, 0.96, 0.87, 1], roughness: 0.92, glowPulse: tinGlint
  });
  // Wooden Scoop
  const scM = m4TRS(state.scoop.pos, state.scoop.rot, [1, 1, 1]);
  queueMesh(MESH.scoopBowl, scM, { color: [0.86, 0.68, 0.44, 1], roughness: 0.72, tex: TEX.wood, glowPulse: tinGlint });
  queueMesh(MESH.scoopHandle, m4Mul(scM, m4TRS([-0.065, 0.036, 0], [0, 0, 1.32], [1, 1, 1])), {
    color: [0.82, 0.64, 0.40, 1], roughness: 0.74, tex: TEX.wood, glowPulse: tinGlint
  });
  if (state.scoop.hasPowder) {
    queueMesh(MESH.sphere, m4Mul(scM, m4TRS([0, 0.025, 0], [0, 0, 0], [0.026, 0.018, 0.026])), {
      color: [1.0, 0.97, 0.88, 1], roughness: 0.92
    });
  }

  // 3) Clear Glass Calf Nursing Bottle + Dynamic Internal Powder & Swirling Warm Milk!
  const bGlint = getSubtleGlint("bottle");
  const botM = m4TRS(state.bottle.pos, state.bottle.rot, [1, 1, 1]);

  // Powder mound at bottom of bottle (dissolves smoothly as child shakes!)
  const undissolvedPowder = (state.powderScoops / 2) * (1 - state.mixProgress);
  if (undissolvedPowder > 0.02) {
    const ph = 0.048 * undissolvedPowder;
    queueMesh(MESH.powderMound, m4Mul(botM, m4TRS([0, 0.012, 0], [0, 0, 0], [1, ph, 1])), {
      color: [1.0, 0.96, 0.84, 0.96], roughness: 0.92, castShadow: false, sortOrder: 0
    });
  }

  // Dynamic Liquid inside bottle: shifts from clear warm water -> rich creamy ivory milk, drains as calf gulps!
  const rawFill = state.mixProgress >= 0.99 ? state.milkAmount : state.waterAmount;
  if (rawFill > 0.015) {
    const h = 0.175 * rawFill;
    const isInverted = Math.abs(state.bottle.rot[0]) > 1.1;
    // When inverted for nursing, milk rests toward the bottle shoulder/nipple end!
    const liqY = isInverted ? (0.205 - h * 0.5) : (0.014 + h * 0.5);
    const mixCol = [
      lerp(0.84, 1.0, state.mixProgress),
      lerp(0.92, 0.98, state.mixProgress),
      lerp(0.96, 0.90, state.mixProgress),
      lerp(0.46, 0.97, state.mixProgress)
    ];
    const sloshM = m4Mul(botM, m4TRS([0, liqY, 0], [0, 0, state.bottle.sloshX * 0.35], [1, h, 1]));
    queueMesh(MESH.bottleLiquid, sloshM, {
      color: mixCol, roughness: lerp(0.12, 0.32, state.mixProgress), subsurface: 0.45 * state.mixProgress, castShadow: false, sortOrder: 1
    });
    // Frothy milk foam ring on top of mixed milk!
    if (state.mixProgress > 0.25) {
      const foamY = isInverted ? (0.205 - h) : (0.014 + h);
      queueMesh(MESH.cyl, m4Mul(botM, m4TRS([0, foamY, 0], [0, 0, state.bottle.sloshX * 0.35], [0.060, 0.012, 0.060])), {
        color: [1.0, 0.995, 0.96, 0.88 * state.mixProgress], roughness: 0.55, castShadow: false, sortOrder: 2
      });
    }
  }

  // Clear Glass Bottle Shell (rendered in transparent pass with Fresnel reflections!)
  queueMesh(MESH.bottleGlass, botM, {
    color: [0.95, 0.98, 1.0, 0.22], roughness: 0.06, glass: true, glowPulse: bGlint, doubleSided: true, sortOrder: 3
  });

  // Soft Peach Rubber Calf Nipple & Cream Collar (either next to bottle or snapped snugly onto bottle!)
  const capGlint = state.capped ? bGlint : getSubtleGlint("cap");
  const capM = state.capped
    ? m4Mul(botM, m4Translate(0, 0.232, 0))
    : m4TRS(state.cap.pos, state.cap.rot, [1, 1, 1]);
  queueMesh(MESH.bottleCollar, capM, {
    color: [0.96, 0.94, 0.88, 1], roughness: 0.35, glowPulse: capGlint
  });
  queueMesh(MESH.bottleNipple, m4Mul(capM, m4Translate(0, 0.032, 0)), {
    color: [0.92, 0.64, 0.54, 1], roughness: 0.44, subsurface: 0.65, glowPulse: capGlint
  });

  // 4) Folded Soft White Cotton Towel
  const towM = m4TRS(state.towel.pos, state.towel.rot, [1, 1, 1]);
  queueMesh(MESH.towel, m4Mul(towM, m4Translate(0, 0.028, 0)), {
    color: [1, 1, 1, 1], roughness: 0.90, furSheen: 0.45, tex: TEX.linen, texScale: [3, 3], glowPulse: getSubtleGlint("towel")
  });

  // 5) Soft Wooden Grooming Brush
  const brGlint = getSubtleGlint("brush");
  const brM = m4TRS(state.brush.pos, state.brush.rot, [1, 1, 1]);
  queueMesh(MESH.brushBack, m4Mul(brM, m4Translate(0, 0.038, 0)), {
    color: [0.80, 0.58, 0.36, 1], roughness: 0.55, tex: TEX.wood, glowPulse: brGlint
  });
  queueMesh(MESH.brushBristles, m4Mul(brM, m4Translate(0, 0.019, 0)), {
    color: [0.95, 0.90, 0.78, 1], roughness: 0.92, furSheen: 0.55, glowPulse: brGlint
  });
}

function drawMeshItem(item, prog) {
  const u = prog.u;
  gl.uniformMatrix4fv(u.uModel, false, item.model);
  if (prog === mainProg) {
    gl.uniformMatrix3fv(u.uNormalMat, false, m4NormalMat3(item.model));
    gl.uniform4fv(u.uBaseColor, item.color);
    gl.uniform3fv(u.uEmissive, item.emissive);
    gl.uniform1f(u.uRoughness, item.roughness);
    gl.uniform1f(u.uMetallic, item.metallic);
    gl.uniform1f(u.uFurSheen, item.furSheen);
    gl.uniform1f(u.uSubsurface, item.subsurface);
    gl.uniform1f(u.uUseTex, item.tex ? item.texStrength : 0.0);
    gl.uniform2fv(u.uTexScale, item.texScale);
    gl.uniform1f(u.uGlowPulse, item.glowPulse);
    gl.uniform1f(u.uGlass, item.glass);
    gl.uniform1f(u.uShadowRecv, item.recvShadow);
    gl.uniform1f(u.uSunWindow, item.sunWindow);
    if (item.tex) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, item.tex);
    }
  }
  if (item.doubleSided) gl.disable(gl.CULL_FACE);
  else gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(item.mesh.vao);
  gl.drawElements(gl.TRIANGLES, item.mesh.count, item.mesh.type, 0);
}

// Render Volumetric Morning Sunbeams + Floating Dust Motes & Particles
function renderFX() {
  gl.useProgram(fxProg.prog);
  gl.uniformMatrix4fv(fxProg.u.uViewProj, false, cam.vp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, TEX.sprite);
  gl.uniform1i(fxProg.u.uSprite, 0);

  gl.enable(gl.BLEND);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);

  // 1) Volumetric Diagonal Morning Sunbeams slanting from upper-left barn window!
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.uniform1f(fxProg.u.uMode, 1.0);
  const beams = [
    { top: [-1.35, 2.30, -1.95], bot: [ 0.15, 0.15,  0.45], w: 0.42, a: 0.085 },
    { top: [-0.82, 2.25, -1.95], bot: [ 0.72, 0.18,  0.65], w: 0.46, a: 0.075 },
    { top: [-1.10, 1.85, -1.95], bot: [ 0.38, 0.05,  0.95], w: 0.52, a: 0.060 }
  ];
  let q = 0;
  for (const b of beams) {
    const dir = v3Norm(v3Sub(b.bot, b.top));
    const view = v3Norm(v3Sub(cam.pos, v3Lerp(b.top, b.bot, 0.5)));
    const side = v3Scale(v3Norm(v3Cross(dir, view)), b.w);
    const p0 = v3Sub(b.top, side), p1 = v3Add(b.top, side);
    const p2 = v3Add(b.bot, v3Scale(side, 1.45)), p3 = v3Sub(b.bot, v3Scale(side, 1.45));
    const o = q * 36;
    const verts = [[p0, 0, 0], [p1, 1, 0], [p2, 1, 1], [p3, 0, 1]];
    for (let k = 0; k < 4; k++) {
      const vo = o + k * 9;
      fxData[vo] = verts[k][0][0]; fxData[vo+1] = verts[k][0][1]; fxData[vo+2] = verts[k][0][2];
      fxData[vo+3] = verts[k][1];  fxData[vo+4] = verts[k][2];
      fxData[vo+5] = 1.0; fxData[vo+6] = 0.90; fxData[vo+7] = 0.66; fxData[vo+8] = b.a;
    }
    q++;
  }
  gl.bindVertexArray(fxVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, fxVbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxData.subarray(0, q * 36));
  gl.drawElements(gl.TRIANGLES, q * 6, gl.UNSIGNED_SHORT, 0);

  // 2) Billboard Particles (Standard alpha-blended: steam, powder, straw, milk bubbles)
  gl.uniform1f(fxProg.u.uMode, 0.0);
  const pushBillboards = (additive) => {
    let cnt = 0;
    const addQuad = (x, y, z, sz, r, g, b, a) => {
      if (cnt >= MAX_FX_QUADS) return;
      const rx = cam.right[0] * sz, ry = cam.right[1] * sz, rz = cam.right[2] * sz;
      const ux = cam.up[0] * sz,    uy = cam.up[1] * sz,    uz = cam.up[2] * sz;
      const o = cnt * 36;
      const cs = [
        [x - rx - ux, y - ry - uy, z - rz - uz, 0, 0],
        [x + rx - ux, y + ry - uy, z + rz - uz, 1, 0],
        [x + rx + ux, y + ry + uy, z + rz + uz, 1, 1],
        [x - rx + ux, y - ry + uy, z - rz + uz, 0, 1]
      ];
      for (let k = 0; k < 4; k++) {
        const vo = o + k * 9;
        fxData[vo]=cs[k][0]; fxData[vo+1]=cs[k][1]; fxData[vo+2]=cs[k][2];
        fxData[vo+3]=cs[k][3]; fxData[vo+4]=cs[k][4];
        fxData[vo+5]=r; fxData[vo+6]=g; fxData[vo+7]=b; fxData[vo+8]=a;
      }
      cnt++;
    };

    if (additive) {
      // Ambient golden morning dust motes drifting softly in sunbeams
      for (const d of dustMotes) {
        const mx = d.x + Math.sin(state.time * d.spd + d.ph) * 0.14;
        const my = d.y + Math.cos(state.time * d.spd * 0.7 + d.ph) * 0.09;
        const tw = 0.35 + 0.65 * (Math.sin(state.time * 1.8 + d.ph) * 0.5 + 0.5);
        addQuad(mx, my, d.z, d.sz, 1.0, 0.93, 0.72, 0.42 * tw);
      }
    }
    for (const p of particles) {
      if (p.additive !== additive) continue;
      const f = p.life / p.maxLife;
      const alpha = p.a * Math.sin(clamp(f, 0, 1) * PI);
      addQuad(p.x, p.y, p.z, p.size, p.r, p.g, p.b, alpha);
    }
    if (cnt > 0) {
      gl.blendFunc(gl.SRC_ALPHA, additive ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxData.subarray(0, cnt * 36));
      gl.drawElements(gl.TRIANGLES, cnt * 6, gl.UNSIGNED_SHORT, 0);
    }
  };
  pushBillboards(false);
  pushBillboards(true);

  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
}

// ============================================================================
// 12. MAIN RENDER LOOP & RESPONSIVE VIEWPORT
// ============================================================================
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
  cam.aspect = w / h;
  // Adaptive FOV so all foreground bench props stay reachable even on vertical tablets/phones!
  const minHalfW = 1.04;
  const baseFov = 40 * PI / 180;
  const neededHalfH = minHalfW / Math.max(0.45, cam.aspect);
  const neededFov = 2 * Math.atan(neededHalfH / 2.02);
  cam.fovY = clamp(Math.max(baseFov, neededFov), baseFov, 68 * PI / 180);
}
window.addEventListener("resize", resize);
resize();

let lastTime = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastTime) * 0.001, 0.05);
  lastTime = now;

  update(dt);

  // Subtle living camera breathing & gentle focus during feeding
  const t = state.time;
  const focusShift = state.drinking ? 0.10 : 0.0;
  cam.pos = [
    Math.sin(t * 0.35) * 0.035,
    1.32 + Math.cos(t * 0.5) * 0.012 - focusShift * 0.25,
    2.86 - focusShift * 1.6
  ];
  cam.target = [0.0, 0.86 + focusShift * 0.65, 0.08];
  cam.view = m4LookAt(cam.pos, cam.target, [0, 1, 0]);
  cam.proj = m4Perspective(cam.fovY, cam.aspect, 0.1, 24.0);
  cam.vp = m4Mul(cam.proj, cam.view);
  cam.invVP = m4Invert(cam.vp);
  cam.right = [cam.view[0], cam.view[4], cam.view[8]];
  cam.up    = [cam.view[1], cam.view[5], cam.view[9]];

  buildScene();

  // ---- Pass 1: Shadow Map ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(shadowProg.prog);
  gl.uniformMatrix4fv(shadowProg.u.uLightVP, false, LIGHT_VP);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(2.0, 2.5);
  for (const item of opaqueList) {
    if (item.castShadow) drawMeshItem(item, shadowProg);
  }
  gl.disable(gl.POLYGON_OFFSET_FILL);

  // ---- Pass 2: Main Lit PBR Scene ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.24, 0.18, 0.13, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(mainProg.prog);
  gl.uniformMatrix4fv(mainProg.u.uViewProj, false, cam.vp);
  gl.uniformMatrix4fv(mainProg.u.uLightVP, false, LIGHT_VP);
  gl.uniform3fv(mainProg.u.uCamPos, cam.pos);
  gl.uniform3fv(mainProg.u.uLightDir, LIGHT_DIR);
  gl.uniform3fv(mainProg.u.uLightColor, LIGHT_COLOR);
  gl.uniform1i(mainProg.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(mainProg.u.uShadowMap, 1);

  gl.disable(gl.BLEND);
  gl.depthMask(true);
  for (const item of opaqueList) drawMeshItem(item, mainProg);

  // ---- Pass 3: Translucent Milk, Glass Bottle & Foam (Back-to-front sorted) ----
  transList.sort((a, b) => {
    const za = a.model[14], zb = b.model[14];
    if (Math.abs(za - zb) < 0.09) return a.sortOrder - b.sortOrder;
    return za - zb;
  });
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  for (const item of transList) drawMeshItem(item, mainProg);

  // ---- Pass 4: Volumetric Morning Sunbeams & Dust/Steam/Sparkle Particles ----
  renderFX();
}

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
