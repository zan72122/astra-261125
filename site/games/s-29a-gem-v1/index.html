<canvas id="c"></canvas>
<script>
(() => {
"use strict";

// ============================================================================
// 1. MATH UTILITIES (Vec3, Mat4, Smooth Damping)
// ============================================================================
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);

function v3(x = 0, y = 0, z = 0) { return [x, y, z]; }
function v3Add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function v3Sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function v3Scale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function v3Dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function v3Cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function v3Len(a) { return Math.hypot(a[0], a[1], a[2]); }
function v3Dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }
function v3Norm(a) { const l = v3Len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
function v3Lerp(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function m4Identity() {
  const m = new Float32Array(16);
  m[0] = m[5] = m[10] = m[15] = 1;
  return m;
}
function m4Mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    o[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
    o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
    o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return o;
}
function m4Translate(x, y, z) {
  const m = m4Identity(); m[12] = x; m[13] = y; m[14] = z; return m;
}
function m4Scale(x, y, z) {
  const m = m4Identity(); m[0] = x; m[5] = y; m[10] = z; return m;
}
function m4RotX(r) {
  const m = m4Identity(), c = Math.cos(r), s = Math.sin(r);
  m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m;
}
function m4RotY(r) {
  const m = m4Identity(), c = Math.cos(r), s = Math.sin(r);
  m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m;
}
function m4RotZ(r) {
  const m = m4Identity(), c = Math.cos(r), s = Math.sin(r);
  m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m;
}
function m4TRS(pos, rot, scale) {
  let m = m4Translate(pos[0], pos[1], pos[2]);
  if (rot[1]) m = m4Mul(m, m4RotY(rot[1]));
  if (rot[0]) m = m4Mul(m, m4RotX(rot[0]));
  if (rot[2]) m = m4Mul(m, m4RotZ(rot[2]));
  if (scale[0] !== 1 || scale[1] !== 1 || scale[2] !== 1) m = m4Mul(m, m4Scale(scale[0], scale[1], scale[2]));
  return m;
}
function m4Perspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY * 0.5);
  const nf = 1 / (near - far);
  const m = new Float32Array(16);
  m[0] = f / aspect; m[5] = f; m[10] = (far + near) * nf; m[11] = -1; m[14] = 2 * far * near * nf;
  return m;
}
function m4Ortho(l, r, b, t, n, f) {
  const m = new Float32Array(16);
  m[0] = 2 / (r - l); m[5] = 2 / (t - b); m[10] = -2 / (f - n); m[15] = 1;
  m[12] = -(r + l) / (r - l); m[13] = -(t + b) / (t - b); m[14] = -(f + n) / (f - n);
  return m;
}
function m4LookAt(eye, target, up) {
  const z = v3Norm(v3Sub(eye, target));
  const x = v3Norm(v3Cross(up, z));
  const y = v3Cross(z, x);
  const m = new Float32Array(16);
  m[0] = x[0]; m[4] = x[1]; m[8]  = x[2]; m[12] = -v3Dot(x, eye);
  m[1] = y[0]; m[5] = y[1]; m[9]  = y[2]; m[13] = -v3Dot(y, eye);
  m[2] = z[0]; m[6] = z[1]; m[10] = z[2]; m[14] = -v3Dot(z, eye);
  m[15] = 1;
  return m;
}
function m4Invert(m) {
  const o = new Float32Array(16);
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det = b00*b11 - b01*b10 + b02*b09 + b03*b08 - b04*b07 + b05*b06;
  if (!det) return m4Identity();
  det = 1 / det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det; o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det; o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det; o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det; o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det; o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;
  return o;
}
function m4NormalMat3(m) {
  const a00=m[0],a01=m[1],a02=m[2], a10=m[4],a11=m[5],a12=m[6], a20=m[8],a21=m[9],a22=m[10];
  const b01 = a22*a11 - a12*a21, b11 = -a22*a10 + a12*a20, b21 = a21*a10 - a11*a20;
  let det = a00*b01 + a01*b11 + a02*b21;
  if (Math.abs(det) < 1e-8) return new Float32Array([1,0,0, 0,1,0, 0,0,1]);
  det = 1 / det;
  return new Float32Array([
    b01*det, (-a22*a01+a02*a21)*det, (a12*a01-a02*a11)*det,
    b11*det, (a22*a00-a02*a20)*det, (-a12*a00+a02*a10)*det,
    b21*det, (-a21*a00+a01*a20)*det, (a11*a00-a01*a10)*det
  ]);
}
function m4TransformPoint(m, p) {
  const x = p[0], y = p[1], z = p[2];
  const w = m[3]*x + m[7]*y + m[11]*z + m[15] || 1;
  return [
    (m[0]*x + m[4]*y + m[8]*z + m[12]) / w,
    (m[1]*x + m[5]*y + m[9]*z + m[13]) / w,
    (m[2]*x + m[6]*y + m[10]*z + m[14]) / w
  ];
}

// ============================================================================
// 2. WEBGL2 INITIALIZATION & SHADERS
// ============================================================================
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, powerPreference: "high-performance" });
if (!gl) { document.body.style.background = "#e9d4b5"; return; }

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  const uniforms = {};
  const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(p, i);
    uniforms[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { prog: p, u: uniforms };
}

// --- Shadow Map Shader ---
const shadowProg = createProgram(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat4 uModel;
uniform mat4 uLightVP;
void main() {
  gl_Position = uLightVP * uModel * vec4(aPos, 1.0);
}`, `#version 300 es
precision highp float;
void main() {}`);

// --- Main PBR + Subsurface + Fur Sheen + Shadow Shader ---
const mainProg = createProgram(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
layout(location=2) in vec2 aUv;
layout(location=3) in vec4 aCol;

uniform mat4 uModel;
uniform mat4 uViewProj;
uniform mat4 uLightVP;
uniform mat3 uNormalMat;

out vec3 vWorldPos;
out vec3 vNormal;
out vec2 vUv;
out vec4 vCol;
out vec4 vLightSpacePos;

void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vNormal = normalize(uNormalMat * aNorm);
  vUv = aUv;
  vCol = aCol;
  vLightSpacePos = uLightVP * wp;
  gl_Position = uViewProj * wp;
}`, `#version 300 es
precision highp float;
in vec3 vWorldPos;
in vec3 vNormal;
in vec2 vUv;
in vec4 vCol;
in vec4 vLightSpacePos;

uniform vec3 uCamPos;
uniform vec3 uLightDir;
uniform vec3 uLightColor;
uniform vec4 uBaseColor;
uniform vec3 uEmissive;
uniform float uRoughness;
uniform float uMetallic;
uniform float uFurSheen;
uniform float uSubsurface;
uniform float uUseTex;
uniform vec2 uTexScale;
uniform float uGlowPulse;
uniform float uGlass;
uniform float uShadowRecv;
uniform float uSunWindow;
uniform sampler2D uTex;
uniform sampler2D uShadowMap;

out vec4 fragColor;

float calcShadow(vec4 lsPos, vec3 N, vec3 L) {
  if (uShadowRecv < 0.5) return 1.0;
  vec3 proj = lsPos.xyz / lsPos.w * 0.5 + 0.5;
  if (proj.z > 1.0 || proj.x < 0.01 || proj.x > 0.99 || proj.y < 0.01 || proj.y > 0.99) return 1.0;
  float ndl = max(dot(N, L), 0.0);
  float bias = max(0.0022 * (1.0 - ndl), 0.0007);
  vec2 texel = vec2(1.0 / 1024.0);
  float sum = 0.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      float d = texture(uShadowMap, proj.xy + vec2(float(x), float(y)) * texel).r;
      sum += (proj.z - bias > d) ? 0.0 : 1.0;
    }
  }
  return sum / 9.0;
}

vec3 acesTone(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec3 N = normalize(vNormal);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 L = normalize(uLightDir);
  vec3 H = normalize(V + L);

  vec4 albedo = uBaseColor * vCol;
  float rough = clamp(uRoughness, 0.04, 1.0);
  if (uUseTex > 0.5) {
    vec4 t = texture(uTex, vUv * uTexScale);
    albedo.rgb *= mix(vec3(1.0), t.rgb, uUseTex);
    rough = clamp(rough * mix(0.84, 1.16, t.a), 0.04, 1.0);
  }
  // Convert sRGB-ish base albedo to linear
  vec3 baseLin = pow(max(albedo.rgb, vec3(0.001)), vec3(2.2));

  float shadow = calcShadow(vLightSpacePos, N, L);
  // Soften shadow slightly for cozy morning bounce
  float shadowLit = mix(0.28, 1.0, shadow);

  float NdotL = max(dot(N, L), 0.0);
  float NdotV = max(dot(N, V), 0.001);
  float NdotH = max(dot(N, H), 0.0);
  float VdotH = max(dot(V, H), 0.0);

  // GGX Specular
  float a = rough * rough;
  float a2 = a * a;
  float denom = NdotH * NdotH * (a2 - 1.0) + 1.0;
  float D = a2 / (3.14159265 * denom * denom + 1e-5);
  float k = (rough + 1.0) * (rough + 1.0) / 8.0;
  float G = (NdotV / (NdotV * (1.0 - k) + k)) * (NdotL / (NdotL * (1.0 - k) + k));
  vec3 F0 = mix(vec3(0.04), baseLin, uMetallic);
  vec3 F = F0 + (1.0 - F0) * pow(1.0 - VdotH, 5.0);
  vec3 spec = (D * G * F) / (4.0 * NdotV * NdotL + 0.001);
  vec3 kD = (1.0 - F) * (1.0 - uMetallic);

  // Direct morning sunlight
  vec3 direct = (kD * baseLin / 3.14159265 + spec) * uLightColor * NdotL * shadowLit;

  // Subsurface scattering wrap (ears, muzzle, warm milk, rubber teat)
  if (uSubsurface > 0.01) {
    float wrapL = max(0.0, (dot(N, L) + 0.55) / 1.55);
    float backTrans = pow(clamp(dot(V, -L + N * 0.35), 0.0, 1.0), 2.5);
    vec3 sssTint = vec3(1.0, 0.56, 0.36);
    direct += baseLin * sssTint * (wrapL * 0.25 + backTrans * 0.65) * uSubsurface * uLightColor * mix(0.45, 1.0, shadow);
  }

  // Velvet / Plush Calf Fur Rim Sheen
  if (uFurSheen > 0.01) {
    float rim = pow(1.0 - NdotV, 2.6);
    float sunRim = smoothstep(-0.2, 0.8, dot(N, L)) * 0.65 + 0.35;
    vec3 sheenCol = mix(baseLin * 1.45, vec3(1.0, 0.90, 0.72), 0.55);
    direct += sheenCol * rim * uFurSheen * sunRim * 0.72 * mix(0.5, 1.0, shadow);
  }

  // Hemisphere Ambient: Pale morning sky above + Warm sunlit straw bounce below
  float hemi = N.y * 0.5 + 0.5;
  vec3 skyCol = vec3(0.56, 0.68, 0.80) * 0.62;
  vec3 strawBounce = vec3(0.70, 0.50, 0.26) * 0.58;
  vec3 ambient = baseLin * mix(strawBounce, skyCol, hemi) * (1.0 - uMetallic * 0.5);

  // Gentle front-right barn doorway fill so calf face is always luminous & readable
  vec3 fillDir = normalize(vec3(0.45, 0.35, 0.82));
  float fillNdl = max(dot(N, fillDir), 0.0);
  vec3 fillLight = (baseLin * 0.24 * fillNdl + pow(max(dot(N, normalize(V + fillDir)), 0.0), 24.0) * 0.08 * (1.0 - rough)) * vec3(1.0, 0.95, 0.86);

  // Secondary morning window specular catchlight (especially pretty in calf's eyes & glass)
  vec3 winDir = normalize(vec3(-0.55, 0.62, 0.56));
  float winSpec = pow(max(dot(N, normalize(V + winDir)), 0.0), mix(16.0, 180.0, 1.0 - rough));
  vec3 catchLight = vec3(1.0, 0.96, 0.88) * winSpec * (1.0 - rough) * (0.28 + uGlass * 0.9);

  vec3 col = direct + ambient + fillLight + catchLight + uEmissive;

  // Subtle sunlit diegetic glint when a prop invites touch (no arrows/icons!)
  if (uGlowPulse > 0.001) {
    float rimG = pow(1.0 - NdotV, 2.0) * 0.75 + 0.25;
    col += vec3(1.0, 0.90, 0.62) * rimG * uGlowPulse * 0.34;
  }

  float alpha = albedo.a;
  // Clear glass Fresnel reflectivity
  if (uGlass > 0.5) {
    float fres = pow(1.0 - NdotV, 3.0);
    col += vec3(1.0, 0.97, 0.91) * (fres * 0.65 + winSpec * 0.85);
    alpha = clamp(albedo.a + fres * 0.42 + winSpec * 0.38, 0.14, 0.88);
  }

  // Morning window sky glow override
  if (uSunWindow > 0.5) {
    col = mix(vec3(0.95, 0.98, 1.0), vec3(1.35, 1.24, 0.96), clamp(1.0 - vUv.y * 0.7, 0.0, 1.0));
  }

  // Gentle warm morning dust atmospheric haze for deep barn background
  float dist = length(uCamPos - vWorldPos);
  float fog = smoothstep(3.0, 9.5, dist) * 0.42;
  vec3 fogCol = vec3(0.58, 0.48, 0.35);
  col = mix(col, fogCol, fog * (1.0 - uSunWindow));

  col = acesTone(col);
  col = pow(col, vec3(1.0 / 2.2));
  fragColor = vec4(col, alpha);
}`);

// --- Volumetric Sunbeam & Soft Particle Shader ---
const fxProg = createProgram(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aUv;
layout(location=2) in vec4 aCol;
uniform mat4 uViewProj;
out vec2 vUv;
out vec4 vCol;
void main() {
  vUv = aUv;
  vCol = aCol;
  gl_Position = uViewProj * vec4(aPos, 1.0);
}`, `#version 300 es
precision highp float;
in vec2 vUv;
in vec4 vCol;
uniform sampler2D uSprite;
uniform float uMode; // 0 = radial sprite, 1 = sunbeam quad
out vec4 fragColor;
void main() {
  if (uMode > 0.5) {
    // Soft diagonal morning sunbeam shaft
    float edgeX = sin(clamp(vUv.x, 0.0, 1.0) * 3.14159265);
    float fadeY = smoothstep(0.0, 0.16, vUv.y) * smoothstep(1.0, 0.12, vUv.y);
    float a = pow(edgeX, 1.7) * fadeY * vCol.a;
    fragColor = vec4(vCol.rgb, a);
  } else {
    float mask = texture(uSprite, vUv).a;
    fragColor = vec4(vCol.rgb, mask * vCol.a);
  }
}`);

// ============================================================================
// 3. SHADOW MAP FBO & PROCEDURAL TEXTURES
// ============================================================================
const SHADOW_SIZE = 1024;
const shadowTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, shadowTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, SHADOW_SIZE, SHADOW_SIZE, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const shadowFbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
gl.drawBuffers([gl.NONE]);
gl.readBuffer(gl.NONE);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

function makeTextureFromCanvas(cnv, repeat = true) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cnv);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  return tex;
}

// Seeded pseudo-random for crisp deterministic textures
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildWoodTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const ctx = c.getContext("2d");
  const rng = mulberry32(101);
  ctx.fillStyle = "#c9a074"; ctx.fillRect(0, 0, 512, 512);
  // Organic grain lines
  for (let y = 0; y < 512; y++) {
    const plank = Math.floor(y / 128);
    const shade = 0.92 + (plank % 2) * 0.08 + (rng() - 0.5) * 0.05;
    for (let x = 0; x < 512; x += 4) {
      const wave = Math.sin(x * 0.015 + plank * 2.1 + Math.sin(y * 0.06) * 2.2) * 0.5 + 0.5;
      const g = Math.sin((y + wave * 12) * 0.42) * 0.5 + 0.5;
      const r = clamp(Math.floor((182 + g * 38) * shade), 0, 255);
      const gr = clamp(Math.floor((144 + g * 32) * shade), 0, 255);
      const b = clamp(Math.floor((104 + g * 24) * shade), 0, 255);
      ctx.fillStyle = `rgb(${r},${gr},${b})`;
      ctx.fillRect(x, y, 4, 1);
    }
  }
  // Subtle plank seams & fine scratches
  ctx.fillStyle = "rgba(55,34,18,0.42)";
  for (let p = 128; p < 512; p += 128) ctx.fillRect(0, p - 1, 512, 3);
  for (let i = 0; i < 180; i++) {
    ctx.fillStyle = rng() > 0.5 ? "rgba(255,235,205,0.08)" : "rgba(70,42,20,0.09)";
    ctx.fillRect(rng() * 512, rng() * 512, 20 + rng() * 90, 1 + rng() * 2);
  }
  return makeTextureFromCanvas(c, true);
}

function buildFurTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const ctx = c.getContext("2d");
  const rng = mulberry32(202);
  ctx.fillStyle = "#efe6d8"; ctx.fillRect(0, 0, 512, 512);
  // Soft warm mottling
  for (let i = 0; i < 65; i++) {
    const x = rng() * 512, y = rng() * 512, rad = 28 + rng() * 65;
    const gr = ctx.createRadialGradient(x, y, 2, x, y, rad);
    const warm = rng() > 0.45 ? "rgba(255,244,225,0.14)" : "rgba(186,144,104,0.13)";
    gr.addColorStop(0, warm); gr.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  }
  // Fine plush hair strokes
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 4200; i++) {
    const x = rng() * 512, y = rng() * 512;
    const len = 7 + rng() * 14;
    const ang = (rng() - 0.5) * 0.35 + PI * 0.5;
    ctx.strokeStyle = rng() > 0.48 ? "rgba(255,246,232,0.22)" : "rgba(155,112,74,0.18)";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  return makeTextureFromCanvas(c, true);
}

function buildStrawTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const ctx = c.getContext("2d");
  const rng = mulberry32(303);
  ctx.fillStyle = "#b58d4d"; ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2400; i++) {
    const x = rng() * 512, y = rng() * 512;
    const len = 18 + rng() * 44, ang = rng() * TAU;
    const lum = rng();
    ctx.strokeStyle = lum > 0.65 ? "rgba(246,216,138,0.55)" : (lum > 0.3 ? "rgba(196,154,78,0.5)" : "rgba(116,82,38,0.48)");
    ctx.lineWidth = 1.2 + rng() * 2.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  return makeTextureFromCanvas(c, true);
}

function buildLinenTexture() {
  const c = document.createElement("canvas"); c.width = 256; c.height = 256;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#f7f2e9"; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i += 4) {
    ctx.fillStyle = (i % 8 === 0) ? "rgba(210,196,178,0.34)" : "rgba(255,252,248,0.3)";
    ctx.fillRect(0, i, 256, 2);
    ctx.fillRect(i, 0, 2, 256);
  }
  return makeTextureFromCanvas(c, true);
}

function buildSpriteTexture() {
  const c = document.createElement("canvas"); c.width = 128; c.height = 128;
  const ctx = c.getContext("2d");
  const gr = ctx.createRadialGradient(64, 64, 2, 64, 64, 62);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(0.38, "rgba(255,255,255,0.68)");
  gr.addColorStop(0.75, "rgba(255,255,255,0.16)");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, 128, 128);
  return makeTextureFromCanvas(c, false);
}

// ============================================================================
// 4. PROCEDURAL ORGANIC 3D MESH BUILDER
// ============================================================================
function uploadMesh(positions, normals, uvs, colors, indices) {
  const vCount = positions.length / 3;
  const data = new Float32Array(vCount * 12);
  for (let i = 0; i < vCount; i++) {
    const o = i * 12;
    data[o]   = positions[i * 3];     data[o+1] = positions[i * 3 + 1]; data[o+2] = positions[i * 3 + 2];
    data[o+3] = normals[i * 3];       data[o+4] = normals[i * 3 + 1];   data[o+5] = normals[i * 3 + 2];
    data[o+6] = uvs[i * 2];           data[o+7] = uvs[i * 2 + 1];
    data[o+8] = colors[i * 4];        data[o+9] = colors[i * 4 + 1];    data[o+10] = colors[i * 4 + 2]; data[o+11] = colors[i * 4 + 3];
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const stride = 48;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, stride, 32);
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  const useUint32 = vCount > 65535;
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, useUint32 ? new Uint32Array(indices) : new Uint16Array(indices), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: indices.length, type: useUint32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
}

function computeSmoothNormals(pos, idx) {
  const n = new Float32Array(pos.length);
  for (let i = 0; i < idx.length; i += 3) {
    const i0 = idx[i] * 3, i1 = idx[i + 1] * 3, i2 = idx[i + 2] * 3;
    const ax = pos[i1] - pos[i0], ay = pos[i1 + 1] - pos[i0 + 1], az = pos[i1 + 2] - pos[i0 + 2];
    const bx = pos[i2] - pos[i0], by = pos[i2 + 1] - pos[i0 + 1], bz = pos[i2 + 2] - pos[i0 + 2];
    const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    n[i0] += nx; n[i0 + 1] += ny; n[i0 + 2] += nz;
    n[i1] += nx; n[i1 + 1] += ny; n[i1 + 2] += nz;
    n[i2] += nx; n[i2 + 1] += ny; n[i2 + 2] += nz;
  }
  for (let i = 0; i < n.length; i += 3) {
    const l = Math.hypot(n[i], n[i + 1], n[i + 2]) || 1;
    n[i] /= l; n[i + 1] /= l; n[i + 2] /= l;
  }
  return n;
}

// Sculpted loft mesh along rings: each ring = { c:[x,y,z], rx, ry, col?:[r,g,b], fn?:(ang,x,y)=>[x,y,zOff,col] }
// Rings advance along +Z or arbitrary spine; default cross section in XY plane
function createLoft(rings, segs = 22, axis = "z", capStart = true, capEnd = true) {
  const pos = [], uv = [], col = [], idx = [];
  const rc = rings.length;
  for (let r = 0; r < rc; r++) {
    const ring = rings[r];
    const v = r / Math.max(1, rc - 1);
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const a = u * TAU;
      let cx = Math.cos(a) * ring.rx;
      let cy = Math.sin(a) * ring.ry;
      let cz = 0;
      let c = ring.col || [1, 1, 1];
      if (ring.fn) {
        const res = ring.fn(a, cx, cy, c);
        cx = res[0]; cy = res[1]; cz = res[2] || 0;
        if (res[3]) c = res[3];
      }
      if (axis === "y") {
        pos.push(ring.c[0] + cx, ring.c[1] + cz, ring.c[2] + cy);
      } else {
        pos.push(ring.c[0] + cx, ring.c[1] + cy, ring.c[2] + cz);
      }
      uv.push(u, v);
      col.push(c[0], c[1], c[2], 1);
    }
  }
  const stride = segs + 1;
  const ascending = axis === "y"
    ? (rings[rc - 1].c[1] >= rings[0].c[1])
    : (rings[rc - 1].c[2] >= rings[0].c[2]);
  const flipY = (axis === "y") ? ascending : !ascending;
  for (let r = 0; r < rc - 1; r++) {
    for (let s = 0; s < segs; s++) {
      const a = r * stride + s, b = a + 1, c = a + stride, d = c + 1;
      if (flipY) idx.push(a, c, b, b, c, d);
      else idx.push(a, b, c, b, d, c);
    }
  }
  if (capStart) {
    const r0 = rings[0], ci = pos.length / 3;
    const c0 = r0.col || [1, 1, 1];
    pos.push(r0.c[0], r0.c[1], r0.c[2]); uv.push(0.5, 0); col.push(c0[0], c0[1], c0[2], 1);
    for (let s = 0; s < segs; s++) {
      if (flipY) idx.push(ci, s, s + 1);
      else idx.push(ci, s + 1, s);
    }
  }
  if (capEnd) {
    const rl = rings[rc - 1], ci = pos.length / 3, base = (rc - 1) * stride;
    const cl = rl.col || [1, 1, 1];
    pos.push(rl.c[0], rl.c[1], rl.c[2]); uv.push(0.5, 1); col.push(cl[0], cl[1], cl[2], 1);
    for (let s = 0; s < segs; s++) {
      if (flipY) idx.push(ci, base + s + 1, base + s);
      else idx.push(ci, base + s, base + s + 1);
    }
  }
  const norm = computeSmoothNormals(pos, idx);
  return uploadMesh(pos, norm, uv, col, idx);
}

function createSphere(rx = 1, ry = 1, rz = 1, stacks = 16, slices = 22, colFn = null, maxPhi = PI) {
  const pos = [], norm = [], uv = [], col = [], idx = [];
  for (let i = 0; i <= stacks; i++) {
    const v = i / stacks, phi = v * maxPhi;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let j = 0; j <= slices; j++) {
      const u = j / slices, th = u * TAU;
      const nx = sp * Math.cos(th), ny = cp, nz = sp * Math.sin(th);
      pos.push(nx * rx, ny * ry, nz * rz);
      const nn = v3Norm([nx / rx, ny / ry, nz / rz]);
      norm.push(nn[0], nn[1], nn[2]);
      uv.push(u, v);
      const c = colFn ? colFn(nx, ny, nz) : [1, 1, 1];
      col.push(c[0], c[1], c[2], 1);
    }
  }
  const st = slices + 1;
  for (let i = 0; i < stacks; i++) {
    for (let j = 0; j < slices; j++) {
      const a = i * st + j, b = a + 1, c = a + st, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  return uploadMesh(pos, norm, uv, col, idx);
}

function createBox(w = 1, h = 1, d = 1, col = [1, 1, 1]) {
  const hw = w * 0.5, hh = h * 0.5, hd = d * 0.5;
  const faces = [
    [[0,0,1],  [[-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]]],
    [[0,0,-1], [[hw,-hh,-hd],[-hw,-hh,-hd],[-hw,hh,-hd],[hw,hh,-hd]]],
    [[0,1,0],  [[-hw,hh,hd],[hw,hh,hd],[hw,hh,-hd],[-hw,hh,-hd]]],
    [[0,-1,0], [[-hw,-hh,-hd],[hw,-hh,-hd],[hw,-hh,hd],[-hw,-hh,hd]]],
    [[1,0,0],  [[hw,-hh,hd],[hw,-hh,-hd],[hw,hh,-hd],[hw,hh,hd]]],
    [[-1,0,0], [[-hw,-hh,-hd],[-hw,-hh,hd],[-hw,hh,hd],[-hw,hh,-hd]]]
  ];
  const pos = [], norm = [], uv = [], cols = [], idx = [];
  let vi = 0;
  for (const [n, verts] of faces) {
    const uvs = [[0,0],[1,0],[1,1],[0,1]];
    for (let i = 0; i < 4; i++) {
      pos.push(...verts[i]); norm.push(...n); uv.push(...uvs[i]); cols.push(col[0], col[1], col[2], 1);
    }
    idx.push(vi, vi+1, vi+2, vi, vi+2, vi+3); vi += 4;
  }
  return uploadMesh(pos, norm, uv, cols, idx);
}

function createCylinder(rBot, rTop, h, segs = 20, open = false, col = [1, 1, 1]) {
  const rings = [];
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const r = lerp(rBot, rTop, t);
    rings.push({ c: [0, -h * 0.5 + t * h, 0], rx: r, ry: r, col });
  }
  return createLoft(rings, segs, "y", !open, !open);
}

// Pitcher handle (curved tube)
function buildCurvedHandle(radius, tubeR, startA, endA) {
  const segs = 16, rSegs = 10, pos = [], uv = [], col = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, ang = lerp(startA, endA, t);
    const cx = Math.cos(ang) * radius, cy = Math.sin(ang) * radius;
    const tx = -Math.sin(ang), ty = Math.cos(ang);
    for (let j = 0; j <= rSegs; j++) {
      const a = (j / rSegs) * TAU;
      const nx = Math.cos(ang) * Math.cos(a), ny = Math.sin(ang) * Math.cos(a), nz = Math.sin(a);
      pos.push(cx + nx * tubeR, cy + ny * tubeR, nz * tubeR);
      uv.push(t, j / rSegs); col.push(1, 1, 1, 1);
    }
  }
  const st = rSegs + 1;
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < rSegs; j++) {
      const a = i * st + j, b = a + 1, c = a + st, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const norm = computeSmoothNormals(pos, idx);
  return uploadMesh(pos, norm, uv, col, idx);
}

// --- Batched 3D Golden Straw Field (550+ individual sunlit 3D straw blades!) ---
function buildStrawField() {
  const rng = mulberry32(777);
  const pos = [], norm = [], uv = [], col = [], idx = [];
  let vi = 0;
  for (let i = 0; i < 580; i++) {
    const x = (rng() - 0.5) * 3.8;
    const z = -2.0 + rng() * 2.65;
    const y = 0.01 + Math.max(0, 0.08 - Math.hypot(x * 0.45, (z + 0.5) * 0.5) * 0.06) + rng() * 0.03;
    const len = 0.14 + rng() * 0.22;
    const w = 0.008 + rng() * 0.007;
    const yaw = rng() * TAU;
    const tilt = 0.06 + rng() * 0.34;
    const dx = Math.cos(yaw) * len, dz = Math.sin(yaw) * len, dy = Math.sin(tilt) * len * 0.55;
    const px = -Math.sin(yaw) * w, pz = Math.cos(yaw) * w;
    const tone = 0.78 + rng() * 0.30;
    const c = [0.94 * tone, 0.78 * tone, 0.42 * tone, 1];
    // Curved 2-segment blade
    const x0 = x - dx * 0.4, y0 = y, z0 = z - dz * 0.4;
    const x1 = x + dx * 0.1, y1 = y + dy * 0.65, z1 = z + dz * 0.1;
    const x2 = x + dx * 0.6, y2 = y + dy * 0.45, z2 = z + dz * 0.6;
    pos.push(
      x0 - px, y0, z0 - pz,  x0 + px, y0, z0 + pz,
      x1 - px * 0.85, y1, z1 - pz * 0.85,  x1 + px * 0.85, y1, z1 + pz * 0.85,
      x2, y2, z2
    );
    for (let k = 0; k < 5; k++) {
      norm.push(0, 1, 0); uv.push(k * 0.25, 0.5); col.push(...c);
    }
    idx.push(vi, vi+1, vi+2, vi+1, vi+3, vi+2, vi+2, vi+3, vi+4);
    vi += 5;
  }
  const n = computeSmoothNormals(pos, idx);
  return uploadMesh(pos, n, uv, col, idx);
}

const SFX = {
  ctx: null,
  noiseBuf: null,
  ambienceStarted: false,
  lastBrushTime: 0,
  lastShakeTime: 0,
  lastPetTime: 0,

  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const sr = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, sr * 2, sr);
      const d = this.noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < d.length; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.032;
        b2 = 0.950 * b2 + w * 0.048;
        d[i] = (b0 + b1 + b2 + w * 0.14) * 0.35;
      }
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    if (!this.ambienceStarted && this.ctx) {
      this.ambienceStarted = true;
      this.startAmbience();
    }
  },

  startAmbience() {
    const c = this.ctx;
    // Ultra-soft warm morning breeze in barn
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    const flt = c.createBiquadFilter();
    flt.type = "lowpass"; flt.frequency.value = 340;
    const g = c.createGain(); g.gain.value = 0.035;
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start();
  },

  // Sweet distant morning bird chirp
  birdChirp(bright = false) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const notes = bright ? [2450, 3100, 2750] : [1850, 2320];
    notes.forEach((f, idx) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      const st = t + idx * 0.11;
      o.frequency.setValueAtTime(f * 0.88, st);
      o.frequency.exponentialRampToValueAtTime(f * 1.12, st + 0.05);
      o.frequency.exponentialRampToValueAtTime(f * 0.95, st + 0.10);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(bright ? 0.055 : 0.018, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.11);
      o.connect(g); g.connect(c.destination);
      o.start(st); o.stop(st + 0.12);
    });

  // Baby Jersey calf cute soft "muu~" (mode: 'curious', 'eager', 'happy', 'sigh')
  calfMoo(mode = "curious") {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const dur = mode === "sigh" ? 0.42 : (mode === "eager" ? 0.62 : 0.54);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    o1.type = "sawtooth"; o2.type = "triangle";
    const baseF = mode === "eager" ? 295 : (mode === "happy" ? 315 : (mode === "sigh" ? 235 : 265));
    o1.frequency.setValueAtTime(baseF * 0.88, t);
    if (mode === "curious") {
      o1.frequency.linearRampToValueAtTime(baseF * 1.06, t + dur * 0.65);
      o1.frequency.linearRampToValueAtTime(baseF * 1.14, t + dur);
    } else if (mode === "eager") {
      o1.frequency.linearRampToValueAtTime(baseF * 1.18, t + dur * 0.45);
      o1.frequency.linearRampToValueAtTime(baseF * 0.96, t + dur);
    } else if (mode === "happy") {
      o1.frequency.linearRampToValueAtTime(baseF * 1.22, t + dur * 0.35);
      o1.frequency.linearRampToValueAtTime(baseF * 1.02, t + dur);
    } else {
      o1.frequency.linearRampToValueAtTime(baseF * 0.82, t + dur);
    }
    o2.frequency.setValueAtTime(baseF * 1.76, t);
    o2.frequency.linearRampToValueAtTime(baseF * 1.95, t + dur * 0.5);

    // Warm nasal baby-calf formant filter
    const f1 = c.createBiquadFilter();
    f1.type = "bandpass"; f1.Q.value = 3.2;
    f1.frequency.setValueAtTime(520, t);
    f1.frequency.linearRampToValueAtTime(760, t + dur * 0.45);
    f1.frequency.linearRampToValueAtTime(480, t + dur);

    lp.type = "lowpass"; lp.frequency.value = 1150;

    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(mode === "sigh" ? 0.055 : 0.095, t + 0.08);
    g.gain.setValueAtTime(mode === "sigh" ? 0.045 : 0.082, t + dur * 0.72);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const g2 = c.createGain(); g2.gain.value = 0.28;
    o1.connect(f1); o2.connect(g2); g2.connect(f1);
    f1.connect(lp); lp.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);

  gulp(pitchBias = 0) {

    const ng = c.createGain();

    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
    ns.connect(nf); nf.connect(ng); ng.connect(c.destination);
    ns.start(t); ns.stop(t + 0.09);

    // Warm hollow "goku" swallow pitch arc
    const o = c.createOscillator(); o.type = "sine";
    const f0 = 195 + pitchBias * 38 + rand(-12, 12);
    o.frequency.setValueAtTime(f0 * 0.75, t + 0.03);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.48, t + 0.095);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.85, t + 0.185);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t + 0.025);
    g.gain.linearRampToValueAtTime(0.16, t + 0.065);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
    o.connect(g); g.connect(c.destination);
    o.start(t + 0.02); o.stop(t + 0.22);

    // Subtle bottle bubble pop
    const b = c.createOscillator(); b.type = "sine";
    const bf = 480 + rand(0, 220);
    b.frequency.setValueAtTime(bf, t + 0.09);
    b.frequency.exponentialRampToValueAtTime(bf * 1.8, t + 0.145);
    const bg = c.createGain();
    bg.gain.setValueAtTime(0.0001, t + 0.09);
    bg.gain.linearRampToValueAtTime(0.035, t + 0.105);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.155);
    b.connect(bg); bg.connect(c.destination);
    b.start(t + 0.09); b.stop(t + 0.16);
  },

  // Milk powder soft sprinkle puff
  powderPour() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(2400, t); f.Q.value = 1.2;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.09, t + 0.07);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t); s.stop(t + 0.44);
  },

  // Warm water pouring tick (rising pitch as bottle fills!)
  waterDrop(fillRatio) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = "sine";
    const f = 320 + fillRatio * 340 + rand(-35, 45);
    o.frequency.setValueAtTime(f * 0.82, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.45, t + 0.065);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.08);
  },

  // Nipple cap snug rubber pop
  capPop() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(640, t + 0.055);
    const g = c.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.09);
  },

  // Bottle liquid slosh while shaking
  shakeSlosh(strength = 1) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastShakeTime < 0.11) return;
    this.lastShakeTime = now;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(620 + rand(0, 320), now);
    f.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
    f.Q.value = 2.6;
    const g = c.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.09 * clamp(strength, 0.3, 1.1), now + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(now); s.stop(now + 0.14);
  },

  // Soft brush or linen wipe stroke
  softStroke(isCloth = false) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastBrushTime < 0.16) return;
    this.lastBrushTime = now;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = "bandpass";
    f.frequency.value = isCloth ? 1150 : 1850;
    f.Q.value = 1.1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(isCloth ? 0.055 : 0.068, now + 0.045);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(now); s.stop(now + 0.21);
  },

  // Warm brass barn bell chime
  barnBell(tiny = false) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const base = tiny ? 1320 : 680;
    [1, 2.02, 2.98, 4.16].forEach((mult, idx) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = base * mult;
      const amp = (tiny ? 0.032 : 0.065) / (idx + 1);
      const dec = (tiny ? 0.45 : 1.35) / (idx * 0.55 + 1);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dec + 0.03);
    });
  },

  // Straw rustle / calf playful hop
  strawStep() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1900;
    const g = c.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t); s.stop(t + 0.17);
  },

  // Tender acoustic kalimba / harp sparkle for joyful milestones
  warmChime(notes = [523.25, 659.25, 783.99, 1046.5]) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    notes.forEach((f, idx) => {
      const st = t + idx * 0.095;
      const o = c.createOscillator(), g = c.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.062, st + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.72);
      o.connect(g); g.connect(c.destination);
      o.start(st); o.stop(st + 0.75);
    });
  },

  // Gentle petting murmur
  petPurr() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastPetTime < 0.75) return;
    this.lastPetTime = now;
    this.calfMoo("sigh");
  }
};

// 9. RAYCASTING & POINTER INTERACTION (Tap + Drag, Ultra-Forgiving for 5yo!)
// ============================================================================
function screenToRay(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
  const near = m4TransformPoint(cam.invVP, [nx, ny, -1]);
  const far = m4TransformPoint(cam.invVP, [nx, ny, 1]);
  return { origin: near, dir: v3Norm(v3Sub(far, near)) };
}

function rayPointDist(ray, pt) {
  const to = v3Sub(pt, ray.origin);
  const t = Math.max(0, v3Dot(to, ray.dir));
  const closest = v3Add(ray.origin, v3Scale(ray.dir, t));
  return { dist: v3Dist(closest, pt), t };
}

function rayPlaneZ(ray, planeZ) {
  const dz = ray.dir[2];
  if (Math.abs(dz) < 1e-4) return [0, 0.8, planeZ];
  const t = clamp((planeZ - ray.origin[2]) / dz, 0.3, 6.0);
  return v3Add(ray.origin, v3Scale(ray.dir, t));
}

function hitTest(ray) {
  const cands = [];
  const add = (id, pt, rad, prio = 0) => {
    const r = rayPointDist(ray, pt);
    if (r.dist < rad) cands.push({ id, score: r.dist / rad - prio * 0.25, t: r.t });
  };

  // Bench props (generous radii for little fingers!)
  add("bottle",  v3Add(state.bottle.pos, [0, 0.13, 0]), 0.17, 1.2);
  if (!state.capped) add("cap", v3Add(state.cap.pos, [0, 0.04, 0]), 0.13, 1.4);
  add("pitcher", v3Add(state.pitcher.pos, [0, 0.12, 0]), 0.18, 1.0);
  add("tin",     v3Add(PROP_HOME.tin, [0, 0.10, 0]), 0.17, 1.0);
  add("towel",   v3Add(state.towel.pos, [0, 0.04, 0]), 0.16, 1.0);
  add("brush",   v3Add(state.brush.pos, [0, 0.04, 0]), 0.16, 1.0);

  if (state.hasCrown && !state.crownOnCalf) add("crown", state.crown.pos, 0.16, 1.1);
  if (state.hasRibbon && !state.ribbonOnCalf) add("ribbon", state.ribbon.pos, 0.16, 1.1);

  // Barn interactive friends
  add("bell", [-1.06, 1.38, 0.52], 0.17, 0.9);
  add("sparrow", state.sparrow.pos, 0.16, 0.9);
  if (state.butterfly.active) add("butterfly", state.butterfly.pos, 0.16, 1.1);

  // Calf head, nose & body
  add("calfNose", state.calf.noseWorld, 0.17, 0.7);
  add("calf",     state.calf.headWorld, 0.28, 0.5);
  add("calfBody", [state.calf.pos[0], 0.76, state.calf.pos[2] + 0.08], 0.34, 0.2);

  if (!cands.length) return null;
  cands.sort((a, b) => a.score - b.score);
  return cands[0].id;
}

function isBottleEmptyAfterFeed() {
